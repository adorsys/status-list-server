[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
color-eyre = "0.6"
clap = { version = "4.6", features = ["derive"] }
base64 = "0.22"
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-postgres", "sqlx-sqlite", "sqlx-mysql", "runtime-tokio-rustls", "with-json"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
