[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.23"
color-eyre = "0.6"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.3"
sha2 = "0.11"
uuid = { version = "1.28", features = ["v4"] }
status-list-server = { path = "..", default-features = false, features = ["history"] }
tokio = { version = "1.53", features = ["rt-multi-thread"] }
sea-orm = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-mysql", "sqlx-sqlite"] }
tempfile = "3"
