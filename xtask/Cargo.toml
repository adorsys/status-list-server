[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
color-eyre = "0.6"
clap = { version = "4.6", features = ["derive"] }
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.28", features = ["v4"] }
status-list-server = { path = "..", default-features = false }
