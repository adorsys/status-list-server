# Deliberately vulnerable zizmor fixture: don't "fix" it.
# Kept outside .github/ so the real gate doesn't scan it.
name: zizmor selftest fixture
on: [push]

permissions: {}

jobs:
  # Asserts `artipacked`: a checkout without `persist-credentials: false`.
  deliberately-vulnerable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  # Asserts excessive-permissions: broadens permissions: {} to write-all.
  excessively-permissioned:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: echo "this job needs no token at all"
