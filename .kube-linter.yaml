checks:
  exclude:
    # Subchart containers (postgres) use template-level defaults
    # that don't set cpu/memory resources or read-only root fs.
    # These are third-party packaged charts we cannot modify.
    - "unset-cpu-requirements"
    - "unset-memory-requirements"
    - "no-read-only-root-fs"
    # Cache TTL env vars (e.g. APP_CACHE__TTL) are numeric durations, not secrets.
    - "env-var-secret"
    # "latest-tag" is deliberately NOT excluded. The chart used to default
    # statuslist.image.tag to "latest"; it now defaults to appVersion, so nothing
    # renders ":latest" and the check will fire if that regresses.
