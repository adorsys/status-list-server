# Container-backed tests starve each other at startup; cap them at four across processes.
# The SQL fixtures' in-process semaphore can't see nextest's separate processes.
[test-groups.containers]
max-threads = 4

[[profile.default.overrides]]
# Keep mysql or postgres in new DB test names; check with cargo nextest show-config test-groups.
filter = 'test(mysql) or test(postgres) or binary(cert_provisioning)'
test-group = 'containers'
# A container that never gets ready would otherwise hang the run.
slow-timeout = { period = "5m", terminate-after = 2, grace-period = "10s" }
