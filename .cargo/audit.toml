[advisories]
ignore = [
  # rkyv 0.7.46 via rust_decimal: no patched 0.7.x and not built; drop once upstream bumps it.
  "RUSTSEC-2026-0235",
]

informational_warnings = ["unmaintained"]
severity_threshold = "low"

[output]
deny = ["unmaintained"]
format = "terminal"
quiet = false

[yanked]
enabled = true
update_index = true
