
# cargo-vet audits file

[[audits.azure_security_keyvault_secrets]]
who = "Christiantyemele <yemelechristian2@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.0.0 -> 1.0.1"
notes = "Reviewed the 1.0.0 to 1.0.1 delta. The only runtime source change moves cached challenge scope assignment after challenge resource validation, preventing an unverified resource from poisoning later authentication. Added test covers rejected challenges; no new runtime API, dependency, or unsafe code in this crate delta."

[[audits.granit-parser]]
who = "Christiantyemele <yemelechristian2@gmail.com>"
criteria = "safe-to-deploy"
version = "1.3.0"
notes = "Reviewed 1.3.0 production default feature surface: pure-Rust YAML parser; no build script, proc macro, unsafe code, native code, network access, process execution, or dynamic loading. Used only through serde-saphyr for the operator-managed issuer registry."

[[audits.granit-parser]]
who = "Christiantyemele <yemelechristian2@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.3.0 -> 2.0.0"
notes = "Delta 1.3.0 -> 2.0.0. Verified 2.0.0 still has forbid(unsafe_code), no build script (build = false), no proc macro, no native/network code. Duplicate directives/keys remain rejected (duplicate version/tag directive tests pass). Used only through serde-saphyr for the operator-managed issuer registry."

[[audits.libsqlite3-sys]]
who = "Codex (AI-assisted audit for Christian Yemele)"
criteria = "safe-to-deploy"
delta = "0.37.0 -> 0.39.1"
notes = "Reviewed 0.37.0 -> 0.39.1 for the bundled SQLite feature path used by SQLx. Bundled SQLite 3.54.1 C source and headers match the official sqlite-amalgamation-3540100.zip byte-for-byte; archive SHA3-256 matches sqlite.org. Reviewed Cargo manifest and build.rs delta: bundled path compiles local SQLite source, copies bundled bindings, and adds no network or process execution. Other Rust source change is an import reorder in src/error.rs. Built all features and exercised 53 SQLite unit tests."

[[audits.serde-saphyr]]
who = "Christiantyemele <yemelechristian2@gmail.com>"
criteria = "safe-to-deploy"
version = "1.3.0"
notes = "Reviewed 1.3.0 production default feature surface: pure-Rust YAML serde adapter; no build script, proc macro, unsafe code, native code, network access, process execution, or dynamic loading. The application uses only from_str and to_string; filesystem include support is not enabled."

[[audits.serde-saphyr]]
who = "Christiantyemele <yemelechristian2@gmail.com>"
criteria = "safe-to-deploy"
