version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-type: all
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          # Leave major upgrades ungrouped so migrations remain independently reviewable.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directories:
      - /perf
      - /scripts/local-ci/node
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    cooldown:
      default-days: 7

  # uv owns both pyproject.toml and uv.lock. Do not add a competing pip updater
  # for demo/requirements.txt; regenerate that export in each uv update PR.
  - package-ecosystem: uv
    directory: /demo
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /scripts/local-ci
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
