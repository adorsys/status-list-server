name: "API Contract Tests"

on:
  merge_group:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  postman-newman:
    name: Postman Collection (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect API-facing changes
        id: api-changes
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          base_ref="origin/${GITHUB_BASE_REF}"
          if ! git merge-base --is-ancestor "$base_ref" HEAD 2>/dev/null; then
            git fetch --no-tags --deepen=100 origin "${GITHUB_BASE_REF}"
          fi
          git merge-base "$base_ref" HEAD >/dev/null

          changed=$(git diff --name-only "$base_ref...HEAD" -- \
            docs/openapi.yaml \
            postman \
            scripts/test-postman-collection.sh \
            scripts/check-api-test-images.sh \
            src/config.rs \
            src/startup.rs \
            src/domain \
            src/server \
            src/outbound/memory.rs \
            src/outbound/cache.rs \
            Cargo.toml \
            Cargo.lock \
            package.json \
            package-lock.json \
            .env.template)

          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf 'API-facing changes detected:\n%s\n' "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No API-facing changes detected; Newman collection gate is a no-op for this PR."
          fi

      - name: Install Rust
        if: steps.api-changes.outputs.changed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-shared-key: "workspace"
          cache-save-if: "false"

      - name: Install build dependencies
        if: steps.api-changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Verify pinned API test images
        if: steps.api-changes.outputs.changed == 'true'
        run: ./scripts/check-api-test-images.sh

      - name: Start in-memory server and run collection
        if: steps.api-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          cargo build --no-default-features --features memory
          APP_SERVER__HOST=0.0.0.0 \
          APP_SERVER__CERT__PROVISIONING_STRATEGY=store \
            APP_SERVER__CERT__STORE__CERTIFICATE_PATH=test_data/ed25519_cert.pem \
            APP_SERVER__CERT__STORE__SIGNING_KEY_PATH=test_data/ed25519_key.pem \
            target/debug/status-list-server > /tmp/status-list-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if ! NEWMAN_RUNNER=docker ./scripts/test-postman-collection.sh; then
            echo "::group::status-list-server logs"
            cat /tmp/status-list-server.log
            echo "::endgroup::"
            exit 1
          fi
