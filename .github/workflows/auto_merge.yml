name: Auto Merge Dependabot

on:
  pull_request:

# `contents: write` for `gh pr merge --auto`, `pull-requests: write` for
# `gh pr review --approve`; everything unlisted is `none`.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # `user.login` is who opened the PR -- fixed at open time, unspoofable, and the
    # actual authorization check. `github.actor` alone is spoofable (zizmor flags it),
    # which is why it is paired here rather than removed; it narrows, it does not
    # prevent. `head.repo.full_name` excludes forks.
    #
    # SAFETY DEPENDS ON BRANCH PROTECTION: without `dismiss_stale_reviews`, a push to
    # an open dependabot branch merges on the already-armed auto-merge and no condition
    # here stops it. Not assertable in CI (needs `administration: read`) -- see #417.
    #
    # Keep the ignore comment on this `if:` header: below is a folded scalar where `#`
    # is literal text and would corrupt the condition.
    if: >- # zizmor: ignore[bot-conditions]
      github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          alert-lookup: true
          compat-lookup: true

      # Decided once, here, rather than repeated as an `if:` on each step below -- three
      # copies of the predicate is three chances for them to disagree, and the approve
      # step disagreeing with the merge step is what "approved but never merged", or
      # worse "merged without the intended gate", looks like.
      #
      # Auto-merge is limited to patch and minor bumps. `fetch-metadata` already exposes
      # the semver class and it was not being read, so a *major* upgrade was approved
      # with GITHUB_TOKEN and merged without anyone reading it. An unknown or empty
      # update-type is treated as ineligible: this fails closed.
      #
      # github-actions updates stay excluded regardless of semver class -- a moved tag
      # is a supply-chain event, not a version bump.
      - name: Decide whether this PR may auto-merge
        id: gate
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          eligible=false
          case "$ECOSYSTEM" in
            github-actions)
              reason="github-actions updates always need manual review"
              ;;
            *)
              case "$UPDATE_TYPE" in
                version-update:semver-patch|version-update:semver-minor)
                  eligible=true
                  reason="${UPDATE_TYPE#version-update:}"
                  ;;
                "")
                  reason="fetch-metadata reported no update-type"
                  ;;
                *)
                  reason="${UPDATE_TYPE#version-update:} needs manual review"
                  ;;
              esac
              ;;
          esac
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"
          echo "auto-merge eligible: ${eligible} (${reason})"

      - name: Approve the PR
        if: steps.gate.outputs.eligible == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        if: steps.gate.outputs.eligible == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain why auto-merge was withheld
        if: steps.gate.outputs.eligible != 'true'
        run: echo "Left for manual review -- see the eligibility decision above."
