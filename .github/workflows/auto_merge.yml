name: Auto Merge Dependabot

on:
  pull_request:

# `pull-requests: write` to arm auto-merge; `contents: write` because `--auto` merges
# immediately when the pull request is already mergeable rather than arming anything.
# Everything unlisted is `none`.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # `user.login`, not `github.actor`: the actor is whoever last touched the pull
    # request, so it is both spoofable and wrong after a maintainer reopens one.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Patch and minor only, never github-actions. Unknown or empty update-type is
      # ineligible, so this fails closed. Decided once so the steps cannot disagree.
      - name: Decide whether this PR may auto-merge
        id: gate
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          eligible=false
          case "$ECOSYSTEM" in
            github-actions)
              reason="github-actions updates always need manual review"
              ;;
            *)
              case "$UPDATE_TYPE" in
                version-update:semver-patch|version-update:semver-minor)
                  eligible=true
                  reason="${UPDATE_TYPE#version-update:}"
                  ;;
                "")
                  reason="fetch-metadata reported no update-type"
                  ;;
                *)
                  reason="${UPDATE_TYPE#version-update:} needs manual review"
                  ;;
              esac
              ;;
          esac
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"
          echo "auto-merge eligible: ${eligible} (${reason})"

      # No approval step. `gh pr review --approve` cannot work here -- GitHub refuses
      # `addPullRequestReview` from Actions -- and the ruleset requires two approvals
      # with `require_last_push_approval`, which one bot approval could not satisfy
      # anyway. Arming auto-merge is the whole job: reviews stay human, and the merge
      # fires on its own once they land and the checks are green.
      - name: Enable auto-merge for Dependabot PRs
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "::error::could not arm auto-merge on ${PR_URL}."
            echo "The usual cause is the repository setting 'Allow auto-merge' being"
            echo "off: Settings -> General -> Pull Requests. See CONTRIBUTING.md,"
            echo "'Dependabot auto-merge'."
            exit 1
          fi

      - name: Explain why auto-merge was withheld
        if: steps.gate.outputs.eligible != 'true'
        run: echo "Left for manual review -- see the eligibility decision above."
