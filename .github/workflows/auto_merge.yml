name: Auto Merge Dependabot

on:
  pull_request:

# contents: write because --auto merges at once when the PR is already mergeable.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # user.login, not github.actor, which is whoever last touched the PR.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Patch and minor only, never github-actions; unknown types are refused.
      - name: Decide whether this PR may auto-merge
        id: gate
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          eligible=false
          case "$ECOSYSTEM" in
            github-actions)
              reason="github-actions updates always need manual review"
              ;;
            *)
              case "$UPDATE_TYPE" in
                version-update:semver-patch|version-update:semver-minor)
                  eligible=true
                  reason="${UPDATE_TYPE#version-update:}"
                  ;;
                "")
                  reason="fetch-metadata reported no update-type"
                  ;;
                *)
                  reason="${UPDATE_TYPE#version-update:} needs manual review"
                  ;;
              esac
              ;;
          esac
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"
          echo "auto-merge eligible: ${eligible} (${reason})"

      - name: Enable auto-merge for Dependabot PRs
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Auto-merge is off in repo settings by choice (CONTRIBUTING.md), so that case warns, not fails.
          # Read the setting from the API rather than parsing gh's error text, which isn't stable.
          allowed=$(gh api "repos/${REPO}" --jq '.allow_auto_merge' 2>/dev/null) || allowed=""

          if [ "$allowed" = "false" ]; then
            echo "::warning::auto-merge is disabled for this repository, so nothing was armed."
            echo "Turn it on at Settings -> General -> Pull Requests. See CONTRIBUTING.md,"
            echo "'Dependabot auto-merge'. This pull request was otherwise eligible."
            exit 0
          fi

          if [ "$allowed" != "true" ]; then
            # Couldn't read the setting: warn and try anyway, so a real failure still surfaces.
            echo "::warning::could not read allow_auto_merge for ${REPO} (got '${allowed}'); arming anyway."
          fi

          # The setting is on, so any failure here is a real one.
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "::error::could not arm auto-merge on ${PR_URL}."
            exit 1
          fi

      - name: Explain why auto-merge was withheld
        if: steps.gate.outputs.eligible != 'true'
        run: echo "Left for manual review -- see the eligibility decision above."
