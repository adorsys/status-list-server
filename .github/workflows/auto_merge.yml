name: Auto Merge Dependabot

on:
  pull_request:

# `pull-requests: write` to arm auto-merge; `contents: write` because `--auto` merges
# immediately when the pull request is already mergeable rather than arming anything.
# Everything unlisted is `none`.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # `user.login`, not `github.actor`: the actor is whoever last touched the pull
    # request, so it is both spoofable and wrong after a maintainer reopens one.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Patch and minor only, never github-actions. Unknown or empty update-type is
      # ineligible, so this fails closed. Decided once so the steps cannot disagree.
      - name: Decide whether this PR may auto-merge
        id: gate
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          eligible=false
          case "$ECOSYSTEM" in
            github-actions)
              reason="github-actions updates always need manual review"
              ;;
            *)
              case "$UPDATE_TYPE" in
                version-update:semver-patch|version-update:semver-minor)
                  eligible=true
                  reason="${UPDATE_TYPE#version-update:}"
                  ;;
                "")
                  reason="fetch-metadata reported no update-type"
                  ;;
                *)
                  reason="${UPDATE_TYPE#version-update:} needs manual review"
                  ;;
              esac
              ;;
          esac
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"
          echo "auto-merge eligible: ${eligible} (${reason})"

      - name: Enable auto-merge for Dependabot PRs
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # `Allow auto-merge` being off is a repository setting, not a fault in this
          # pull request, and it withholds every eligible one until it is turned on. A
          # job that is red on every dependency bump teaches people to ignore red, so
          # that case warns. It is off by choice today (CONTRIBUTING.md, "Dependabot
          # auto-merge"), which makes this the path every eligible bump takes rather
          # than a rare fallback.
          #
          # Read from the repository object rather than matched against gh's error
          # text: that wording is not an API and can change across gh versions or
          # locales, which would silently reclassify this case as a hard failure --
          # or, worse, reclassify an unrelated failure as this case.
          #
          # `allow_auto_merge` is the REST spelling; GraphQL calls it
          # `autoMergeAllowed`.
          allowed=$(gh api "repos/${REPO}" --jq '.allow_auto_merge' 2>/dev/null) || allowed=""

          if [ "$allowed" = "false" ]; then
            echo "::warning::auto-merge is disabled for this repository, so nothing was armed."
            echo "Turn it on at Settings -> General -> Pull Requests. See CONTRIBUTING.md,"
            echo "'Dependabot auto-merge'. This pull request was otherwise eligible."
            exit 0
          fi

          if [ "$allowed" != "true" ]; then
            # Neither true nor false: the token could not read the setting. Genuinely
            # anomalous for a token with push access, so surface it and still try --
            # a failure below is then reported as a failure rather than swallowed.
            echo "::warning::could not read allow_auto_merge for ${REPO} (got '${allowed}'); arming anyway."
          fi

          # The setting is on, so any failure here is a real one.
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "::error::could not arm auto-merge on ${PR_URL}."
            exit 1
          fi

      - name: Explain why auto-merge was withheld
        if: steps.gate.outputs.eligible != 'true'
        run: echo "Left for manual review -- see the eligibility decision above."
