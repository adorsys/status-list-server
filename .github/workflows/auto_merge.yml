name: Auto Merge Dependabot

on:
  pull_request:

# `contents: write` for `gh pr merge --auto`, `pull-requests: write` for
# `gh pr review --approve`; everything unlisted is `none`.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # `user.login` is who opened the PR -- fixed at open time, unspoofable, and the
    # actual authorization check. `github.actor` alone is spoofable (zizmor flags it),
    # which is why it is paired here rather than removed; it narrows, it does not
    # prevent. `head.repo.full_name` excludes forks.
    #
    # SAFETY DEPENDS ON BRANCH PROTECTION: without `dismiss_stale_reviews`, a push to
    # an open dependabot branch merges on the already-armed auto-merge and no condition
    # here stops it. Not assertable in CI (needs `administration: read`) -- see #417.
    #
    # Keep the ignore comment on this `if:` header: below is a folded scalar where `#`
    # is literal text and would corrupt the condition.
    if: >- # zizmor: ignore[bot-conditions]
      github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          alert-lookup: true
          compat-lookup: true

      - name: Approve the PR
        if: steps.metadata.outputs.package-ecosystem != 'github-actions'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.package-ecosystem != 'github-actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Skip auto-merge for GitHub Actions updates
        if: steps.metadata.outputs.package-ecosystem == 'github-actions'
        run: |
          echo "GitHub Actions update detected - manual review required for security"
          echo "Skipped auto-merge for dependency fingerprint"
