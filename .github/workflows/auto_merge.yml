name: Auto Merge Dependabot

on:
  pull_request:
  workflow_dispatch:

# zizmor: ignore-start: excessive-permissions
# This workflow requires write permissions for auto-merge functionality.
# These are pre-existing permissions that will be reviewed separately.
permissions:
  contents: write
  pull-requests: write
# zizmor: ignore-end

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # `github.event.pull_request.user.login`, not `github.actor`. `github.actor` is
    # the last actor to touch the triggering context, not the author of the pull
    # request, so a pull request whose HEAD commit appears to be authored by
    # Dependabot satisfies it while the branch history remains attacker-controlled.
    # This job approves and enables auto-merge, so that guard being bypassable means
    # arbitrary code merges without review. `user.login` is the account that opened
    # the pull request and cannot be reassigned by later activity.
    #
    # Behaviour is unchanged for `workflow_dispatch`: there is no pull request in the
    # event payload, so this evaluates false exactly as the previous condition did.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          alert-lookup: true
          compat-lookup: true

      - name: Approve the PR
        if: steps.metadata.outputs.package-ecosystem != 'github-actions'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.package-ecosystem != 'github-actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Skip auto-merge for GitHub Actions updates
        if: steps.metadata.outputs.package-ecosystem == 'github-actions'
        run: |
          echo "GitHub Actions update detected - manual review required for security"
          echo "Skipped auto-merge for dependency fingerprint"
