name: Auto Merge Dependabot

on:
  pull_request:

# `contents: write` for `gh pr merge --auto`, `pull-requests: write` for
# `gh pr review --approve`; everything unlisted is `none`.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # `user.login` is the real check, `github.actor` only narrows it; neither helps
    # without `dismiss_stale_reviews` (#417). Ignore must stay on this header line.
    if: >- # zizmor: ignore[bot-conditions]
      github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          alert-lookup: true
          compat-lookup: true

      # Patch and minor only, never github-actions. Unknown or empty update-type is
      # ineligible, so this fails closed. Decided once so the steps cannot disagree.
      - name: Decide whether this PR may auto-merge
        id: gate
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          eligible=false
          case "$ECOSYSTEM" in
            github-actions)
              reason="github-actions updates always need manual review"
              ;;
            *)
              case "$UPDATE_TYPE" in
                version-update:semver-patch|version-update:semver-minor)
                  eligible=true
                  reason="${UPDATE_TYPE#version-update:}"
                  ;;
                "")
                  reason="fetch-metadata reported no update-type"
                  ;;
                *)
                  reason="${UPDATE_TYPE#version-update:} needs manual review"
                  ;;
              esac
              ;;
          esac
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"
          echo "auto-merge eligible: ${eligible} (${reason})"

      - name: Approve the PR
        if: steps.gate.outputs.eligible == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        if: steps.gate.outputs.eligible == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain why auto-merge was withheld
        if: steps.gate.outputs.eligible != 'true'
        run: echo "Left for manual review -- see the eligibility decision above."
