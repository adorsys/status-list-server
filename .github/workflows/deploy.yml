name: Build and Deploy to EKS
on:
  # Tags only: a two-arch build and scan takes ~40 minutes.
  push:
    tags:
      - v*.*.*
  # Dispatch builds and scans but never releases: promote-tags and deploy need a push.
  workflow_dispatch:

# A job-level `permissions:` block replaces this default rather than merging with it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CLUSTER_NAME: datev-wallet-cluster
  AWS_REGION: eu-central-1
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/status-list-server
  CHART_DIR: deploy/helm/chart
  HELM_RELEASE_NAME: statuslist
  HELM_NAMESPACE: statuslist-production
  APP_DATABASE_PORT: ${{ vars.APP_DATABASE_PORT }}
  # Repo-scoped value, compared in deploy against the environment-scoped one.
  REPO_IMAGE_VARIANT: ${{ vars.IMAGE_VARIANT || 'aws' }}

jobs:
  # No if: a skip here would cascade to every dependent job.
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The v*.*.* glob isn't semver (v2024.01.release matches), so check properly.
      - name: Assert the tag is semver
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: bash scripts/validate-release-tag.sh "$REF_NAME" "$IS_TAG"

  ci:
    name: CI
    # A malformed tag fails in seconds; without this the whole suite runs first.
    needs: validate-tag
    uses: ./.github/workflows/CI.yml
    # A called workflow can only narrow these; CI.yml needs read only.
    permissions:
      contents: read

  helm-checks:
    name: Helm Checks
    needs: validate-tag
    uses: ./.github/workflows/helm-checks.yml
    # helm-checks' kube-linter job needs security-events to upload SARIF.
    permissions:
      contents: read
      security-events: write

  build-and-push:
    name: Build and Push Docker Image to GHCR (${{ matrix.variant.suffix }})
    runs-on: ubuntu-latest
    needs: [ci, helm-checks, validate-tag]
    timeout-minutes: 60
    # zizmor: ignore[excessive-permissions]
    # Sigstore signing needs these; see docs/adr/0001-container-image-provenance.md.
    permissions:
      contents: read
      packages: write
      # id-token lets this job assert the repo's identity. The deploy role's trust policy must pin
      # sub to environment:production, or this build job could assume it (ADR 0001).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - suffix: aws
            features: "postgres,aws,redis"
            description: "PostgreSQL database with AWS Secrets Manager and Route53 DNS support"
          - suffix: gcp
            features: "postgres,gcp,redis"
            description: "PostgreSQL database with GCP Secret Manager and Cloud DNS support"
          - suffix: azure
            features: "postgres,azure,redis"
            description: "PostgreSQL database with Azure Key Vault and Azure DNS support"
          - suffix: vault
            features: "postgres,vault,redis"
            description: "PostgreSQL database with HashiCorp Vault / OpenBao token material storage"
          - suffix: fscert
            features: "postgres,redis"
            description: "PostgreSQL database with filesystem-mounted token signing keys and certificates"
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the token sits in .git/config, inside the Docker build context.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        # Sha tag only; release tags come after the scan passes.
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=sha,format=short,prefix=sha-,suffix=-${{ matrix.variant.suffix }}
          labels: |
            org.opencontainers.image.description=${{ matrix.variant.description }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build-${{ matrix.variant.suffix }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.variant.suffix }}
          # Explicit: the default drops to mode=min if the repo goes private.
          provenance: mode=max
          sbom: true
          build-args: |
            FEATURES=${{ matrix.variant.features }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index,manifest:org.opencontainers.image.description=${{ matrix.variant.description }}

      - name: Assert a digest was produced
        # An empty digest would fall back to tag-based deploys; IMAGE_REF is built only after this check.
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.variant.suffix }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::build-push-action produced no image digest for variant ${SUFFIX}."
            exit 1
          fi
          echo "image digest for ${SUFFIX}: $DIGEST"
          echo "IMAGE_REF=${IMAGE_BASE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DIGEST" > "image-digest-${SUFFIX}.txt"

      - name: Attest build provenance
        # Signed provenance on top of BuildKit's self-asserted one (ADR 0001).
        # Bound to the index digest, so it survives promote-tags.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # No tag: the action rejects one.
          subject-name: ${{ env.IMAGE_BASE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # GHCR's Referrers API is unsettled; gh attestation verify reads GitHub's API anyway.
          push-to-registry: false
          # Keeps artifact-metadata: write off this job; flipping push-to-registry would need it.
          create-storage-record: false

      - name: Verify OCI description annotations
        env:
          DESCRIPTION: ${{ matrix.variant.description }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          raw=$(docker buildx imagetools inspect --raw "${IMAGE_BASE}@${DIGEST}")
          index_description=$(printf '%s' "$raw" | jq -r '.annotations["org.opencontainers.image.description"] // ""')
          if [ "$index_description" != "$DESCRIPTION" ]; then
            echo "::error::index OCI description annotation mismatch for ${DIGEST}"
            echo "expected: $DESCRIPTION"
            echo "actual:   $index_description"
            exit 1
          fi

          for manifest in $(printf '%s' "$raw" | jq -r '.manifests[]
            | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))
            | .digest'); do
            manifest_description=$(docker buildx imagetools inspect --raw "${IMAGE_BASE}@${manifest}" \
              | jq -r '.annotations["org.opencontainers.image.description"] // ""')
            if [ "$manifest_description" != "$DESCRIPTION" ]; then
              echo "::error::manifest OCI description annotation mismatch for ${manifest}"
              echo "expected: $DESCRIPTION"
              echo "actual:   $manifest_description"
              exit 1
            fi
          done

      - name: Upload built digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.variant.suffix }}
          path: image-digest-${{ matrix.variant.suffix }}.txt
          if-no-files-found: error

  scan-image:
    name: Scan Image for Vulnerabilities (${{ matrix.variant.suffix }})
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - suffix: aws
          - suffix: gcp
          - suffix: azure
          - suffix: vault
          - suffix: fscert
    env:
      # Scan both: cargo auditable records each target's own graph, so arches can differ.
      SCAN_ARCHES: amd64 arm64
      # Declared so static analysis knows them; set at runtime.
      SCAN_REF_AMD64: ""
      SCAN_REF_ARM64: ""
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --name "image-digest-${{ matrix.variant.suffix }}" --dir .

      - name: Resolve the architecture manifests to scan
        env:
          SUFFIX: ${{ matrix.variant.suffix }}
        run: |
          set -euo pipefail
          index_digest=$(cat "image-digest-${SUFFIX}.txt")
          [[ "$index_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::invalid built image digest for ${SUFFIX}: ${index_digest}"
            exit 1
          }

          # Captured, not piped, so a failed resolution can't leave this step green.
          resolved=$(bash scripts/resolve-arch-manifests.sh "${IMAGE_BASE}@${index_digest}" $SCAN_ARCHES)

          # Upper-cased to match the env.SCAN_REF_* names the scan steps read.
          while read -r arch manifest; do
            echo "SCAN_REF_$(printf '%s' "$arch" | tr '[:lower:]' '[:upper:]')=${IMAGE_BASE}@${manifest}" >> "$GITHUB_ENV"
          done <<< "$resolved"

      - name: Install Trivy
        # Pinned to the same version trivy-action v0.36.0 uses internally.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: false

      - name: Restore Trivy vulnerability database cache
        # Absolute path: neither trivy-action nor Trivy expands ~ in cache-dir.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Ensure Trivy vulnerability database
        # Falls back to a cached DB under 24h old; fails otherwise.
        run: bash scripts/ensure-trivy-db.sh "$RUNNER_TEMP/trivy" 24

      - name: Save Trivy vulnerability database cache
        # One leg saves; the others would fail to reserve the same key.
        if: strategy.job-index == 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}

      - name: Scan image (amd64)
        # Unfiltered, so every view is derived from one pull. The DB was already refreshed above.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_REF_AMD64 }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: json
          output: trivy-image-report-amd64.json
          cache: false
          cache-dir: ${{ runner.temp }}/trivy
          skip-setup-trivy: true

      - name: Scan image (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_REF_ARM64 }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: json
          output: trivy-image-report-arm64.json
          cache: false
          cache-dir: ${{ runner.temp }}/trivy
          skip-setup-trivy: true

      - name: Derive reports
        # Severity floor and ledger live in the script, shared with the nightly re-scan.
        run: |
          set -eu
          for arch in $SCAN_ARCHES; do
            sh scripts/derive-trivy-reports.sh "$arch"
          done

      - name: Collect published SBOMs
        # After the scan, so an imagetools hiccup can't cost the reports.
        run: |
          set -euo pipefail
          index_digest=$(cat "image-digest-${{ matrix.variant.suffix }}.txt")
          image_ref="${IMAGE_BASE}@${index_digest}"
          : > sbom-summary.md
          for platform in linux/amd64 linux/arm64; do
            out="sbom-${platform#linux/}.json"
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect "$image_ref" \
                   --format "{{ json (index .SBOM \"$platform\") }}" > "$out"; then
                break
              fi
              [ "$attempt" -lt 3 ] || { echo "::error::could not fetch SBOM for $platform"; exit 1; }
              sleep $(( attempt * 5 ))
            done
            crates=$(sh scripts/count-sbom-crates.sh "$out")
            echo "$platform: $crates distinct cargo packages"
            echo "- \`$platform\`: $crates distinct cargo packages" >> sbom-summary.md
          done

      - name: Publish report to job summary
        if: always()
        run: |
          set -eu
          index_digest=$(cat "image-digest-${{ matrix.variant.suffix }}.txt" 2>/dev/null || true)
          image_ref="${IMAGE_BASE}@${index_digest}"
          {
            echo "## Container image scan (${{ matrix.variant.suffix }})"
            echo
            echo "Index: \`${image_ref}\`"
            echo
            echo "| Platform | Scanned digest | HIGH/CRITICAL |"
            echo "| --- | --- | --- |"
            for arch in $SCAN_ARCHES; do
              var="SCAN_REF_$(printf '%s' "$arch" | tr '[:lower:]' '[:upper:]')"
              ref="${!var:-}"
              findings="trivy-highcrit-all-${arch}.json"
              if [ -s "$findings" ]; then
                count=$(jq '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | length' "$findings")
              else
                count="not scanned"
              fi
              echo "| \`linux/${arch}\` | \`${ref##*@}\` | ${count} |"
            done
            echo
            echo "### Published SBOM"
            echo
            cat sbom-summary.md 2>/dev/null || echo "_SBOM collection did not complete._"
            echo
            echo "Full tables and JSON: the \`container-scan-reports-${{ matrix.variant.suffix }}\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan reports
        # warn: the [ -s ] fallbacks above guarantee the files exist.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-scan-reports-${{ matrix.variant.suffix }}
          path: |
            trivy-image-report-*.json
            trivy-image-report-*.txt
            trivy-highcrit-all-*.json
            trivy-gate-findings-*.json
          if-no-files-found: warn

      - name: Upload published SBOMs
        # Separate artifact, so a missing SBOM can't sink the scan results.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-sboms-${{ matrix.variant.suffix }}
          path: |
            sbom-amd64.json
            sbom-arm64.json
          if-no-files-found: warn

      # No SARIF upload here: tag-ref alerts never show in the branch view; the nightly uploads instead.

      - name: Assert published SBOMs list Rust crates
        # index .SBOM errors unless the image is a multi-platform index.
        run: |
          set -eu
          for platform in linux/amd64 linux/arm64; do
            out="sbom-${platform#linux/}.json"
            crates=$(sh scripts/count-sbom-crates.sh "$out")
            if [ "$crates" -eq 0 ]; then
              echo "::error::Published SBOM for $platform lists no pkg:cargo/ packages. The image ships without usable dependency metadata."
              exit 1
            fi
            echo "$platform: $crates distinct cargo packages"
          done

      - name: Prove the gate can fail
        # A gate that has never failed can't be told apart from one that can't.
        run: sh scripts/gate-selftest.sh

      - name: Vulnerability gate
        # Any HIGH or CRITICAL left after the ledger blocks, fixed or not (docs/supply-chain.md).
        run: |
          set -eu
          # Count advisories, not rows, across both arches.
          advisories=$(jq -s '[.[].Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | length' trivy-gate-findings-*.json)
          occurrences=$(jq -s '[.[].Results[]?.Vulnerabilities[]?] | length' trivy-gate-findings-*.json)
          total=$(jq -s '[.[].Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | length' trivy-highcrit-all-*.json)
          suppressed=$(( total - advisories ))

          echo "HIGH/CRITICAL after exceptions: ${advisories} advisories across ${occurrences} package occurrences (${suppressed} suppressed by .trivyignore.yaml)"
          {
            echo
            echo "### Vulnerability gate"
            echo
            if [ "${advisories}" -eq 0 ]; then
              echo "No HIGH or CRITICAL findings after exceptions, on any scanned architecture."
            else
              echo "\`${advisories}\` distinct HIGH/CRITICAL advisories (\`${occurrences}\` package occurrences) block this release."
              echo
              echo "Triage steps and the exception format are in \`docs/supply-chain.md\`."
              echo "The exact blocking set is \`trivy-gate-findings-<arch>.json\` in the \`container-scan-reports-${{ matrix.variant.suffix }}\` artifact."
            fi
            echo
            if [ "${suppressed}" -gt 0 ]; then
              echo "\`${suppressed}\` HIGH/CRITICAL advisories were suppressed by \`.trivyignore.yaml\`. The unsuppressed set is \`trivy-highcrit-all-<arch>.json\`."
            else
              echo "No findings were suppressed by \`.trivyignore.yaml\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Render every arch before failing.
          status=0
          for arch in $SCAN_ARCHES; do
            echo "--- linux/${arch} ---"
            sh scripts/vuln-gate.sh "trivy-gate-findings-${arch}.json" || status=1
          done
          exit "$status"

  verify-provenance:
    name: Verify Signed Provenance (${{ matrix.variant.suffix }})
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    # Not gated on push: it must pass before promotion, and dispatch runs are where the real
    # gh attestation verify gets exercised before a release depends on it.
    permissions:
      contents: read
      packages: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - suffix: aws
          - suffix: gcp
          - suffix: azure
          - suffix: vault
          - suffix: fscert
    env:
      SUFFIX: ${{ matrix.variant.suffix }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/workflows

      - name: Prove the attestation check can fail
        if: matrix.variant.suffix == 'aws'
        run: bash scripts/attestation-selftest.sh

      - name: Download built digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --name "image-digest-${{ matrix.variant.suffix }}" --dir .

      - name: Verify signed provenance for the built digest
        # Pin the exact ref: otherwise any ref's dispatch run could produce an accepted signature.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          index_digest=$(cat "image-digest-${SUFFIX}.txt")
          [[ "$index_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::invalid built image digest for ${SUFFIX}: ${index_digest}"
            exit 1
          }
          bash scripts/verify-attestation.sh \
            "${IMAGE_BASE}@${index_digest}" "$GITHUB_REPOSITORY" "$GITHUB_REF"

  promote-tags:
    name: Promote Scanned Digest to Release Tags (${{ matrix.variant.suffix }})
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - scan-image
      - verify-provenance
    # Check the event too: workflow_dispatch can run on tag refs.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - suffix: aws
            description: "PostgreSQL database with AWS Secrets Manager and Route53 DNS support"
          - suffix: gcp
            description: "PostgreSQL database with GCP Secret Manager and Cloud DNS support"
          - suffix: azure
            description: "PostgreSQL database with Azure Key Vault and Azure DNS support"
          - suffix: vault
            description: "PostgreSQL database with HashiCorp Vault / OpenBao token material storage"
          - suffix: fscert
            description: "PostgreSQL database with filesystem-mounted token signing keys and certificates"
    env:
      SUFFIX: ${{ matrix.variant.suffix }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --name "image-digest-${{ matrix.variant.suffix }}" --dir .

      - name: Extract release tags
        # The tag glob also matches prereleases, so latest is withheld explicitly.
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.variant.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.variant.suffix }}
            type=raw,value=latest,suffix=-${{ matrix.variant.suffix }},enable=${{ !contains(github.ref_name, '-') }}

      - name: Promote digest to release tags
        # Copies by digest, so the tags point at exactly the scanned index.
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DESCRIPTION: ${{ matrix.variant.description }}
        run: |
          set -euo pipefail
          index_digest=$(cat "image-digest-${SUFFIX}.txt")
          [[ "$index_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::invalid built image digest for ${SUFFIX}: ${index_digest}"
            exit 1
          }
          image_ref="${IMAGE_BASE}@${index_digest}"
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=(--tag "$tag")
          done <<< "$TAGS"
          # No tags would make this a silent no-op.
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::metadata-action produced no release tags for ${GITHUB_REF_NAME}-${SUFFIX}."
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}" \
            "${args[@]}" "$image_ref"

      - name: Verify attestations survived promotion
        # Attestations are separate manifests and could be dropped silently.
        run: |
          set -eu
          DEPLOY_TAG="${GITHUB_REF_NAME#v}"
          release_ref="${IMAGE_BASE}:${DEPLOY_TAG}-${SUFFIX}"
          description="${{ matrix.variant.description }}"
          actual_description=$(docker buildx imagetools inspect --raw "$release_ref" \
            | jq -r '.annotations["org.opencontainers.image.description"] // ""')
          if [ "$actual_description" != "$description" ]; then
            echo "::error::OCI description annotation missing after tag promotion on $release_ref."
            echo "expected: $description"
            echo "actual:   $actual_description"
            exit 1
          fi
          for platform in linux/amd64 linux/arm64; do
            for field in SBOM Provenance; do
              if ! docker buildx imagetools inspect "$release_ref" \
                --format "{{ json (index .$field \"$platform\") }}" \
                | jq -e '(type == "object") and (length > 0)' > /dev/null; then
                echo "::error::$field missing for $platform on $release_ref after tag promotion."
                exit 1
              fi
            done
          done
          echo "SBOM and provenance present for both platforms on $release_ref"

      - name: Verify signed provenance survived promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEPLOY_TAG="${GITHUB_REF_NAME#v}"
          release_ref="${IMAGE_BASE}:${DEPLOY_TAG}-${SUFFIX}"
          promoted_digest=$(docker buildx imagetools inspect "$release_ref" \
            --format '{{ .Manifest.Digest }}')
          [[ "$promoted_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::${release_ref} did not resolve to a digest: '${promoted_digest}'"
            exit 1
          }

          bash scripts/verify-attestation.sh \
            "${IMAGE_BASE}@${promoted_digest}" "$GITHUB_REPOSITORY" "$GITHUB_REF"

          built_digest=$(cat "image-digest-${SUFFIX}.txt")
          if [ "$promoted_digest" != "$built_digest" ]; then
            echo "::error::${release_ref} resolves to ${promoted_digest}, not the built and scanned ${built_digest}."
            echo "The release tag was applied to something other than the artifact this run gated."
            echo "Note that the digest it does resolve to carries valid provenance from this run, so this"
            echo "is a promotion fault rather than a signing one."
            exit 1
          fi

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Never deploy an untagged release; recover from a promotion failure by re-running it.
    needs:
      - build-and-push
      - scan-image
      - promote-tags
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 30
    environment: production
    # Keyed on the environment so two quick tags can't helm upgrade at once.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: read
      attestations: read
    env:
      # Pushed-ref values go through env, never ${{ }} in run:, since the pusher controls them.
      IMAGE_VARIANT: ${{ vars.IMAGE_VARIANT || 'aws' }}
      # Job-level so the production environment's value resolves.
      APP_CACHE_HOST: ${{ vars.APP_CACHE_HOST }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: status-list-server-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Validate deployment configuration
        run: |
          if [[ -z "${APP_DATABASE_PORT}" ]]; then
            echo "APP_DATABASE_PORT repository/environment variable is required" >&2
            exit 1
          fi
          if [[ -z "${APP_CACHE_HOST:-}" ]]; then
            echo "APP_CACHE_HOST repository/environment variable is required" >&2
            exit 1
          fi
          # Never echo the value; a misconfigured one may embed credentials.
          if [[ ! "${APP_CACHE_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "APP_CACHE_HOST must be a bare hostname (no scheme, port, path or credentials)" >&2
            exit 1
          fi

      - name: Assert the issuer registry ConfigMap exists
        # The chart mounts the registry from status-list-server-issuers and nothing
        # creates it. On a missing ConfigMap the pods would sit in ContainerCreating for
        # the whole --wait window and then roll back; fail fast instead, before the
        # release is attempted.
        run: |
          set -euo pipefail
          if ! kubectl get configmap status-list-server-issuers \
              -n "${{ env.HELM_NAMESPACE }}" >/dev/null 2>&1; then
            echo "::error::ConfigMap 'status-list-server-issuers' does not exist in namespace '${{ env.HELM_NAMESPACE }}'."
            echo "The deployment mounts the issuer trust registry from it, and nothing creates it."
            echo "Create it before the first release; see docs/deployment-runbook.md, 'Issuer trust registry'."
            exit 1
          fi
          echo "ConfigMap 'status-list-server-issuers' is present."

      - name: Assert the deployed variant is visible outside this environment
        # The nightly scan only sees the repo-scoped IMAGE_VARIANT. If production overrides it,
        # the nightly would verify a variant nobody runs, so fail the deploy instead.
        run: |
          set -eu
          if [ "${IMAGE_VARIANT:-aws}" != "$REPO_IMAGE_VARIANT" ]; then
            echo "::error::IMAGE_VARIANT differs between scopes: this environment resolves"
            echo "'${IMAGE_VARIANT:-aws}', the repository resolves '${REPO_IMAGE_VARIANT}'."
            echo
            echo "An environment-scoped IMAGE_VARIANT on 'production' is invisible to"
            echo "scheduled-image-scan.yml, which would keep re-scanning '${REPO_IMAGE_VARIANT}'"
            echo "and reporting success while production serves '${IMAGE_VARIANT:-aws}'."
            echo
            echo "Set IMAGE_VARIANT at the repository level and remove the environment"
            echo "override, or teach the nightly to read the same scope before deploying."
            exit 1
          fi
          echo "IMAGE_VARIANT '${IMAGE_VARIANT:-aws}' is visible to the scheduled re-scan."

      - name: Build Helm dependencies
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build "$CHART_DIR"

      - name: Deploy chart
        # :? on the digest: empty would silently deploy the mutable tag, and helm's error points elsewhere.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEPLOY_TAG="${GITHUB_REF_NAME#v}"
          IMAGE_VARIANT="${IMAGE_VARIANT:-aws}"
          FULL_TAG="${DEPLOY_TAG}-${IMAGE_VARIANT}"

          # Kubernetes needs the index digest, not a per-arch manifest.
          IMAGE_DIGEST=$(docker buildx imagetools inspect "${IMAGE_BASE}:${FULL_TAG}" \
            --format '{{ .Manifest.Digest }}')
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Could not resolve a valid image index digest for ${IMAGE_BASE}:${FULL_TAG}"
            exit 1
          }

          echo "Deploying ${IMAGE_BASE}:${FULL_TAG}@${IMAGE_DIGEST}"

          # Verify the digest this job resolved: the tag may have moved since promote-tags checked it.
          bash scripts/verify-attestation.sh \
            "${IMAGE_BASE}@${IMAGE_DIGEST}" "$GITHUB_REPOSITORY" "$GITHUB_REF"

          # `FULL_TAG`, not `DEPLOY_TAG`: the tag must carry the variant suffix, or
          # production gets whichever feature set happens to sit on the bare tag.
          #
          # `:?` on both -- helm reports an empty value as a YAML error pointing
          # nowhere near the cause, and an empty digest silently falls back to the
          # mutable tag, which is the failure this pipeline exists to prevent.
          BASELINES="$RUNNER_TEMP/eso-refresh-baselines"
          : > "$BASELINES"
          for es in statuslist-external-secret statuslist-external-secret-aws-credentials statuslist-redis-credentials; do
            rt=$(kubectl get externalsecret "$es" -n "${{ env.HELM_NAMESPACE }}" \
              -o jsonpath='{.status.refreshTime}' 2>/dev/null || true)
            printf '%s %s\n' "$es" "${rt:-}" >> "$BASELINES"
          done

          # --rollback-on-failure only covers the upgrade; the ESO check below may need to roll back too.
          PREV_REVISION=""
          if helm history "${{ env.HELM_RELEASE_NAME }}" -n "${{ env.HELM_NAMESPACE }}" --max 1 >/dev/null 2>&1; then
            PREV_REVISION=$(helm history "${{ env.HELM_RELEASE_NAME }}" -n "${{ env.HELM_NAMESPACE }}" \
              --output json | jq -r 'max_by(.revision) | .revision' 2>/dev/null || true)
          fi
          printf '%s\n' "${PREV_REVISION:-}" > "$RUNNER_TEMP/eso-prev-revision"

          # A clean-looking rollback can still leave migration records the old release cannot start on.
          if ! helm upgrade --install ${{ env.HELM_RELEASE_NAME }} "$CHART_DIR" \
            --namespace ${{ env.HELM_NAMESPACE }} \
            -f "$CHART_DIR"/values-aws.yaml \
            -f "$CHART_DIR"/values-production.yaml \
            --set "statuslist.issuerRegistry.volume.configMap.name=status-list-server-issuers" \
            --set-string "externalSecret.spec.secretStoreRef.name=datev-secret-store" \
            --set-string "externalSecret.spec.secretStoreRef.kind=ClusterSecretStore" \
            --set "secretStore.enabled=false" \
            --wait \
            --rollback-on-failure \
            --timeout 10m \
            --set-string "statuslist.image.repository=${IMAGE_BASE}" \
            --set-string "statuslist.image.tag=${FULL_TAG:?full image tag missing}" \
            --set-string "statuslist.image.digest=${IMAGE_DIGEST:?image digest missing}" \
            --set-string "statuslist.env.APP_DATABASE__PORT=${APP_DATABASE_PORT}" \
            --set-string "statuslist.env.APP_CACHE__HOST=${APP_CACHE_HOST:?cache host missing}"; then
            if [ -n "$PREV_REVISION" ]; then
              echo "::error title=Check for migrations the restored release does not know::The upgrade failed and Helm rolled back to revision $PREV_REVISION. If a pod of the new release started, it may have migrated the database, and then every pod of the restored release that starts from now on (restart, scale-up, node drain) crash-loops until the migration records are deleted, even though the rollback looks clean. See docs/deployment-runbook.md, \"Rolling back across migrations\"."
            fi
            exit 1
          fi

      - name: Verify application rollout
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE_NAME }}-status-list-server-deployment \
            -n ${{ env.HELM_NAMESPACE }} \
            --timeout 2m

      - name: Verify ESO secret path reconciles
        # On an upgrade the app secrets can remain from the old namespaced store even if the
        # Helm and Deployment rollout succeeds, so gate the release on the ExternalSecrets
        # actually syncing from the new cluster store.
        #
        # We don't read ClusterSecretStore here: the deploy role's EKS/RBAC is
        # namespace-scoped, so a cluster-scoped get returns Forbidden on every deploy. We
        # rely on the namespaced release ExternalSecrets instead, requiring each one's
        # refreshTime to move past its pre-deploy baseline (recorded in the Deploy chart
        # step) because Ready=True alone can be stale from before the upgrade; on a fresh
        # install the baseline is empty and only Ready=True is required.
        #
        # The chart's refreshInterval is 30m, so an image-only release leaves the
        # ExternalSecret spec unchanged and ESO could keep the old refreshTime for the whole
        # wait window; we force-sync with a unique external-secrets.io/force-sync annotation
        # to trigger an immediate reconcile.
        #
        # This runs after helm upgrade --install --rollback-on-failure has already
        # succeeded, so a failure here alone would leave the broken revision live. We
        # explicitly roll back to the pre-deploy revision (or uninstall on a fresh install)
        # when any ExternalSecret fails, keeping the cluster on the last known-good state.
        env:
          PRIMARY_ES: statuslist-external-secret
          CREDS_ES: statuslist-external-secret-aws-credentials
          REDIS_ES: statuslist-redis-credentials
        run: |
          set -euo pipefail
          NAMESPACE="${{ env.HELM_NAMESPACE }}"
          RELEASE="${{ env.HELM_RELEASE_NAME }}"
          BASELINES="$RUNNER_TEMP/eso-refresh-baselines"
          PREV_REVISION_FILE="$RUNNER_TEMP/eso-prev-revision"
          FORCE_SYNC="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          TIMEOUT=180
          rollback_done=0

          cleanup_on_failure() {
            if [ "$rollback_done" -eq 1 ]; then
              return 0
            fi
            rollback_done=1
            local prev_rev=""
            if [ -f "$PREV_REVISION_FILE" ]; then
              prev_rev=$(cat "$PREV_REVISION_FILE")
            fi
            echo "::warning::ESO verification failed; restoring the previous release state"
            if [ -n "$prev_rev" ]; then
              if ! helm rollback "$RELEASE" "$prev_rev" --namespace "$NAMESPACE" --wait --timeout 5m; then
                echo "::warning::helm rollback to revision $prev_rev failed; manual intervention required"
                echo "::error title=Check for migrations the restored release does not know::The rollback to revision $prev_rev did not finish. It followed a successful upgrade, so every migration the new release carries has already run. If it carries any, the restored release cannot start a pod until their records are deleted. See docs/deployment-runbook.md, \"Rolling back across migrations\"."
              fi
            else
              helm uninstall "$RELEASE" --namespace "$NAMESPACE" --wait --timeout 5m || \
                echo "::warning::helm uninstall of fresh release failed; manual intervention required"
            fi
          }
          trap cleanup_on_failure EXIT

          # Force-sync all release ExternalSecrets immediately so an image-only release
          # cannot leave a stale refreshTime for the whole wait window.
          for es in "$PRIMARY_ES" "$CREDS_ES" "$REDIS_ES"; do
            kubectl annotate externalsecret "$es" -n "$NAMESPACE" \
              "external-secrets.io/force-sync=$FORCE_SYNC" --overwrite >/dev/null 2>&1 || \
              echo "::warning::could not annotate $es for force-sync; relying on its own refresh interval"
          done

          await_synced() {
            local es="$1" label="$2"
            local baseline=""
            if [ -f "$BASELINES" ]; then
              baseline=$(awk -v es="$es" '$1==es {print $2}' "$BASELINES")
            fi
            local i=0 ready="" rt=""
            while [ "$i" -lt "$TIMEOUT" ]; do
              ready=$(kubectl get externalsecret "$es" -n "$NAMESPACE" \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
              rt=$(kubectl get externalsecret "$es" -n "$NAMESPACE" \
                -o jsonpath='{.status.refreshTime}' 2>/dev/null || true)
              if [ "$ready" = "True" ] && { [ -z "$baseline" ] || { [ -n "$rt" ] && [ "$rt" != "$baseline" ]; }; }; then
                echo "OK: $label reports Ready=True and refreshed for this deployment"
                return 0
              fi
              sleep 5
              i=$((i + 5))
            done
            echo "::error::Timed out after ${TIMEOUT}s waiting for $label to sync from the cluster store (Ready='${ready:-<unset>}', refreshTime='${rt:-<unset>}', baseline='${baseline:-<none>}')"
            return 1
          }

          await_synced "$PRIMARY_ES" "ExternalSecret $PRIMARY_ES ($NAMESPACE)"

          await_synced "$CREDS_ES" "ExternalSecret $CREDS_ES ($NAMESPACE)"

          await_synced "$REDIS_ES" "ExternalSecret $REDIS_ES ($NAMESPACE)"

          rollback_done=1

      - name: Verify the Redis cache connected at startup
        # Redis isn't in readiness and warm-up failure is non-fatal, so a broken cache
        # would otherwise deploy green. Startup only; RedisCacheErrors covers runtime.
        run: |
          set -euo pipefail
          NS="${{ env.HELM_NAMESPACE }}"
          PODS=$(kubectl get pods -n "$NS" \
            -l "app=status-list-server,app.kubernetes.io/instance=${{ env.HELM_RELEASE_NAME }}" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
          checked=0
          failed=""
          confirmed=""
          for pod in $PODS; do
            checked=$((checked + 1))
            logs=$(kubectl logs "pod/$pod" -n "$NS" --tail=500 2>/dev/null || true)
            if printf '%s\n' "$logs" | grep -q "Redis status-list cache unavailable at startup"; then
              echo "::error::Pod $pod: Redis status-list cache did not connect at startup; it will fire RedisCacheErrors. Check APP_CACHE_HOST, the redis-credentials secret, TLS/CA, and egress/security groups." >&2
              failed=1
            elif printf '%s\n' "$logs" | grep -qE "cache\.backend=redis.*status-list cache backend selected|status-list cache backend selected.*cache\.backend=redis"; then
              confirmed=1
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::warning::No status-list-server pods found to inspect; skipping Redis startup verification"
            exit 0
          fi
          if [ -n "$failed" ]; then
            exit 1
          fi
          if [ -n "$confirmed" ] && [ -z "$failed" ]; then
            echo "OK: Redis cache connected at startup on all $checked inspected pod(s)"
          else
            echo "::warning::Could not confirm Redis cache connected at startup from pod logs (startup lines may have rotated out of the tail); not treating as failure"
          fi
