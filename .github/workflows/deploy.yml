name: Build and Deploy to EKS
on:
  # Release tags only -- a two-arch build plus scan costs ~40 minutes. Consequence:
  # the image is scanned once per release and never again; see docs/supply-chain.md.
  push:
    tags:
      - v*.*.*
  # Exercises build, scan and assertions without cutting a release. `promote-tags`
  # and `deploy` require `event_name == 'push'`, so dispatch never releases.
  workflow_dispatch:

# A job-level `permissions:` block replaces this default rather than merging with it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CLUSTER_NAME: datev-wallet-cluster
  AWS_REGION: eu-central-1
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/status-list-server
  HELM_RELEASE_NAME: statuslist
  HELM_NAMESPACE: statuslist-production
  APP_DATABASE_PORT: ${{ vars.APP_DATABASE_PORT }}
jobs:
  # No `if:` guard -- a skip here would cascade to everything that needs it. The
  # non-tag case is handled inside the step.
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # `v*.*.*` is a refspec glob, not semver -- `v2024.01.release` matches. On those,
      # metadata-action drops the semver tags and deploy falls through to `latest`.
      - name: Assert the tag is semver
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" != "true" ]; then
            echo "Not a tag push -- nothing to validate."
            exit 0
          fi

          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$REF_NAME" =~ $semver ]]; then
            echo "::error::Tag '${REF_NAME}' matched the v*.*.* push filter but is not semver."
            echo "metadata-action would drop every type=semver entry, and the deploy job"
            echo "would fall through to the mutable 'latest' tag instead of failing."
            echo "Delete the tag and push one shaped like v1.2.3 or v1.2.3-rc.1."
            echo
            echo "Build metadata (a '+' suffix) is rejected too: '+' is not a legal"
            echo "character in a Docker image tag."
            exit 1
          fi

          echo "Tag '${REF_NAME}' is valid semver."

  ci:
    name: CI
    uses: ./.github/workflows/CI.yml
    # A called workflow can only narrow the caller's token, so CI.yml's kube-linter
    # job needs its SARIF upload scope granted here too.
    permissions:
      contents: read
      security-events: write

  build-and-push:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: [ci, validate-tag]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      # From `vars`, not `meta`: this job publishes only the sha tag, so
      # `meta.outputs.version` would be that sha rather than the release version.
      deploy_tag: ${{ steps.vars.outputs.DEPLOY_TAG }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.digest.outputs.IMAGE_REF }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build needs the source, not the token. Left persisted it stays in
          # .git/config for every later step, including the Docker build context.
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve deploy tag
        # Safe to derive by hand: `validate-tag` has already rejected non-semver tags.
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "DEPLOY_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOY_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract Docker metadata
        # Only the sha tag here. `promote-tags` applies semver and `latest` after the
        # scan, so a rejected image never becomes an advertised release.
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=sha,format=short,prefix=sha-
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Explicit: the action defaults to mode=max on public repos and mode=min on
          # private, so a visibility change would silently degrade provenance.
          provenance: mode=max
          sbom: true
      - name: Assert a digest was produced
        # An empty digest would silently fall back to tag-based deployment. Built in
        # shell rather than `outputs:`, which would emit `<base>@` with no digest.
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::build-push-action produced no image digest."
            exit 1
          fi
          echo "image digest: $DIGEST"
          echo "IMAGE_REF=${IMAGE_BASE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  scan-image:
    name: Scan Image for Vulnerabilities
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
      # Both arches: `cargo auditable` records the graph cargo resolved per target, so
      # a shared lockfile does not make the two package sets identical.
      SCAN_ARCHES: amd64 arm64
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the architecture manifests to scan
        # Resolving each child manifest fixes which arches are scanned by construction,
        # rather than trusting Trivy's default and checking afterwards.
        run: |
          set -euo pipefail
          index=$(docker buildx imagetools inspect --raw "$IMAGE_REF")

          for arch in $SCAN_ARCHES; do
            # env.SCAN_ARCH rather than a --arg variable: `$arch` in a single-quoted
            # jq program reads as an unexpanded shell variable.
            matches=$(printf '%s' "$index" | SCAN_ARCH="$arch" jq -c '[.manifests[]
              | select(.platform.os == "linux" and .platform.architecture == env.SCAN_ARCH)
              | .digest]')

            count=$(printf '%s' "$matches" | jq 'length')
            if [ "$count" -ne 1 ]; then
              echo "::error::expected exactly one linux/${arch} manifest in ${IMAGE_REF}, found ${count}."
              exit 1
            fi

            manifest=$(printf '%s' "$matches" | jq -r '.[0]')
            # Upper-cased because the scan steps read these back as `env.SCAN_REF_AMD64`
            # and `env.SCAN_REF_ARM64`, which a `uses:` step cannot build dynamically.
            echo "SCAN_REF_$(printf '%s' "$arch" | tr '[:lower:]' '[:upper:]')=${IMAGE_BASE}@${manifest}" >> "$GITHUB_ENV"
            echo "scanning linux/${arch}: ${manifest}"
          done

      - name: Scan image (amd64)
        # Unfiltered; every view below is `trivy convert`ed from these, so the table and
        # the gate read the same data and each image is pulled once.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_REF_AMD64 }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: json
          output: trivy-image-report-amd64.json

      - name: Scan image (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_REF_ARM64 }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: json
          output: trivy-image-report-arm64.json

      - name: Derive reports
        run: |
          set -eu
          # trivy-action puts the binary on PATH for later steps; fail loudly rather
          # than silently skipping every derived report if that stops being true.
          trivy --version > /dev/null

          for arch in $SCAN_ARCHES; do
            report="trivy-image-report-${arch}.json"

            trivy convert --format table --output "trivy-image-report-${arch}.txt" "$report"

            # Before and after the ledger: the difference is what the exceptions hid, so
            # a green gate distinguishes "nothing found" from "everything accepted".
            trivy convert \
              --severity HIGH,CRITICAL \
              --format json --output "trivy-highcrit-all-${arch}.json" \
              "$report"

            trivy convert \
              --severity HIGH,CRITICAL \
              --ignorefile .trivyignore.yaml \
              --format json --output "trivy-gate-findings-${arch}.json" \
              "$report"

            # A clean scan must still produce every artifact.
            [ -s "trivy-image-report-${arch}.txt" ] || echo "No vulnerabilities reported." > "trivy-image-report-${arch}.txt"
            [ -s "trivy-gate-findings-${arch}.json" ] || echo '{"Results":[]}' > "trivy-gate-findings-${arch}.json"
            [ -s "trivy-highcrit-all-${arch}.json" ] || echo '{"Results":[]}' > "trivy-highcrit-all-${arch}.json"
          done

      - name: Collect published SBOMs
        # After the scan, not before: registry metadata is a separate failure domain,
        # and a transient imagetools error here must not cost the trivy reports.
        run: |
          set -euo pipefail
          : > sbom-summary.md
          for platform in linux/amd64 linux/arm64; do
            out="sbom-${platform#linux/}.json"
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect "$IMAGE_REF" \
                   --format "{{ json (index .SBOM \"$platform\") }}" > "$out"; then
                break
              fi
              [ "$attempt" -lt 3 ] || { echo "::error::could not fetch SBOM for $platform"; exit 1; }
              sleep $(( attempt * 5 ))
            done
            crates=$(sh scripts/count-sbom-crates.sh "$out")
            echo "$platform: $crates distinct cargo packages"
            echo "- \`$platform\`: $crates distinct cargo packages" >> sbom-summary.md
          done

      - name: Publish report to job summary
        # Deliberately small -- the full tables and JSON are artifacts below. Inlining
        # them would bury the gate decision.
        if: always()
        run: |
          set -eu
          {
            echo "## Container image scan"
            echo
            echo "Index: \`${IMAGE_REF}\`"
            echo
            echo "| Platform | Scanned digest | HIGH/CRITICAL |"
            echo "| --- | --- | --- |"
            for arch in $SCAN_ARCHES; do
              var="SCAN_REF_$(printf '%s' "$arch" | tr '[:lower:]' '[:upper:]')"
              ref="${!var:-}"
              findings="trivy-highcrit-all-${arch}.json"
              if [ -s "$findings" ]; then
                count=$(jq '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | length' "$findings")
              else
                count="not scanned"
              fi
              echo "| \`linux/${arch}\` | \`${ref##*@}\` | ${count} |"
            done
            echo
            echo "### Published SBOM"
            echo
            cat sbom-summary.md 2>/dev/null || echo "_SBOM collection did not complete._"
            echo
            echo "Full tables and JSON: the \`container-scan-reports\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan reports
        # `warn`, not `error`: the `[ -s ... ]` fallbacks above guarantee the files.
        # Failing here would only add a second red step.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-scan-reports
          path: |
            trivy-image-report-*.json
            trivy-image-report-*.txt
            trivy-highcrit-all-*.json
            trivy-gate-findings-*.json
          if-no-files-found: warn

      - name: Upload published SBOMs
        # Separate artifact: a lost SBOM must not take down the upload carrying the
        # scan results. Absence is caught by the assertion below instead.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-sboms
          path: |
            sbom-amd64.json
            sbom-arm64.json
          if-no-files-found: warn

      # No code-scanning upload: alerts filed against a tag ref never surface in the
      # Security tab's branch view. A durable sink needs the scheduled re-scan (#410).

      - name: Assert published SBOMs list Rust crates
        # Covers the SBOM BuildKit attached; the Dockerfile's .dep-v0 check covers the
        # binary. `index .SBOM` needs a multi-platform index or it errors here.
        run: |
          set -eu
          for platform in linux/amd64 linux/arm64; do
            out="sbom-${platform#linux/}.json"
            crates=$(sh scripts/count-sbom-crates.sh "$out")
            if [ "$crates" -eq 0 ]; then
              echo "::error::Published SBOM for $platform lists no pkg:cargo/ packages. The image ships without usable dependency metadata."
              exit 1
            fi
            echo "$platform: $crates distinct cargo packages"
          done

      - name: Prove the gate can fail
        # A gate that never fired is indistinguishable from one that cannot fire, so
        # prove both directions. The failing case must name the ID it was given.
        run: |
          set -eu
          fixture=scripts/testdata/gate-selftest-findings.json
          clean=scripts/testdata/gate-clean-findings.json

          for f in "$fixture" "$clean"; do
            [ -f "$f" ] || {
              echo "::error::Gate self-test fixture $f is missing; the gate is unverified."
              exit 1
            }
          done

          expected=$(jq -r '.Results[]?.Vulnerabilities[]?.VulnerabilityID' "$fixture" | head -1)
          if [ -z "$expected" ]; then
            echo "::error::Gate self-test fixture $fixture contains no findings; it cannot test anything."
            exit 1
          fi

          if output=$(sh scripts/vuln-gate.sh "$fixture" 2>&1); then
            echo "::error::Gate self-test passed against a fixture containing a CRITICAL finding. The vulnerability gate cannot fail and is not protecting this release."
            exit 1
          fi

          case "$output" in
            *"$expected"*)
              echo "gate self-test: ${expected} correctly fails the gate" ;;
            *)
              echo "::error::Gate self-test exited non-zero but never reported ${expected}, so the gate is erroring rather than blocking. Output follows."
              echo "$output"
              exit 1 ;;
          esac

          # The other direction: a gate that blocks unconditionally is also broken,
          # and would otherwise only surface during a release.
          if ! sh scripts/vuln-gate.sh "$clean" > /dev/null 2>&1; then
            echo "::error::Gate self-test failed against a clean fixture. The gate blocks unconditionally and no release can pass it."
            exit 1
          fi
          echo "gate self-test: clean report correctly passes the gate"

      - name: Vulnerability gate
        # Blocks on any HIGH or CRITICAL surviving the ledger, with ignore-unfixed off.
        # Thresholds and rationale: docs/supply-chain.md, "The Gate Blocks".
        run: |
          set -eu
          # Advisories, not rows: one CVE across three crates is one thing to triage.
          # Counted across every arch -- a single-arch advisory still blocks.
          advisories=$(jq -s '[.[].Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | length' trivy-gate-findings-*.json)
          occurrences=$(jq -s '[.[].Results[]?.Vulnerabilities[]?] | length' trivy-gate-findings-*.json)
          total=$(jq -s '[.[].Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | length' trivy-highcrit-all-*.json)
          suppressed=$(( total - advisories ))

          echo "HIGH/CRITICAL after exceptions: ${advisories} advisories across ${occurrences} package occurrences (${suppressed} suppressed by .trivyignore.yaml)"
          {
            echo
            echo "### Vulnerability gate"
            echo
            if [ "${advisories}" -eq 0 ]; then
              echo "No HIGH or CRITICAL findings after exceptions, on any scanned architecture."
            else
              echo "\`${advisories}\` distinct HIGH/CRITICAL advisories (\`${occurrences}\` package occurrences) block this release."
              echo
              echo "Triage steps and the exception format are in \`docs/supply-chain.md\`."
              echo "The exact blocking set is \`trivy-gate-findings-<arch>.json\` in the \`container-scan-reports\` artifact."
            fi
            echo
            if [ "${suppressed}" -gt 0 ]; then
              echo "\`${suppressed}\` HIGH/CRITICAL advisories were suppressed by \`.trivyignore.yaml\`. The unsuppressed set is \`trivy-highcrit-all-<arch>.json\`."
            else
              echo "No findings were suppressed by \`.trivyignore.yaml\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Rendered from the gate set itself, so table, counts and exit code cannot
          # disagree. Every arch renders before failing, so one run shows all of it.
          status=0
          for arch in $SCAN_ARCHES; do
            echo "--- linux/${arch} ---"
            sh scripts/vuln-gate.sh "trivy-gate-findings-${arch}.json" || status=1
          done
          exit "$status"

  promote-tags:
    name: Promote Scanned Digest to Release Tags
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - scan-image
    # Positively gated on `push`: workflow_dispatch accepts tag refs too, so a ref
    # test alone would not keep dispatch off the release path.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
      DEPLOY_TAG: ${{ needs.build-and-push.outputs.deploy_tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release tags
        # The `v*.*.*` glob absorbs prereleases, so `latest` is withheld explicitly.
        # metadata-action already withholds {{major}}.{{minor}}; raw tags do not.
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Promote digest to release tags
        # `imagetools create` copies manifest descriptors by digest: nothing is rebuilt
        # and the tags resolve to exactly the scanned index.
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=(--tag "$tag")
          done <<< "$TAGS"
          # An empty tag list would degrade to `imagetools create <source>`, which
          # promotes nothing. This job must not have a silent no-op form.
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::metadata-action produced no release tags for ${GITHUB_REF_NAME}."
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "$IMAGE_REF"

      - name: Verify attestations survived promotion
        # Attestations are separate manifests; a silent drop would publish a release
        # whose SBOM and provenance vanished with nothing failing.
        run: |
          set -eu
          release_ref="${IMAGE_BASE}:${DEPLOY_TAG}"
          for platform in linux/amd64 linux/arm64; do
            for field in SBOM Provenance; do
              if ! docker buildx imagetools inspect "$release_ref" \
                --format "{{ json (index .$field \"$platform\") }}" \
                | jq -e '(type == "object") and (length > 0)' > /dev/null; then
                echo "::error::$field missing for $platform on $release_ref after tag promotion."
                exit 1
              fi
            done
          done
          echo "SBOM and provenance present for both platforms on $release_ref"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Keeps tags and production consistent -- never deploy an untagged release.
    # Recovery from a promotion failure is a re-run of that job.
    needs:
      - build-and-push
      - scan-image
      - promote-tags
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 30
    environment: production
    # Keyed on the environment, not the ref: two tags pushed in quick succession
    # would otherwise run `helm upgrade` concurrently against the same release.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      # Routed through env rather than interpolated into the helm command: deploy_tag
      # derives from GITHUB_REF_NAME, which the person pushing the tag controls.
      DEPLOY_TAG: ${{ needs.build-and-push.outputs.deploy_tag }}
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the Helm chart is needed here; the deploy authenticates to AWS via
          # OIDC, not the checkout token.
          persist-credentials: false
      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: status-list-server-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
      - name: Validate deployment configuration
        run: |
          if [[ -z "${APP_DATABASE_PORT}" ]]; then
            echo "APP_DATABASE_PORT repository/environment variable is required" >&2
            exit 1
          fi
      - name: Build Helm dependencies
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart
      - name: Deploy chart
        # `:?` because helm reports an empty value as a YAML error pointing nowhere
        # near the cause. Via env, not interpolation: the tag is attacker-influenced.
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} helm/chart \
            --namespace ${{ env.HELM_NAMESPACE }} \
            --wait \
            --rollback-on-failure \
            --timeout 10m \
            --set-string "statuslist.image.repository=${IMAGE_BASE}" \
            --set-string "statuslist.image.tag=${DEPLOY_TAG:?deploy tag missing}" \
            --set-string "statuslist.image.digest=${IMAGE_DIGEST:?image digest missing}" \
            --set-string "statuslist.env.APP_DATABASE__PORT=${APP_DATABASE_PORT}"
