name: Crate Type

on:
  workflow_call:
    outputs:
      is_lib:
        value: ${{ jobs.check-crate-type.outputs.is_lib }}
      is_bin:
        value: ${{ jobs.check-crate-type.outputs.is_bin }}

# Declared rather than relying on zizmor's `workflow_call` exemption.
permissions:
  contents: read

jobs:
  check-crate-type:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Searching for lib
        # All targets, not `targets[0]`: cargo does not promise an ordering, so keying
        # on the first one let `is_lib` flip and silently skip cargo-test-doc.
        id: searching
        run: |
          set -euo pipefail
          kinds=$(cargo metadata --format-version=1 --no-deps \
            | jq -c '[.packages[].targets[].kind[]] | unique')
          echo "kinds of targets: ${kinds}"
          echo "is_lib=$(printf '%s' "$kinds" | jq -r 'any(. == "lib") | tostring')" >> "$GITHUB_OUTPUT"
          echo "is_bin=$(printf '%s' "$kinds" | jq -r 'any(. == "bin") | tostring')" >> "$GITHUB_OUTPUT"

    outputs:
      is_lib: ${{ steps.searching.outputs.is_lib }}
      is_bin: ${{ steps.searching.outputs.is_bin }}
