name: Crate Type

on:
  workflow_call:
    outputs:
      is_lib:
        value: ${{ jobs.check-crate-type.outputs.is_lib }}
      is_bin:
        value: ${{ jobs.check-crate-type.outputs.is_bin }}

# Declared rather than relying on zizmor's `workflow_call` exemption.
permissions:
  contents: read

jobs:
  check-crate-type:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Searching for lib
        # Every target and every library kind: a wrong is_lib silently skips cargo-test-doc.
        id: searching
        run: |
          set -euo pipefail
          kinds=$(cargo metadata --format-version=1 --no-deps \
            | jq -c '[.packages[].targets[].kind[]] | unique')
          echo "kinds of targets: ${kinds}"

          # Assigned first: inside echo's arguments a failing jq would slip past set -e.
          is_lib=$(printf '%s' "$kinds" | jq -r \
            '["lib","rlib","dylib","cdylib","staticlib","proc-macro"] as $lib
             | any(IN($lib[])) | tostring')
          is_bin=$(printf '%s' "$kinds" | jq -r 'any(. == "bin") | tostring')

          if [ -z "$is_lib" ] || [ -z "$is_bin" ]; then
            echo "::error::target-kind detection produced no value (is_lib='${is_lib}' is_bin='${is_bin}')."
            exit 1
          fi

          printf 'is_lib=%s\nis_bin=%s\n' "$is_lib" "$is_bin" >> "$GITHUB_OUTPUT"

    outputs:
      is_lib: ${{ steps.searching.outputs.is_lib }}
      is_bin: ${{ steps.searching.outputs.is_bin }}
