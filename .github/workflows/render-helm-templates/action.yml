name: Render Helm Templates
description: Render all Helm chart variants into /tmp/rendered and run render-time negative tests.
runs:
  using: composite
  steps:
    - name: Render Helm templates
      shell: bash
      run: bash scripts/render-helm-templates.sh
    - name: Validate enabled AlertmanagerConfig route against pinned 91.4.0 CRD
      shell: bash
      run: bash scripts/validate-alertmanager-crd.sh
