# Workflow to clean the cache in case of issues
name: Clean Cache

# `actions: write` is what `gh cache delete` needs; everything unlisted is `none`.
permissions:
  actions: write

on:
  workflow_dispatch:

jobs:
  clean-cache:
    runs-on: ubuntu-latest
    # No checkout, so `gh` has no git remote to infer the repo from. It never reads
    # GITHUB_REPOSITORY, hence GH_REPO.
    steps:
      - run: gh cache delete --all
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
