name: Clean Cache

permissions:
  actions: write

on:
  workflow_dispatch:

jobs:
  clean-cache:
    runs-on: ubuntu-latest
    # No checkout, so gh needs GH_REPO to know the repo.
    steps:
      - run: gh cache delete --all
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
