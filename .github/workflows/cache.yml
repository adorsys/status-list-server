# Workflow to clean the cache in case of issues
name: Clean Cache

# `actions: write` is what `gh cache delete` needs; everything unlisted is `none`.
permissions:
  actions: write

on:
  workflow_dispatch:

jobs:
  clean-cache:
    runs-on: ubuntu-latest
    # No checkout: this only talks to the API. GH_REPO replaces it -- `gh` resolves the
    # repo from `--repo`, `GH_REPO`, then the git remote, never `GITHUB_REPOSITORY`,
    # so without it the step fails with "not a git repository".
    steps:
      - run: gh cache delete --all
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
