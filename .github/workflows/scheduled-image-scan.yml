name: Scheduled Image Re-scan
on:
  # The capability this exists for: an advisory published after a release trips the
  # gate with no source change. Source-level CI cannot cover a time axis, and
  # deploy.yml runs a handful of times a month.
  #
  # An off-peak minute rather than the hour, which queues behind every other cron. A
  # fixed clock rather than the Trivy DB refresh, because no such event is published.
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

# A scheduled run uses the default branch ref, which is what puts code-scanning alerts
# in the branch view that a `refs/tags/*` upload from deploy.yml cannot reach.
permissions:
  contents: read

# Not keyed on the ref: a dispatch during the nightly would otherwise race it for the
# tracking issue and post two conflicting updates.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/status-list-server
  # The same expression deploy.yml resolves the deploy from, so which variant is
  # running is read from one source rather than restated here and left to drift.
  # Load-bearing, not decorative: the run fails if this variant was not scanned.
  DEPLOYED_VARIANT: ${{ vars.IMAGE_VARIANT || 'aws' }}
  EXPIRY_WARN_DAYS: "30"
  ISSUE_MARKER: "<!-- scheduled-image-scan -->"
  ISSUE_LABEL: scheduled-image-scan

jobs:
  # The variant list, once. It used to appear twice in this file -- as the matrix and
  # again as the set the coverage check asserts -- eleven lines apart, and the drift
  # was asymmetric: forget the matrix and the cron goes permanently red, forget the
  # assertion and a variant is silently uncovered. The second is the one that matters,
  # because it is invisible. This is the same argument the shared scripts rest on.
  variants:
    name: Resolve Variant List
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Publish the variant list
        id: list
        env:
          VARIANTS: aws gcp azure vault fscert
        run: |
          set -euo pipefail
          # Unquoted on purpose: the word splitting is what turns the list into lines.
          list=$(printf '%s\n' $VARIANTS | jq -Rsc 'split("\n") | map(select(length > 0))')

          [ "$(printf '%s' "$list" | jq 'length')" -gt 0 ] || {
            echo "::error::the variant list is empty; this run would assert nothing and pass."
            exit 1
          }

          {
            printf 'names=%s\n' "$VARIANTS"
            printf 'list=%s\n' "$list"
          } >> "$GITHUB_OUTPUT"
          echo "variants: ${VARIANTS}"

  rescan:
    name: Re-scan Released Image (${{ matrix.variant }})
    needs: variants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      # One variant's registry trouble must not withhold the other four's findings.
      # `report` honours this rather than undoing it: a leg that dies becomes a row,
      # not a reason to withhold everything else.
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.list) }}
    env:
      # Both published architectures, for the reason in deploy.yml: `cargo auditable`
      # records the graph cargo resolved per target, not the lockfile's union.
      SCAN_ARCHES: amd64 arm64
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        # `repository_owner`, not `github.actor`: on a schedule event the actor is
        # whoever last touched the workflow file, which is neither meaningful nor
        # stable. GHCR authenticates on the token; the username should say what it is.
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the released digest
        # `latest-<variant>` is only ever applied by promote-tags to a digest that
        # already passed the release gate, so it names a real artifact rather than an
        # arbitrary one. Where it can still differ from what is running is recorded in
        # docs/supply-chain.md, "Known Gaps".
        #
        # Pinned to the digest immediately: a tag is mutable, and re-resolving it later
        # in the job could scan something other than what is reported here.
        #
        # Two questions are asked separately rather than collapsed into one retry loop.
        # "Is the tag reachable" and "can we still extract a digest from it" have
        # different answers and different owners, and answering both with "may not have
        # been released yet" is how a resolver that quietly stopped working becomes a
        # nightly that scans nothing and stays green -- the absence-reads-as-success
        # failure scripts/gate-selftest.sh exists to prevent, one layer up.
        id: resolve
        run: |
          set -uo pipefail
          ref="${IMAGE_BASE}:latest-${VARIANT}"

          raw=""
          for attempt in 1 2 3; do
            if raw=$(docker buildx imagetools inspect --raw "$ref" 2>/dev/null); then
              break
            fi
            raw=""
            [ "$attempt" -lt 3 ] || break
            sleep $(( attempt * 5 ))
          done

          # A persistent failure here is not classified by matching the error text,
          # which is not an API and would silently reclassify an unrelated fault. The
          # retries cover the transient case; what is left is genuinely unreachable,
          # and `report` fails the run over it rather than reading it as clean.
          if [ -z "$raw" ]; then
            echo "::warning::${ref} is not reachable; this variant is recorded as unscanned."
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          digest=$(docker buildx imagetools inspect "$ref" \
            --format '{{ .Manifest.Digest }}' 2>/dev/null) || digest=""

          # The same strict form deploy.yml validates built digests with, rather than a
          # `sha256:*` glob that accepts anything after the prefix.
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::${ref} is reachable, but no valid index digest could be extracted from it."
            echo "Got: '${digest}'"
            echo "This is a failure of the resolver, not of the registry: the tag exists and"
            echo "\`imagetools inspect --format '{{ .Manifest.Digest }}'\` no longer returns what"
            echo "this workflow expects. It must not be reported as 'not released yet'."
            exit 1
          fi

          echo "resolved=true" >> "$GITHUB_OUTPUT"
          echo "index_digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "resolved ${ref} -> ${digest}"

      - name: Resolve the architecture manifests to scan
        if: steps.resolve.outputs.resolved == 'true'
        env:
          INDEX_DIGEST: ${{ steps.resolve.outputs.index_digest }}
        run: |
          set -euo pipefail
          # Captured rather than piped: a pipeline or process substitution discards the
          # script's exit status, leaving a failed resolution looking like an empty one.
          resolved=$(bash scripts/resolve-arch-manifests.sh "${IMAGE_BASE}@${INDEX_DIGEST}" $SCAN_ARCHES)

          while read -r arch manifest; do
            upper=$(printf '%s' "$arch" | tr '[:lower:]' '[:upper:]')
            echo "SCAN_REF_${upper}=${IMAGE_BASE}@${manifest}" >> "$GITHUB_ENV"
            echo "MANIFEST_${upper}=${manifest}" >> "$GITHUB_ENV"
          done <<< "$resolved"

      - name: Scan image (amd64)
        if: steps.resolve.outputs.resolved == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_REF_AMD64 }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: json
          output: trivy-image-report-amd64.json

      - name: Scan image (arm64)
        if: steps.resolve.outputs.resolved == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_REF_ARM64 }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: json
          output: trivy-image-report-arm64.json

      - name: Derive reports
        # The same script deploy.yml runs, so the nightly result and the release result
        # are the same measurement of the same artifact.
        if: steps.resolve.outputs.resolved == 'true'
        run: |
          set -eu
          for arch in $SCAN_ARCHES; do
            sh scripts/derive-trivy-reports.sh "$arch"
          done

      - name: Derive SARIF
        # From the full report with the gate's severity floor, not from the gate set:
        # an accepted exception should still file an alert to be dismissed, so the
        # ledger cannot quietly hide a finding from the Security tab.
        if: steps.resolve.outputs.resolved == 'true'
        run: |
          set -eu
          for arch in $SCAN_ARCHES; do
            trivy convert \
              --severity HIGH,CRITICAL \
              --format sarif --output "image-${VARIANT}-${arch}.sarif" \
              "trivy-image-report-${arch}.json"
          done

      - name: Prove the gate can fail
        # This is the run people will trust between releases, so it carries the same
        # proof the release path does: a gate that has never fired is indistinguishable
        # from one that cannot. Needs no network -- the fixtures are JSON on disk.
        if: steps.resolve.outputs.resolved == 'true'
        run: sh scripts/gate-selftest.sh

      - name: Evaluate the gate
        # Renders the table but does not decide the run. One verdict is aggregated in
        # `report`, so the counts, the tracking issue and the exit code cannot disagree
        # about what was found across five variants.
        if: steps.resolve.outputs.resolved == 'true'
        env:
          INDEX_DIGEST: ${{ steps.resolve.outputs.index_digest }}
        run: |
          set -eu
          advisories=$(jq -s '[.[].Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique' trivy-gate-findings-*.json)
          occurrences=$(jq -s '[.[].Results[]?.Vulnerabilities[]?] | length' trivy-gate-findings-*.json)
          total=$(jq -s '[.[].Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | length' trivy-highcrit-all-*.json)

          jq -n \
            --arg variant "$VARIANT" \
            --arg index "$INDEX_DIGEST" \
            --arg amd64 "${MANIFEST_AMD64:-}" \
            --arg arm64 "${MANIFEST_ARM64:-}" \
            --argjson advisories "$advisories" \
            --argjson occurrences "$occurrences" \
            --argjson total "$total" \
            '{variant: $variant, status: "scanned", index_digest: $index,
              manifests: {amd64: $amd64, arm64: $arm64},
              advisories: $advisories, occurrences: $occurrences,
              suppressed: ($total - ($advisories | length))}' \
            > "scan-summary-${VARIANT}.json"

          for arch in $SCAN_ARCHES; do
            echo "--- ${VARIANT} linux/${arch} ---"
            sh scripts/vuln-gate.sh "trivy-gate-findings-${arch}.json" || true
          done

      - name: Record an unresolved variant
        if: steps.resolve.outputs.resolved != 'true'
        run: |
          set -eu
          jq -n --arg variant "$VARIANT" \
            '{variant: $variant, status: "unavailable", advisories: [],
              occurrences: 0, suppressed: 0}' \
            > "scan-summary-${VARIANT}.json"

      - name: Upload scan results
        # `always()` so a failing step still leaves the evidence, and so `report` can
        # tell "this variant was clean" from "this variant never reported".
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-${{ matrix.variant }}
          path: |
            scan-summary-*.json
            trivy-image-report-*.json
            trivy-image-report-*.txt
            trivy-highcrit-all-*.json
            trivy-gate-findings-*.json
            image-*.sarif
          if-no-files-found: warn

  report:
    name: Report and Track
    needs:
      - variants
      - rescan
    # `always()`: a variant that failed is exactly the case the tracking issue and the
    # coverage accounting below exist to describe.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
      issues: write
    env:
      EXPECTED_VARIANTS: ${{ needs.variants.outputs.names }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download scan results
        # `gh run download` rather than an action, matching deploy.yml. A total absence
        # of artifacts is not fatal here -- it is described by the accounting below,
        # which produces a better message than a download failure would.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! gh run download "$GITHUB_RUN_ID" --dir artifacts; then
            echo "::warning::no artifacts could be downloaded from this run."
            mkdir -p artifacts
          fi

      - name: Account for variants that never reported
        # A missing summary means that leg died before it could say anything. That is
        # an infrastructure failure and it must not read downstream as "clean" -- but
        # it must not withhold the variants that *did* report either. `fail-fast: false`
        # was set so one variant's trouble could not do that, and failing the run here
        # would have undone it eleven lines later.
        #
        # So a missing leg becomes a row like any other, and the verdict accounts for
        # it at the end, next to the findings gate. Information and verdict separate.
        id: coverage
        run: |
          set -euo pipefail
          [ -n "${EXPECTED_VARIANTS}" ] || {
            echo "::error::the variant list is empty, so this run cannot know what it was meant to cover."
            exit 1
          }

          mkdir -p artifacts/unreported
          missing=""
          for variant in $EXPECTED_VARIANTS; do
            # `-print -quit` rather than a pipe into `grep -q`: under `pipefail` the
            # early-exiting reader can SIGPIPE the writer, and a variant whose file
            # exists would be recorded as missing.
            if [ -z "$(find artifacts -name "scan-summary-${variant}.json" -print -quit)" ]; then
              missing="${missing:+${missing} }${variant}"
              jq -n --arg variant "$variant" \
                '{variant: $variant, status: "failed", advisories: [],
                  occurrences: 0, suppressed: 0}' \
                > "artifacts/unreported/scan-summary-${variant}.json"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::warning::no scan summary from: ${missing} -- recorded as failed, not as clean."
          else
            echo "all expected variants reported."
          fi
          printf 'missing=%s\n' "$missing" >> "$GITHUB_OUTPUT"

      - name: Aggregate findings
        id: aggregate
        run: |
          set -euo pipefail
          find artifacts -name 'scan-summary-*.json' -exec cat {} + | jq -s '.' > summaries.json

          if [ "$(jq 'length' summaries.json)" -eq 0 ]; then
            echo "::error::no scan summaries at all, so this run measured nothing."
            exit 1
          fi

          # Advisory IDs are third-party data: they come out of a scanned image and end
          # up in a job holding `issues: write` and `security-events: write`, in an
          # issue body, and in a `$GITHUB_OUTPUT` line that is newline-terminated.
          # Anything outside the shape every advisory scheme actually uses is refused
          # rather than filtered -- silently dropping one would hide a finding, which is
          # the opposite of this workflow's job.
          #
          # `\A`/`\z` rather than `^`/`$`, measured rather than assumed: in jq 1.7's
          # regex engine `$` also matches before a trailing newline, so `^[...]+$`
          # accepts "CVE-1\n" -- the exact value that would write a stray blank line
          # into `$GITHUB_OUTPUT`. `\z` does not. Both forms reject an embedded
          # newline; only `\z` rejects a trailing one.
          bad=$(jq -r '[.[].advisories[] | select(test("\\A[A-Za-z0-9._-]+\\z") | not)] | @json' summaries.json)
          if [ "$bad" != "[]" ]; then
            echo "::error::Trivy returned advisory IDs outside the expected character set: ${bad}"
            echo "Refusing to render them into an issue body or a workflow output."
            exit 1
          fi

          scanned=$(jq -r '[.[] | select(.status == "scanned")] | length' summaries.json)
          advisories=$(jq -r '[.[].advisories[]] | unique | join(",")' summaries.json)
          count=$(jq -r '[.[].advisories[]] | unique | length' summaries.json)
          unavailable=$(jq -r '[.[] | select(.status == "unavailable") | .variant] | join(" ")' summaries.json)
          failed=$(jq -r '[.[] | select(.status == "failed") | .variant] | join(" ")' summaries.json)
          deployed_status=$(jq -r --arg v "$DEPLOYED_VARIANT" \
            '[.[] | select(.variant == $v) | .status] | first // "absent"' summaries.json)

          # Nothing resolved at all is not a clean result: it means no released image
          # was reachable, so this run measured nothing and must not read as green.
          if [ "$scanned" -eq 0 ]; then
            echo "::error::no variant resolved a released image, so nothing was scanned."
            echo "Either no release has published \`latest-<variant>\` tags yet, or GHCR"
            echo "was unreachable for every variant. This is not a clean scan."
            exit 1
          fi

          {
            printf 'scanned=%s\n' "$scanned"
            printf 'advisory_count=%s\n' "$count"
            printf 'unavailable=%s\n' "$unavailable"
            printf 'failed=%s\n' "$failed"
            printf 'deployed_status=%s\n' "$deployed_status"
            # Delimiter form even though the validation above guarantees a single
            # line: the one that does not depend on the value being well-formed.
            printf 'advisories<<SCAN_ADVISORIES_EOF\n%s\nSCAN_ADVISORIES_EOF\n' "$advisories"
          } >> "$GITHUB_OUTPUT"

          echo "scanned ${scanned} variant(s); ${count} distinct HIGH/CRITICAL advisories after exceptions"
          echo "deployed variant '${DEPLOYED_VARIANT}': ${deployed_status}"

      - name: Merge and upload SARIF
        # One upload: GitHub fails the run when two SARIF files share a tool and
        # category, so the per-arch reports are merged into one document's `runs`
        # (the limit is 20) rather than uploaded separately.
        #
        # `always()` so a failure anywhere upstream does not cost the night its durable
        # sink, which is one of the three things this workflow exists to provide.
        id: sarif
        if: always()
        run: |
          set -euo pipefail
          files=$(find artifacts -name 'image-*.sarif' | sort)
          if [ -z "$files" ]; then
            echo "no SARIF produced -- nothing was scanned."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p tagged
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            base=$(basename "$file" .sarif)   # image-<variant>-<arch>
            rest=${base#image-}
            variant=${rest%-*}
            arch=${rest##*-}

            # Trivy names every run's tool "Trivy", sets no `automationDetails` and no
            # `partialFingerprints`, and for a `lang-pkgs` result -- which is all a
            # `FROM scratch` image holding one Rust binary produces -- the location URI
            # is the target path, unchanged. That path is identical across all five
            # variants and both architectures, so ten runs uploaded under one category
            # collapse into one set of alerts, and the only distinction that matters
            # (which image a finding is in, when one variant is the deployed one) is
            # precisely the one lost. So it is written into the location and the
            # message, where the dedup key can see it.
            jq --arg tag "${variant}/${arch}" '
              .runs |= map(
                .results = ((.results // []) | map(
                  .message.text = ((.message.text // "") + " (" + $tag + ")")
                  | .locations = ((.locations // []) | map(
                      .physicalLocation.artifactLocation.uri =
                        ($tag + "/" + (.physicalLocation.artifactLocation.uri // "image"))
                    ))
                ))
              )' "$file" > "tagged/${variant}-${arch}.sarif"
          done <<< "$files"

          find tagged -name '*.sarif' -exec cat {} + \
            | jq -s '{version: .[0].version, "$schema": .[0]["$schema"],
                      runs: (map(.runs) | add)}' > merged.sarif

          runs=$(jq '.runs | length' merged.sarif)
          # GitHub rejects a SARIF document carrying more than 20 runs. Nothing else
          # would warn before the upload started failing on a sixth variant.
          if [ "$runs" -gt 20 ]; then
            echo "::error::merged.sarif holds ${runs} runs; GitHub accepts at most 20 per upload."
            echo "Split the upload, or stop uploading every variant."
            exit 1
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "merged ${runs} run(s) into merged.sarif"

      - name: Upload SARIF to code scanning
        # No `continue-on-error`, unlike CI.yml's kube-linter upload: that allows for
        # fork pull requests withholding write scopes, which a scheduled run does not
        # have. Here a failed upload is a failure of the durable sink this workflow
        # exists to provide.
        if: ${{ always() && steps.sarif.outputs.present == 'true' }}
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: merged.sarif
          category: container-image

      - name: Check for approaching exception expiry
        # Never fails the run. A date three weeks out is notice, not a fault, and a red
        # cron for it is how a red cron stops being read. `always()` for the same reason
        # the SARIF step has it: this is the only advance warning an `expired_at` gets.
        id: expiry
        if: always()
        run: |
          set -uo pipefail
          : > expiring.tsv
          status=0
          python3 scripts/check-trivyignore.py .trivyignore.yaml \
            --expiring-within "$EXPIRY_WARN_DAYS" > expiring.tsv || status=$?

          # A validator failure must not read as "nothing is expiring". Pull request CI
          # already rejects a malformed ledger, so reaching this means something changed
          # underneath it -- say so rather than reporting an empty list.
          if [ "$status" -ne 0 ]; then
            echo "::warning::check-trivyignore.py exited ${status}; expiry could not be determined from .trivyignore.yaml."
            : > expiring.tsv
          fi

          if [ -s expiring.tsv ]; then
            echo "expiring=true" >> "$GITHUB_OUTPUT"
            cat expiring.tsv
          else
            echo "expiring=false" >> "$GITHUB_OUTPUT"
            echo "no exception lapses within ${EXPIRY_WARN_DAYS} days."
          fi

      - name: Publish report to job summary
        # Gated on the aggregation having produced `summaries.json`: with no data this
        # would render an empty table that reads as a clean result.
        if: ${{ always() && steps.aggregate.outcome == 'success' }}
        env:
          UNAVAILABLE: ${{ steps.aggregate.outputs.unavailable }}
          FAILED: ${{ steps.aggregate.outputs.failed }}
          DEPLOYED_STATUS: ${{ steps.aggregate.outputs.deployed_status }}
        run: |
          set -eu
          {
            echo "## Scheduled image re-scan"
            echo
            echo "Deployed variant: \`${DEPLOYED_VARIANT}\` (from \`vars.IMAGE_VARIANT\`) — **${DEPLOYED_STATUS}**"
            echo
            echo "| Variant | Status | Index digest | amd64 manifest | arm64 manifest | Advisories |"
            echo "| --- | --- | --- | --- | --- | --- |"
            jq -r '.[] | "| `\(.variant)` | \(.status) | `\(.index_digest // "-")` | `\(.manifests.amd64 // "-")` | `\(.manifests.arm64 // "-")` | \(.advisories | length) |"' summaries.json
            echo
            echo "Index and per-architecture manifest digests differ. \`kubectl get pod -o jsonpath='{..imageID}'\` may report either, so compare against whichever matches."
            echo
            if [ -s expiring.tsv ]; then
              echo "### Exceptions lapsing within ${EXPIRY_WARN_DAYS} days"
              echo
              echo "| Advisory | Expires | Days remaining |"
              echo "| --- | --- | --- |"
              while IFS=$'\t' read -r id date days; do
                echo "| \`${id}\` | ${date} | ${days} |"
              done < expiring.tsv
              echo
            fi
            if [ -n "${FAILED}" ]; then
              echo "**Never reported** (the scan leg died before it could say anything): \`${FAILED}\`"
              echo
            fi
            if [ -n "${UNAVAILABLE}" ]; then
              echo "**Not scanned** (no \`latest-<variant>\` image resolved): \`${UNAVAILABLE}\`"
              echo
            fi
            echo "Full reports: the \`rescan-<variant>\` artifacts on this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        # One issue, found by label. The label is created idempotently first, which is
        # what removes the objection that sent an earlier version to a body search:
        # `gh issue create --label` fails outright when the label does not exist, but
        # `gh label create --force` is a no-op when it does. A label is an exact,
        # unbounded key; a body search paged at 100 open issues silently starts filing
        # a second issue every night once the repository crosses that line, which is
        # the failure the "one issue, not one per run" requirement names.
        #
        # Gated on the aggregation succeeding, which is the Decision that keeps a Trivy
        # database or registry failure from filing an issue titled as if a vulnerability
        # had been found. The issue is the vulnerability record; the red run is the
        # infrastructure notification. Those are different channels on purpose.
        if: ${{ always() && steps.aggregate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ADVISORIES: ${{ steps.aggregate.outputs.advisories }}
          ADVISORY_COUNT: ${{ steps.aggregate.outputs.advisory_count }}
          UNAVAILABLE: ${{ steps.aggregate.outputs.unavailable }}
          FAILED: ${{ steps.aggregate.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Scheduled image scan: HIGH/CRITICAL findings on released images"
          today=$(date -u +%Y-%m-%d)

          # An expiry inside the window is actionable even with a clean scan, so either
          # condition owns the issue. Both are rendered whichever opened it.
          #
          # `if` rather than `[ ... ] && var=x`: under `set -e` a false test in that
          # form is a failed command list and would exit the step.
          actionable=false
          if [ "${ADVISORY_COUNT:-0}" -gt 0 ]; then
            actionable=true
          fi
          if [ -s expiring.tsv ]; then
            actionable=true
          fi

          gh label create "$ISSUE_LABEL" --repo "$REPO" --force \
            --color B60205 \
            --description "Tracking issue for the scheduled image re-scan" > /dev/null

          matches=$(gh issue list --repo "$REPO" --state open --label "$ISSUE_LABEL" \
            --limit 100 --json number,body)

          # Taking `first` would quietly make one of them the record and orphan the
          # rest, which is the same "one issue" guarantee failing in a way nobody sees.
          found=$(printf '%s' "$matches" | jq 'length')
          if [ "$found" -gt 1 ]; then
            echo "::error::${found} open issues carry the \`${ISSUE_LABEL}\` label, so there is no single tracking issue."
            printf '%s' "$matches" | jq -r '.[] | "  #\(.number)"'
            echo "Close or unlabel all but one, then re-run."
            exit 1
          fi

          number=$(printf '%s' "$matches" | jq -r '.[0].number // empty')
          previous=$(printf '%s' "$matches" | jq -r '.[0].body // ""' \
            | sed -n '/<!-- advisories: /{s/.*<!-- advisories: \(.*\) -->.*/\1/p;q;}')

          if [ "$actionable" = false ] && [ -z "$number" ]; then
            echo "clean, and no tracking issue open. Nothing to do."
            exit 0
          fi

          {
            echo "$ISSUE_MARKER"
            echo "<!-- advisories: ${ADVISORIES} -->"
            echo
            echo "> This body is rewritten by the nightly scan. The HTML comment above is"
            echo "> how it remembers the previous advisory set; editing it will produce a"
            echo "> spurious \"findings changed\" comment. Add notes in a comment instead."
            echo
            if [ "${ADVISORY_COUNT:-0}" -gt 0 ]; then
              echo "\`${ADVISORY_COUNT}\` distinct HIGH/CRITICAL advisories survive \`.trivyignore.yaml\` on released images."
            else
              echo "**Resolved as of ${today}** — no HIGH/CRITICAL findings survive \`.trivyignore.yaml\` on any scanned variant."
              echo
              echo "Left open deliberately: closing an issue someone is mid-triage on is harder to notice than a stale one."
            fi
            echo
            echo "| Variant | Status | Index digest | Advisories |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | "| `\(.variant)` | \(.status) | `\(.index_digest // "-")` | \(if (.advisories | length) == 0 then "none" else (.advisories | join(", ")) end) |"' summaries.json
            echo
            if [ -s expiring.tsv ]; then
              echo "### Exceptions lapsing within ${EXPIRY_WARN_DAYS} days"
              echo
              while IFS=$'\t' read -r id date days; do
                echo "- \`${id}\` expires ${date} (${days} days)"
              done < expiring.tsv
              echo
            fi
            if [ -n "${FAILED}" ]; then
              echo "Never reported: \`${FAILED}\` — the scan leg died before it could say anything, so this run does not cover those variants."
              echo
            fi
            if [ -n "${UNAVAILABLE}" ]; then
              echo "Not scanned: \`${UNAVAILABLE}\` — no \`latest-<variant>\` image resolved."
              echo
            fi
            echo "Triage steps and the exception format: \`docs/supply-chain.md\`."
            echo
            echo "Latest run: ${RUN_URL}"
          } > issue-body.md

          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$title" \
              --label "$ISSUE_LABEL" --body-file issue-body.md
            echo "opened the tracking issue."
            exit 0
          fi

          # `--add-label` as well: if someone removed it, the next run would otherwise
          # not find this issue and would open a second one.
          gh issue edit "$number" --repo "$REPO" \
            --add-label "$ISSUE_LABEL" --body-file issue-body.md

          # Comment only on a change of state. A findings set that is stable across runs
          # must not produce a notification every morning, or the issue stops being read.
          if [ "$previous" = "$ADVISORIES" ]; then
            echo "issue #${number} refreshed; advisory set unchanged, so no comment."
            exit 0
          fi

          printf '%s' "$previous" | tr ',' '\n' | sed '/^$/d' | sort > /tmp/previous-ids
          printf '%s' "$ADVISORIES" | tr ',' '\n' | sed '/^$/d' | sort > /tmp/current-ids
          added=$(comm -13 /tmp/previous-ids /tmp/current-ids | tr '\n' ' ')
          removed=$(comm -23 /tmp/previous-ids /tmp/current-ids | tr '\n' ' ')

          {
            if [ "${ADVISORY_COUNT:-0}" -eq 0 ]; then
              echo "No longer reproduces as of ${today}. Left open for you to close."
            else
              echo "Findings changed on ${today}."
              if [ -n "$added" ]; then
                echo "- New: ${added}"
              fi
              if [ -n "$removed" ]; then
                echo "- No longer present: ${removed}"
              fi
            fi
            echo
            echo "${RUN_URL}"
          } > comment.md

          gh issue comment "$number" --repo "$REPO" --body-file comment.md
          echo "commented on issue #${number}: the advisory set changed."

      - name: Verdict
        # Last, and `always()`, so the SARIF, the summary and the issue are all in place
        # before the run goes red. The red run is the notification; the issue is the
        # record of findings specifically.
        #
        # Three ways to be red, reported together rather than one masking the others:
        # findings survived the ledger, a variant never reported, or a released image
        # could not be resolved. The last two used to be silent -- a run could go green
        # having scanned one variant out of five, including a green run on a night the
        # image actually serving production was never looked at.
        if: always()
        env:
          ADVISORY_COUNT: ${{ steps.aggregate.outputs.advisory_count }}
          UNAVAILABLE: ${{ steps.aggregate.outputs.unavailable }}
          FAILED: ${{ steps.aggregate.outputs.failed }}
          DEPLOYED_STATUS: ${{ steps.aggregate.outputs.deployed_status }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          set -eu
          verdict=0

          if [ "$AGGREGATE_OUTCOME" != "success" ]; then
            echo "::error::aggregation did not complete, so this run has no verdict to give."
            exit 1
          fi

          # The deployed variant is the one this workflow is actually about. Any status
          # other than `scanned` means the claim "the released image is re-scanned
          # nightly" was not true tonight, whatever the other four did.
          case "${DEPLOYED_STATUS:-absent}" in
            scanned)
              ;;
            absent)
              echo "::error::the deployed variant '${DEPLOYED_VARIANT}' is not in the scanned variant list at all."
              echo "\`vars.IMAGE_VARIANT\` names a variant this workflow does not build a row for."
              verdict=1 ;;
            *)
              echo "::error::the deployed variant '${DEPLOYED_VARIANT}' was not scanned (status: ${DEPLOYED_STATUS})."
              echo "This run says nothing about the image currently serving production."
              verdict=1 ;;
          esac

          if [ -n "${FAILED:-}" ]; then
            echo "::error::these variants never reported: ${FAILED}"
            echo "Their scan legs died before writing a summary; they are not covered by this run."
            verdict=1
          fi

          if [ -n "${UNAVAILABLE:-}" ]; then
            echo "::error::no released image resolved for: ${UNAVAILABLE}"
            echo "\`promote-tags\` applies \`latest-<variant>\` to every variant of a release, so"
            echo "a partial absence is anomalous. If a variant was just added to the matrix,"
            echo "it stays red until the next release publishes its tag."
            verdict=1
          fi

          if [ "${ADVISORY_COUNT:-0}" -gt 0 ]; then
            echo "::error::${ADVISORY_COUNT} HIGH/CRITICAL advisories survive .trivyignore.yaml on released images."
            verdict=1
          fi

          if [ "$verdict" -eq 0 ]; then
            echo "every expected variant was scanned, and no HIGH or CRITICAL findings survive exceptions."
          fi
          exit "$verdict"
