name: Scheduled Image Re-scan
on:
  # Catches advisories published after a release, with no source change.
  # Off the hour, which queues behind every other cron.
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

# Runs on the default branch so alerts land in its code-scanning view.
permissions:
  contents: read

# Not keyed on the ref, so a manual run can't race the nightly for the tracking issue.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/status-list-server
  # Must match deploy.yml's variant. This job has no environment, so it only sees repo-level vars;
  # deploy.yml fails if the two scopes diverge. Keep that check.
  DEPLOYED_VARIANT: ${{ vars.IMAGE_VARIANT || 'aws' }}
  EXPIRY_WARN_DAYS: "30"
  # The tracking issue is found by this label only.
  ISSUE_LABEL: scheduled-image-scan

jobs:
  # Single list for the matrix and the coverage check; check-variant-parity.py keeps it in step with deploy.yml.
  variants:
    name: Resolve Variant List
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the variant list matches deploy.yml
        run: |
          set -eu
          # The runner usually has PyYAML, but nothing promises it.
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 scripts/check-variant-parity.py

      - name: Publish the variant list
        id: list
        env:
          VARIANTS: aws gcp azure vault fscert
        run: |
          set -euo pipefail
          # Unquoted on purpose: the word splitting is what turns the list into lines.
          list=$(printf '%s\n' $VARIANTS | jq -Rsc 'split("\n") | map(select(length > 0))')

          [ "$(printf '%s' "$list" | jq 'length')" -gt 0 ] || {
            echo "::error::the variant list is empty; this run would assert nothing and pass."
            exit 1
          }

          {
            printf 'names=%s\n' "$VARIANTS"
            printf 'list=%s\n' "$list"
          } >> "$GITHUB_OUTPUT"
          echo "variants: ${VARIANTS}"

  rescan:
    name: Re-scan Released Image (${{ matrix.variant }})
    needs: variants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      # One variant's registry trouble must not hide the others' findings.
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.list) }}
    env:
      # Both arches: cargo auditable records each target's own dependency graph.
      SCAN_ARCHES: amd64 arm64
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        # repository_owner, not github.actor, which on a schedule is whoever last edited this file.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the released digest
        # latest-<variant> only ever points at a digest that passed the release gate.
        # Pin the digest right away; the tag can move during the job.
        id: resolve
        run: |
          set -uo pipefail
          ref="${IMAGE_BASE}:latest-${VARIANT}"

          raw=""
          for attempt in 1 2 3; do
            if raw=$(docker buildx imagetools inspect --raw "$ref" 2>/dev/null); then
              break
            fi
            raw=""
            [ "$attempt" -lt 3 ] || break
            sleep $(( attempt * 5 ))
          done

          # Unreachable after retries: recorded as unscanned, and report fails the run over it.
          if [ -z "$raw" ]; then
            echo "::warning::${ref} is not reachable; this variant is recorded as unscanned."
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          digest=$(docker buildx imagetools inspect "$ref" \
            --format '{{ .Manifest.Digest }}' 2>/dev/null) || digest=""

          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::${ref} is reachable, but no valid index digest could be extracted from it."
            echo "Got: '${digest}'"
            echo "This is a failure of the resolver, not of the registry: the tag exists and"
            echo "\`imagetools inspect --format '{{ .Manifest.Digest }}'\` no longer returns what"
            echo "this workflow expects. It must not be reported as 'not released yet'."
            exit 1
          fi

          echo "resolved=true" >> "$GITHUB_OUTPUT"
          echo "index_digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "resolved ${ref} -> ${digest}"

      - name: Resolve the architecture manifests to scan
        if: steps.resolve.outputs.resolved == 'true'
        env:
          INDEX_DIGEST: ${{ steps.resolve.outputs.index_digest }}
        run: |
          set -euo pipefail
          # Captured, not piped, so a failure keeps its exit status.
          resolved=$(bash scripts/resolve-arch-manifests.sh "${IMAGE_BASE}@${INDEX_DIGEST}" $SCAN_ARCHES)

          while read -r arch manifest; do
            upper=$(printf '%s' "$arch" | tr '[:lower:]' '[:upper:]')
            echo "SCAN_REF_${upper}=${IMAGE_BASE}@${manifest}" >> "$GITHUB_ENV"
            echo "MANIFEST_${upper}=${manifest}" >> "$GITHUB_ENV"
          done <<< "$resolved"

      - name: Install Trivy
        # Pinned to the same version trivy-action v0.36.0 uses internally.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: false

      - name: Restore Trivy vulnerability database cache
        # Not gated on resolved, so the saving leg still saves.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Ensure Trivy vulnerability database
        # Falls back to a cached DB under 24h old; fails otherwise.
        run: bash scripts/ensure-trivy-db.sh "$RUNNER_TEMP/trivy" 24

      - name: Save Trivy vulnerability database cache
        # One leg saves; release tags restore this default-branch entry.
        if: strategy.job-index == 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}

      - name: Scan image (amd64)
        if: steps.resolve.outputs.resolved == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The ensure step above already handled freshness.
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_REF_AMD64 }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: json
          output: trivy-image-report-amd64.json
          cache: false
          cache-dir: ${{ runner.temp }}/trivy
          skip-setup-trivy: true

      - name: Scan image (arm64)
        if: steps.resolve.outputs.resolved == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_REF_ARM64 }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: json
          output: trivy-image-report-arm64.json
          cache: false
          cache-dir: ${{ runner.temp }}/trivy
          skip-setup-trivy: true

      - name: Derive reports
        if: steps.resolve.outputs.resolved == 'true'
        run: |
          set -eu
          for arch in $SCAN_ARCHES; do
            sh scripts/derive-trivy-reports.sh "$arch"
          done

      - name: Derive SARIF
        # From the pre-ledger HIGH/CRITICAL set, so the severity floor lives only in derive-trivy-reports.sh.
        if: steps.resolve.outputs.resolved == 'true'
        run: |
          set -eu
          for arch in $SCAN_ARCHES; do
            trivy convert \
              --format sarif --output "image-${VARIANT}-${arch}.sarif" \
              "trivy-highcrit-all-${arch}.json"
          done

      - name: Prove the gate can fail
        # A gate that has never failed can't be told apart from one that can't.
        if: steps.resolve.outputs.resolved == 'true'
        run: sh scripts/gate-selftest.sh

      - name: Evaluate the gate
        # Renders only; report makes the single verdict.
        if: steps.resolve.outputs.resolved == 'true'
        env:
          INDEX_DIGEST: ${{ steps.resolve.outputs.index_digest }}
        run: |
          set -eu
          # scan-summary-<variant>.json: {variant, status: scanned|unavailable|failed, advisories, suppressed,
          # index_digest?, manifests?}. The optional fields only appear on scanned rows.
          advisories=$(jq -s '[.[].Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique' trivy-gate-findings-*.json)
          total=$(jq -s '[.[].Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | length' trivy-highcrit-all-*.json)

          jq -n \
            --arg variant "$VARIANT" \
            --arg index "$INDEX_DIGEST" \
            --arg amd64 "${MANIFEST_AMD64:-}" \
            --arg arm64 "${MANIFEST_ARM64:-}" \
            --argjson advisories "$advisories" \
            --argjson total "$total" \
            '{variant: $variant, status: "scanned", index_digest: $index,
              manifests: {amd64: $amd64, arm64: $arm64},
              advisories: $advisories,
              suppressed: ($total - ($advisories | length))}' \
            > "scan-summary-${VARIANT}.json"

          for arch in $SCAN_ARCHES; do
            echo "--- ${VARIANT} linux/${arch} ---"
            sh scripts/vuln-gate.sh "trivy-gate-findings-${arch}.json" || true
          done

      - name: Record an unresolved variant
        if: steps.resolve.outputs.resolved != 'true'
        run: |
          set -eu
          jq -n --arg variant "$VARIANT" \
            '{variant: $variant, status: "unavailable", advisories: [], suppressed: 0}' \
            > "scan-summary-${VARIANT}.json"

      - name: Upload scan results
        # always(), so report can tell "clean" from "never reported".
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rescan-${{ matrix.variant }}
          path: |
            scan-summary-*.json
            trivy-image-report-*.json
            trivy-image-report-*.txt
            trivy-highcrit-all-*.json
            trivy-gate-findings-*.json
            image-*.sarif
          if-no-files-found: warn

  report:
    name: Report and Track
    needs:
      - variants
      - rescan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
      issues: write
    env:
      EXPECTED_VARIANTS: ${{ needs.variants.outputs.names }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download scan results
        # Missing artifacts aren't fatal; the accounting below reports them.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --dir artifacts; then
            echo "::warning::no artifacts could be downloaded from this run."
            mkdir -p artifacts
          fi

      - name: Account for variants that never reported
        # A leg that died becomes a "failed" row; the verdict accounts for it.
        id: coverage
        run: |
          set -euo pipefail
          [ -n "${EXPECTED_VARIANTS}" ] || {
            echo "::error::the variant list is empty, so this run cannot know what it was meant to cover."
            exit 1
          }

          mkdir -p artifacts/unreported
          missing=""
          for variant in $EXPECTED_VARIANTS; do
            # Not piped into grep -q: under pipefail, SIGPIPE would mark a present file missing.
            if [ -z "$(find artifacts -name "scan-summary-${variant}.json" -print -quit)" ]; then
              missing="${missing:+${missing} }${variant}"
              jq -n --arg variant "$variant" \
                '{variant: $variant, status: "failed", advisories: [], suppressed: 0}' \
                > "artifacts/unreported/scan-summary-${variant}.json"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::warning::no scan summary from: ${missing} -- recorded as failed, not as clean."
          else
            echo "all expected variants reported."
          fi
          printf 'missing=%s\n' "$missing" >> "$GITHUB_OUTPUT"

      - name: Aggregate findings
        id: aggregate
        run: |
          set -euo pipefail
          find artifacts -name 'scan-summary-*.json' -exec cat {} + | jq -s '.' > summaries.json

          if [ "$(jq 'length' summaries.json)" -eq 0 ]; then
            echo "::error::no scan summaries at all, so this run measured nothing."
            exit 1
          fi

          # Advisory IDs are untrusted and reach an issue body and $GITHUB_OUTPUT: refuse odd ones, don't filter.
          # \A and \z, not ^ and $: in jq 1.7, $ also matches before a trailing newline.
          bad=$(jq -r '[.[].advisories[] | select(test("\\A[A-Za-z0-9._-]+\\z") | not)] | @json' summaries.json)
          if [ "$bad" != "[]" ]; then
            echo "::error::Trivy returned advisory IDs outside the expected character set: ${bad}"
            echo "Refusing to render them into an issue body or a workflow output."
            exit 1
          fi

          scanned=$(jq -r '[.[] | select(.status == "scanned")] | length' summaries.json)
          advisories=$(jq -r '[.[].advisories[]] | unique | join(",")' summaries.json)
          count=$(jq -r '[.[].advisories[]] | unique | length' summaries.json)
          unavailable=$(jq -r '[.[] | select(.status == "unavailable") | .variant] | join(" ")' summaries.json)
          failed=$(jq -r '[.[] | select(.status == "failed") | .variant] | join(" ")' summaries.json)
          deployed_status=$(jq -r --arg v "$DEPLOYED_VARIANT" \
            '[.[] | select(.variant == $v) | .status] | first // "absent"' summaries.json)

          if [ "$scanned" -eq 0 ]; then
            echo "::error::no variant resolved a released image, so nothing was scanned."
            echo "Either no release has published \`latest-<variant>\` tags yet, or GHCR"
            echo "was unreachable for every variant. This is not a clean scan."
            exit 1
          fi

          {
            printf 'scanned=%s\n' "$scanned"
            printf 'advisory_count=%s\n' "$count"
            printf 'unavailable=%s\n' "$unavailable"
            printf 'failed=%s\n' "$failed"
            printf 'deployed_status=%s\n' "$deployed_status"
            # Heredoc form anyway, so it doesn't depend on the value being well-formed.
            printf 'advisories<<SCAN_ADVISORIES_EOF\n%s\nSCAN_ADVISORIES_EOF\n' "$advisories"
          } >> "$GITHUB_OUTPUT"

          echo "scanned ${scanned} variant(s); ${count} distinct HIGH/CRITICAL advisories after exceptions"
          echo "deployed variant '${DEPLOYED_VARIANT}': ${deployed_status}"

      - name: Merge and upload SARIF
        # Each run needs its own automationDetails.id; the action's category input is applied too late to help.
        id: sarif
        if: always()
        run: |
          set -euo pipefail
          files=$(find artifacts -name 'image-*.sarif' | sort)
          if [ -z "$files" ]; then
            echo "no SARIF produced -- nothing was scanned."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p tagged
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            base=$(basename "$file" .sarif)   # image-<variant>-<arch>
            rest=${base#image-}
            variant=${rest%-*}
            arch=${rest##*-}

            if [ -e "tagged/${variant}-${arch}.sarif" ]; then
              echo "::error::more than one SARIF for ${variant}/${arch}: ${file}"
              exit 1
            fi

            # Code scanning merges alerts by rule and location across categories, so prefix each image's path.
            # The trailing / matters: the category is everything before the last /.
            jq --arg tag "${variant}/${arch}" '
              .runs |= map(
                .automationDetails.id = ("container-image/" + $tag + "/")
                | .results = ((.results // []) | map(
                  .message.text = ((.message.text // "") + " (" + $tag + ")")
                  | .locations = ((.locations // []) | map(
                      .physicalLocation.artifactLocation.uri =
                        ($tag + "/" + (.physicalLocation.artifactLocation.uri // "image"))
                    ))
                ))
              )' "$file" > "tagged/${variant}-${arch}.sarif"
          done <<< "$files"

          find tagged -name '*.sarif' -exec cat {} + \
            | jq -s '{version: .[0].version, "$schema": .[0]["$schema"],
                      runs: (map(.runs) | add)}' > merged.sarif

          runs=$(jq '.runs | length' merged.sarif)
          # GitHub rejects more than 20 runs per SARIF upload.
          if [ "$runs" -gt 20 ]; then
            echo "::error::merged.sarif holds ${runs} runs; GitHub accepts at most 20 per upload."
            echo "Split the upload, or stop uploading every variant."
            exit 1
          fi

          # The action only catches duplicate ids; ids sharing a category still fail at GitHub.
          # .runs[] | .id // "", not .runs[].id // "", which drops runs without an id.
          dupes=$(jq -r '[.runs[] | .automationDetails.id // ""
                          | if test("/") then sub("/[^/]*$"; "") else "" end]
                         | group_by(.) | map(select(length > 1) | .[0] | if . == "" then "(empty)" else . end)
                         | join(" ")' merged.sarif)
          if [ -n "$dupes" ]; then
            echo "::error::merged.sarif has more than one run in category: ${dupes}"
            exit 1
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "merged ${runs} run(s) into merged.sarif"

      - name: Upload SARIF to code scanning
        # No continue-on-error: a scheduled run always has the write scope.
        if: ${{ always() && steps.sarif.outputs.present == 'true' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: merged.sarif

      - name: Check for approaching exception expiry
        # An approaching expiry is notice, not failure; a broken checker is a failure.
        id: expiry
        if: always()
        run: |
          set -uo pipefail
          : > expiring.tsv
          status=0

          # A missing PyYAML would look like "nothing expiring", so install it.
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml

          python3 scripts/check-trivyignore.py .trivyignore.yaml \
            --expiring-within "$EXPIRY_WARN_DAYS" > expiring.tsv || status=$?

          if [ "$status" -ne 0 ]; then
            echo "::error::check-trivyignore.py exited ${status}; expiry could not be determined from .trivyignore.yaml."
            echo "This run gives no advance warning on \`expired_at\`, which is one of the three things it exists for."
            : > expiring.tsv
            echo "checker_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "checker_failed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -s expiring.tsv ]; then
            echo "expiring=true" >> "$GITHUB_OUTPUT"
            cat expiring.tsv
          else
            echo "expiring=false" >> "$GITHUB_OUTPUT"
            echo "no exception lapses within ${EXPIRY_WARN_DAYS} days."
          fi

      - name: Publish report to job summary
        # No data would render an empty table that looks clean.
        if: ${{ always() && steps.aggregate.outcome == 'success' }}
        env:
          UNAVAILABLE: ${{ steps.aggregate.outputs.unavailable }}
          FAILED: ${{ steps.aggregate.outputs.failed }}
          DEPLOYED_STATUS: ${{ steps.aggregate.outputs.deployed_status }}
        run: |
          set -eu
          {
            echo "## Scheduled image re-scan"
            echo
            echo "Deployed variant: \`${DEPLOYED_VARIANT}\` (from \`vars.IMAGE_VARIANT\`) — **${DEPLOYED_STATUS}**"
            echo
            # Suppressed separates "nothing found" from "everything found was accepted".
            echo "| Variant | Status | Index digest | amd64 manifest | arm64 manifest | Advisories | Suppressed |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            jq -r '.[] | "| `\(.variant)` | \(.status) | `\(.index_digest // "-")` | `\(.manifests.amd64 // "-")` | `\(.manifests.arm64 // "-")` | \(.advisories | length) | \(.suppressed // 0) |"' summaries.json
            echo
            echo "Index and per-architecture manifest digests differ. \`kubectl get pod -o jsonpath='{..imageID}'\` may report either, so compare against whichever matches."
            echo
            if [ -s expiring.tsv ]; then
              echo "### Exceptions lapsing within ${EXPIRY_WARN_DAYS} days"
              echo
              echo "| Advisory | Expires | Days remaining |"
              echo "| --- | --- | --- |"
              while IFS=$'\t' read -r id date days; do
                echo "| \`${id}\` | ${date} | ${days} |"
              done < expiring.tsv
              echo
            fi
            if [ -n "${FAILED}" ]; then
              echo "**Never reported** (the scan leg died before it could say anything): \`${FAILED}\`"
              echo
            fi
            if [ -n "${UNAVAILABLE}" ]; then
              echo "**Not scanned** (no \`latest-<variant>\` image resolved): \`${UNAVAILABLE}\`"
              echo
            fi
            echo "Full reports: the \`rescan-<variant>\` artifacts on this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        # Create the label first: gh issue create --label fails if it's missing.
        # Only after a successful aggregation, so an infra failure never files a vulnerability issue.
        if: ${{ always() && steps.aggregate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ADVISORIES: ${{ steps.aggregate.outputs.advisories }}
          ADVISORY_COUNT: ${{ steps.aggregate.outputs.advisory_count }}
          UNAVAILABLE: ${{ steps.aggregate.outputs.unavailable }}
          FAILED: ${{ steps.aggregate.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Scheduled image scan: HIGH/CRITICAL findings on released images"
          today=$(date -u +%Y-%m-%d)

          # if, not [ ... ] && x=y, so a false test can't fail the step under set -e.
          actionable=false
          if [ "${ADVISORY_COUNT:-0}" -gt 0 ]; then
            actionable=true
          fi
          if [ -s expiring.tsv ]; then
            actionable=true
          fi

          # Expiries are half the change key; id@date, not days left, so the key doesn't change nightly.
          expiring_key=$(cut -f1,2 expiring.tsv | tr '\t' '@' | paste -sd, -)

          gh label create "$ISSUE_LABEL" --repo "$REPO" --force \
            --color B60205 \
            --description "Tracking issue for the scheduled image re-scan" > /dev/null

          matches=$(gh issue list --repo "$REPO" --state open --label "$ISSUE_LABEL" \
            --limit 100 --json number,body)

          found=$(printf '%s' "$matches" | jq 'length')
          if [ "$found" -gt 1 ]; then
            echo "::error::${found} open issues carry the \`${ISSUE_LABEL}\` label, so there is no single tracking issue."
            printf '%s' "$matches" | jq -r '.[] | "  #\(.number)"'
            echo "Close or unlabel all but one, then re-run."
            exit 1
          fi

          number=$(printf '%s' "$matches" | jq -r '.[0].number // empty')
          body=$(printf '%s' "$matches" | jq -r '.[0].body // ""')
          previous=$(printf '%s' "$body" \
            | sed -n '/<!-- advisories: /{s/.*<!-- advisories: \(.*\) -->.*/\1/p;q;}')
          previous_expiring=$(printf '%s' "$body" \
            | sed -n '/<!-- expiring: /{s/.*<!-- expiring: \(.*\) -->.*/\1/p;q;}')

          if [ "$actionable" = false ] && [ -z "$number" ]; then
            echo "clean, and no tracking issue open. Nothing to do."
            exit 0
          fi

          {
            echo "<!-- advisories: ${ADVISORIES} -->"
            echo "<!-- expiring: ${expiring_key} -->"
            echo
            echo "> This body is rewritten by the nightly scan. The HTML comments above"
            echo "> are how it remembers the previous advisory and expiry sets; editing"
            echo "> them will produce a spurious \"changed\" comment. Notes go in a comment."
            echo
            if [ "${ADVISORY_COUNT:-0}" -gt 0 ]; then
              echo "\`${ADVISORY_COUNT}\` distinct HIGH/CRITICAL advisories survive \`.trivyignore.yaml\` on released images."
            else
              echo "**Resolved as of ${today}** — no HIGH/CRITICAL findings survive \`.trivyignore.yaml\` on any scanned variant."
              echo
              echo "Left open deliberately: closing an issue someone is mid-triage on is harder to notice than a stale one."
            fi
            echo
            echo "| Variant | Status | Index digest | Advisories |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | "| `\(.variant)` | \(.status) | `\(.index_digest // "-")` | \(if (.advisories | length) == 0 then "none" else (.advisories | join(", ")) end) |"' summaries.json
            echo
            if [ -s expiring.tsv ]; then
              echo "### Exceptions lapsing within ${EXPIRY_WARN_DAYS} days"
              echo
              while IFS=$'\t' read -r id date days; do
                echo "- \`${id}\` expires ${date} (${days} days)"
              done < expiring.tsv
              echo
            fi
            if [ -n "${FAILED}" ]; then
              echo "Never reported: \`${FAILED}\` — the scan leg died before it could say anything, so this run does not cover those variants."
              echo
            fi
            if [ -n "${UNAVAILABLE}" ]; then
              echo "Not scanned: \`${UNAVAILABLE}\` — no \`latest-<variant>\` image resolved."
              echo
            fi
            echo "Triage steps and the exception format: \`docs/supply-chain.md\`."
            echo
            echo "Latest run: ${RUN_URL}"
          } > issue-body.md

          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$title" \
              --label "$ISSUE_LABEL" --body-file issue-body.md
            echo "opened the tracking issue."
            exit 0
          fi

          # Re-add the label in case someone removed it.
          gh issue edit "$number" --repo "$REPO" \
            --add-label "$ISSUE_LABEL" --body-file issue-body.md

          # Comment only when either set changes, so a stable state doesn't notify every morning.
          if [ "$previous" = "$ADVISORIES" ] && [ "$previous_expiring" = "$expiring_key" ]; then
            echo "issue #${number} refreshed; advisory and expiry sets unchanged, so no comment."
            exit 0
          fi

          printf '%s' "$previous" | tr ',' '\n' | sed '/^$/d' | sort > /tmp/previous-ids
          printf '%s' "$ADVISORIES" | tr ',' '\n' | sed '/^$/d' | sort > /tmp/current-ids
          added=$(comm -13 /tmp/previous-ids /tmp/current-ids | tr '\n' ' ')
          removed=$(comm -23 /tmp/previous-ids /tmp/current-ids | tr '\n' ' ')

          {
            if [ "$previous" != "$ADVISORIES" ]; then
              if [ "${ADVISORY_COUNT:-0}" -eq 0 ]; then
                echo "No longer reproduces as of ${today}. Left open for you to close."
              else
                echo "Findings changed on ${today}."
                if [ -n "$added" ]; then
                  echo "- New: ${added}"
                fi
                if [ -n "$removed" ]; then
                  echo "- No longer present: ${removed}"
                fi
              fi
              echo
            fi

            if [ "$previous_expiring" != "$expiring_key" ]; then
              if [ -s expiring.tsv ]; then
                echo "Exceptions lapsing within ${EXPIRY_WARN_DAYS} days changed on ${today}:"
                echo
                while IFS=$'\t' read -r id date days; do
                  echo "- \`${id}\` expires ${date} (${days} days remaining)"
                done < expiring.tsv
                echo
                echo "Re-argue or remove these before they lapse. An expired entry stops suppressing anything, so the finding returns and blocks the next release."
              else
                echo "No \`.trivyignore.yaml\` exception lapses within ${EXPIRY_WARN_DAYS} days as of ${today}."
              fi
              echo
            fi
            echo "${RUN_URL}"
          } > comment.md

          gh issue comment "$number" --repo "$REPO" --body-file comment.md
          echo "commented on issue #${number}: the advisory or expiry set changed."

      - name: Verdict
        # Last, after the SARIF, summary and issue are in place. Red means the deployed variant
        # wasn't covered, findings survived, or the expiry checker broke; other variants only warn.
        if: always()
        env:
          ADVISORY_COUNT: ${{ steps.aggregate.outputs.advisory_count }}
          UNAVAILABLE: ${{ steps.aggregate.outputs.unavailable }}
          FAILED: ${{ steps.aggregate.outputs.failed }}
          DEPLOYED_STATUS: ${{ steps.aggregate.outputs.deployed_status }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          EXPIRING: ${{ steps.expiry.outputs.expiring }}
          CHECKER_FAILED: ${{ steps.expiry.outputs.checker_failed }}
        run: |
          set -eu
          verdict=0

          if [ "$AGGREGATE_OUTCOME" != "success" ]; then
            echo "::error::aggregation did not complete, so this run has no verdict to give."
            exit 1
          fi

          case "${DEPLOYED_STATUS:-absent}" in
            scanned)
              ;;
            absent)
              echo "::error::the deployed variant '${DEPLOYED_VARIANT}' is not in the scanned variant list at all."
              echo "\`vars.IMAGE_VARIANT\` names a variant this workflow does not build a row for."
              verdict=1 ;;
            *)
              echo "::error::the deployed variant '${DEPLOYED_VARIANT}' was not scanned (status: ${DEPLOYED_STATUS})."
              echo "This run says nothing about the image currently serving production."
              verdict=1 ;;
          esac

          if [ -n "${FAILED:-}" ]; then
            echo "::warning::these variants never reported: ${FAILED}"
            echo "Their scan legs died before writing a summary; they are not covered by this run."
          fi

          if [ -n "${UNAVAILABLE:-}" ]; then
            echo "::warning::no released image resolved for: ${UNAVAILABLE}"
            echo "\`promote-tags\` applies \`latest-<variant>\` to every variant of a release, so a"
            echo "partial absence is anomalous -- unless a variant was just added to the matrix,"
            echo "in which case it stays unresolved until the next release publishes its tag."
          fi

          if [ "${EXPIRING:-false}" = "true" ]; then
            echo "::warning::.trivyignore.yaml exceptions lapse within ${EXPIRY_WARN_DAYS} days; see the job summary and the tracking issue."
          fi

          if [ "${CHECKER_FAILED:-false}" = "true" ]; then
            echo "::error::the exception expiry check could not run, so this run gave no \`expired_at\` warning."
            verdict=1
          fi

          if [ "${ADVISORY_COUNT:-0}" -gt 0 ]; then
            echo "::error::${ADVISORY_COUNT} HIGH/CRITICAL advisories survive .trivyignore.yaml on released images."
            verdict=1
          fi

          if [ "$verdict" -eq 0 ]; then
            echo "the deployed variant '${DEPLOYED_VARIANT}' was scanned, and no HIGH or CRITICAL findings survive exceptions."
          fi
          exit "$verdict"
