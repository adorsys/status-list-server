name: Conventional Commits

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest

    env:
      CONVENTIONAL_COMMIT_PATTERN: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([A-Za-z0-9._/-]+\))?!?: .+$'

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ ! "${PR_TITLE}" =~ ${CONVENTIONAL_COMMIT_PATTERN} ]]; then
            echo "::error title=Invalid PR title::PR title must follow Conventional Commits, for example: feat(api): add status list lookup"
            echo "Received: ${PR_TITLE}"
            exit 1
          fi

      - name: Validate commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..HEAD"
          elif [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            base_ref="${MERGE_GROUP_BASE_REF#refs/heads/}"
            git fetch --no-tags origin "${base_ref}"
            range="origin/${base_ref}..HEAD"
          elif [[ -n "${BASE_REF}" ]]; then
            git fetch --no-tags origin "${BASE_REF}"
            range="origin/${BASE_REF}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi

          echo "Validating non-merge commit subjects in range: ${range}"

          failures=0
          commits=0

          while IFS= read -r commit; do
            commits=$((commits + 1))
            subject="$(git log -1 --format=%s "${commit}")"

            if [[ ! "${subject}" =~ ${CONVENTIONAL_COMMIT_PATTERN} ]]; then
              echo "::error title=Invalid commit message::${commit} '${subject}' must follow Conventional Commits"
              failures=$((failures + 1))
            fi
          done < <(git log --format=%H --no-merges "${range}")

          if [[ "${commits}" -eq 0 ]]; then
            echo "No non-merge commits found to validate."
          fi

          if [[ "${failures}" -gt 0 ]]; then
            echo "Found ${failures} non-conventional commit message(s)."
            exit 1
          fi
