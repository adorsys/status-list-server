name: "CI"

on:
  merge_group:
  workflow_dispatch:
  workflow_call:
  pull_request:

# A scope added here must also be granted by deploy.yml's `ci` job, which calls this
# workflow: a called workflow can only narrow the caller's token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  zizmor-security:
    name: Zizmor Security Check
    runs-on: ubuntu-latest
    env:
      # The action's `version` defaults to `latest`, so without this an upstream zizmor
      # release turns every PR red. The action's SHA pins the action, not the scanner.
      ZIZMOR_VERSION: "1.28.0"

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail-closed at every severity. To accept a finding use `# zizmor: ignore[rule]`
      # on the line it anchors to; `ignore-start`/`ignore-end` suppress nothing.
      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          # `.` also picks up .github/dependabot.yml.
          inputs: .
          persona: regular
          online-audits: true
          # SARIF would need `security-events: write`; annotations anchor on the diff.
          advanced-security: false
          annotations: true

      # A green gate and a broken gate look identical from here. CLI, not the action:
      # the self-test needs to observe a failure, which the action would turn into one.
      - name: Install zizmor for the self-test
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: zizmor@${{ env.ZIZMOR_VERSION }}

      - name: Assert the scanner still fails on a known finding
        if: ${{ !cancelled() }}
        run: bash scripts/zizmor-selftest.sh

      # auto_merge.yml suppresses `bot-conditions`, which silences the audit for whatever
      # that condition later becomes. Assert the guards the suppression assumes.
      - name: Assert dependabot auto-merge keeps its author check
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          # yq exits 0 and prints "null" for a missing key, so test the value.
          condition=$(yq '.jobs.dependabot.if' .github/workflows/auto_merge.yml)
          if [ -z "$condition" ] || [ "$condition" = "null" ]; then
            echo "::error::no .jobs.dependabot.if in auto_merge.yml -- was the job renamed?"
            exit 1
          fi

          # github.actor included: dropping it would leave a suppression with nothing
          # left to suppress, hiding a real regression if it came back.
          for guard in \
            "github.event.pull_request.user.login == 'dependabot[bot]'" \
            "github.actor == 'dependabot[bot]'" \
            "github.event.pull_request.head.repo.full_name == github.repository"; do
            case "$condition" in
              *"$guard"*) ;;
              *)
                echo "::error::auto_merge.yml lost a required guard on its dependabot job:"
                echo "  ${guard}"
                echo
                echo "Its '# zizmor: ignore[bot-conditions]' comment assumes github.actor"
                echo "is paired with an unspoofable author check. Restore the guard, or"
                echo "delete the ignore comment so zizmor can flag this itself."
                echo
                echo "Background: the High severity bot-conditions finding in #417."
                exit 1
                ;;
            esac
          done

          echo "auto_merge.yml still carries all three guards."

      # `ci-success.needs` is hand-maintained, so a job missing from it fails without
      # blocking the merge. `docker-build` already did.
      - name: Assert every job is gated by ci-success
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          yq -r '.jobs | keys | .[] | select(. != "ci-success")' \
            .github/workflows/CI.yml | sort > /tmp/ci-jobs
          yq -r '.jobs.ci-success.needs[]' \
            .github/workflows/CI.yml | sort > /tmp/ci-gated

          missing=$(comm -23 /tmp/ci-jobs /tmp/ci-gated)

          if [ -n "$missing" ]; then
            echo "::error::these CI.yml jobs are not in ci-success.needs, so they do not block merges:"
            printf '  %s\n' $missing
            exit 1
          fi

          echo "every CI.yml job is gated by ci-success."

  cargo-fmt:
    name: Cargo Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt

      - name: Rustfmt Check
        run: cargo fmt --all --check

  cargo-build:
    name: Cargo Build
    runs-on: ubuntu-latest
    needs: cargo-fmt
    timeout-minutes: 45

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Cargo Build
        run: cargo build --workspace --all-targets --all-features

      - name: Memory-only Build
        run: cargo check --no-default-features --features memory

      - name: Release image feature set
        # `--all-features` does not cover this -- cargo unifies features, so the release
        # set is never compiled as such. Read from the Dockerfile so it cannot drift.
        run: |
          set -euo pipefail
          features=$(sed -nE 's/^ARG FEATURES="([^"]+)".*/\1/p' Dockerfile)
          if [ -z "${features}" ]; then
            echo "::error::could not read ARG FEATURES from Dockerfile"
            exit 1
          fi
          echo "release image features: ${features}"
          cargo check --workspace --features "${features}"

      - name: Verify domain layer purity
        run: |
          if grep -rn -E "(sea_orm|axum|aws_sdk|reqwest|moka|crate::server|crate::outbound)" src/domain/; then
            echo "ERROR: Infrastructure dependencies or imports found in src/domain/"
            exit 1
          fi

  docker-build:
    name: Docker Build Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # The default docker driver cannot export to the gha cache backend.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker build (production features)
        # No FEATURES build-arg: the Dockerfile default is already the release set, and
        # a second copy would drift.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cargo-clippy:
    name: Cargo Clippy Check
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy

      - name: Clippy Check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  cargo-nextest:
    name: Cargo Nextest
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          # Same pin as the coverage job below, so both run the same test harness.
          tool: nextest@0.9.101

      - name: Run Cargo Tests
        run: cargo nextest run --workspace --all-targets --all-features

  cargo-doc:
    name: Cargo Documentation
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Generate Documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  check-crate-type:
    uses: ./.github/workflows/crate_type.yml

  cargo-test-doc:
    needs: check-crate-type
    if: ${{ needs.check-crate-type.outputs.is_lib == 'true' }}
    name: Cargo test doc
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Cargo test doc
        run: cargo test --doc --workspace --all-features

  cargo-machete:
    name: Cargo Machete Check
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install cargo-machete
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-machete@0.9.2

      - name: Check for unused dependencies
        run: cargo machete --with-metadata

  cargo-vet:
    name: Vet dependencies
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install cargo-vet
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-vet@0.10.2

      - name: Run cargo-vet
        run: cargo vet --locked

  cargo-deny:
    uses: ./.github/workflows/cargo_deny.yml

  typos-cli:
    name: typos
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Typos
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: typos-cli@1.49.0

      - name: run typos
        run: typos

  tombi-toml-lint:
    name: Tombi TOML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Taplo
        uses: tombi-toml/setup-tombi@f2ae7247d62521245eb2793d653b9df472b9e090 # v1.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate TOML files
        run: tombi lint

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: "**/*.md"

  trivy-config:
    name: Trivy Config Scan (Helm Chart)
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .trivyignore.yaml
        # Before the scan that consumes the file, so a malformed entry fails in seconds
        # as itself rather than later as a scanner error on an unrelated change.
        run: |
          set -eu
          # apt rather than pip: the runner's PyYAML comes from the distribution, so
          # this pulls no unpinned dependency into every pull request.
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check-trivyignore.py .trivyignore.yaml

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build Helm dependencies
        run: |
          # Upstream chart default values:
          # https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-collector/values.yaml
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart

      - name: Render Helm template
        env:
          APP_DATABASE_PORT: "5432"
        run: |
          mkdir -p /tmp/rendered
          helm template status-list-server helm/chart \
            -f helm/chart/values.yaml \
            --set-string statuslist.env.APP_DATABASE__PORT="${APP_DATABASE_PORT}" \
            --output-dir /tmp/rendered

      - name: Verify image reference resolution
        # Runs here rather than in its own workflow because it asserts against the
        # rendered chart this job already built.
        run: bash scripts/verify-image-reference.sh

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore.yaml

  kube-linter:
    name: KubeLinter Scan (Helm Chart)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the SARIF upload below. deploy.yml's `ci` job must grant this too -- a
      # called workflow can only narrow the caller's token.
      security-events: write

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build Helm dependencies
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart

      - name: Render Helm template
        env:
          APP_DATABASE_PORT: "5432"
        run: |
          mkdir -p /tmp/rendered
          helm template status-list-server helm/chart \
            -f helm/chart/values.yaml \
            --set-string statuslist.env.APP_DATABASE__PORT="${APP_DATABASE_PORT}" \
            --output-dir /tmp/rendered

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: /tmp/rendered
          format: sarif
          config: .kube-linter.yaml
          output-file: kube-linter-results.sarif

      - name: Upload KubeLinter SARIF to code scanning
        # `always()` so the SARIF survives the failing run it matters for.
        # `continue-on-error` because fork PRs withhold write scopes.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: kube-linter-results.sarif
          category: kube-linter

      - name: Upload KubeLinter SARIF artifact
        # Kept alongside the code-scanning upload rather than instead of it: alerts on
        # a fork pull request go nowhere, and this is the only copy that run keeps.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kube-linter-results
          path: kube-linter-results.sarif
          if-no-files-found: warn

  yaml-lint:
    name: YAML Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: YAML Lint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0

      - name: Run yamlfmt
        run: yamlfmt --lint .

  otel-config-validation:
    name: OpenTelemetry Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose model
        run: docker compose config

      - name: Verify Jaeger image tag exists
        run: docker manifest inspect jaegertracing/jaeger:2.20.0 >/dev/null

      - name: Validate Compose Collector config
        run: |
          docker run --rm \
            -v "$PWD/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config /etc/otelcol/config.yaml

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Build Helm dependencies
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart

      - name: Render Helm chart
        env:
          APP_DATABASE_PORT: "5432"
        run: |
          helm template statuslist helm/chart \
            --namespace statuslist \
            --set-string statuslist.env.APP_DATABASE__PORT="${APP_DATABASE_PORT}" \
            > /tmp/statuslist-rendered.yaml

      - name: Extract rendered Helm Collector config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          rendered = Path("/tmp/statuslist-rendered.yaml")
          for document in yaml.safe_load_all(rendered.read_text()):
              if not isinstance(document, dict):
                  continue
              metadata = document.get("metadata") or {}
              if (
                  document.get("kind") == "ConfigMap"
                  and metadata.get("name", "").endswith("-opentelemetry-collector")
              ):
                  data = document.get("data", {})
                  content = data.get("relay") or data.get("config.yaml")
                  if content:
                      Path("/tmp/helm-otel-collector.yaml").write_text(content)
                      break
          else:
              raise SystemExit("rendered Helm Collector ConfigMap was not found")
          PY

      - name: Validate rendered Helm Collector config
        run: |
          docker run --rm \
            -v "/tmp/helm-otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config /etc/otelcol/config.yaml

  cargo-coverage:
    name: Cargo Coverage (llvm-cov)
    runs-on: ubuntu-latest
    needs: cargo-build
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          # Both pinned: cargo-llvm-cov and nextest have to agree on the test-runner
          # interface, so they are bumped together rather than floating independently.
          tool: cargo-llvm-cov@0.6.16,nextest@0.9.101

      - name: Generate code coverage
        run: cargo llvm-cov nextest --workspace --all-features --html --output-dir target/llvm-cov/html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error

  # The single required status check -- the jobs above are unchained, so nothing else
  # here represents the suite. Rollout order: CONTRIBUTING.md, "Branch Protection".
  ci-success:
    name: CI Success
    if: ${{ !cancelled() }}
    needs:
      - zizmor-security
      - cargo-fmt
      - cargo-build
      - docker-build
      - cargo-clippy
      - cargo-nextest
      - cargo-doc
      - check-crate-type
      - cargo-test-doc
      - cargo-machete
      - cargo-vet
      - cargo-deny
      - typos-cli
      - tombi-toml-lint
      - markdown-lint
      - trivy-config
      - kube-linter
      - yaml-lint
      - otel-config-validation
      - cargo-coverage
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Printed so a failure shows which job caused it without expanding the UI.
      - name: Summarise job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS"

      # `skipped` is omitted deliberately: cargo-test-doc skips on a workspace with no
      # lib target, which is legitimate.
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed -- see the results above."
          exit 1
