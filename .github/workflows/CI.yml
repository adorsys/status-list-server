name: "CI"

# PERMISSIONS. deploy.yml calls this workflow, and a called workflow can only narrow
# the caller's token. Every job here is therefore capped at what deploy.yml's `ci`
# job grants. A job needing a new scope must have it added in BOTH files, or it fails
# only on the deploy.yml path.

on:
  merge_group:
  workflow_dispatch:
  workflow_call:
  pull_request:

# Default for every job; a job needing more declares it itself. Reached through
# `workflow_call`, and a called workflow can only narrow the token it is handed -- so
# a scope added here must also be granted by deploy.yml's `ci` job or the run fails.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  zizmor-security:
    name: Zizmor Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail-closed: a finding at any severity fails this job. Fix findings rather than
      # reaching for `|| true`, `min-severity`, or a narrower `inputs:`. To accept one,
      # put `# zizmor: ignore[rule]` on the line it anchors to -- `ignore-start` /
      # `ignore-end` blocks are not zizmor syntax and suppress nothing.
      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # `.` not `.github/workflows/`: also audits .github/dependabot.yml.
          inputs: .
          persona: regular
          # `known-vulnerable-actions` needs the API; the action supplies the token.
          online-audits: true
          # SARIF upload would need `security-events: write` on a read-only job.
          advanced-security: false
          # Mutually exclusive with advanced-security. Without it findings land only in
          # the raw log with no anchors on the diff.
          annotations: true

      # auto_merge.yml suppresses `bot-conditions`, and that suppression silences the
      # audit for whatever the condition later becomes -- so assert the guards it
      # assumes are still there. Parses the condition rather than grepping: a text
      # match would also accept `user.login` in a comment, or an inverted comparison.
      #
      # `!cancelled()`, not `always()`: a zizmor failure must not skip this, but a
      # cancelled run should. The `${{ }}` wrapper is required -- bare `!` is a YAML tag.
      - name: Assert dependabot auto-merge keeps its author check
        if: ${{ !cancelled() }}
        run: |
          condition=$(yq '.jobs.dependabot.if' .github/workflows/auto_merge.yml) || {
            echo "Could not parse .github/workflows/auto_merge.yml"
            exit 1
          }

          for guard in \
            "github.event.pull_request.user.login == 'dependabot[bot]'" \
            "github.event.pull_request.head.repo.full_name == github.repository"; do
            case "$condition" in
              *"$guard"*) ;;
              *)
                echo "auto_merge.yml lost a required guard on its dependabot job:"
                echo "  ${guard}"
                echo
                echo "Its '# zizmor: ignore[bot-conditions]' comment assumes github.actor"
                echo "is paired with an unspoofable author check. Restore the guard, or"
                echo "delete the ignore comment so zizmor can flag this itself."
                echo
                echo "Background: the High severity bot-conditions finding in #417."
                exit 1
                ;;
            esac
          done

          echo "auto_merge.yml still carries both guards."

  cargo-fmt:
    name: Cargo Format Check
    runs-on: ubuntu-latest
    # Deliberately not `needs: zizmor-security` -- that chain made a network-dependent
    # check the root of every Rust job. Blocking comes from `ci-success` below instead.

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt

      - name: Rustfmt Check
        run: cargo fmt --all --check

  cargo-build:
    name: Cargo Build
    runs-on: ubuntu-latest
    needs: cargo-fmt
    timeout-minutes: 45

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Cargo Build
        run: cargo build --workspace --all-targets --all-features

      - name: Memory-only Build
        run: cargo check --no-default-features --features memory

      - name: Release image feature set
        # The feature set the release image is actually built with. Two gaps make it
        # worth checking on its own. Nothing validates the `ARG FEATURES` string: it is
        # a bare string handed to `cargo build` inside the image build, so a value
        # naming no real feature fails only when someone cuts a release. And
        # `--all-features` above does not stand in for it -- cargo unifies features
        # across the graph, so enabling everything builds `sea-orm` with all three
        # `sqlx` backends where the release set builds it with `sqlx-postgres` alone.
        #
        # Read out of the Dockerfile rather than duplicated, so changing FEATURES there
        # cannot silently stop this from checking what ships.
        run: |
          set -euo pipefail
          features=$(sed -nE 's/^ARG FEATURES="([^"]+)".*/\1/p' Dockerfile)
          if [ -z "${features}" ]; then
            echo "::error::could not read ARG FEATURES from Dockerfile"
            exit 1
          fi
          echo "release image features: ${features}"
          cargo check --workspace --features "${features}"

      - name: Verify domain layer purity
        run: |
          if grep -rn -E "(sea_orm|axum|aws_sdk|reqwest|moka|crate::server|crate::outbound)" src/domain/; then
            echo "ERROR: Infrastructure dependencies or imports found in src/domain/"
            exit 1
          fi

  docker-build:
    name: Docker Build Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker build (production features)
        # No `--build-arg FEATURES`: the Dockerfile's `ARG FEATURES` default already is
        # the release feature set, so passing it here would be a second copy to keep in
        # sync, and a stale one would smoke-test a set the release never builds.
        run: docker build .

  cargo-clippy:
    name: Cargo Clippy Check
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy

      - name: Clippy Check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  cargo-nextest:
    name: Cargo Nextest
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: nextest

      - name: Run Cargo Tests
        run: cargo nextest run --workspace --all-targets --all-features

  cargo-doc:
    name: Cargo Documentation
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Generate Documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  check-crate-type:
    uses: ./.github/workflows/crate_type.yml

  cargo-test-doc:
    needs: check-crate-type
    if: ${{ needs.check-crate-type.outputs.is_lib == 'true' }}
    name: Cargo test doc
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Cargo test doc
        run: cargo test --doc --workspace --all-features

  cargo-machete:
    name: Cargo Machete Check
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install cargo-machete
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete --with-metadata

  cargo-vet:
    name: Vet dependencies
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install cargo-vet
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-vet@0.10.2

      - name: Run cargo-vet
        run: cargo vet --locked

  cargo-deny:
    uses: ./.github/workflows/cargo_deny.yml

  typos-cli:
    name: typos
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Typos
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: typos-cli

      - name: run typos
        run: typos

  tombi-toml-lint:
    name: Tombi TOML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Taplo
        uses: tombi-toml/setup-tombi@f2ae7247d62521245eb2793d653b9df472b9e090 # v1.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate TOML files
        run: tombi lint

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: "**/*.md"

  trivy-config:
    name: Trivy Config Scan (Helm Chart)
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .trivyignore.yaml
        # Before the scan that consumes the file, so a malformed entry fails in seconds
        # as itself rather than later as a scanner error on an unrelated change.
        run: |
          set -eu
          # apt rather than pip: the runner's PyYAML comes from the distribution, so
          # this pulls no unpinned dependency into every pull request.
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check-trivyignore.py .trivyignore.yaml

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build Helm dependencies
        run: |
          # Upstream chart default values:
          # https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-collector/values.yaml
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart

      - name: Render Helm template
        env:
          APP_DATABASE_PORT: "5432"
        run: |
          mkdir -p /tmp/rendered
          helm template status-list-server helm/chart \
            -f helm/chart/values.yaml \
            --set-string statuslist.env.APP_DATABASE__PORT="${APP_DATABASE_PORT}" \
            --output-dir /tmp/rendered

      - name: Verify image reference resolution
        # Rationale and the individual expectations are in the script. It runs here
        # rather than in a workflow of its own because it asserts against a rendered
        # chart, which this job has already built.
        run: bash scripts/verify-image-reference.sh

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore.yaml

  kube-linter:
    name: KubeLinter Scan (Helm Chart)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the SARIF upload below. Note this workflow is also called as a reusable
      # workflow from deploy.yml, and a called workflow can only narrow the caller's
      # token -- so deploy.yml's `ci` job grants the same scope.
      security-events: write

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build Helm dependencies
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart

      - name: Render Helm template
        env:
          APP_DATABASE_PORT: "5432"
        run: |
          mkdir -p /tmp/rendered
          helm template status-list-server helm/chart \
            -f helm/chart/values.yaml \
            --set-string statuslist.env.APP_DATABASE__PORT="${APP_DATABASE_PORT}" \
            --output-dir /tmp/rendered

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: /tmp/rendered
          format: sarif
          config: .kube-linter.yaml
          output-file: kube-linter-results.sarif

      - name: Upload KubeLinter SARIF to code scanning
        # `if: always()` because the SARIF is most worth having in exactly the run
        # where the scan failed -- writing a findings file and then discarding it on
        # the failure path was the original defect. `continue-on-error` because the
        # upload cannot succeed for a pull request from a fork, where write scopes are
        # withheld, and a code-scanning outage should not fail a lint job.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: kube-linter-results.sarif
          category: kube-linter

      - name: Upload KubeLinter SARIF artifact
        # Kept alongside the code-scanning upload rather than instead of it: alerts on
        # a fork pull request go nowhere, and this is the only copy that run keeps.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kube-linter-results
          path: kube-linter-results.sarif
          if-no-files-found: warn

  yaml-lint:
    name: YAML Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: YAML Lint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0

      - name: Run yamlfmt
        run: yamlfmt --lint .

  otel-config-validation:
    name: OpenTelemetry Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose model
        run: docker compose config

      - name: Verify Jaeger image tag exists
        run: docker manifest inspect jaegertracing/jaeger:2.20.0 >/dev/null

      - name: Validate Compose Collector config
        run: |
          docker run --rm \
            -v "$PWD/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config /etc/otelcol/config.yaml

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Build Helm dependencies
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart

      - name: Render Helm chart
        env:
          APP_DATABASE_PORT: "5432"
        run: |
          helm template statuslist helm/chart \
            --namespace statuslist \
            --set-string statuslist.env.APP_DATABASE__PORT="${APP_DATABASE_PORT}" \
            > /tmp/statuslist-rendered.yaml

      - name: Extract rendered Helm Collector config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          rendered = Path("/tmp/statuslist-rendered.yaml")
          for document in yaml.safe_load_all(rendered.read_text()):
              if not isinstance(document, dict):
                  continue
              metadata = document.get("metadata") or {}
              if (
                  document.get("kind") == "ConfigMap"
                  and metadata.get("name", "").endswith("-opentelemetry-collector")
              ):
                  data = document.get("data", {})
                  content = data.get("relay") or data.get("config.yaml")
                  if content:
                      Path("/tmp/helm-otel-collector.yaml").write_text(content)
                      break
          else:
              raise SystemExit("rendered Helm Collector ConfigMap was not found")
          PY

      - name: Validate rendered Helm Collector config
        run: |
          docker run --rm \
            -v "/tmp/helm-otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config /etc/otelcol/config.yaml

  cargo-coverage:
    name: Cargo Coverage (llvm-cov)
    runs-on: ubuntu-latest
    needs: cargo-build
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-llvm-cov@0.6.16,nextest@0.9.101 # or an version that is working now because of our sha pin 

      - name: Generate code coverage
        run: cargo llvm-cov nextest --workspace --all-features --html --output-dir target/llvm-cov/html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error

  # THE SINGLE REQUIRED STATUS CHECK -- set branch protection to require `CI Success`
  # and nothing else here. The jobs above are unchained, so without this a zizmor
  # failure leaves every other check green and the PR mergeable. Gating here rather
  # than on a hand-maintained checks list means a new job cannot escape the gate.
  ci-success:
    name: CI Success
    if: ${{ !cancelled() }}
    needs:
      - zizmor-security
      - cargo-fmt
      - cargo-build
      - docker-build
      - cargo-clippy
      - cargo-nextest
      - cargo-doc
      - check-crate-type
      - cargo-test-doc
      - cargo-machete
      - cargo-vet
      - cargo-deny
      - typos-cli
      - tombi-toml-lint
      - markdown-lint
      - trivy-config
      - kube-linter
      - yaml-lint
      - otel-config-validation
      - cargo-coverage
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Printed so a failure shows which job caused it without expanding the UI.
      - name: Summarise job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS"

      # A GitHub expression, not a shell script parsing `toJSON(needs)` -- no jq, no
      # runner-image dependency. `skipped` is absent on purpose so skipped jobs pass:
      # cargo-test-doc is gated on is_lib, which crate_type.yml derives from
      # `targets[0].kind`, so it can start skipping without anyone touching CI.
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed -- see the results above."
          exit 1
