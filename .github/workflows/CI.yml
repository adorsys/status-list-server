name: "CI"

on:
  merge_group:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - develop
      - main

# A scope added here must also be granted by deploy.yml's `ci` job, which calls this
# workflow: a called workflow can only narrow the caller's token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  zizmor-security:
    name: Zizmor Security Check
    runs-on: ubuntu-latest
    env:
      # The action's `version` defaults to `latest`, so without this an upstream zizmor
      # release turns every PR red. The action's SHA pins the action, not the scanner.
      ZIZMOR_VERSION: "1.28.0"

      # zizmor's exit codes are severity-encoded: 0 no findings, 1 audit error, 2
      # argument error, 3 no inputs collected, then 11/12/13/14 for "findings
      # reported, highest severity is informational/low/medium/high".
      #
      # The self-test accepts the whole 11-14 band rather than one value. This gate is
      # fail-closed at every severity, so any code in the band proves what the
      # self-test claims -- that the gate evaluated the fixture and reported. Pinning
      # a single code would instead pin the fixture's current severity classification:
      # an upstream reclassification, or adding a finding of a different severity to
      # the fixture, would red every PR with nothing actually wrong.
      #
      # Revisit alongside ZIZMOR_VERSION if the exit-code contract changes.
      ZIZMOR_FINDINGS_EXIT_MIN: "11"
      ZIZMOR_FINDINGS_EXIT_MAX: "14"

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail-closed at every severity. To accept a finding use `# zizmor: ignore[rule]`
      # on the line it anchors to; `ignore-start`/`ignore-end` suppress nothing.
      #
      # `online-audits: true` is deliberate and stays on the merge gate. The four
      # online audits -- known-vulnerable-actions, impostor-commit, ref-confusion and
      # typosquat-uses -- are the ones that catch a supply-chain attack on the actions
      # this repository pins by SHA. Offline, a newly disclosed advisory against a
      # pinned action is invisible until someone happens to bump it. That an advisory
      # published upstream reds a PR that changed nothing here is the alarm working,
      # not noise: the workflow really did become vulnerable between the two runs.
      #
      # The cost is that zizmor is `fatal` when an online audit's request fails (see
      # its Troubleshooting docs), so a transient GitHub API error is indistinguishable
      # from a finding at the job level. The retry below covers exactly that case.
      - name: Run Zizmor
        id: zizmor
        # Failure is deferred to the retry, which is the step that gates the job.
        continue-on-error: true
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          # `.` also picks up .github/dependabot.yml.
          inputs: .
          persona: regular
          online-audits: true
          # `annotations` and `advanced-security` are mutually exclusive in this action.
          # A fail-closed gate wants findings on the diff, not in a tab that stays empty.
          advanced-security: false
          annotations: true

      # Only a transient failure is rescued: a real finding is deterministic and fails
      # this run too, so the retry cannot turn a red gate green. Not `continue-on-error`,
      # so this step is the one that fails the job.
      - name: Run Zizmor (retry)
        if: ${{ steps.zizmor.outcome == 'failure' }}
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          inputs: .
          persona: regular
          online-audits: true
          advanced-security: false
          annotations: true

      - name: Assert the gate fails on a known-bad fixture
        if: ${{ !cancelled() }}
        env:
          FIXTURE: scripts/testdata/zizmor-selftest-workflow.yml
          ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.28.0@sha256:8e6b3e4fb74d1aa5d23e83ea369f386c66eced0d1fb944d32cd8b2aac100b00d
        run: |
          set -uo pipefail

          test -f "$FIXTURE" || {
            echo "::error::self-test fixture is missing: ${FIXTURE}"
            exit 1
          }

          rc=0
          out=$(docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            "$ZIZMOR_IMAGE" \
            --persona=regular --no-online-audits --color=never --format=plain \
            -- "$FIXTURE" 2>&1) || rc=$?
          printf '%s\n' "$out"

          # 11-14 is "findings reported", encoded by highest severity -- see the
          # exit-code note on ZIZMOR_FINDINGS_EXIT_MIN above. The band matters rather
          # than the exact value: 0 is a clean fixture, 3 is "no inputs collected" and
          # 1 is any other error, and all three would pass a bare non-zero check.
          if [ "$rc" -lt "$ZIZMOR_FINDINGS_EXIT_MIN" ] || [ "$rc" -gt "$ZIZMOR_FINDINGS_EXIT_MAX" ]; then
            echo "::error::expected a findings exit code (${ZIZMOR_FINDINGS_EXIT_MIN}-${ZIZMOR_FINDINGS_EXIT_MAX}) from the fixture, got ${rc}."
            echo "Do not trust what this job reports above: the gate did not evaluate"
            echo "the fixture, so a clean result for this repository proves nothing."
            exit 1
          fi

          # Every rule the fixture asserts, not just the first: a run that reports one
          # finding and silently stopped raising the other would still exit in-band.
          missing=""
          for rule in artipacked excessive-permissions; do
            [[ "$out" == *"$rule"* ]] || missing="${missing} ${rule}"
          done

          if [ -n "$missing" ]; then
            echo "::error::the gate failed on the fixture but did not report:${missing}"
            echo "The fixture asserts a checkout without persist-credentials: false"
            echo "(artipacked) and a job broadening permissions to write-all"
            echo "(excessive-permissions). A rule that stopped firing would let the"
            echo "corresponding regression through this gate unnoticed."
            exit 1
          fi

          echo "self-test passed: the gate fails, and names every expected finding, on a known-bad workflow."

      - name: Assert every job is gated by ci-success
        # `ci-success.needs` is hand-maintained, so a job missing from it fails without
        # blocking the merge. `docker-build` already did.
        if: ${{ !cancelled() }}
        # `yq` (mikefarah v4) is part of the documented ubuntu-latest image contract,
        # alongside `jq`, so it is not an unstated dependency:
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
        # It is preferred over `jq` here because it reads CI.yml directly; converting
        # YAML to JSON first would need a tool from that same contract anyway.
        run: |
          set -euo pipefail

          yq -r '.jobs | keys | .[] | select(. != "ci-success")' \
            .github/workflows/CI.yml | sort > /tmp/ci-jobs
          yq -r '.jobs.ci-success.needs[]' \
            .github/workflows/CI.yml | sort > /tmp/ci-gated

          missing=$(comm -23 /tmp/ci-jobs /tmp/ci-gated)

          if [ -n "$missing" ]; then
            echo "::error::these CI.yml jobs are not in ci-success.needs, so they do not block merges:"
            printf '  %s\n' $missing
            exit 1
          fi

          echo "every CI.yml job is gated by ci-success."

  cargo-fmt:
    name: Cargo Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
          cache: false

      - name: Rustfmt Check
        run: cargo fmt --all --check

  cargo-build:
    name: Cargo Build
    runs-on: ubuntu-latest
    needs: cargo-fmt
    timeout-minutes: 45

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-shared-key: "workspace"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Cargo Build
        run: cargo build --workspace --all-targets --all-features

      - name: Memory-only Build
        run: cargo check --no-default-features --features memory

      - name: Release image feature set
        # The Dockerfile default is still the local smoke-build feature set.
        # Release variants, including Redis status-cache support, are checked by `release-variant-checks` below.
        #
        # Still read from the Dockerfile rather than restated here, so this check
        # cannot drift from the value it is meant to compile.
        run: |
          set -euo pipefail
          features=$(sed -nE 's/^ARG FEATURES="([^"]+)".*/\1/p' Dockerfile)
          if [ -z "${features}" ]; then
            echo "::error::could not read ARG FEATURES from Dockerfile"
            exit 1
          fi
          echo "release image features: ${features}"
          cargo check --workspace --features "${features}"

      - name: Verify domain layer purity
        run: |
          if grep -rn -E "(sea_orm|axum|aws_sdk|reqwest|moka|crate::server|crate::outbound)" src/domain/; then
            echo "ERROR: Infrastructure dependencies or imports found in src/domain/"
            exit 1
          fi

  release-variant-checks:
    name: Release Variant Check with Redis Status Cache (${{ matrix.variant.suffix }})
    runs-on: ubuntu-latest
    needs: cargo-build
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - suffix: aws
            features: "postgres,aws,redis"
          - suffix: gcp
            features: "postgres,gcp,redis"
          - suffix: azure
            features: "postgres,azure,redis"
          - suffix: vault
            features: "postgres,vault,redis"
          - suffix: fscert
            features: "postgres,redis"

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-shared-key: "workspace"
          cache-save-if: "false"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Cargo check release variant
        run: cargo check --workspace --features "${FEATURES}"
        env:
          FEATURES: ${{ matrix.variant.features }}

  docker-build:
    name: Docker Build Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker build (production features)
        # No FEATURES build-arg: the Dockerfile default is already the release set, and
        # a second copy would drift.
        #
        # No gha cache: Docker layer caching is intentionally disabled to avoid cache
        # bloat. The cargo build cache is shared across jobs; Docker layer caching
        # would add ~2GB per run without significant benefit for this smoke build,
        # evicting the cargo caches the other jobs rely on.
        run: docker build .

  cargo-clippy:
    name: Cargo Clippy Check
    runs-on: ubuntu-latest
    needs:
      - cargo-build
      - release-variant-checks

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          cache-shared-key: "workspace"
          cache-save-if: "false"

      - name: Clippy Check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  cargo-nextest:
    name: Cargo Nextest
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-shared-key: "workspace"
          cache-save-if: "false"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          # Same pin as the coverage job below, so both run the same test harness.
          tool: nextest@0.9.101

      - name: Run Cargo Tests
        run: cargo nextest run --workspace --all-targets --all-features

  cargo-doc:
    name: Cargo Documentation
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-shared-key: "workspace"
          cache-save-if: "false"

      - name: Generate Documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  check-crate-type:
    uses: ./.github/workflows/crate_type.yml

  cargo-test-doc:
    needs:
      - check-crate-type
      - cargo-build
    if: ${{ needs.check-crate-type.outputs.is_lib == 'true' }}
    name: Cargo test doc
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-shared-key: "workspace"
          cache-save-if: "false"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Cargo test doc
        run: cargo test --doc --workspace --all-features

  cargo-machete:
    name: Cargo Machete Check
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-machete@0.9.2

      - name: Check for unused dependencies
        run: cargo machete --with-metadata

  cargo-vet:
    name: Vet dependencies
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Install cargo-vet
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-vet@0.10.2

      - name: Run cargo-vet
        run: cargo vet --locked

  cargo-deny:
    uses: ./.github/workflows/cargo_deny.yml

  typos-cli:
    name: typos
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Typos
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: typos-cli@1.49.0

      - name: run typos
        run: typos

  tombi-toml-lint:
    name: Tombi TOML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Taplo
        uses: tombi-toml/setup-tombi@f2ae7247d62521245eb2793d653b9df472b9e090 # v1.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate TOML files
        run: tombi lint

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: "**/*.md"

  attestation-selftest:
    name: Attestation Verifier Self-Test
    runs-on: ubuntu-latest
    # Its own job rather than a step on helm-checks.yml's trivy-config: that job is a
    # Trivy config scan and this has nothing to do with Trivy, so a failure there would
    # name the wrong thing in the checks list.
    #
    # Runs on every pull request, unlike scripts/gate-selftest.sh, because this needs
    # nothing installed: no network, no registry, no image, and not even a real gh --
    # every case is a stubbed gh on PATH. So drift is caught by whoever changes the
    # verifier, while they are looking at it, rather than on the last step before a
    # production deploy.
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the attestation check can fail
        run: bash scripts/attestation-selftest.sh

  yaml-lint:
    name: YAML Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: YAML Lint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0

      - name: Run yamlfmt
        run: yamlfmt --lint .

  config-guards:
    name: Config Guards (trivyignore + variant parity)
    runs-on: ubuntu-latest

    # Repo-wide guards, not Helm-specific, so they run on every PR.
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .trivyignore.yaml
        # Before the scan that consumes the file, so a malformed entry fails in seconds
        # as itself rather than later as a scanner error on an unrelated change.
        run: |
          set -eu
          # apt rather than pip: the runner's PyYAML comes from the distribution, so
          # this pulls no unpinned dependency into every pull request.
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check-trivyignore.py .trivyignore.yaml

      - name: Assert the image variant lists agree across workflows
        # GitHub does not expose `env` to `strategy.matrix`, so the variant list is
        # restated in deploy.yml's three fan-out matrices and again in the scheduled
        # re-scan. The drift is asymmetric and one half is invisible: a variant added
        # to deploy.yml but not to the re-scan is built, promoted, deployed and never
        # re-scanned, with nothing going red.
        #
        # Checked here rather than only in the nightly so it fails for whoever adds the
        # variant, while they are looking at it, rather than at 03:37 the next night.
        run: python3 scripts/check-variant-parity.py

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose model
        run: docker compose --profile "*" config --quiet

      - name: Validate profiles and application defaults
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          expected = {
              None: {"app"},
              "postgres": {"app", "db"},
              "mysql": {"app", "mysql"},
              "observability": {"app", "otel-collector", "jaeger", "prometheus", "alertmanager", "grafana", "pushgateway"},
              "acme": {"app", "pebble", "challtestsrv"},
              "fscert": {"app", "filesystem-cert"},
              "aws": {"app", "floci"},
              "redis": {"app", "redis"},
          }
          for profile, services in expected.items():
              command = ["docker", "compose"]
              if profile is not None:
                  command.extend(["--profile", profile])
              command.extend(["config", "--services"])
              actual = set(subprocess.check_output(command, text=True).splitlines())
              if actual != services:
                  raise SystemExit(f"{profile or 'default'}: expected {services}, got {actual}")

          for label, compose_args in (
              ("default", []),
              (".env.template", ["--env-file", ".env.template"]),
          ):
              app_config = json.loads(subprocess.check_output(
                  ["docker", "compose", *compose_args, "config", "--format", "json"],
                  text=True,
              ))["services"]["app"]
              environment = app_config["environment"]
              if any(dependency["required"] for dependency in app_config["depends_on"].values()):
                  raise SystemExit(f"{label}: app dependencies must remain optional")
              if app_config["build"]["args"]["FEATURES"] != "memory":
                  raise SystemExit(f"{label}: default app build must support in-memory startup")
              if "APP_DATABASE__BACKEND" in environment:
                  raise SystemExit(f"{label}: compiled features must select the default database backend")
              if environment["APP_TELEMETRY__ENABLED"] != "false":
                  raise SystemExit(f"{label}: telemetry must remain disabled by default")
              if environment["APP_SERVER__ENABLE_METRICS"] != "true":
                  raise SystemExit(f"{label}: the local metrics endpoint must remain enabled")
              if "APP_SERVER__CERT__PROVISIONING_STRATEGY" in environment:
                  raise SystemExit(f"{label}: certificate strategy is compile-time, not runtime")
              if app_config["ports"][0].get("host_ip") != "127.0.0.1":
                  raise SystemExit(f"{label}: the local server port must bind to loopback")

          postgres_config = json.loads(subprocess.check_output(
              ["docker", "compose", "--profile", "postgres", "config", "--format", "json"],
              env={**os.environ, "FEATURES": "postgres"},
              text=True,
          ))
          postgres_app = postgres_config["services"]["app"]
          postgres_environment = postgres_app["environment"]
          if postgres_app["build"]["args"]["FEATURES"] != "postgres":
              raise SystemExit("postgres: app image must compile the postgres feature")
          if "APP_DATABASE__BACKEND" in postgres_environment:
              raise SystemExit("postgres: Compose must not override the feature-selected backend")
          if postgres_environment["APP_DATABASE__HOST"] != "db":
              raise SystemExit("postgres: app must address the Compose PostgreSQL service")

          all_profiles = json.loads(subprocess.check_output(
              ["docker", "compose", "--profile", "*", "config", "--format", "json"],
              text=True,
          ))
          for service_name, service in all_profiles["services"].items():
              for port in service.get("ports", []):
                  if port.get("host_ip") != "127.0.0.1":
                      raise SystemExit(f"{service_name}: published ports must bind to loopback by default")

          remote_profiles = json.loads(subprocess.check_output(
              ["docker", "compose", "--profile", "*", "config", "--format", "json"],
              env={**os.environ, "BIND_ADDR": "0.0.0.0"},
              text=True,
          ))
          for service_name, service in remote_profiles["services"].items():
              for port in service.get("ports", []):
                  if port.get("host_ip") != "0.0.0.0":
                      raise SystemExit(f"{service_name}: BIND_ADDR must override published interfaces")
          PY

      - name: Smoke-test default application startup
        run: |
          set -euo pipefail

          cleanup() {
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT

          wait_until_ready() {
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/health/ready >/dev/null; then
                return 0
              fi
              sleep 2
            done
            docker compose ps
            docker compose logs app
            return 1
          }

          docker compose up -d --build
          wait_until_ready
          docker compose down --volumes --remove-orphans

          docker compose --env-file .env.template up -d
          wait_until_ready

  cargo-coverage:
    name: Cargo Coverage (llvm-cov)
    runs-on: ubuntu-latest
    needs: cargo-build
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: llvm-tools-preview
          cache-shared-key: "coverage"

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          # Both pinned: cargo-llvm-cov and nextest have to agree on the test-runner
          # interface, so they are bumped together rather than floating independently.
          tool: cargo-llvm-cov@0.6.16,nextest@0.9.101

      - name: Generate code coverage
        run: cargo llvm-cov nextest --workspace --all-features --html --output-dir target/llvm-cov/html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error

  local-ci-tests:
    name: Local CI runner tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      - name: Install test prerequisites
        run: |
          sudo apt-get install -y python3-yaml
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
      - name: Test local CI runner
        run: python3 -m unittest discover -s scripts/local-ci/tests -p 'test_*.py'

  # The single required status check. The jobs above form several independent chains
  # rather than one, so no individual job represents the suite. Rollout order:
  # CONTRIBUTING.md, "Branch Protection".
  ci-success:
    name: CI Success
    if: always()
    needs:
      - zizmor-security
      - cargo-fmt
      - cargo-build
      - release-variant-checks
      - docker-build
      - cargo-clippy
      - cargo-nextest
      - cargo-doc
      - check-crate-type
      - cargo-test-doc
      - cargo-machete
      - cargo-vet
      - cargo-deny
      - typos-cli
      - tombi-toml-lint
      - markdown-lint
      - attestation-selftest
      - yaml-lint
      - config-guards
      - compose-validation
      - cargo-coverage
      - local-ci-tests
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Printed so a failure shows which job caused it without expanding the UI.
      - name: Summarise job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS"

      # `if: always()` makes a *skipped* job report neither failure nor cancellation,
      # so the check below would pass it. cargo-test-doc is the one job allowed to
      # skip -- it is gated on check-crate-type's `is_lib` output.
      #
      # This closes the transitive case as well: if check-crate-type were ever itself
      # skipped, its `is_lib` output would be empty, cargo-test-doc's `'' == 'true'`
      # would skip too, and both would have reported a pass. The in-job non-empty
      # assert in crate_type.yml only covers the case where that job runs.
      - name: Fail if a required job was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          skipped=$(printf '%s' "$NEEDS" | jq -r '
            to_entries
            | map(select(.value.result == "skipped" and .key != "cargo-test-doc"))
            | .[].key')

          if [ -n "$skipped" ]; then
            echo "::error::these required jobs were skipped, which ci-success would otherwise report as a pass:"
            printf '  %s\n' $skipped
            echo "A skipped job has not run its checks. Either it must not be conditional,"
            echo "or it belongs in the allowlist in this step alongside cargo-test-doc."
            exit 1
          fi

          echo "no required job was skipped."

      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed -- see the results above."
          exit 1
