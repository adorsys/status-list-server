name: "CI"

on:
  merge_group:
  workflow_dispatch:
  workflow_call:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  zizmor-security:
    name: Zizmor Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zizmor
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: zizmor@1.28.0

      - name: Run Zizmor
        run: zizmor .github/workflows/ || true

  cargo-fmt:
    name: Cargo Format Check
    runs-on: ubuntu-latest
    needs: zizmor-security

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt

      - name: Rustfmt Check
        run: cargo fmt --all --check

  cargo-build:
    name: Cargo Build
    runs-on: ubuntu-latest
    needs: cargo-fmt
    timeout-minutes: 45

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Cargo Build
        run: cargo build --workspace --all-targets --all-features

      - name: Memory-only Build
        run: cargo check --no-default-features --features memory

      - name: Verify domain layer purity
        run: |
          if grep -rn -E "(sea_orm|axum|aws_sdk|redis|reqwest|moka|crate::server|crate::outbound)" src/domain/; then
            echo "ERROR: Infrastructure dependencies or imports found in src/domain/"
            exit 1
          fi

  cargo-clippy:
    name: Cargo Clippy Check
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy

      - name: Clippy Check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  cargo-nextest:
    name: Cargo Nextest
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: nextest

      - name: Run Cargo Tests
        run: cargo nextest run --workspace --all-targets --all-features

  cargo-doc:
    name: Cargo Documentation
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Generate Documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  check-crate-type:
    uses: ./.github/workflows/crate_type.yml

  cargo-test-doc:
    needs: check-crate-type
    if: ${{ needs.check-crate-type.outputs.is_lib == 'true' }}
    name: Cargo test doc
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Cargo test doc
        run: cargo test --doc --workspace --all-features

  cargo-machete:
    name: Cargo Machete Check
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install cargo-machete
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete --with-metadata

  cargo-vet:
    name: Vet dependencies
    runs-on: ubuntu-latest
    needs: cargo-build

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install cargo-vet
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-vet@0.10.2

      - name: Run cargo-vet
        run: cargo vet --locked

  cargo-deny:
    uses: ./.github/workflows/cargo_deny.yml

  typos-cli:
    name: typos
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Typos
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: typos-cli

      - name: run typos
        run: typos

  tombi-toml-lint:
    name: Tombi TOML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Taplo
        uses: tombi-toml/setup-tombi@f2ae7247d62521245eb2793d653b9df472b9e090 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate TOML files
        run: tombi lint

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24
        with:
          globs: "**/*.md"

  trivy-config:
    name: Trivy Config Scan (Helm Chart)
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build Helm dependencies
        run: |
          helm repo add dandydeveloper https://dandydeveloper.github.io/charts
          # Upstream chart default values:
          # https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-collector/values.yaml
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart

      - name: Render Helm templates
        run: |
          mkdir -p /tmp/rendered
          helm template status-list-server helm/chart -f helm/chart/values.yaml --output-dir /tmp/rendered/default
          helm template status-list-server helm/chart --set serviceAccount.create=false --output-dir /tmp/rendered/no-sa
          helm template status-list-server helm/chart --set statuslist.aws.mountCredentials=true --output-dir /tmp/rendered/legacy-creds
          helm template status-list-server helm/chart --set secretStore.provider=vault --output-dir /tmp/rendered/vault
          helm template status-list-server helm/chart --set secretStore.provider=gcp --output-dir /tmp/rendered/gcp
          # Azure Workload Identity: ESO uses its own ServiceAccount, not the app KSA.
          helm template status-list-server helm/chart \
            --set secretStore.provider=azure \
            --set secretStore.azure.authType=WorkloadIdentity \
            --set secretStore.azure.serviceAccountRef.name=eso-controller-sa \
            --output-dir /tmp/rendered/azure
          helm template status-list-server helm/chart \
            --set secretStore.provider=raw \
            --set-string secretStore.raw.provider.webhook.severity=high \
            --output-dir /tmp/rendered/raw
          helm template status-list-server helm/chart \
            --set externalSecret.enabled=false \
            --set statuslist.fallbackSecret.enabled=true \
            --set-string statuslist.fallbackSecret.stringData.postgres-password=x \
            --output-dir /tmp/rendered/fallback
          # Scaling readiness: opt-in HPA + PDB.
          helm template status-list-server helm/chart \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --output-dir /tmp/rendered/scaling

          # Negative render tests: invalid provider and empty raw:{} must fail closed.
          if helm template status-list-server helm/chart --set secretStore.provider=invalid >/dev/null 2>&1; then
            echo "ERROR: provider=invalid should fail"; exit 1
          fi
          if helm template status-list-server helm/chart --set secretStore.provider=raw >/dev/null 2>&1; then
            echo "ERROR: provider=raw with empty secretStore.raw should fail"; exit 1
          fi
          # Contradictory modes: ESO disabled but SecretStore enabled must not render a SecretStore.
          if helm template status-list-server helm/chart \
              --set externalSecret.enabled=false \
              --set secretStore.enabled=true 2>/dev/null | grep -q "kind: SecretStore"; then
            echo "ERROR: no-ESO mode must not render a SecretStore CR"; exit 1
          fi

          # Upgrade render test: legacy secretStore.aws.region must be preserved for APP_AWS__REGION.
          REGION=$(helm template status-list-server helm/chart --set secretStore.aws.region=us-west-2 \
            | grep -A1 'name: APP_AWS__REGION' | grep 'value:' | sed -E 's/.*value: "?([^"]*)"?.*/\1/')
          if [ "$REGION" != "us-west-2" ]; then
            echo "ERROR: APP_AWS__REGION should fall back to legacy secretStore.aws.region, got '$REGION'"; exit 1
          fi
          # Upgrade render test: custom fallback secret name must propagate to the Deployment secretKeyRef.
          if ! helm template status-list-server helm/chart \
              --set externalSecret.enabled=false \
              --set statuslist.fallbackSecret.enabled=true \
              --set statuslist.fallbackSecret.name=mycustomsecret \
              --set-string statuslist.fallbackSecret.stringData.postgres-password=x 2>/dev/null \
              | grep -q 'name: mycustomsecret'; then
            echo "ERROR: custom fallback secret name not propagated"; exit 1
          fi

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore.yaml

  kube-linter:
    name: KubeLinter Scan (Helm Chart)
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build Helm dependencies
        run: |
          helm repo add dandydeveloper https://dandydeveloper.github.io/charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart

      - name: Render Helm templates
        run: |
          mkdir -p /tmp/rendered
          helm template status-list-server helm/chart -f helm/chart/values.yaml --output-dir /tmp/rendered/default
          helm template status-list-server helm/chart --set serviceAccount.create=false --output-dir /tmp/rendered/no-sa
          helm template status-list-server helm/chart --set statuslist.aws.mountCredentials=true --output-dir /tmp/rendered/legacy-creds
          helm template status-list-server helm/chart --set secretStore.provider=vault --output-dir /tmp/rendered/vault
          helm template status-list-server helm/chart --set secretStore.provider=gcp --output-dir /tmp/rendered/gcp
          # Azure Workload Identity: ESO uses its own ServiceAccount, not the app KSA.
          helm template status-list-server helm/chart \
            --set secretStore.provider=azure \
            --set secretStore.azure.authType=WorkloadIdentity \
            --set secretStore.azure.serviceAccountRef.name=eso-controller-sa \
            --output-dir /tmp/rendered/azure
          helm template status-list-server helm/chart \
            --set secretStore.provider=raw \
            --set-string secretStore.raw.provider.webhook.severity=high \
            --output-dir /tmp/rendered/raw
          helm template status-list-server helm/chart \
            --set externalSecret.enabled=false \
            --set statuslist.fallbackSecret.enabled=true \
            --set-string statuslist.fallbackSecret.stringData.postgres-password=x \
            --output-dir /tmp/rendered/fallback
          # Scaling readiness: opt-in HPA + PDB.
          helm template status-list-server helm/chart \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --output-dir /tmp/rendered/scaling

          # Negative render tests: invalid provider and empty raw:{} must fail closed.
          if helm template status-list-server helm/chart --set secretStore.provider=invalid >/dev/null 2>&1; then
            echo "ERROR: provider=invalid should fail"; exit 1
          fi
          if helm template status-list-server helm/chart --set secretStore.provider=raw >/dev/null 2>&1; then
            echo "ERROR: provider=raw with empty secretStore.raw should fail"; exit 1
          fi
          # Contradictory modes: ESO disabled but SecretStore enabled must not render a SecretStore.
          if helm template status-list-server helm/chart \
              --set externalSecret.enabled=false \
              --set secretStore.enabled=true 2>/dev/null | grep -q "kind: SecretStore"; then
            echo "ERROR: no-ESO mode must not render a SecretStore CR"; exit 1
          fi

          # Upgrade render test: legacy secretStore.aws.region must be preserved for APP_AWS__REGION.
          REGION=$(helm template status-list-server helm/chart --set secretStore.aws.region=us-west-2 \
            | grep -A1 'name: APP_AWS__REGION' | grep 'value:' | sed -E 's/.*value: "?([^"]*)"?.*/\1/')
          if [ "$REGION" != "us-west-2" ]; then
            echo "ERROR: APP_AWS__REGION should fall back to legacy secretStore.aws.region, got '$REGION'"; exit 1
          fi
          # Upgrade render test: custom fallback secret name must propagate to the Deployment secretKeyRef.
          if ! helm template status-list-server helm/chart \
              --set externalSecret.enabled=false \
              --set statuslist.fallbackSecret.enabled=true \
              --set statuslist.fallbackSecret.name=mycustomsecret \
              --set-string statuslist.fallbackSecret.stringData.postgres-password=x 2>/dev/null \
              | grep -q 'name: mycustomsecret'; then
            echo "ERROR: custom fallback secret name not propagated"; exit 1
          fi

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: /tmp/rendered
          format: sarif
          config: .kube-linter.yaml
          output-file: kube-linter-results.sarif

  yaml-lint:
    name: YAML Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: YAML Lint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0

      - name: Run yamlfmt
        run: yamlfmt --lint .

  otel-config-validation:
    name: OpenTelemetry Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose model
        run: docker compose config

      - name: Verify Jaeger image tag exists
        run: docker manifest inspect jaegertracing/jaeger:2.20.0 >/dev/null

      - name: Validate Compose Collector config
        run: |
          docker run --rm \
            -v "$PWD/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config /etc/otelcol/config.yaml

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Build Helm dependencies
        run: |
          helm repo add dandydeveloper https://dandydeveloper.github.io/charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helm/chart

      - name: Render Helm chart
        run: helm template statuslist helm/chart --namespace statuslist > /tmp/statuslist-rendered.yaml

      - name: Extract rendered Helm Collector config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          rendered = Path("/tmp/statuslist-rendered.yaml")
          for document in yaml.safe_load_all(rendered.read_text()):
              if not isinstance(document, dict):
                  continue
              metadata = document.get("metadata") or {}
              if (
                  document.get("kind") == "ConfigMap"
                  and metadata.get("name", "").endswith("-opentelemetry-collector")
              ):
                  data = document.get("data", {})
                  content = data.get("relay") or data.get("config.yaml")
                  if content:
                      Path("/tmp/helm-otel-collector.yaml").write_text(content)
                      break
          else:
              raise SystemExit("rendered Helm Collector ConfigMap was not found")
          PY

      - name: Validate rendered Helm Collector config
        run: |
          docker run --rm \
            -v "/tmp/helm-otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.158.0 \
            validate --config /etc/otelcol/config.yaml

  cargo-coverage:
    name: Cargo Coverage (llvm-cov)
    runs-on: ubuntu-latest
    needs: cargo-build
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-llvm-cov@0.6.16,nextest@0.9.101 # or an version that is working now because of our sha pin 

      - name: Generate code coverage
        run: cargo llvm-cov nextest --workspace --all-features --html --output-dir target/llvm-cov/html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error
