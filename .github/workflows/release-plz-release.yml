name: Release-plz release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Release-plz release
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'adorsys/status-list-server' }}
    steps:
      # Without permission-* inputs the token gets every scope the App has.
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          rustflags: ''
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          # App token: tags pushed with GITHUB_TOKEN don't trigger deploy.yml.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
