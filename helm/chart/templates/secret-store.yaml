{{- if .Values.secretStore.enabled }}
{{- $provider := required "secretStore.provider is required when secretStore.enabled is true" .Values.secretStore.provider }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.spec.secretStoreRef.name }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
  {{- if eq $provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ required "secretStore.aws.region is required when provider is 'aws'" .Values.secretStore.aws.region }}
  {{- else if eq $provider "gcpsm" }}
    gcpsm:
      projectID: {{ required "secretStore.gcpsm.projectID is required when provider is 'gcpsm'" .Values.secretStore.gcpsm.projectID }}
  {{- else if eq $provider "azurekv" }}
    azurekv:
      tenantId: {{ required "secretStore.azurekv.tenantId is required when provider is 'azurekv'" .Values.secretStore.azurekv.tenantId }}
      vaultUrl: {{ required "secretStore.azurekv.vaultUrl is required when provider is 'azurekv'" .Values.secretStore.azurekv.vaultUrl }}
      authType: {{ .Values.secretStore.azurekv.authType | default "ManagedIdentity" | quote }}
  {{- else }}
    {{- fail (printf "unsupported secretStore.provider %q (supported: aws, gcpsm, azurekv)" $provider) }}
  {{- end }}
{{- end }}
