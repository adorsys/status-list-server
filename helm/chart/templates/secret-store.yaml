{{- if .Values.statuslist.enabled }}
{{- /*
  The SecretStore is an External Secrets Operator CR. Render it only when ESO is
  actually in use (externalSecret.enabled). In the fallback (no-ESO) mode this CR
  must not be emitted or a cluster without ESO CRDs would reject the release.
*/}}
{{- if and .Values.externalSecret.enabled .Values.secretStore.enabled }}
{{- $supported := list "aws" "vault" "gcp" "azure" "raw" }}
{{- if not (has .Values.secretStore.provider $supported) }}
{{- fail (printf "secretStore.provider '%v' is not supported. Supported providers: aws, vault, gcp, azure, raw" .Values.secretStore.provider) }}
{{- end }}
{{- if eq .Values.secretStore.provider "raw" }}
{{- if empty .Values.secretStore.raw }}
{{- fail "secretStore.provider is 'raw' but secretStore.raw is empty. Provide the concrete ESO provider body under secretStore.raw (rendered directly under spec.provider), e.g. secretStore.raw: { webhook: { url: '...' } }. 'raw: {}' is rejected to avoid silently emitting an empty/insecure SecretStore." }}
{{- end }}
{{- end }}
{{- if and .Values.secretStore.enabled (eq .Values.secretStore.provider "vault") (empty .Values.secretStore.vault.server) }}
{{- fail "secretStore.provider is 'vault' but secretStore.vault.server is empty. Provide the Vault/OpenBao server URL." }}
{{- end }}
{{- if and .Values.secretStore.enabled (eq .Values.secretStore.provider "gcp") (empty .Values.secretStore.gcp.projectID) }}
{{- fail "secretStore.provider is 'gcp' but secretStore.gcp.projectID is empty. Provide the Google Cloud project ID." }}
{{- end }}
{{- if and .Values.secretStore.enabled (eq .Values.secretStore.provider "azure") }}
{{- if empty .Values.secretStore.azure.vaultUrl }}
{{- fail "secretStore.provider is 'azure' but secretStore.azure.vaultUrl is empty. Provide the Azure Key Vault URL." }}
{{- end }}
{{- $azureAuthTypes := list "ServicePrincipal" "ManagedIdentity" "WorkloadIdentity" }}
{{- if and .Values.secretStore.azure.authType (not (has .Values.secretStore.azure.authType $azureAuthTypes)) }}
{{- fail (printf "secretStore.azure.authType '%v' is not supported. Valid authTypes: ServicePrincipal, ManagedIdentity, WorkloadIdentity" .Values.secretStore.azure.authType) }}
{{- end }}
{{- if eq .Values.secretStore.azure.authType "WorkloadIdentity" }}
{{- if empty .Values.secretStore.azure.serviceAccountRef.name }}
{{- fail "secretStore.azure.authType is 'WorkloadIdentity' but secretStore.azure.serviceAccountRef.name is empty. Provide the ServiceAccount bound to the External Secrets Operator identity." }}
{{- end }}
{{- else }}
{{- if empty .Values.secretStore.azure.tenantId }}
{{- fail "secretStore.provider is 'azure' but secretStore.azure.tenantId is empty. Provide the Azure tenant ID." }}
{{- end }}
{{- if and (empty .Values.secretStore.azure.authSecretRef) (empty .Values.secretStore.azure.identityId) }}
{{- fail "secretStore.provider is 'azure' but no identity configuration is set. Set secretStore.azure.authType (ServicePrincipal | ManagedIdentity | WorkloadIdentity) together with the matching authSecretRef / identityId fields." }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.spec.secretStoreRef.name }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
  {{- if eq .Values.secretStore.provider "aws" }}
    aws:
      service: {{ .Values.secretStore.aws.service | default "SecretsManager" }}
      # The ESO AWS SecretStore needs an explicit region (ESO does not read the pod's
      # instance metadata). Prefer secretStore.aws.region, then statuslist.aws.region;
      # the final eu-central-1 only satisfies the SecretStore CR and is NOT injected into
      # the pod (APP_AWS__REGION stays opt-in for pure-IRSA / Workload Identity installs).
      region: {{ .Values.secretStore.aws.region | default (include "status-list-server-chart.appRegion" .) | default "eu-central-1" }}
  {{- else if eq .Values.secretStore.provider "vault" }}
    vault:
      server: {{ .Values.secretStore.vault.server | quote }}
      path: {{ .Values.secretStore.vault.path | default "secret" | quote }}
      {{- with .Values.secretStore.vault.auth }}
      auth:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- else if eq .Values.secretStore.provider "gcp" }}
    gcpsm:
      projectID: {{ .Values.secretStore.gcp.projectID | quote }}
      {{- with .Values.secretStore.gcp.auth }}
      auth:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- else if eq .Values.secretStore.provider "azure" }}
    azurekv:
      vaultUrl: {{ .Values.secretStore.azure.vaultUrl | quote }}
      {{- if .Values.secretStore.azure.tenantId }}
      tenantId: {{ .Values.secretStore.azure.tenantId | quote }}
      {{- end }}
      {{- if .Values.secretStore.azure.authType }}
      authType: {{ .Values.secretStore.azure.authType | quote }}
      {{- end }}
      {{- if .Values.secretStore.azure.environmentType }}
      environmentType: {{ .Values.secretStore.azure.environmentType | quote }}
      {{- end }}
      {{- with .Values.secretStore.azure.identityId }}
      identityId: {{ . | quote }}
      {{- end }}
      {{- if .Values.secretStore.azure.serviceAccountRef.name }}
      # serviceAccountRef should reference the External Secrets Operator controller's own
      # ServiceAccount (least privilege), not the application ServiceAccount. Set
      # .namespace only when ESO is deployed in a different namespace than this release;
      # leaving it empty bounds the reference to this release namespace.
      serviceAccountRef:
        name: {{ .Values.secretStore.azure.serviceAccountRef.name | quote }}
        {{- if .Values.secretStore.azure.serviceAccountRef.namespace }}
        namespace: {{ .Values.secretStore.azure.serviceAccountRef.namespace | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.secretStore.azure.authSecretRef }}
      authSecretRef:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- else if eq .Values.secretStore.provider "raw" }}
    {{- toYaml .Values.secretStore.raw | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
