{{- if and .Values.otelCollector.enabled .Values.otelCollector.standalone.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-otel-collector
  labels:
    {{- include "status-list-server-chart.otelCollectorLabels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.otelCollector.standalone.replicaCount }}
  selector:
    matchLabels:
      {{- include "status-list-server-chart.otelCollectorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "status-list-server-chart.otelCollectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: {{ .Values.otelCollector.standalone.image.repository }}:{{ .Values.otelCollector.standalone.image.tag }}
          args: ["--config", "/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8889
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          {{- with .Values.otelCollector.standalone.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "status-list-server-chart.fullname" . }}-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-otel-collector
  labels:
    {{- include "status-list-server-chart.otelCollectorLabels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.otelCollector.standalone.service.type }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.otelCollector.standalone.service.grpcPort }}
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.otelCollector.standalone.service.httpPort }}
      targetPort: 4318
      protocol: TCP
    - name: metrics
      port: 8889
      targetPort: 8889
      protocol: TCP
  selector:
    {{- include "status-list-server-chart.otelCollectorSelectorLabels" . | nindent 4 }}
{{- end }}
