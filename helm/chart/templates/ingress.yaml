{{- if .Values.statuslist.ingress.enabled }}
{{- $host := .Values.statuslist.ingress.externalDnsHostname | default .Values.global.domain }}
{{- $tlsHosts := .Values.statuslist.ingress.tls.hosts }}
{{- /* When no explicit TLS hosts are given, derive a single host from the
       actual rendered ingress host so the certificate always matches the
       host that is served, instead of silently using a different domain. */}}
{{- if and (not $tlsHosts) $host (ne $host "localhost") }}
  {{- $tlsHosts = list $host }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-ingress
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if $host }}
    external-dns.alpha.kubernetes.io/hostname: {{ $host }}
    {{- end }}
    {{- if .Values.statuslist.ingress.annotations }}
    {{- toYaml .Values.statuslist.ingress.annotations | nindent 4 }}
    {{- end }}

spec:
  ingressClassName: nginx
  rules:
  {{- if $host }}
  - host: {{ $host }}
  {{- else }}
  - host: localhost
  {{- end }}
    http:
      paths:
      - path: {{ .Values.statuslist.ingress.path }}
        pathType: {{ .Values.statuslist.ingress.pathType }}
        backend:
          service:
            name: {{ include "status-list-server-chart.fullname" . }}-service
            port:
              number: {{ .Values.statuslist.service.port }}
  {{- if and .Values.statuslist.ingress.tls.secretName $tlsHosts }}
  tls:
  - hosts:
    {{- range $tlsHosts }}
    - {{ . | quote }}
    {{- end }}
    secretName: {{ .Values.statuslist.ingress.tls.secretName }}
  {{- end }}
{{- end }}
