{{- if .Values.statuslist.ingress.enabled }}
{{- $globalDomain := trimSuffix "." (dig "domain" "" (.Values.global | default dict) | default "" | lower) }}
{{- $ingressHost := .Values.statuslist.ingress.externalDnsHostname | default "" | lower }}
{{- if and (eq $ingressHost "") $globalDomain }}
{{- $ingressHost = printf "statuslist.%s" $globalDomain }}
{{- end }}
{{- if eq $ingressHost "" }}
{{- $ingressHost = "localhost" }}
{{- end }}
{{- $tlsHosts := list }}
{{- range (.Values.statuslist.ingress.tls.hosts | default list) }}
{{- $tlsHosts = append $tlsHosts (. | lower) }}
{{- end }}
{{- if and (eq (len $tlsHosts) 0) $globalDomain }}
{{- $tlsHosts = list (printf "*.%s" $globalDomain) }}
{{- else if and (eq (len $tlsHosts) 0) (ne $ingressHost "localhost") }}
{{- $tlsHosts = list $ingressHost }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-ingress
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if ne $ingressHost "localhost" }}
    external-dns.alpha.kubernetes.io/hostname: {{ $ingressHost }}
    {{- end }}
    {{- if .Values.statuslist.ingress.annotations }}
    {{- toYaml .Values.statuslist.ingress.annotations | nindent 4 }}
    {{- end }}

spec:
  ingressClassName: nginx
  rules:
  - host: {{ $ingressHost }}
    http:
      paths:
      - path: {{ .Values.statuslist.ingress.path }}
        pathType: {{ .Values.statuslist.ingress.pathType }}
        backend:
          service:
            name: {{ include "status-list-server-chart.fullname" . }}-service
            port:
              number: {{ .Values.statuslist.service.port }}
  {{- if and .Values.statuslist.ingress.tls.secretName (gt (len $tlsHosts) 0) }}
  tls:
  - hosts:
    {{- range $tlsHosts }}
    - {{ . | quote }}
    {{- end }}
    secretName: {{ .Values.statuslist.ingress.tls.secretName }}
  {{- end }}
{{- end }}
