{{- $platform := .Values.alerting.platform | default "" }}
{{- if and .Values.alerting.enabled (empty .Values.alerting.existingSecret) }}
{{- $validPlatforms := list "slack" "discord" "teams" "mattermost" "email" "webhook" }}
{{- if not (has $platform $validPlatforms) }}
  {{- fail (printf "alerting.platform %q is not supported. Must be one of: slack, discord, teams, mattermost, email, webhook" $platform) }}
{{- end }}
{{- /* Validate that the required credential is set for the chosen platform */ -}}
{{- if and (ne $platform "email") (empty .Values.alerting.webhookUrl) }}
  {{- fail (printf "alerting.webhookUrl is required when alerting.platform=%q" $platform) }}
{{- end }}
{{- if eq $platform "email" }}
  {{- if empty .Values.alerting.email.to }}
    {{- fail "alerting.email.to is required when alerting.platform=email" }}
  {{- end }}
  {{- if empty .Values.alerting.email.smtpHost }}
    {{- fail "alerting.email.smtpHost is required when alerting.platform=email" }}
  {{- end }}
  {{- if empty .Values.alerting.email.smtpFrom }}
    {{- fail "alerting.email.smtpFrom is required when alerting.platform=email" }}
  {{- end }}
{{- end }}
{{- /* Render the chart-managed Secret only when there is at least one credential key to store.
     Email to/from/smarthost are plain CRD strings (not in the Secret); with no smtpPassword and
     no dmsWebhookUrl the Secret would have an empty stringData, so it is skipped. */ -}}
{{- $hasSecretData := or (ne $platform "email") .Values.alerting.dmsWebhookUrl (and (eq $platform "email") .Values.alerting.email.smtpPassword) }}
{{- if $hasSecretData }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-alerting
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerting
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if ne $platform "email" }}
  webhook-url: {{ .Values.alerting.webhookUrl | quote }}
  {{- end }}
  {{- if .Values.alerting.dmsWebhookUrl }}
  dms-webhook-url: {{ .Values.alerting.dmsWebhookUrl | quote }}
  {{- end }}
  {{- if eq $platform "email" }}
  # Email to/from/smarthost are rendered as plain CRD strings and do NOT live in the Secret.
  # Only the optional SMTP AUTH password is stored here and referenced via authPassword.
  {{- if .Values.alerting.email.smtpPassword }}
  smtp-password: {{ .Values.alerting.email.smtpPassword | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}