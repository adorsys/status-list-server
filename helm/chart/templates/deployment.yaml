{{- if .Values.statuslist.enabled }}
{{- $redisHA := index .Values "redis-ha" | default dict -}}
{{- $redisHAEnabled := eq (default false (index $redisHA "enabled")) true -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-deployment
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.statuslist.replicaCount }}
  selector:
    matchLabels:
      {{- include "status-list-server-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.statuslist.service.targetPort | quote }}
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "status-list-server-chart.labels" . | nindent 8 }}
    spec:
      {{- with .Values.statuslist.initContainers }}
      initContainers:
        {{- range $ic := . }}
        {{- $hardened := dict
              "securityContext" (dict
                "readOnlyRootFilesystem" true
                "allowPrivilegeEscalation" false
                "capabilities" (dict "drop" (list "ALL")))
              "resources" (dict
                "requests" (dict "cpu" "50m" "memory" "64Mi")
                "limits" (dict "cpu" "100m" "memory" "128Mi"))
              "volumeMounts" (list (dict "name" "tmp" "mountPath" "/tmp")) }}
        - {{- tpl (toYaml (mustMergeOverwrite $ic $hardened)) $ | nindent 10 }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "status-list-server-chart.name" . }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: {{ .Values.statuslist.image.repository }}:{{ .Values.statuslist.image.tag }}
          imagePullPolicy: {{ .Values.statuslist.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.statuslist.service.targetPort | int }}
              protocol: TCP
          {{- with .Values.statuslist.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.statuslist.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.statuslist.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- $env := dict }}
            {{- range $name, $value := .Values.statuslist.env }}
            {{- $_ := set $env $name $value }}
            {{- end }}
            {{- if not (hasKey $env "APP_SERVER__DOMAIN") }}
              {{- if .Values.statuslist.ingress.externalDnsHostname }}
                {{- $_ := set $env "APP_SERVER__DOMAIN" .Values.statuslist.ingress.externalDnsHostname }}
              {{- else }}
                {{- $_ := set $env "APP_SERVER__DOMAIN" "localhost" }}
              {{- end }}
            {{- end }}
            {{- $otel := index .Values "opentelemetry-collector" | default dict }}
            {{- if $otel.enabled }}
              {{- if not (hasKey $env "APP_TELEMETRY__ENABLED") }}
                {{- $_ := set $env "APP_TELEMETRY__ENABLED" "true" }}
              {{- end }}
              {{- if not (hasKey $env "APP_TELEMETRY__OTLP_ENDPOINT") }}
                {{- $otlpPort := dig "ports" "otlp" "servicePort" 4317 $otel }}
                {{- /* Mirror the upstream opentelemetry-collector.fullname helper exactly:        */}}
                {{- /* 1. fullnameOverride → use as-is (trunc 63)                                */}}
                {{- /* 2. else: effectiveName = nameOverride ?? chart name                        */}}
                {{- /*    if release.contains(effectiveName) → use release (trunc 63)            */}}
                {{- /*    else → "$release-$effectiveName" (trunc 63)                            */}}
                {{- $collectorSvcName := "" }}
                {{- if $otel.fullnameOverride }}
                  {{- $collectorSvcName = $otel.fullnameOverride | trunc 63 | trimSuffix "-" }}
                {{- else }}
                  {{- $effectiveName := $otel.nameOverride | default "opentelemetry-collector" }}
                  {{- if contains $effectiveName .Release.Name }}
                    {{- $collectorSvcName = .Release.Name | trunc 63 | trimSuffix "-" }}
                  {{- else }}
                    {{- $collectorSvcName = printf "%s-%s" .Release.Name $effectiveName | trunc 63 | trimSuffix "-" }}
                  {{- end }}
                {{- end }}
                {{- $_ := set $env "APP_TELEMETRY__OTLP_ENDPOINT" (printf "http://%s.%s.svc.cluster.local:%d" $collectorSvcName .Release.Namespace ($otlpPort | int)) }}
              {{- end }}
            {{- else }}
              {{- if not (hasKey $env "APP_TELEMETRY__ENABLED") }}
                {{- $_ := set $env "APP_TELEMETRY__ENABLED" "false" }}
              {{- end }}
            {{- end }}
            {{- range $name, $value := $env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.externalSecret.enabled }}{{ .Values.externalSecret.spec.target.name }}{{ else }}statuslist-secret{{ end }}
                  key: postgres-password
            {{- if .Values.secretStore.enabled }}
            - name: APP_AWS__REGION
              value: {{ .Values.secretStore.aws.region | quote }}
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /home/nobody/.aws/credentials
            - name: AWS_CONFIG_FILE
              value: /home/nobody/.aws/config
            {{- end }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: APP_DATABASE__URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/$(POSTGRES_DB)"
            {{- if $redisHAEnabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.externalSecret.enabled }}{{ .Values.externalSecret.spec.target.name }}{{ else }}statuslist-secret{{ end }}
                  key: redis-password
            - name: APP_REDIS__URI
              value: {{ include "status-list-server-chart.redisUri" . | quote }}
            {{- end }}
            {{- if .Values.statuslist.s3CompatibleCredentials.enabled }}
            - name: APP_S3_COMPATIBLE__ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.statuslist.s3CompatibleCredentials.existingSecret | quote }}
                  key: {{ .Values.statuslist.s3CompatibleCredentials.accessKeyIdKey | quote }}
            - name: APP_S3_COMPATIBLE__SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.statuslist.s3CompatibleCredentials.existingSecret | quote }}
                  key: {{ .Values.statuslist.s3CompatibleCredentials.secretAccessKeyKey | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if .Values.secretStore.enabled }}
            - name: aws-credentials-volume
              mountPath: /home/nobody/.aws
              readOnly: true
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if .Values.secretStore.enabled }}
        - name: aws-credentials-volume
          secret:
            secretName: aws-credentials-secret
      {{- end }}
{{- end }}
