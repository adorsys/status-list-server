{{- if and .Values.statuslist.enabled .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: status-list-server-sli
      rules:
        - record: sli:request_latency:p95:5m
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m])) by (namespace, le))
        - record: sli:request_latency:p95:1h
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[1h])) by (namespace, le))
        - record: sli:request_latency:p95:30m
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30m])) by (namespace, le))
        - record: sli:request_latency:p95:6h
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[6h])) by (namespace, le))
        - record: sli:error_rate:5m
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}",status_class="5xx"}[5m])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m]))
        - record: sli:error_rate:1h
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}",status_class="5xx"}[1h])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[1h]))
        - record: sli:error_rate:30m
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}",status_class="5xx"}[30m])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30m]))
        - record: sli:error_rate:6h
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}",status_class="5xx"}[6h])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[6h]))
        - record: sli:error_rate:30d
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}",status_class="5xx"}[30d])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30d]))
        - record: sli:db_query_latency:p95:5m
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m])) by (namespace, le))
        - record: sli:db_query_latency:p95:1h
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[1h])) by (namespace, le))
        - record: sli:db_query_latency:p95:30m
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30m])) by (namespace, le))
        - record: sli:db_query_latency:p95:6h
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[6h])) by (namespace, le))
        - record: sli:cache_hit_ratio:5m
          expr: sum by (namespace)(rate(status_list_cache_hits_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m])) / (sum by (namespace)(rate(status_list_cache_hits_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m])) + sum by (namespace)(rate(status_list_cache_misses_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m])))
        - record: sli:cache_hit_ratio:7d
          expr: sum by (namespace)(rate(status_list_cache_hits_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[7d])) / (sum by (namespace)(rate(status_list_cache_hits_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[7d])) + sum by (namespace)(rate(status_list_cache_misses_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[7d])))
        - record: sli:cert_renewal_failure_rate:5m
          expr: sum by (namespace)(rate(cert_renewal_failures_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m])) / sum by (namespace)(rate(cert_renewal_attempts_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m]))
        - record: sli:cert_renewal_failure_rate:7d
          expr: sum by (namespace)(rate(cert_renewal_failures_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[7d])) / sum by (namespace)(rate(cert_renewal_attempts_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[7d]))
        - record: sli:cert_renewal_failure_rate:30d
          expr: sum by (namespace)(rate(cert_renewal_failures_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30d])) / sum by (namespace)(rate(cert_renewal_attempts_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30d]))
        - record: sli:token_gen_failure_rate:5m
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[5m]))
        - record: sli:token_gen_failure_rate:1h
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[1h])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[1h]))
        - record: sli:token_gen_failure_rate:30m
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30m])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30m]))
        - record: sli:token_gen_failure_rate:6h
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[6h])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[6h]))
        - record: sli:token_gen_failure_rate:30d
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30d])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"}[30d]))
        - record: sli:token_gen_error_budget:30d
          expr: clamp_max(clamp_min(1 - sli:token_gen_failure_rate:30d{namespace="{{ .Release.Namespace }}"} / {{ .Values.slo.errorRateTarget }}, 0), 1)
        - record: sli:error_budget:success:30d
          expr: clamp_max(clamp_min(1 - sli:error_rate:30d{namespace="{{ .Release.Namespace }}"} / {{ .Values.slo.errorRateTarget }}, 0), 1)

    - name: status-list-server-slo-alerts
      rules:
        - alert: Watchdog
          expr: vector(1)
          labels:
            severity: none
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
          annotations:
            summary: "Prometheus alerting pipeline is healthy (Watchdog)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/README.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: StatusListMetricsAbsent
          # Alert on the scrape-generated `up` series, not the request histogram:
          # /metrics and health routes are excluded from the HTTP metrics
          # middleware, so a healthy but idle deployment never produces the
          # histogram and a histogram-based absence check pages falsely. The `up`
          # series is created by the ServiceMonitor scrape itself, so
          # `max(up) == 0` catches a target that is present but failing scrapes
          # while `absent(up)` catches a target that is gone entirely. The
          # `service` label matches the rendered Service the ServiceMonitor
          # selects (the chart fullname followed by `-service`).
          expr: absent(up{namespace="{{ .Release.Namespace }}",service="{{ include "status-list-server-chart.fullname" . }}-service"}) or max by (namespace, service)(up{namespace="{{ .Release.Namespace }}",service="{{ include "status-list-server-chart.fullname" . }}-service"}) == 0
          for: 5m
          labels:
            severity: page
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
          annotations:
            summary: "status-list-server metrics absent for 5m (target down or not scraped)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: Status List /metrics target is unreachable or absent (up == 0 or no up series for 5m)'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/README.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: RequestLatencyFastBurn
          expr: sli:request_latency:p95:1h{namespace="{{ .Release.Namespace }}"} > {{ .Values.slo.requestLatencyP95 }} and sli:request_latency:p95:5m{namespace="{{ .Release.Namespace }}"} > {{ .Values.slo.requestLatencyP95 }}
          for: 5m
          labels:
            severity: page
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: request_latency
          annotations:
            summary: "Request latency P95 sustainably above 300ms (>300ms on the 1h window)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: request latency P95 is {{ `{{ humanize $value }}` }}s on the 1h window (threshold {{ mulf .Values.slo.requestLatencyP95 1000 }}ms)'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/request-latency.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: RequestLatencySlowBurn
          expr: sli:request_latency:p95:6h{namespace="{{ .Release.Namespace }}"} > {{ .Values.slo.requestLatencyP95 }} and sli:request_latency:p95:30m{namespace="{{ .Release.Namespace }}"} > {{ .Values.slo.requestLatencyP95 }}
          for: 30m
          labels:
            severity: warn
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: request_latency
          annotations:
            summary: "Request latency P95 sustained above 300ms on the 6h window"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: request latency P95 is {{ `{{ humanize $value }}` }}s on the 6h window (threshold {{ mulf .Values.slo.requestLatencyP95 1000 }}ms)'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/request-latency.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: ErrorRateFastBurn
          expr: sli:error_rate:1h{namespace="{{ .Release.Namespace }}"} >= {{ mulf .Values.slo.errorRateTarget .Values.slo.fastBurnMultiplier | printf "%.3f" }} and sli:error_rate:5m{namespace="{{ .Release.Namespace }}"} >= {{ mulf .Values.slo.errorRateTarget .Values.slo.fastBurnMultiplier | printf "%.3f" }}
          for: 5m
          labels:
            severity: page
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: error_rate
          annotations:
            summary: "5xx error rate burning the error budget fast (>=14.4x over 0.5% budget on the 1h window)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: 1h error rate is {{ `{{ humanizePercentage $value }}` }} (>=14.4x budget)'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-rate.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: ErrorRateSlowBurn
          expr: sli:error_rate:6h{namespace="{{ .Release.Namespace }}"} >= {{ mulf .Values.slo.errorRateTarget .Values.slo.slowBurnMultiplier | printf "%.3f" }} and sli:error_rate:30m{namespace="{{ .Release.Namespace }}"} >= {{ mulf .Values.slo.errorRateTarget .Values.slo.slowBurnMultiplier | printf "%.3f" }}
          for: 30m
          labels:
            severity: warn
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: error_rate
          annotations:
            summary: "5xx error rate burning the error budget slowly (>=6x over 0.5% budget on the 6h window)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: 6h error rate is {{ `{{ humanizePercentage $value }}` }} (>=6x budget)'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-rate.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: DbLatencyFastBurn
          expr: sli:db_query_latency:p95:1h{namespace="{{ .Release.Namespace }}"} > {{ .Values.slo.dbLatencyP95 }} and sli:db_query_latency:p95:5m{namespace="{{ .Release.Namespace }}"} > {{ .Values.slo.dbLatencyP95 }}
          for: 5m
          labels:
            severity: page
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: db_latency
          annotations:
            summary: "DB query latency P95 sustainably above 50ms (>50ms on the 1h window)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: DB query latency P95 is {{ `{{ humanize $value }}` }}s on the 1h window (threshold {{ mulf .Values.slo.dbLatencyP95 1000 }}ms)'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/db-latency.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: DbLatencySlowBurn
          expr: sli:db_query_latency:p95:6h{namespace="{{ .Release.Namespace }}"} > {{ .Values.slo.dbLatencyP95 }} and sli:db_query_latency:p95:30m{namespace="{{ .Release.Namespace }}"} > {{ .Values.slo.dbLatencyP95 }}
          for: 30m
          labels:
            severity: warn
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: db_latency
          annotations:
            summary: "DB query latency P95 sustained above 50ms on the 6h window"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: DB query latency P95 is {{ `{{ humanize $value }}` }}s on the 6h window (threshold {{ mulf .Values.slo.dbLatencyP95 1000 }}ms)'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/db-latency.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: TokenGenerationFastBurn
          expr: sli:token_gen_failure_rate:1h{namespace="{{ .Release.Namespace }}"} >= {{ mulf .Values.slo.errorRateTarget .Values.slo.fastBurnMultiplier | printf "%.3f" }} and sli:token_gen_failure_rate:5m{namespace="{{ .Release.Namespace }}"} >= {{ mulf .Values.slo.errorRateTarget .Values.slo.fastBurnMultiplier | printf "%.3f" }}
          for: 5m
          labels:
            severity: page
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: token_generation
          annotations:
            summary: "Token-generation failures burning the error budget fast (>=14.4x over 0.5% budget on the 1h window)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: 1h token-generation failure rate is {{ `{{ humanizePercentage $value }}` }} (>=14.4x budget)'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: TokenGenerationSlowBurn
          expr: sli:token_gen_failure_rate:6h{namespace="{{ .Release.Namespace }}"} >= {{ mulf .Values.slo.errorRateTarget .Values.slo.slowBurnMultiplier | printf "%.3f" }} and sli:token_gen_failure_rate:30m{namespace="{{ .Release.Namespace }}"} >= {{ mulf .Values.slo.errorRateTarget .Values.slo.slowBurnMultiplier | printf "%.3f" }}
          for: 30m
          labels:
            severity: warn
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: token_generation
          annotations:
            summary: "Token-generation failure rate burning the error budget slowly (>=6x over 0.5% budget on the 6h window)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: 6h token-generation failure rate is {{ `{{ humanizePercentage $value }}` }} (>=6x budget)'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: CacheHitRatioLow
          expr: sli:cache_hit_ratio:5m{namespace="{{ .Release.Namespace }}"} < {{ .Values.slo.cacheHitRatioMin }}
          for: 15m
          labels:
            severity: warn
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: cache_hit_ratio
          annotations:
            summary: "Status-list cache hit ratio below 85% for 15m (degradation, not outage)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: current cache hit ratio is {{ `{{ $value | humanizePercentage }}` }}'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cache-hit-ratio.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: ErrorBudgetCritical
          expr: sli:error_budget:success:30d{namespace="{{ .Release.Namespace }}"} < {{ .Values.slo.errorBudgetCriticalThreshold }}
          for: 5m
          labels:
            severity: page
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: error_budget
          annotations:
            summary: "Error budget is below 10% for the 30d window"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: remaining error budget is {{ `{{ $value | humanizePercentage }}` }}'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-budget.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: TokenGenErrorBudgetCritical
          expr: sli:token_gen_error_budget:30d{namespace="{{ .Release.Namespace }}"} < {{ .Values.slo.errorBudgetCriticalThreshold }}
          for: 5m
          labels:
            severity: page
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: token_gen_error_budget
          annotations:
            summary: "Token generation error budget below 10% for the 30d window"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: remaining token generation error budget is {{ `{{ $value | humanizePercentage }}` }}'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: CertRenewalFailures
          expr: cert_time_to_expiry_seconds{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"} <= {{ .Values.slo.certExpiryWarnSeconds }}
          for: 30m
          labels:
            severity: warn
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: cert_renewal
          annotations:
            summary: "Certificate expires within 14 days (renewal loop not refreshing it)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: time to expiry is {{ `{{ $value }}` }}s'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cert-renewal.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
        - alert: CertRenewalErrorBudgetCritical
          expr: cert_time_to_expiry_seconds{otel_scope_name="status-list-server",namespace="{{ .Release.Namespace }}"} <= {{ .Values.slo.certExpiryCriticalSeconds }}
          for: 10m
          labels:
            severity: page
            team: statuslist
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: cert_renewal
          annotations:
            summary: "Certificate expires within 7 days (imminent expiry)"
            description: 'namespace {{ `{{ $labels.namespace }}` }}: time to expiry is {{ `{{ $value }}` }}s'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cert-renewal.md"
            dashboard_url: {{ .Values.alerting.dashboardUrl | default "http://localhost:3000/d/status-list-slo" | quote }}
{{- end }}

