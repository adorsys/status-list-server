{{- if and .Values.statuslist.enabled .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: status-list-server-sli
      rules:
        - record: sli:request_latency:p95:5m
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server"}[5m])) by (namespace, le))
        - record: sli:request_latency:p95:1h
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server"}[1h])) by (namespace, le))
        - record: sli:request_latency:p95:30m
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server"}[30m])) by (namespace, le))
        - record: sli:request_latency:p95:6h
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server"}[6h])) by (namespace, le))
        - record: sli:error_rate:5m
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",status_class="5xx"}[5m])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server"}[5m]))
        - record: sli:error_rate:1h
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",status_class="5xx"}[1h])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server"}[1h]))
        - record: sli:error_rate:30m
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",status_class="5xx"}[30m])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server"}[30m]))
        - record: sli:error_rate:6h
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",status_class="5xx"}[6h])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server"}[6h]))
        - record: sli:error_rate:30d
          expr: sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server",status_class="5xx"}[30d])) / sum by (namespace)(rate(http_server_requests_total{otel_scope_name="status-list-server"}[30d]))
        - record: sli:db_query_latency:p95:5m
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server"}[5m])) by (namespace, le))
        - record: sli:db_query_latency:p95:1h
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server"}[1h])) by (namespace, le))
        - record: sli:db_query_latency:p95:30m
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server"}[30m])) by (namespace, le))
        - record: sli:db_query_latency:p95:6h
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server"}[6h])) by (namespace, le))
        - record: sli:cache_hit_ratio:5m
          expr: sum by (namespace)(rate(status_list_cache_hits_total{otel_scope_name="status-list-server"}[5m])) / (sum by (namespace)(rate(status_list_cache_hits_total{otel_scope_name="status-list-server"}[5m])) + sum by (namespace)(rate(status_list_cache_misses_total{otel_scope_name="status-list-server"}[5m])))
        - record: sli:cache_hit_ratio:7d
          expr: sum by (namespace)(rate(status_list_cache_hits_total{otel_scope_name="status-list-server"}[7d])) / (sum by (namespace)(rate(status_list_cache_hits_total{otel_scope_name="status-list-server"}[7d])) + sum by (namespace)(rate(status_list_cache_misses_total{otel_scope_name="status-list-server"}[7d])))
        - record: sli:cert_renewal_failure_rate:5m
          expr: sum by (namespace)(rate(cert_renewal_failures_total{otel_scope_name="status-list-server"}[5m])) / sum by (namespace)(rate(cert_renewal_attempts_total{otel_scope_name="status-list-server"}[5m]))
        - record: sli:cert_renewal_failure_rate:7d
          expr: sum by (namespace)(rate(cert_renewal_failures_total{otel_scope_name="status-list-server"}[7d])) / sum by (namespace)(rate(cert_renewal_attempts_total{otel_scope_name="status-list-server"}[7d]))
        - record: sli:cert_renewal_failure_rate:30d
          expr: sum by (namespace)(rate(cert_renewal_failures_total{otel_scope_name="status-list-server"}[30d])) / sum by (namespace)(rate(cert_renewal_attempts_total{otel_scope_name="status-list-server"}[30d]))
        - record: sli:token_gen_failure_rate:5m
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server"}[5m])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server"}[5m]))
        - record: sli:token_gen_failure_rate:1h
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server"}[1h])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server"}[1h]))
        - record: sli:token_gen_failure_rate:30m
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server"}[30m])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server"}[30m]))
        - record: sli:token_gen_failure_rate:6h
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server"}[6h])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server"}[6h]))
        - record: sli:token_gen_failure_rate:30d
          expr: sum by (namespace)(rate(token_generation_failures_total{otel_scope_name="status-list-server"}[30d])) / sum by (namespace)(rate(token_generation_attempts_total{otel_scope_name="status-list-server"}[30d]))
        - record: sli:token_gen_error_budget:30d
          expr: clamp_max(clamp_min(1 - sli:token_gen_failure_rate:30d / {{ .Values.slo.errorRateTarget }}, 0), 1)
        - record: sli:error_budget:success:30d
          expr: clamp_max(clamp_min(1 - sli:error_rate:30d / {{ .Values.slo.errorRateTarget }}, 0), 1)

    - name: status-list-server-slo-alerts
      rules:
        - alert: Watchdog
          expr: vector(1)
          labels:
            severity: none
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
          annotations:
            summary: "Prometheus alerting pipeline is healthy (Watchdog)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/README.md"
        - alert: StatusListMetricsAbsent
          expr: absent(http_server_duration_seconds_bucket{otel_scope_name="status-list-server"})
          for: 5m
          labels:
            severity: page
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
          annotations:
            summary: "status-list-server metrics absent for 5m (target down or not scraped)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/README.md"
        - alert: RequestLatencyFastBurn
          expr: sli:request_latency:p95:1h > {{ .Values.slo.requestLatencyP95 }} and sli:request_latency:p95:5m > {{ .Values.slo.requestLatencyP95 }}
          for: 5m
          labels:
            severity: page
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: request_latency
          annotations:
            summary: "Request latency P95 sustainably above 300ms (>300ms on the 1h window)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/request-latency.md"
        - alert: RequestLatencySlowBurn
          expr: sli:request_latency:p95:6h > {{ .Values.slo.requestLatencyP95 }} and sli:request_latency:p95:30m > {{ .Values.slo.requestLatencyP95 }}
          for: 30m
          labels:
            severity: warn
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: request_latency
          annotations:
            summary: "Request latency P95 sustained above 300ms on the 6h window"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/request-latency.md"
        - alert: ErrorRateFastBurn
          expr: sli:error_rate:1h >= {{ mulf .Values.slo.errorRateTarget .Values.slo.fastBurnMultiplier | printf "%.3f" }} and sli:error_rate:5m >= {{ mulf .Values.slo.errorRateTarget .Values.slo.fastBurnMultiplier | printf "%.3f" }}
          for: 5m
          labels:
            severity: page
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: error_rate
          annotations:
            summary: "5xx error rate burning the error budget fast (>=14.4x over 0.5% budget on the 1h window)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-rate.md"
        - alert: ErrorRateSlowBurn
          expr: sli:error_rate:6h >= {{ mulf .Values.slo.errorRateTarget .Values.slo.slowBurnMultiplier | printf "%.3f" }} and sli:error_rate:30m >= {{ mulf .Values.slo.errorRateTarget .Values.slo.slowBurnMultiplier | printf "%.3f" }}
          for: 30m
          labels:
            severity: warn
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: error_rate
          annotations:
            summary: "5xx error rate burning the error budget slowly (>=6x over 0.5% budget on the 6h window)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-rate.md"
        - alert: DbLatencyFastBurn
          expr: sli:db_query_latency:p95:1h > {{ .Values.slo.dbLatencyP95 }} and sli:db_query_latency:p95:5m > {{ .Values.slo.dbLatencyP95 }}
          for: 5m
          labels:
            severity: page
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: db_latency
          annotations:
            summary: "DB query latency P95 sustainably above 50ms (>50ms on the 1h window)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/db-latency.md"
        - alert: DbLatencySlowBurn
          expr: sli:db_query_latency:p95:6h > {{ .Values.slo.dbLatencyP95 }} and sli:db_query_latency:p95:30m > {{ .Values.slo.dbLatencyP95 }}
          for: 30m
          labels:
            severity: warn
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: db_latency
          annotations:
            summary: "DB query latency P95 sustained above 50ms on the 6h window"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/db-latency.md"
        - alert: TokenGenerationFastBurn
          expr: sli:token_gen_failure_rate:1h >= {{ mulf .Values.slo.errorRateTarget .Values.slo.fastBurnMultiplier | printf "%.3f" }} and sli:token_gen_failure_rate:5m >= {{ mulf .Values.slo.errorRateTarget .Values.slo.fastBurnMultiplier | printf "%.3f" }}
          for: 5m
          labels:
            severity: page
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: token_generation
          annotations:
            summary: "Token-generation failures burning the error budget fast (>=14.4x over 0.5% budget on the 1h window)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"
        - alert: TokenGenerationSlowBurn
          expr: sli:token_gen_failure_rate:6h >= {{ mulf .Values.slo.errorRateTarget .Values.slo.slowBurnMultiplier | printf "%.3f" }} and sli:token_gen_failure_rate:30m >= {{ mulf .Values.slo.errorRateTarget .Values.slo.slowBurnMultiplier | printf "%.3f" }}
          for: 30m
          labels:
            severity: warn
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: token_generation
          annotations:
            summary: "Token-generation failure rate burning the error budget slowly (>=6x over 0.5% budget on the 6h window)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"
        - alert: CacheHitRatioLow
          expr: sli:cache_hit_ratio:5m < {{ .Values.slo.cacheHitRatioMin }}
          for: 15m
          labels:
            severity: warn
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: cache_hit_ratio
          annotations:
            summary: "Status-list cache hit ratio below 85% for 15m (degradation, not outage)"
            description: 'Current cache hit ratio: {{ `{{ $value | humanizePercentage }}` }}'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cache-hit-ratio.md"
        - alert: ErrorBudgetCritical
          expr: sli:error_budget:success:30d < {{ .Values.slo.errorBudgetCriticalThreshold }}
          for: 5m
          labels:
            severity: page
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: error_budget
          annotations:
            summary: "Error budget is below 10% for the 30d window"
            description: 'Remaining error budget: {{ `{{ $value | humanizePercentage }}` }}'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-budget.md"
        - alert: TokenGenErrorBudgetCritical
          expr: sli:token_gen_error_budget:30d < {{ .Values.slo.errorBudgetCriticalThreshold }}
          for: 5m
          labels:
            severity: page
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: token_gen_error_budget
          annotations:
            summary: "Token generation error budget below 10% for the 30d window"
            description: 'Remaining token generation error budget: {{ `{{ $value | humanizePercentage }}` }}'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"
        - alert: CertRenewalFailures
          expr: cert_time_to_expiry_seconds{otel_scope_name="status-list-server"} <= {{ .Values.slo.certExpiryWarnSeconds }}
          for: 30m
          labels:
            severity: warn
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: cert_renewal
          annotations:
            summary: "Certificate expires within 14 days (renewal loop not refreshing it)"
            description: 'Time to expiry: {{ `{{ $value }}` }}s'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cert-renewal.md"
        - alert: CertRenewalErrorBudgetCritical
          expr: cert_time_to_expiry_seconds{otel_scope_name="status-list-server"} <= {{ .Values.slo.certExpiryCriticalSeconds }}
          for: 10m
          labels:
            severity: page
            service: status-list-server
            namespace: {{ .Release.Namespace | quote }}
            sli: cert_renewal
          annotations:
            summary: "Certificate expires within 7 days (imminent expiry)"
            description: 'Time to expiry: {{ `{{ $value }}` }}s'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cert-renewal.md"
{{- end }}

