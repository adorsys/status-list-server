{{- if and .Values.statuslist.enabled .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: status-list-server-sli
      rules:
        - record: sli:request_latency:p95:5m
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server"}[5m])) by (le))
        - record: sli:request_latency:p95:1h
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server"}[1h])) by (le))
        - record: sli:request_latency:p95:6h
          expr: histogram_quantile(0.95, sum(rate(http_server_duration_seconds_bucket{otel_scope_name="status-list-server"}[6h])) by (le))
        - record: sli:error_rate:5m
          expr: sum(rate(http_server_requests_total{otel_scope_name="status-list-server",status_class="5xx"}[5m])) / sum(rate(http_server_requests_total{otel_scope_name="status-list-server"}[5m]))
        - record: sli:error_rate:1h
          expr: sum(rate(http_server_requests_total{otel_scope_name="status-list-server",status_class="5xx"}[1h])) / sum(rate(http_server_requests_total{otel_scope_name="status-list-server"}[1h]))
        - record: sli:error_rate:6h
          expr: sum(rate(http_server_requests_total{otel_scope_name="status-list-server",status_class="5xx"}[6h])) / sum(rate(http_server_requests_total{otel_scope_name="status-list-server"}[6h]))
        - record: sli:error_rate:30d
          expr: sum(rate(http_server_requests_total{otel_scope_name="status-list-server",status_class="5xx"}[30d])) / sum(rate(http_server_requests_total{otel_scope_name="status-list-server"}[30d]))
        - record: sli:db_query_latency:p95:5m
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server"}[5m])) by (le))
        - record: sli:db_query_latency:p95:1h
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server"}[1h])) by (le))
        - record: sli:db_query_latency:p95:6h
          expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket{otel_scope_name="status-list-server"}[6h])) by (le))
        - record: sli:cache_hit_ratio:5m
          expr: sum(rate(status_list_cache_hits_total{otel_scope_name="status-list-server"}[5m])) / (sum(rate(status_list_cache_hits_total{otel_scope_name="status-list-server"}[5m])) + sum(rate(status_list_cache_misses_total{otel_scope_name="status-list-server"}[5m])))
        - record: sli:cert_renewal_failure_rate:5m
          expr: sum(rate(cert_renewal_failures_total{otel_scope_name="status-list-server"}[5m])) / sum(rate(cert_renewal_attempts_total{otel_scope_name="status-list-server"}[5m]))
        - record: sli:cert_renewal_failure_rate:30d
          expr: sum(rate(cert_renewal_failures_total{otel_scope_name="status-list-server"}[30d])) / sum(rate(cert_renewal_attempts_total{otel_scope_name="status-list-server"}[30d]))
        - record: sli:token_gen_failure_rate:5m
          expr: sum(rate(token_generation_failures_total{otel_scope_name="status-list-server"}[5m])) / sum(rate(token_generation_attempts_total{otel_scope_name="status-list-server"}[5m]))
        - record: sli:token_gen_failure_rate:1h
          expr: sum(rate(token_generation_failures_total{otel_scope_name="status-list-server"}[1h])) / sum(rate(token_generation_attempts_total{otel_scope_name="status-list-server"}[1h]))
        - record: sli:token_gen_failure_rate:6h
          expr: sum(rate(token_generation_failures_total{otel_scope_name="status-list-server"}[6h])) / sum(rate(token_generation_attempts_total{otel_scope_name="status-list-server"}[6h]))
        - record: sli:token_gen_failure_rate:30d
          expr: sum(rate(token_generation_failures_total{otel_scope_name="status-list-server"}[30d])) / sum(rate(token_generation_attempts_total{otel_scope_name="status-list-server"}[30d]))
        - record: sli:error_budget:success:30d
          expr: clamp_max(clamp_min(1 - sli:error_rate:30d / 0.005, 0), 1)

    - name: status-list-server-slo-alerts
      rules:
        - alert: RequestLatencyFastBurn
          expr: sli:request_latency:p95:1h > 0.3 and sli:request_latency:p95:6h > 0.3
          for: 5m
          labels:
            severity: page
            sli: request_latency
          annotations:
            summary: "Request latency P95 sustainably above 300ms (>300ms in both 1h and 6h)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/request-latency.md"
        - alert: RequestLatencySlowBurn
          expr: sli:request_latency:p95:6h > 0.3
          for: 30m
          labels:
            severity: warn
            sli: request_latency
          annotations:
            summary: "Request latency P95 sustained above 300ms for 6h"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/request-latency.md"
        - alert: ErrorRateFastBurn
          expr: sli:error_rate:1h >= 0.072 and sli:error_rate:6h >= 0.072
          for: 5m
          labels:
            severity: page
            sli: error_rate
          annotations:
            summary: "5xx error rate burning the error budget fast (>=14.4x over 0.5% budget in both 1h and 6h)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-rate.md"
        - alert: ErrorRateSlowBurn
          expr: sli:error_rate:6h >= 0.030
          for: 30m
          labels:
            severity: warn
            sli: error_rate
          annotations:
            summary: "5xx error rate burning the error budget slowly (>=6x over 0.5% budget for 6h)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-rate.md"
        - alert: DbLatencyFastBurn
          expr: sli:db_query_latency:p95:1h > 0.05 and sli:db_query_latency:p95:6h > 0.05
          for: 5m
          labels:
            severity: page
            sli: db_latency
          annotations:
            summary: "DB query latency P95 sustainably above 50ms (>50ms in both 1h and 6h)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/db-latency.md"
        - alert: DbLatencySlowBurn
          expr: sli:db_query_latency:p95:6h > 0.05
          for: 30m
          labels:
            severity: warn
            sli: db_latency
          annotations:
            summary: "DB query latency P95 sustained above 50ms for 6h"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/db-latency.md"
        - alert: TokenGenerationFastBurn
          expr: sli:token_gen_failure_rate:1h >= 0.072 and sli:token_gen_failure_rate:6h >= 0.072
          for: 5m
          labels:
            severity: page
            sli: token_generation
          annotations:
            summary: "Token-generation failures burning the error budget fast (>=14.4x over 0.5% budget in both 1h and 6h)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"
        - alert: TokenGenerationSlowBurn
          expr: sli:token_gen_failure_rate:6h >= 0.030
          for: 30m
          labels:
            severity: warn
            sli: token_generation
          annotations:
            summary: "Token-generation failure rate burning the error budget slowly (>=6x over 0.5% budget for 6h)"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"
        - alert: CacheHitRatioLow
          expr: sli:cache_hit_ratio:5m < 0.85
          for: 15m
          labels:
            severity: warn
            sli: cache_hit_ratio
          annotations:
            summary: "Status-list cache hit ratio below 85% for 15m (degradation, not outage)"
            description: 'Current cache hit ratio: {{ `{{ $value | humanizePercentage }}` }}'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cache-hit-ratio.md"
        - alert: ErrorBudgetCritical
          expr: sli:error_budget:success:30d < 0.1
          for: 5m
          labels:
            severity: page
            sli: error_budget
          annotations:
            summary: "Error budget is below 10% for the 30d window"
            description: 'Remaining error budget: {{ `{{ $value | humanizePercentage }}` }}'
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-budget.md"
        - alert: CertRenewalFailures
          expr: sli:cert_renewal_failure_rate:5m >= 0.01
          for: 15m
          labels:
            severity: warn
            sli: cert_renewal
          annotations:
            summary: "Certificate renewal failure rate at or above 1% for 15m"
            runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cert-renewal.md"
{{- end }}
