{{- if .Values.statuslist.enabled }}
{{- if .Values.podDisruptionBudget.enabled }}
{{- $minAvailable := .Values.podDisruptionBudget.minAvailable }}
{{- $maxUnavailable := .Values.podDisruptionBudget.maxUnavailable }}
{{- if and $minAvailable $maxUnavailable }}
{{- fail "podDisruptionBudget must set exactly one of minAvailable or maxUnavailable, not both" }}
{{- end }}
{{- if not (or $minAvailable $maxUnavailable) }}
{{- fail "podDisruptionBudget must set exactly one of minAvailable or maxUnavailable" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  # Allow eviction of unhealthy pods so voluntary disruption is not blocked by
  # unhealthy replicas (kube-linter: pdb-unhealthy-pod-eviction-policy).
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "status-list-server-chart.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
