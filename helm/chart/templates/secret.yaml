{{- if and (not .Values.externalSecret.enabled) .Values.statuslist.fallbackSecret.enabled }}
{{- $stringData := dict }}
{{- range $key, $value := .Values.statuslist.fallbackSecret.stringData }}
{{- $_ := set $stringData $key $value }}
{{- end }}
{{- $pg := index $stringData "postgres-password" | default "" }}
{{- if empty $pg }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "statuslist-secret" }}
{{- $existingPg := "" }}
{{- if and $existing $existing.data }}
{{- $existingPg = index $existing.data "postgres-password" | default "" }}
{{- end }}
{{- if $existingPg }}
{{- $pg = b64dec $existingPg }}
{{- else }}
{{- /* GitOps renderers such as Argo CD and Flux cannot use lookup here; set an explicit postgres-password or disable fallbackSecret in GitOps deployments. */}}
{{- $pg = randAlphaNum 32 }}
{{- end }}
{{- $_ := set $stringData "postgres-password" $pg }}
{{- end }}
{{- $generatedCert := .Values.statuslist.fallbackSecret.generatedCertificate | default dict }}
{{- if $generatedCert.enabled }}
{{- $certKey := $generatedCert.certificateKey | default "statuslist.crt" }}
{{- $signingKey := $generatedCert.signingKey | default "statuslist.key" }}
{{- if or (empty (index $stringData $certKey)) (empty (index $stringData $signingKey)) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "statuslist-secret" }}
{{- $existingCert := "" }}
{{- $existingKey := "" }}
{{- if and $existing $existing.data }}
{{- $existingCert = index $existing.data $certKey | default "" }}
{{- $existingKey = index $existing.data $signingKey | default "" }}
{{- end }}
{{- if and $existingCert $existingKey }}
{{- if empty (index $stringData $certKey) }}
{{- $_ := set $stringData $certKey (b64dec $existingCert) }}
{{- end }}
{{- if empty (index $stringData $signingKey) }}
{{- $_ := set $stringData $signingKey (b64dec $existingKey) }}
{{- end }}
{{- else }}
{{- /* GitOps renderers cannot use lookup here; use explicit certificate files or disable fallbackSecret in GitOps deployments. */}}
{{- $localCert := genSelfSignedCert ($generatedCert.commonName | default "localhost") ($generatedCert.ipAddresses | default list) ($generatedCert.dnsNames | default list) 3650 }}
{{- if empty (index $stringData $certKey) }}
{{- $_ := set $stringData $certKey $localCert.Cert }}
{{- end }}
{{- if empty (index $stringData $signingKey) }}
{{- $_ := set $stringData $signingKey $localCert.Key }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  # Single supported fallback secret name. PostgreSQL (postgres.auth.existingSecret)
  # and the Deployment secretKeyRef both reference this same name, so it is not
  # independently configurable.
  name: statuslist-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
{{- range $key, $value := $stringData }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
