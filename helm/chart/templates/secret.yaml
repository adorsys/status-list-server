{{- if and (not .Values.externalSecret.enabled) .Values.statuslist.fallbackSecret.enabled }}
{{- $pg := index .Values.statuslist.fallbackSecret.stringData "postgres-password" | default "" }}
{{- if empty $pg }}
{{- fail "statuslist.fallbackSecret is enabled but 'postgres-password' is empty. Provide a non-empty password in statuslist.fallbackSecret.stringData.postgres-password, otherwise the application would be configured with an invalid database credential." }}
{{- end }}
{{- $redis := index .Values "redis-ha" | default dict }}
{{- if and (eq (default false (index $redis "enabled")) true) }}
{{- $rp := index .Values.statuslist.fallbackSecret.stringData "redis-password" | default "" }}
{{- if empty $rp }}
{{- fail "statuslist.fallbackSecret is enabled with redis-ha.enabled but 'redis-password' is empty. Provide a non-empty password in statuslist.fallbackSecret.stringData.redis-password, otherwise Redis would be configured with an invalid credential." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  # Single supported fallback secret name. PostgreSQL (postgres.auth.existingSecret)
  # and the Deployment secretKeyRef both reference this same name, so it is not
  # independently configurable.
  name: statuslist-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- range $key, $value := .Values.statuslist.fallbackSecret.stringData }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
