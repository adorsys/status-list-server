{{- if and (not .Values.externalSecret.enabled) .Values.statuslist.fallbackSecret.enabled }}
{{- $stringData := dict }}
{{- range $key, $value := .Values.statuslist.fallbackSecret.stringData }}
{{- $_ := set $stringData $key $value }}
{{- end }}
{{- $pg := index $stringData "postgres-password" | default "" }}
{{- if empty $pg }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "statuslist-secret" }}
{{- $existingPg := "" }}
{{- if and $existing $existing.data }}
{{- $existingPg = index $existing.data "postgres-password" | default "" }}
{{- end }}
{{- if $existingPg }}
{{- $pg = b64dec $existingPg }}
{{- else }}
{{- $pg = randAlphaNum 32 }}
{{- end }}
{{- $_ := set $stringData "postgres-password" $pg }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  # Single supported fallback secret name. PostgreSQL (postgres.auth.existingSecret)
  # and the Deployment secretKeyRef both reference this same name, so it is not
  # independently configurable.
  name: statuslist-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
{{- range $key, $value := $stringData }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
