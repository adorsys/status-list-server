{{- if and (not .Values.externalSecret.enabled) .Values.statuslist.fallbackSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  # Single supported fallback secret name. PostgreSQL (postgres.auth.existingSecret)
  # and the Deployment secretKeyRef both reference this same name, so it is not
  # independently configurable.
  name: statuslist-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- range $key, $value := .Values.statuslist.fallbackSecret.stringData }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
