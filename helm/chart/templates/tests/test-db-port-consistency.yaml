{{- if .Values.statuslist.enabled }}
{{- /*
  Test that the database port configured in APP_DATABASE__PORT matches
  the egress port in the network policy and initContainer commands.
  This ensures the port configuration is consistent across all resources.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-test-db-port
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    helm.sh/test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  test.sh: |
    #!/bin/sh
    set -e

    # Get the configured database port from values
    DB_PORT="{{ include "status-list-server-chart.dbPort" . }}"

    echo "Testing database port consistency..."
    echo "Configured APP_DATABASE__PORT: $DB_PORT"

    # Validate port is a number
    if ! echo "$DB_PORT" | grep -qE '^[0-9]+$'; then
      echo "ERROR: APP_DATABASE__PORT must be a numeric value"
      exit 1
    fi

    # Validate port is in valid range
    if [ "$DB_PORT" -lt 1 ] || [ "$DB_PORT" -gt 65535 ]; then
      echo "ERROR: APP_DATABASE__PORT must be between 1 and 65535"
      exit 1
    fi

    echo "Database port validation passed: $DB_PORT"
    exit 0
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-test-db-port
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    helm.sh/test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  containers:
    - name: test
      image: busybox:1.37
      command: ['sh', '/tests/test.sh']
      volumeMounts:
        - name: tests
          mountPath: /tests
  volumes:
    - name: tests
      configMap:
        name: {{ include "status-list-server-chart.fullname" . }}-test-db-port
  restartPolicy: Never
{{- end }}
