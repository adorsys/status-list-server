apiVersion: v2
name: status-list-server
description: Helm chart for deploying status list server on Kubernetes
type: application
version: 0.4.0
# Default image tag when statuslist.image.tag and .digest are both empty.
# Release images are always suffixed; the chart default uses the filesystem
# certificate-store variant so base installs are provider-neutral. Cloud-specific
# variants are selected in explicit values overlays.
appVersion: "1.0.1-fscert"
dependencies:
  - name: postgres
    version: 0.8.2
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: opentelemetry-collector
    version: 0.169.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-collector.enabled
