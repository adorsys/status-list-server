# AWS/EKS example overlay. Apply this explicitly on AWS deployments:
# helm upgrade --install statuslist ./helm/chart -f ./helm/chart/values-aws.yaml

global:
  domain: eudi-adorsys.com

statuslist:
  image:
    variant: aws
  service:
    # General AWS overlay keeps traffic behind the Ingress TLS layer.
    type: ClusterIP
    annotations: {}
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    tls:
      secretName: statuslist-tls
  env:
    APP_SERVER__CERT__EMAIL: "info@adorsys.com"
    APP_SERVER__CERT__ORGANIZATION: "adorsys GmbH & CO KG"
    APP_SERVER__CERT__DNS__PROVIDER: "route53"
  aws:
    mountCredentials: true
    region: eu-central-1
  fallbackSecret:
    enabled: false

externalSecret:
  enabled: true

secretStore:
  enabled: true
  provider: aws
  aws:
    service: SecretsManager
    region: eu-central-1

postgres:
  persistence:
    storageClass: high-performance
