# Production values for helm/chart. Applied by the production deploy workflow
# (deploy.yml) on release-tag deploys to the statuslist-production namespace.

# Default secret/credential provisioning is External Secrets Operator (ESO): the
# chart's default statuslist.aws.mountCredentials=true mounts the ESO-provisioned
# aws-credentials-secret under /home/nobody/.aws. Production keeps that default, so
# no Workload Identity ServiceAccount annotation is required and no static AWS
# credential files are managed by hand — ESO synchronizes them.
#
# If you prefer Workload Identity / IRSA instead, opt in by attaching the role
# annotation below and setting statuslist.aws.mountCredentials=false (see the
# "ServiceAccount and Workload Identity" section in helm/README.md and
# docs/deployment-runbook.md).
serviceAccount:
  create: true

statuslist:
  aws:
    # ESO-mounted credentials (the chart default). Set false + IRSA annotation for
    # Workload Identity mode.
    mountCredentials: true
    region: eu-central-1
