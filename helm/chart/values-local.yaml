global:
  storageClass: "standard"

statuslist:
  initContainers:
    - name: wait-for-postgres
      image: busybox
      command:
        - "sh"
        - "-c"
        - |
          echo "Waiting for postgres..."
          until nc -z {{ .Release.Name }}-postgres.{{ .Release.Namespace }}.svc.cluster.local {{ include "status-list-server-chart.dbPort" . }}; do
            echo "postgres not ready. Retrying in 2s...";
            sleep 2;
          done
          echo "Postgres is up."

  image:
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    nodePort: 32081
  ingress:
    enabled: false
  env:
    RUST_LOG: "debug"
    APP_ENV: "local"
    APP_SERVER__CERT__ACME_DIRECTORY_URL: "https://acme-staging-v02.api.letsencrypt.org/directory"
    # Parsed certificate chain cache TTL in seconds. "0" means no expiry; non-provisioning replicas rely on this TTL for renewed chains.
    # Status-list record cache TTL in seconds. "0" disables this cache.
    APP_CACHE__TTL: "120"
    APP_CACHE__MAX_CAPACITY: "500"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

postgres:
  persistence:
    enabled: false
    size: 5Gi
    storageClass: "standard"
  image:
    registry: docker.io
    repository: postgres
    tag: "16.3"

externalSecret:
  enabled: false

secretStore:
  enabled: false

opentelemetry-collector:
  enabled: false
