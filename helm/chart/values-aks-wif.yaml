# Example values for AKS deployments using Workload Identity Federation.
# No static Azure credentials required.
#
# Prerequisites:
# 1. AKS cluster with Azure AD Workload Identity enabled
# 2. Azure Managed Identity with federated identity credential
#
# Usage:
#   helm install statuslist ./chart \
#     --namespace statuslist \
#     -f chart/values.yaml \
#     -f chart/values-aks-wif.yaml
#
# See docs/workload-identity.md for the full AKS Workload Identity Federation setup guide.

serviceAccount:
  create: true
  name: statuslist-sa
  annotations:
    # Replace with your actual managed identity client ID and tenant ID
    azure.workload.identity/client-id: <managed-identity-client-id>
    azure.workload.identity/tenant-id: <azure-tenant-id>

externalSecret:
  enabled: true

# No AWS region needed for Azure-only deployments.
statuslist:
  aws:
    region: ""

# ESO syncs secrets from Azure Key Vault using the Workload Identity credentials.
secretStore:
  enabled: true
  provider: azure
  azure:
    tenantId: <azure-tenant-id>
    clientId: <managed-identity-client-id>
    vaultUrl: https://kv-name.vault.azure.net/
    auth:
      workloadIdentity: true

# Disable Redis for simpler deployments.
redis-ha:
  enabled: false