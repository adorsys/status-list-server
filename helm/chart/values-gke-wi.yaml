# Example values for GKE deployments using GKE Workload Identity.
# No static GCP credentials required.
#
# Prerequisites:
# 1. GKE cluster with Workload Identity enabled
# 2. GCP Service Account bound to the Kubernetes ServiceAccount
#
# Usage:
#   helm install statuslist ./chart \
#     --namespace statuslist \
#     -f chart/values.yaml \
#     -f chart/values-gke-wi.yaml
#
# See docs/workload-identity.md for the full GKE Workload Identity setup guide.

serviceAccount:
  create: true
  name: statuslist-sa
  annotations:
    # Replace with your actual GCP service account email
    iam.gke.io/gcp-service-account: statuslist-sa@PROJECT_ID.iam.gserviceaccount.com

externalSecret:
  enabled: true

# No AWS region needed for GCP-only deployments.
statuslist:
  aws:
    region: ""

# ESO syncs secrets from GCP Secret Manager using the Workload Identity credentials.
secretStore:
  enabled: true
  provider: gcp
  gcp:
    projectID: PROJECT_ID
    auth:
      workloadIdentity: true

# Disable Redis for simpler deployments.
redis-ha:
  enabled: false