config:
  target: "http://localhost:8000"
  plugins:
    publish-metrics:
      - type: prometheus
        pushgateway: "http://localhost:9091"
        tags:
          - "test_id:status_list_load"
    expect: {}
    ensure: {}
  phases:
    - duration: 60
      arrivalRate: 5
      name: "Warm up - 5 users/sec"
    - duration: 120
      arrivalRate: 25
      name: "Ramp up - 25 users/sec"
    - duration: 180
      arrivalRate: 50
      name: "Peak load - 50 users/sec"
    - duration: 120
      arrivalRate: 25
      name: "Scale down - 25 users/sec"
    - duration: 60
      arrivalRate: 5
      name: "Cool down - 5 users/sec"

  processor: "../scripts/processor.js"

  ensure:
    maxErrorRate: 5
    p95: 800
    p99: 1500

scenarios:
  - name: "Health Check Flow"
    weight: 30
    flow:
      - get:
          url: "/health/live"
          expect:
            - statusCode: 200
            - contentType: text/plain; charset=utf-8
            - matchesRegexp: "OK"

  - name: "Welcome Endpoint Flow"
    weight: 20
    flow:
      - get:
          url: "/"
          expect:
            - statusCode: 200
            - contentType: text/plain; charset=utf-8
            - matchesRegexp: "Status.*Server"

  - name: "Status List Retrieval Flow"
    weight: 30
    flow:
      - function: "selectPublishedListId"
      - get:
          url: "/api/v1/status-lists/{{ listId }}"
          headers:
            Accept: "application/statuslist+jwt"
          expect:
            - statusCode: 200
          afterResponse: "handleStatusListResponse"

  - name: "Credential Registration Flow"
    weight: 20
    flow:
      - function: "generateIssuerPayload"
      - post:
          url: "{{ $processEnvironment.MANAGEMENT_TARGET }}/api/v1/credentials"
          json:
            issuer: "{{ issuer }}"
            public_key: "{{ publicKeyJwk }}"
          expect:
            - statusCode:
                - 202
                - 409
          afterResponse: "handleCredentialResponse"

  - name: "Authenticated Update Flow"
    weight: 40
    flow:
      - function: "loadTestData"
      - function: "selectRandomToken"
      - function: "generateUUID"
      - put:
          url: "{{ $processEnvironment.MANAGEMENT_TARGET }}/api/v1/status-lists/{{ listId }}/statuses"
          headers:
            Authorization: "Bearer {{ token }}"
          json:
            statuses:
              - index: 1
                status: 0
          expect:
            - statusCode: 201
          afterResponse: "handlePublishResponse"
      - think: 0.5
      - patch:
          url: "{{ $processEnvironment.MANAGEMENT_TARGET }}/api/v1/status-lists/{{ listId }}/statuses"
          headers:
            Authorization: "Bearer {{ token }}"
          json:
            statuses:
              - index: 1
                status: 1
              - index: 2
                status: 0
          expect:
            - statusCode: 200
          afterResponse: "handleUpdateResponse"
      - think: 1
