# Reusable file-backed signer profile. Supply certificate/key mounts for each environment.
statuslist:
  image:
    variant: fscert
  aws:
    mountCredentials: false
  env:
    # Nulling a base-chart key removes it from the rendered env; only these three are defined in
    # the base `values.yaml`. EMAIL/ORGANIZATION/DNS__PROVIDER come from values-aws.yaml, where a
    # null renders as an empty value and the empty DNS provider fails config parsing, so they are
    # deliberately not nulled here (fscert ignores them).
    APP_SERVER__CERT__ACME_DIRECTORY_URL: null
    APP_SERVER__CERT__EKU: null
    APP_SERVER__CERT__RENEWAL_CRON_SCHEDULE: null

