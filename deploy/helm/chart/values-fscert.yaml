# Reusable file-backed signer profile. Supply certificate/key mounts for each environment.
statuslist:
  image:
    variant: fscert
  aws:
    mountCredentials: false
  env:
    # fscert signs from a mounted file, so clear every ACME setting the base chart or an ACME
    # overlay would otherwise inject. deployment.yaml skips null env values, so a null removes
    # the key regardless of which overlay set it.
    APP_SERVER__CERT__ACME_DIRECTORY_URL: null
    APP_SERVER__CERT__EKU: null
    APP_SERVER__CERT__RENEWAL_CRON_SCHEDULE: null
    APP_SERVER__CERT__EMAIL: null
    APP_SERVER__CERT__ORGANIZATION: null
    APP_SERVER__CERT__DNS__PROVIDER: null

