# External Secrets Operator examples. Example 1 is active; uncomment another to switch.

# Example 1: Vault through a ClusterSecretStore that cluster admins create first.
externalSecret:
  enabled: true
  metadata:
    name: statuslist-external-secret
  spec:
    refreshInterval: 15m
    secretStoreRef:
      name: vault-cluster-store
      kind: ClusterSecretStore
    target:
      name: statuslist-secret
      creationPolicy: Owner
      template:
        type: Opaque
        data:
          database-password: "{{ .db_password }}"
          postgres-password: "{{ .db_password }}"
          api-key: "{{ .api_key }}"
          connection-string: "postgresql://{{ .db_user }}:{{ .db_password }}@{{ .db_host }}:5432/statuslist"
    data:
      - secretKey: db_password
        remoteRef:
          key: secret/data/statuslist/database
          property: password
      - secretKey: db_user
        remoteRef:
          key: secret/data/statuslist/database
          property: username
      - secretKey: db_host
        remoteRef:
          key: secret/data/statuslist/database
          property: host
      - secretKey: api_key
        remoteRef:
          key: secret/data/statuslist/api
          property: key

secretStore:
  enabled: false

