{{- if and .Values.statuslist.enabled .Values.grafanaDashboard.enabled }}
{{- /*
  Publishes the generated SLO dashboard as a ConfigMap so the central Grafana
  sidecar (kube-prometheus-stack configures `sidecar.dashboards.searchNamespace`
  + `label: grafana_dashboard / labelValue: "1"`) auto-provisions it.

  Source of truth: deploy/observability/dashboards/generated/status-list-slo.json,
  regenerated from src/generate.mjs (see deploy/observability/dashboards/README.md).
  The chart-local copy under observability/ (inside this chart) is written BY
  THE SAME generator run and CI asserts both are byte-for-byte identical, so the
  Helm ConfigMap (via .Files.Get) can never drift from the reviewed artifact.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  status-list-slo.json: |-
    {{- .Files.Get "observability/dashboards/generated/status-list-slo.json" | nindent 4 }}
{{- end }}
