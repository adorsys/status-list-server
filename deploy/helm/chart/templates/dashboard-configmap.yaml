{{- if and .Values.statuslist.enabled .Values.grafanaDashboard.enabled }}
{{- /* Generated by deploy/observability/dashboards/src/generate.mjs; CI checks this copy matches. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  status-list-slo.json: |-
    {{- .Files.Get "observability/dashboards/generated/status-list-slo.json" | nindent 4 }}
{{- end }}
