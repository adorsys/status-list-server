{{/*
Opt-in NetworkPolicy (statuslist.networkPolicy.enabled, default OFF).

Ingress: a port-only rule for the service targetPort. With an EMPTY statuslist.networkPolicy.ingress
this allows ANY source in the cluster; you MUST restrict sources to your ingress controller.

Egress:
- Database rule: scoped to the database port, `to:` = statuslist.networkPolicy.databaseEgress
  if set, otherwise the in-cluster postgres pod selector. statuslist.networkPolicy.egressInternal
  entries are appended to THIS rule, so each inherits the database port — they are NOT general
  outbound destinations.
- Ports 443/53 are always allowed with NO `to:` entry, i.e. open to 0.0.0.0/0. This policy
  does NOT constrain outbound exfiltration.
- When the opentelemetry-collector is enabled, OTLP ports 4317/4318 are scoped to the
  collector pods only.
*/}}
{{- if .Values.statuslist.networkPolicy.enabled }}
{{- $otel := index .Values "opentelemetry-collector" | default dict -}}
{{- $backend := include "status-list-server-chart.dbBackend" . -}}
{{- $databaseEgress := .Values.statuslist.networkPolicy.databaseEgress | default list -}}
{{- if and (eq $backend "mysql") (empty $databaseEgress) }}
{{- fail "statuslist.networkPolicy.databaseEgress must be set when NetworkPolicy is enabled with APP_DATABASE__BACKEND=mysql because this chart does not deploy the database" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-network-policy
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "status-list-server-chart.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.statuslist.service.targetPort | int }}
          protocol: TCP
      {{- with .Values.statuslist.networkPolicy.ingress }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  egress:
    - ports:
        - port: {{ include "status-list-server-chart.dbPort" . | int }}
          protocol: TCP
      to:
        {{- if not (empty $databaseEgress) }}
        {{- toYaml $databaseEgress | nindent 8 }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
        {{- end }}
        {{- with .Values.statuslist.networkPolicy.egressInternal }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    - ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
    {{- if $otel.enabled }}
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
      # Scope OTLP egress to the opentelemetry-collector pods only.
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
    {{- end }}
{{- end }}
