{{/* With an empty ingress list any pod in the cluster can reach the service.
egressInternal shares the database port; 443 and 53 are open to 0.0.0.0/0. */}}
{{- if .Values.statuslist.networkPolicy.enabled }}
{{- $otel := index .Values "opentelemetry-collector" | default dict -}}
{{- $backend := include "status-list-server-chart.dbBackend" . -}}
{{- $databaseEgress := .Values.statuslist.networkPolicy.databaseEgress | default list -}}
{{- $cacheEgress := .Values.statuslist.networkPolicy.cacheEgress | default list -}}
{{- $env := .Values.statuslist.env | default dict -}}
{{- $cacheBackend := (get $env "APP_CACHE__BACKEND" | default "memory" | toString | trim | lower) -}}
{{- $cachePortValue := (get $env "APP_CACHE__PORT" | default "" | toString | trim) -}}
{{- $cacheTls := (get $env "APP_CACHE__TLS" | default "false" | toString | trim | lower) -}}
{{- $cachePort := 6379 -}}
{{- if eq $cacheTls "true" -}}
{{- $cachePort = 6380 -}}
{{- end -}}
{{- if ne $cachePortValue "" -}}
{{- $cachePort = $cachePortValue | int -}}
{{- end -}}
{{- if and (eq $backend "mysql") (empty $databaseEgress) }}
{{- fail "statuslist.networkPolicy.databaseEgress must be set when NetworkPolicy is enabled with APP_DATABASE__BACKEND=mysql because this chart does not deploy the database" }}
{{- end }}
{{- if and (eq $cacheBackend "redis") (empty $cacheEgress) }}
{{- fail "statuslist.networkPolicy.cacheEgress must be set when NetworkPolicy is enabled with APP_CACHE__BACKEND=redis because this chart does not deploy Redis" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-network-policy
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "status-list-server-chart.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public port: no `from` means any source; restrict it with networkPolicy.ingress.
    - ports:
        - port: {{ .Values.statuslist.service.targetPort | int }}
          protocol: TCP
      {{- with .Values.statuslist.networkPolicy.ingress }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Management port: no rule without selectors, so it's denied by default.
    {{- with .Values.statuslist.networkPolicy.managementIngress }}
    - ports:
        - port: {{ $.Values.statuslist.service.managementTargetPort | int }}
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    # Admin port: denied by default too, like management.
    {{- with .Values.statuslist.networkPolicy.adminIngress }}
    - ports:
        - port: {{ $.Values.statuslist.service.adminTargetPort | int }}
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}

  egress:
    - ports:
        - port: {{ include "status-list-server-chart.dbPort" . | int }}
          protocol: TCP
      to:
        {{- if not (empty $databaseEgress) }}
        {{- toYaml $databaseEgress | nindent 8 }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
        {{- end }}
        {{- with .Values.statuslist.networkPolicy.egressInternal }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- if not (empty $cacheEgress) }}
    - ports:
        - port: {{ $cachePort }}
          protocol: TCP
      to:
        {{- toYaml $cacheEgress | nindent 8 }}
    {{- end }}
    - ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
    {{- if $otel.enabled }}
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
    {{- end }}
{{- end }}
