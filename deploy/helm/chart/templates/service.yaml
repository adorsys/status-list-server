{{- if .Values.statuslist.service.enabled }}
# Public listener: the http port only. This is the Service the public Ingress and
# the configured Service type (ClusterIP / NodePort / LoadBalancer) act on, so an
# internet-facing LoadBalancer overlay never exposes management or admin.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-service
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: public
  namespace: {{ .Release.Namespace }}
  {{- with .Values.statuslist.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.statuslist.service.type }}
  ports:
  - name: http
    port: {{ .Values.statuslist.service.port }}
    targetPort: {{ .Values.statuslist.service.targetPort }}
    protocol: TCP
  - name: management
    port: {{ .Values.statuslist.service.managementPort }}
    targetPort: {{ .Values.statuslist.service.managementTargetPort }}
    protocol: TCP
  - name: admin
    port: {{ .Values.statuslist.service.adminPort }}
    targetPort: {{ .Values.statuslist.service.adminTargetPort }}
    protocol: TCP
    {{- if and (eq .Values.statuslist.service.type "NodePort") .Values.statuslist.service.nodePort }}
    nodePort: {{ .Values.statuslist.service.nodePort }}
    {{- end }}
  selector:
    {{- include "status-list-server-chart.selectorLabels" . | nindent 4 }}
---
# Internal listener: management and admin ports on a ClusterIP Service. Keeping
# these on their own Service (instead of sharing the public Service) means the
# management API and /metrics are never exposed by the public Service type (e.g.
# an internet-facing LoadBalancer). ClusterIP is fixed regardless of the public
# Service type. The ServiceMonitor scrapes the admin port here by name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-internal-service
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - name: management
    port: {{ .Values.statuslist.service.managementPort }}
    targetPort: {{ .Values.statuslist.service.managementTargetPort }}
    protocol: TCP
  - name: admin
    port: {{ .Values.statuslist.service.adminPort }}
    targetPort: {{ .Values.statuslist.service.adminTargetPort }}
    protocol: TCP
  selector:
    {{- include "status-list-server-chart.selectorLabels" . | nindent 4 }}
{{- end }}
