{{- if .Values.statuslist.gateway.enabled }}
{{- if empty .Values.statuslist.gateway.parentRefs }}
{{- fail "statuslist.gateway.parentRefs is required when statuslist.gateway.enabled is true: name the Gateway listener the routes attach to (name, namespace, sectionName)" }}
{{- end }}
{{- if eq (.Values.statuslist.env.APP_SERVER__PROFILE | default "private") "hosted" }}
{{- $_ := required "hosted gateway mode requires statuslist.ingress.externalDnsHostname" .Values.statuslist.ingress.externalDnsHostname }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-route
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    {{- toYaml .Values.statuslist.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ include "status-list-server-chart.publicHost" . | quote }}
  rules:
    - matches:
        - path:
            type: {{ ternary "Exact" "PathPrefix" (eq .Values.statuslist.ingress.pathType "Exact") }}
            value: {{ .Values.statuslist.ingress.path | quote }}
      backendRefs:
        - name: {{ include "status-list-server-chart.fullname" . }}-service
          port: {{ .Values.statuslist.service.port }}
{{- if .Values.statuslist.ingress.management.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-management-route
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    {{- toYaml .Values.statuslist.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ include "status-list-server-chart.managementHost" . | quote }}
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: {{ .Values.statuslist.ingress.management.path | quote }}
      # ingress-nginx waits 60 s for the upstream; Envoy's default is 15 s.
      timeouts:
        request: 60s
      backendRefs:
        - name: {{ include "status-list-server-chart.fullname" . }}-internal-service
          port: {{ .Values.statuslist.service.managementPort }}
{{- end }}
{{- end }}
