{{- if .Values.statuslist.ingress.enabled }}
{{- $globalDomain := trimSuffix "." (dig "domain" "" (.Values.global | default dict) | default "" | lower) }}
{{- $ingressHost := .Values.statuslist.ingress.externalDnsHostname | default "" | lower }}
{{- if and (eq $ingressHost "") $globalDomain }}
{{- $ingressHost = printf "statuslist.%s" $globalDomain }}
{{- end }}
{{- if eq $ingressHost "" }}
{{- $ingressHost = "localhost" }}
{{- end }}
{{- $tlsHosts := list }}
{{- range (.Values.statuslist.ingress.tls.hosts | default list) }}
{{- $tlsHosts = append $tlsHosts (. | lower) }}
{{- end }}
{{- if and (eq (len $tlsHosts) 0) $globalDomain }}
{{- $tlsHosts = list (printf "*.%s" $globalDomain) }}
{{- else if and (eq (len $tlsHosts) 0) .Values.statuslist.ingress.tls.secretName }}
{{- $tlsHosts = list $ingressHost }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-ingress
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if ne $ingressHost "localhost" }}
    external-dns.alpha.kubernetes.io/hostname: {{ $ingressHost }}
    {{- end }}
    {{- if .Values.statuslist.ingress.annotations }}
    {{- toYaml .Values.statuslist.ingress.annotations | nindent 4 }}
    {{- end }}

spec:
  ingressClassName: nginx
  rules:
  - host: {{ $ingressHost }}
    http:
      paths:
      - path: {{ .Values.statuslist.ingress.path }}
        pathType: {{ .Values.statuslist.ingress.pathType }}
        backend:
          service:
            name: {{ include "status-list-server-chart.fullname" . }}-service
            port:
              number: {{ .Values.statuslist.service.port }}
  {{- if and .Values.statuslist.ingress.tls.secretName (gt (len $tlsHosts) 0) }}
  tls:
  - hosts:
    {{- range $tlsHosts }}
    - {{ . | quote }}
    {{- end }}
    secretName: {{ .Values.statuslist.ingress.tls.secretName }}
  {{- end }}
{{- if .Values.statuslist.ingress.management.enabled }}
{{- $mgmtHost := (.Values.statuslist.ingress.management.hostname | default "" | lower) }}
{{- if eq $mgmtHost "" }}
{{- $mgmtHost = $ingressHost }}
{{- end }}
{{- $mgmtTlsHosts := $tlsHosts }}
{{- if ne (.Values.statuslist.ingress.management.hostname | default "") "" }}
{{- /* A separate management hostname gets its own TLS hosts and DNS record. */}}
{{- $mgmtTlsHosts = list $mgmtHost }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}-management-ingress
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Route by path with a regex so the management writes that share the
    # /api/v1/status-lists/ prefix with public reads resolve here.
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- if and (ne $mgmtHost "localhost") (ne (.Values.statuslist.ingress.management.hostname | default "") "") }}
    external-dns.alpha.kubernetes.io/hostname: {{ $mgmtHost }}
    {{- end }}
    {{- if .Values.statuslist.ingress.management.annotations }}
    {{- toYaml .Values.statuslist.ingress.management.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ $mgmtHost }}
    http:
      paths:
      - path: {{ .Values.statuslist.ingress.management.path }}
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ include "status-list-server-chart.fullname" . }}-service
            port:
              number: {{ .Values.statuslist.service.managementPort }}
{{- /* Resolve the TLS secret for the management Ingress:
     - Use the dedicated management secret when explicitly set (ideal for
       separate hostnames with their own cert).
     - Otherwise fall back to the public TLS secret (works for wildcard
       certs covering both hostnames). $mgmtTlsHosts already holds the
       correct hostname(s), so the hosts: field is always right. */}}
{{- $mgmtTlsSecret := .Values.statuslist.ingress.management.tls.secretName | default "" }}
{{- if and (eq $mgmtTlsSecret "") .Values.statuslist.ingress.tls.secretName }}
{{- $mgmtTlsSecret = .Values.statuslist.ingress.tls.secretName }}
{{- end }}
  {{- if and $mgmtTlsSecret (gt (len $mgmtTlsHosts) 0) }}
  tls:
  - hosts:
    {{- range $mgmtTlsHosts }}
    - {{ . | quote }}
    {{- end }}
    secretName: {{ $mgmtTlsSecret }}
  {{- end }}
{{- end }}
{{- end }}
