{{- if and .Values.statuslist.enabled .Values.statuslist.issuerRegistry.configMap.create }}
{{- if eq (trim (toString .Values.statuslist.issuerRegistry.configMap.content)) "" }}
{{- fail "statuslist.issuerRegistry.configMap.content is required when configMap.create=true" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.statuslist.issuerRegistry.configMap.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
data:
  {{ .Values.statuslist.issuerRegistry.configMap.key }}: |
{{ .Values.statuslist.issuerRegistry.configMap.content | indent 4 }}
{{- end }}
