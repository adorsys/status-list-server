{{- if .Values.alerting.enabled }}
{{- $platform := .Values.alerting.platform | required "alerting.platform is required when alerting.enabled=true" }}
{{- $validPlatforms := list "slack" "discord" "teams" "mattermost" "email" "webhook" }}
{{- if not (has $platform $validPlatforms) }}
  {{- fail (printf "alerting.platform %q is not supported. Must be one of: slack, discord, teams, mattermost, email, webhook" $platform) }}
{{- end }}
{{- /* Resolve the Secret name — either the user-provided existing secret or the chart-managed one */ -}}
{{- $secretName := .Values.alerting.existingSecret | default (printf "%s-alerting" (include "status-list-server-chart.fullname" .)) }}
# AlertmanagerConfig routes SLO alerts from kube-prometheus-stack's Alertmanager to the
# configured notification channel. The route tree mirrors the Docker Compose
# generate-alertmanager-config.sh logic:
#   severity=none  -> deadmansswitch (Watchdog; pages on ABSENCE, not on firing)
#   severity=page  -> human channel, repeat every 4h
#   severity=warn  -> human channel, repeat every 24h
#   everything else -> noop sink (never spams a human channel)
#
# Credentials are read from the Secret rendered by alerting-secret.yaml (or from
# alerting.existingSecret when operators manage the Secret externally, e.g. via ESO).
apiVersion: monitoring.coreos.com/v1beta1
kind: AlertmanagerConfig
metadata:
  name: {{ include "status-list-server-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "status-list-server-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerting
    {{- with .Values.alerting.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  route:
    groupBy:
      - alertname
      - sli
      - service
    groupWait: 30s
    groupInterval: 5m
    # Default sink: absorbs anything not explicitly routed so nothing silently
    # spams a human channel.
    receiver: noop
    routes:
      # Watchdog (severity=none) -> dead-man's-switch. When dmsWebhookUrl is not
      # set, the deadmansswitch receiver is an empty noop — the Watchdog is
      # silently absorbed and never reaches a human channel.
      - matchers:
          - name: severity
            value: none
            matchType: "="
        receiver: deadmansswitch

      # Page (act now): re-notify every 4h while still firing.
      - matchers:
          - name: severity
            value: page
            matchType: "="
        receiver: human
        repeatInterval: 4h

      # Warn (act this week): re-notify every 24h while still firing.
      - matchers:
          - name: severity
            value: warn
            matchType: "="
        receiver: human
        repeatInterval: 24h

  inhibitRules:
    # Suppress the warn notification for a given SLI+service when the correlated
    # page alert is already firing (fast-burn page + slow-burn warn fire together
    # for the same SLI; only the page should reach the channel).
    - sourceMatch:
        - name: severity
          value: page
          matchType: "="
      targetMatch:
        - name: severity
          value: warn
          matchType: "="
      equal:
        - sli
        - service

  receivers:
    # Absorbs anything not explicitly routed.
    - name: noop

    # Dead-man's-switch for the always-firing Watchdog. When dmsWebhookUrl / dmsEnabled is not
    # configured, this is an empty receiver and the Watchdog is silently absorbed.
    # When using existingSecret, set dmsEnabled: true if the secret contains key "dms-webhook-url".
    - name: deadmansswitch
      {{- if or .Values.alerting.dmsWebhookUrl .Values.alerting.dmsEnabled }}
      webhookConfigs:
        - urlSecret:
            name: {{ $secretName | quote }}
            key: dms-webhook-url
          {{- if .Values.alerting.webhookTimeout }}
          timeout: {{ .Values.alerting.webhookTimeout | quote }}
          {{- end }}
          sendResolved: false
      {{- end }}

    # Human notification channel. Platform-specific receiver config is rendered
    # below based on alerting.platform; webhook/discord/slack credentials are
    # read from the Secret; email endpoint details are plain values because the
    # EmailConfig CRD defines to/smarthost/from as strings.
    - name: human
      {{- if eq $platform "discord" }}
      discordConfigs:
        - apiURL:
            name: {{ $secretName | quote }}
            key: webhook-url
          sendResolved: true
          title: |-
            {{ `{{ template "discord.default.title" . }}` }}
          message: |-
            {{ `{{ template "discord.default.message" . }}` }}
      {{- else if eq $platform "slack" }}
      slackConfigs:
        - apiURL:
            name: {{ $secretName | quote }}
            key: webhook-url
          {{- if and .Values.alerting.slack .Values.alerting.slack.channel }}
          channel: {{ .Values.alerting.slack.channel | quote }}
          {{- end }}
          sendResolved: true
          title: |-
            {{ `{{ template "slack.default.title" . }}` }}
          text: |-
            {{ `{{ template "slack.default.text" . }}` }}
      {{- else if eq $platform "teams" }}
      # MS Teams classic inbound webhook accepts a generic JSON POST (no native
      # Alertmanager receiver). Connectors that require Adaptive Cards can be
      # bridged by an intermediary; the standard Alertmanager JSON carries full
      # alert context.
      webhookConfigs:
        - urlSecret:
            name: {{ $secretName | quote }}
            key: webhook-url
          {{- if .Values.alerting.webhookTimeout }}
          timeout: {{ .Values.alerting.webhookTimeout | quote }}
          {{- end }}
          sendResolved: true
      {{- else if eq $platform "mattermost" }}
      # Mattermost incoming webhook accepts a generic JSON POST.
      webhookConfigs:
        - urlSecret:
            name: {{ $secretName | quote }}
            key: webhook-url
          {{- if .Values.alerting.webhookTimeout }}
          timeout: {{ .Values.alerting.webhookTimeout | quote }}
          {{- end }}
          sendResolved: true
      {{- else if eq $platform "webhook" }}
      # Generic endpoint accepting Alertmanager's standard JSON notification payload.
      webhookConfigs:
        - urlSecret:
            name: {{ $secretName | quote }}
            key: webhook-url
          {{- if .Values.alerting.webhookTimeout }}
          timeout: {{ .Values.alerting.webhookTimeout | quote }}
          {{- end }}
          sendResolved: true
      {{- else if eq $platform "email" }}
      emailConfigs:
        - to: {{ .Values.alerting.email.to | quote }}
          from: {{ .Values.alerting.email.smtpFrom | quote }}
          smarthost: {{ printf "%s:%s" .Values.alerting.email.smtpHost (.Values.alerting.email.smtpPort | default "587" | toString) | quote }}
          sendResolved: true
          requireTLS: {{ .Values.alerting.email.requireTls | default true }}
          {{- if .Values.alerting.email.smtpPassword }}
          authPassword:
            name: {{ $secretName | quote }}
            key: smtp-password
          {{- end }}
          {{- if .Values.alerting.email.tlsConfig }}
          tlsConfig:
            {{- toYaml .Values.alerting.email.tlsConfig | nindent 12 }}
          {{- end }}
          html: |-
            {{ `{{ template "email.default.html" . }}` }}
      {{- end }}
{{- end }}
