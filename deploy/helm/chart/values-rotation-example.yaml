# Example: zero-downtime rotation of database credentials and signing keys via ESO-synced file mounts.
# Pods reload on file change; the checksum annotation only rolls pods when rendered ExternalSecrets change.

externalSecret:
  enabled: true
  metadata:
    name: statuslist-external-secret
  spec:
    refreshInterval: 5m # Poll frequently for rotation
    secretStoreRef:
      name: vault-cluster-store
      kind: ClusterSecretStore
    target:
      name: statuslist-secret
      creationPolicy: Owner
      template:
        type: Opaque
        data:
          database-password: "{{ .postgres_password }}"
          postgres-password: "{{ .postgres_password }}"
    data:
      - secretKey: postgres_password
        remoteRef:
          key: secret/data/statuslist/production/database
          property: password
    # Names must match statuslist.secretMounts below.
    extraExternalSecrets:
      - metadata:
          name: statuslist-db-credentials
        spec:
          target:
            name: statuslist-db-credentials
            creationPolicy: Owner
          data:
            - secretKey: password
              remoteRef:
                key: secret/data/statuslist/production/database
                property: password
      - metadata:
          name: statuslist-token-keys
        spec:
          target:
            name: statuslist-token-keys
            creationPolicy: Owner
          data:
            - secretKey: statuslist.crt
              remoteRef:
                key: secret/data/statuslist/production/token-keys
                property: certificate
            - secretKey: statuslist.key
              remoteRef:
                key: secret/data/statuslist/production/token-keys
                property: signing_key
      - metadata:
          name: statuslist-api-keys
        spec:
          target:
            name: statuslist-api-keys
            creationPolicy: Owner
          data:
            - secretKey: internal-api-key
              remoteRef:
                key: secret/data/statuslist/production/api
                property: internal_api_key

# The ClusterSecretStore is managed cluster-wide.
secretStore:
  enabled: false

global:
  domain: example.com

statuslist:
  initContainers: []

  fallbackSecret:
    enabled: false

  aws:
    mountCredentials: false

  secretMounts:
    - name: database-credentials
      secretName: statuslist-db-credentials
      mountPath: /etc/secrets/database
      items:
        - key: password
          path: password
      fileEnv:
        APP_DATABASE__PASSWORD_FILE: password

    - name: signing-keys
      secretName: statuslist-token-keys
      mountPath: /etc/secrets/token-keys
      items:
        - key: statuslist.crt
          path: statuslist.crt
        - key: statuslist.key
          path: statuslist.key
      fileEnv:
        APP_SERVER__CERT__STORE__CERTIFICATE_PATH: statuslist.crt
        APP_SERVER__CERT__STORE__SIGNING_KEY_PATH: statuslist.key

    - name: api-keys
      secretName: statuslist-api-keys
      mountPath: /etc/secrets/api
      items:
        - key: internal-api-key
          path: internal-api-key

  watcher:
    pollIntervalSecs: "60"

  env:
    RUST_LOG: "info"
    APP_ENV: "production"
    APP_SERVER__HOST: "0.0.0.0"
    APP_SERVER__PORT: "8000"
    APP_SERVER__DOMAIN: "statuslist.example.com"

    APP_DATABASE__HOST: "statuslist-postgres.example.internal"
    APP_DATABASE__PORT: "5432"
    APP_DATABASE__USERNAME: "statuslist"
    APP_DATABASE__NAME: "statuslist"
    APP_DATABASE__BACKEND: "postgres"
    # The password comes from the mounted file (fileEnv above).

    # Cert and key paths come from the signing-keys fileEnv above.

    # ACME images use DNS-01 instead of static files:
    # APP_SERVER__CERT__ACME_DIRECTORY_URL: "https://acme-v02.api.letsencrypt.org/directory"
    # APP_SERVER__CERT__EMAIL: "ops@example.com"

  ingress:
    enabled: true
    # Defaults to statuslist.<global.domain>.
    externalDnsHostname: ""
    tls:
      # Defaults to *.<global.domain>.
      hosts: []
      secretName: statuslist-tls

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  replicaCount: 3

# Disabled: changing the Secret doesn't change an existing Postgres user's password.
postgres:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  # For EKS IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/statuslist

networkPolicy:
  enabled: true
  ingress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egressInternal: []

opentelemetry-collector:
  enabled: true
  mode: deployment
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  config:
    exporters:
      otlp:
        endpoint: "https://otel-collector.example.com:4317"
        tls:
          insecure: false
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [otlp]

# Rotation procedure and checks: deploy/helm/README.md, "File-Based Secret Mounts and Rotation".
