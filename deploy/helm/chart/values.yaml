global:
  # Sets the default ingress host (statuslist.<domain>) and TLS host (*.<domain>).
  domain: ""
  # Collector export targets; the defaults assume Tempo and Loki in the "monitoring" namespace.
  observability:
    tempo:
      # OTLP/gRPC endpoint (host:port, no scheme) for traces.
      endpoint: "tempo.monitoring.svc.cluster.local:4317"
    loki:
      # Full OTLP/HTTP logs URL, including the /otlp/v1/logs path.
      logsEndpoint: "http://loki-gateway.monitoring.svc.cluster.local/otlp/v1/logs"

# Merged on top of the prometheus.io annotations when those are enabled.
podAnnotations: {}

statuslist:
  enabled: true
  # Waits for the database. deployment.yaml overwrites each entry's resources, volumeMounts and
  # securityContext with hardened defaults; to customize, replace the whole list.
  initContainers:
    - name: wait-for-db
      image: busybox:1.37
      command:
        - "sh"
        - "-c"
        - |
          echo "Waiting for database..."
          until nc -z {{ include "status-list-server-chart.dbHost" . }} {{ include "status-list-server-chart.dbPort" . }}; do
            echo "database not ready. Retrying in 2s...";
            sleep 2;
          done
          echo "Database is up."

  # Ignored when autoscaling is enabled.
  replicaCount: 1
  # Use Recreate when old and new pods must never run side by side.
  strategy:
    type: RollingUpdate
  # Azure Workload Identity needs azure.workload.identity/use: "true" (quoted).
  podLabels: {}
  image:
    repository: ghcr.io/adorsys/status-list-server
    # Precedence: digest, then tag, then <appVersion>-<variant>. Never "latest".
    # Empty pullPolicy means IfNotPresent for digests and Always for tags.
    pullPolicy: ""
    # aws | gcp | azure | vault | fscert (see deploy/helm/README.md). Only Postgres images are published.
    variant: fscert
    tag: ""
    # Each variant has its own digest; an invalid one fails the render.
    digest: ""
  # Off by default: kube-prometheus-stack uses the ServiceMonitor, not these annotations.
  prometheusAnnotations: false
  service:
    enabled: true
    # ClusterIP keeps traffic behind the Ingress TLS.
    type: ClusterIP
    annotations: {}
    port: 8081
    # Must match APP_SERVER__PORT.
    targetPort: 8000
    # Must match APP_SERVER__MANAGEMENT__PORT; only the management Ingress targets it.
    managementPort: 8001
    managementTargetPort: 8001
    # Must match APP_SERVER__ADMIN__PORT; serves /health/ready and /metrics, never behind an Ingress.
    adminPort: 8002
    adminTargetPort: 8002
    # Only for type NodePort (30000-32767).
    nodePort: null
  ingress:
    enabled: true
    path: /
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    tls:
      hosts: []
      # Empty means HTTP only.
      secretName: ""
    # Also becomes APP_SERVER__DOMAIN unless env sets it, so this changes app config too.
    externalDnsHostname: ""
    # Management Ingress, off by default; it routes management paths by regex.
    management:
      enabled: false
      # Hostname for management traffic. Empty reuses the public ingress host.
      hostname: ""
      # A POSIX regex (use-regex): one segment for the list id, end-anchored so nothing longer matches.
      path: "/api/v1/(status-lists/[^/]+/(statuses|allocations)|credentials)$"
      annotations: {}
      tls:
        # Set this for a separate hostname: empty inherits the public secret,
        # whose cert may not cover the management host.
        secretName: ""
  env:
    RUST_LOG: "info"
    APP_ENV: "production"
    # Required in production: a per-deployment audience, different for staging and production.
    APP_MANAGEMENT_AUTH__AUDIENCES: ""
    APP_SERVER__HOST: "0.0.0.0"
    APP_SERVER__PORT: "8000"
    # Service document links (GET /). Defaults to the repository URL.
    # APP_SERVER__LINKS__DOCUMENTATION: "https://github.com/adorsys/status-list-server"
    # APP_SERVER__LINKS__PORTAL: "https://statuslist.example.com"
    # APP_SERVER__DOMAIN comes from statuslist.ingress.externalDnsHostname (or global.domain).
    # APP_SERVER__PUBLIC_BASE_URL defaults to https://{DOMAIN}/api/v1; set it only when it differs.
    # APP_SERVER__PUBLIC_BASE_URL: "https://statuslist.example.com/api/v1"
    APP_SERVER__CERT__ACME_DIRECTORY_URL: "https://acme-v02.api.letsencrypt.org/directory"
    APP_SERVER__CERT__EKU: "1,3,6,1,5,5,7,3,30"
    APP_SERVER__CERT__RENEWAL_CRON_SCHEDULE: "0 0 0 * * *"
    # DNS-01 provider: route53 | cloudflare | gcloud | azure | acmedns (see docs/dns-providers.md).
    # Provider credentials belong in a secret (externalSecret), never in plain env.
    # The chart rejects APP_DATABASE__URL and APP_DATABASE__PASSWORD here; use APP_DATABASE__PASSWORD_FILE.
    # Cache backend: memory or redis (redis needs APP_CACHE__HOST).
    APP_CACHE__BACKEND: "memory"
    # Status-list cache TTL in seconds; "0" disables the cache.
    APP_CACHE__TTL: "300"
    # Memory backend only; Redis expires keys by TTL.
    APP_CACHE__MAX_CAPACITY: "1000"
    # Signed-token cache size in bytes (64 MiB); "0" turns the cache off and every request re-signs.
    APP_TOKEN_BYTES_CACHE__MAX_CAPACITY: "67108864"
    APP_CACHE__TLS: "false"
    # Redis: passwords go in secretEnv or secretMounts; scope its ACL user to APP_CACHE__KEY_PREFIX.
    # Token lifetimes in seconds; TTL must stay below EXP.
    APP_STATUS_LIST__TOKEN_EXP_SECS: "900"
    APP_STATUS_LIST__TOKEN_TTL_SECS: "300"
    APP_RATE_LIMIT__STRICT_BURST_SIZE: "10"
    APP_RATE_LIMIT__STRICT_PERIOD_SECS: "60"
    APP_RATE_LIMIT__PERMISSIVE_BURST_SIZE: "100"
    APP_RATE_LIMIT__PERMISSIVE_PERIOD_SECS: "60"
    APP_LIMITS__MAX_BODY_SIZE_BYTES: "2097152"
    APP_LIMITS__MAX_STATUS_INDEX: "100000"
    APP_LIMITS__MAX_STATUSES_PER_REQUEST: "5000"
    APP_LIMITS__MAX_SERIALIZED_LIST_SIZE: "1048576"
    # 1 to 1000 (one aggregation page). Lists can't be deleted via the API, so leave headroom.
    APP_LIMITS__MAX_LISTS_PER_ISSUER: "1000"
    # Upgrading from a release without the list quota: set "true" for that rollout only,
    # then run list-quota recount and enable (docs/troubleshooting.md).
    # APP_LIMITS__LIST_QUOTA_TRANSITION: "true"
    APP_SERVER__ENABLE_METRICS: "true"
    APP_TELEMETRY__ENVIRONMENT: "production"
    APP_TELEMETRY__SAMPLER_RATIO: "1.0"
  # Mounted as a directory so rotation is picked up without a restart; production needs a volume.
  issuerRegistry:
    path: /etc/status-list-server/issuers.yaml
    # Any volume source (configMap, secret or csi) that holds the file named in path.
    volume: {}
  # Only for the legacy static-credentials path; IRSA needs only serviceAccount annotations.
  aws:
    # Never with IRSA: static credential files win over the web-identity token in the AWS SDK chain.
    mountCredentials: false
    # Rendered as its own ExternalSecret when mountCredentials and externalSecret are both on.
    credentialsSecret:
      remoteKey: "statuslist-aws-credentials"
      credentialsProperty: "CREDENTIALS"
      configProperty: "CONFIG"
      targetTemplate: {}
    # Only used with secretStore.provider=aws; leave empty to let the SDK discover the region.
    region: ""
  # For clusters without ESO. Always named statuslist-secret, which Postgres also reads.
  fallbackSecret:
    enabled: true
    generatedCertificate:
      # Dev only: GitOps renders without cluster lookup and would regenerate it every sync.
      enabled: false
      commonName: localhost
      dnsNames:
        - localhost
      ipAddresses:
        - 127.0.0.1
      certificateKey: statuslist.crt
      signingKey: statuslist.key
    stringData:
      # Empty generates one; under GitOps that means a new password every sync, so set it.
      database-password: ""

  # Mount Secrets as files; fileEnv maps a file to an env var (paths relative to mountPath).
  # The chart refuses APP_DATABASE__PASSWORD; use APP_DATABASE__PASSWORD_FILE. Examples: deploy/helm/README.md.
  secretMounts:
    - name: database-credentials
      secretName: statuslist-secret
      mountPath: /var/run/status-list-server/database
      items:
        # Empty uses statuslist.database.passwordSecretKey.
        - key: ""
          path: password
      fileEnv:
        APP_DATABASE__PASSWORD_FILE: password
  # Env vars from Secret keys (valueFrom.secretKeyRef), e.g. APP_CACHE__PASSWORD.
  secretEnv: {}

  database:
    # Legacy default; switch to database-password once your Secret is sure to have it.
    passwordSecretKey: postgres-password

  # How often mounted secret files are checked for rotation.
  watcher:
    pollIntervalSecs: "30"
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: admin
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  networkPolicy:
    # Off by default. With an empty ingress list it admits any source in the cluster,
    # so restrict it to your ingress controller when you turn it on.
    enabled: false
    ingress: []
    # Empty denies the management port; allow your Ingress controller here if management is exposed.
    managementIngress: []
    # Empty denies the admin port, which silently breaks scraping when serviceMonitor is on.
    # Allow your Prometheus pods, for example:
    #   adminIngress:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: monitoring
    #       podSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: prometheus
    adminIngress: []
    # Appended to the database rule, so these only reach the database port.
    # 443 and 53 are always open to 0.0.0.0/0; this policy doesn't stop exfiltration.
    egressInternal: []
    # Required for MySQL or an external database (then also replace the wait-for-db init container).
    databaseEgress: []
    # Port follows APP_CACHE__PORT, else 6380 with TLS or 6379.
    cacheEgress: []
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Workload Identity also needs a cloud-side trust for system:serviceaccount:<namespace>:<name>,
# so renaming the SA breaks it. Annotation examples: deploy/helm/README.md.
serviceAccount:
  # create=false with no name runs pods as the namespace default SA, which may hold its own cloud role.
  create: true
  name: "" # default: fullname (via _helpers.tpl)
  # Doesn't affect Workload Identity, which uses its own projected token.
  automountServiceAccountToken: false
  annotations: {}
  labels: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  metrics: []

podDisruptionBudget:
  enabled: false
  # Set one. minAvailable >= replicas blocks every node drain; maxUnavailable: 1 is safe.
  minAvailable: null
  maxUnavailable: 1

# If Prometheus also scrapes pod annotations, keep prometheusAnnotations off or samples double.
serviceMonitor:
  enabled: false
  # e.g. release: kube-prometheus-stack
  labels: {}
  interval: ""
  scrapeTimeout: ""
  metricRelabelings: []
  relabelings: []

# Every rule pins namespace="<release namespace>"; keep it or rules read other deployments' data.
prometheusRule:
  enabled: false
  labels: {}

# Found by the Grafana sidecar through the grafana_dashboard label.
grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

# Install kube-prometheus-stack first: these CRDs must exist (AlertmanagerConfig serves only v1alpha1).
# The 30d SLO windows need Prometheus retention over 30 days.
# Don't remote-write OTLP metrics back into the same Prometheus; series would double.
# Alerting platforms, Secret keys and the route tree: deploy/helm/README.md.
alerting:
  enabled: false
  # discord | slack | teams | mattermost | webhook | email
  platform: discord
  # Linked from alert annotations.
  dashboardUrl: "http://localhost:3000/d/status-list-slo"
  slack:
    channel: ""
  labels: {}
  # Use in production. Create it first, with webhook-url plus dms-webhook-url or smtp-password if used.
  existingSecret: ""
  # Never commit a real URL; use existingSecret.
  webhookUrl: ""
  # Dead man's switch: the always-firing Watchdog pings it; empty means nobody notices an outage.
  dmsWebhookUrl: ""
  # For existingSecret setups; the chart can't check that dms-webhook-url exists.
  dmsEnabled: false
  # Go duration; empty keeps Alertmanager's 10s.
  webhookTimeout: ""
  # to, smtpHost and smtpFrom are plain values; only smtpPassword comes from the Secret.
  email:
    to: ""
    smtpHost: ""
    smtpPort: "587"
    smtpFrom: ""
    smtpPassword: ""
    requireTls: true
    tlsConfig: {}

# Keep defaults in sync with deploy/observability/slo/thresholds.json (CI checks this).
# Alert summaries hard-code the default numbers and won't follow changes here.
slo:
  # 0.005 = 0.5% 5xx; also the base for the burn-rate multipliers.
  errorRateTarget: 0.005
  # Pages when both the 1h and 5m rates exceed target x this.
  fastBurnMultiplier: 14.4
  # Warns when both the 6h and 30m rates exceed target x this.
  slowBurnMultiplier: 6.0
  # Seconds.
  requestLatencyP95: 0.3
  # Seconds.
  dbLatencyP95: 0.05
  cacheHitRatioMin: 0.85
  # Unused; kept only for parity with thresholds.json.
  certRenewalFailureMax: 0.01
  # Remaining-budget fraction that pages; the burn settings above also drive token-generation alerts.
  errorBudgetCriticalThreshold: 0.1
  # Seconds left: warn at 14 days, page at 7.
  certExpiryWarnSeconds: 1209600
  certExpiryCriticalSeconds: 604800

postgres:
  # Bundled Postgres. Disabling it doesn't switch the backend: also set APP_DATABASE__BACKEND
  # and APP_DATABASE__HOST, or pods point at a service that no longer exists.
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  auth:
    username: postgres
    database: status-list
    # Must be the app's Secret (statuslist-secret).
    existingSecret: statuslist-secret
    secretKeys:
      passwordKey: postgres-password
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 5432
  image:
    tag: "18.0"

mysql:
  # External MySQL only: this chart never deploys it, and mysql.enabled fails the render.
  # No published image includes MySQL support yet; build one and set statuslist.image.tag.
  auth:
    username: mysql
    database: status-list
  service:
    port: 3306

externalSecret:
  # Mutually exclusive with fallbackSecret.
  # A namespaced SecretStore also needs secretStore.enabled; only a ClusterSecretStore is exempt.
  enabled: false
  metadata:
    name: statuslist-external-secret
  spec:
    refreshInterval: 30m
    secretStoreRef:
      name: statuslist-secret-store
      kind: SecretStore
    target:
      # Fixed; any other name fails the render.
      name: statuslist-secret
      creationPolicy: Owner
      template:
        type: Opaque
        data:
          database-password: "{{ .postgres_password }}"
          postgres-password: "{{ .postgres_password }}"
    data:
      - secretKey: postgres_password
        remoteRef:
          key: statuslist-secret
          property: POSTGRES_PASSWORD
    extraExternalSecrets: []

secretStore:
  enabled: false
  # Provider selector: aws | vault | gcp | azure | raw
  provider: ""
  aws:
    service: SecretsManager # SecretsManager | ParameterStore
    # Set it: ESO otherwise falls back to eu-central-1 and fails elsewhere with SecretSyncedError.
    region: ""
  vault:
    server: ""
    path: "secret"
    auth: {}
  gcp:
    projectID: ""
    auth: {}
  azure:
    tenantId: ""
    vaultUrl: ""
    # ServicePrincipal | ManagedIdentity | WorkloadIdentity ("ClientSecret" is not valid).
    authType: ""
    environmentType: ""
    identityId: ""
    serviceAccountRef:
      name: "" # e.g. eso-controller-sa (WorkloadIdentity) bound to the ESO identity
      # The ESO controller's namespace; empty if it's this release's.
      namespace: ""
    authSecretRef: {}
  # provider=raw only: the body under spec.provider, e.g. webhook: {...}. An empty map is rejected.
  raw: {}

opentelemetry-collector:
  enabled: true
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.158.0"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  serviceAccount:
    automountServiceAccountToken: false
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
    healthcheck:
      enabled: true
      containerPort: 13133
      servicePort: 13133
      protocol: TCP
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: true
  config:
    receivers:
      jaeger: null
      zipkin: null
      prometheus: null
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      otlp/tempo:
        endpoint: '{{ .Values.global.observability.tempo.endpoint }}'
        tls:
          insecure: true
      # No loki exporter since contrib 0.106. Use logs_endpoint: endpoint gets /v1/logs appended and 400s.
      otlphttp/loki:
        logs_endpoint: '{{ .Values.global.observability.loki.logsEndpoint }}'
      # Metrics stay on debug: the ServiceMonitor scrape already feeds Prometheus.
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
