global:
  # Chart-wide public DNS suffix. When set, the default ingress host becomes
  # statuslist.<domain> and the default TLS host becomes *.<domain>.
  # Leave empty for provider-neutral defaults.
  domain: ""

# Optional annotations merged onto the Pod template metadata (top-level, distinct from
# statuslist.podLabels which are merged into the pod LABELS). Consumed by deployment.yaml.
# The chart always emits its own prometheus.io/scrape annotations; these are merged on top.
# Defaults to an empty map; overlays supply the annotations.
podAnnotations: {}

statuslist:
  enabled: true
  # Optional init containers. The default pings the database via `nc -z` using the
  # chart-derived host/port (see the dbHost/dbPort helpers) so the app does not start
  # before the database accepts connections. NOTE: deployment.yaml hardens each entry via
  # mustMergeOverwrite, which REPLACES any `resources`, `volumeMounts`, and securityContext
  # you set here with the chart's hardened defaults (readOnlyRootFilesystem, dropped caps,
  # fixed 50m/100m CPU and 64Mi/128Mi memory, and an /tmp volume). An init container that
  # needs a custom volume mount or more resources cannot be expressed through this list;
  # override the whole `initContainers` block in an overlay that disables the default
  # wait-for-db probe instead.
  initContainers:
    - name: wait-for-db
      image: busybox:1.37
      command:
        - "sh"
        - "-c"
        - |
          echo "Waiting for database..."
          until nc -z {{ include "status-list-server-chart.dbHost" . }} {{ include "status-list-server-chart.dbPort" . }}; do
            echo "database not ready. Retrying in 2s...";
            sleep 2;
          done
          echo "Database is up."

  # Number of application replicas. Omitted when autoscaling.enabled=true so the HPA
  # controls the replica count.
  replicaCount: 1
  # Extra labels merged onto the Pod template metadata. For Azure Workload Identity,
  # specify azure.workload.identity/use: "true" (must be a quoted string, not a boolean).
  podLabels: {}
  image:
    repository: ghcr.io/adorsys/status-list-server
    # Image resolution rules (order of precedence, enforced in deployment.yaml):
    #   1. digest, if set to "sha256:<64 hex chars>" -> image is repository@digest and
    #      pullPolicy defaults to IfNotPresent (content-addressed, immutable). An explicit
    #      value that is not a valid sha256 hex string FAILS the render.
    #   2. tag, if set -> image is repository:<tag> and pullPolicy defaults to Always
    #      (a tag is mutable and may move between releases).
    #   3. both empty -> the chart derives repository:<baseAppVersion>-<variant>, where
    #      baseAppVersion is appVersion with the variant suffix stripped (e.g. appVersion
    #      1.0.1-fscert yields baseAppVersion 1.0.1, and with the default variant fscert
    #      the final derived tag is 1.0.1-fscert). Using "latest" is deliberately avoided
    #      so an upgrade that changes nothing in this chart does not silently change the
    #      running image.
    # pullPolicy below overrides the derived default explicitly.
    pullPolicy: ""
    # Provider/database variant, used only when tag and digest are empty. It selects the
    # variant suffix that is appended to the derived tag. The current release workflow
    # publishes only the PostgreSQL variants below; MySQL-capable images are not yet
    # published, so a MySQL backend requires an explicit statuslist.image.tag or digest.
    #
    # | Variant | Cargo Features | Description | Primary Use Case |
    # |---------|----------------|-------------|------------------|
    # | aws     | postgres,aws | PostgreSQL with AWS Secrets Manager and Route53 DNS | AWS EKS native deployments |
    # | gcp     | postgres,gcp | PostgreSQL with GCP Secret Manager and Cloud DNS | GCP GKE native deployments |
    # | azure   | postgres,azure | PostgreSQL with Azure Key Vault and Azure DNS | Azure AKS native deployments |
    # | vault   | postgres,vault | PostgreSQL with HashiCorp Vault / OpenBao token storage | Vault-backed on-prem or multi-cloud |
    # | fscert  | postgres | PostgreSQL with filesystem-mounted token signing keys | Constrained / air-gapped, external secret injection |
    # Tag format: <version>-<variant> (e.g. 1.2.0-aws). Latest tags: latest-<variant>.
    variant: fscert
    # Explicit image tag (with variant suffix, e.g. 1.2.0-aws). Empty derives the tag from
    # appVersion + statuslist.image.variant as described above.
    tag: ""
    # "sha256:<64 hex chars>". Takes precedence over tag and pins the exact digest CI
    # scanned. Each variant has its own digest; use the digest matching the selected
    # variant. If set, it must be a valid sha256 digest or the render fails.
    digest: ""
  service:
    # Render a Service for the application pod. The Ingress routes to this Service via
    # service.port, and the container listens on service.targetPort.
    enabled: true
    # Kubernetes Service type. ClusterIP keeps traffic behind the Ingress TLS layer;
    # NodePort / LoadBalancer expose it directly (NodePort requires nodePort).
    type: ClusterIP
    # Optional annotations merged onto the Service metadata.
    annotations: {}
    # Service port (port the Ingress / other clients use).
    port: 8081
    # Container port the Service forwards to (matches APP_SERVER__PORT and the pod's
    # http containerPort).
    targetPort: 8000
    # NodePort (30000-32767), required only when service.type=NodePort.
    nodePort: null
  ingress:
    # NGINX Ingress exposing the application. The host defaults to
    # statuslist.<global.domain> when global.domain is set, otherwise localhost; TLS
    # hosts default to *.<global.domain> when global.domain is set, or to the rendered
    # ingress host when tls.secretName is set explicitly.
    enabled: true
    path: /
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    tls:
      # Explicit TLS hostnames. Empty defaults to ["*.<global.domain>"] when global.domain
      # is set, or to the rendered ingress host when secretName is set explicitly.
      hosts: []
      # Empty keeps the neutral default render HTTP-only. Set this in overlays
      # that provide TLS material or cert-manager ingress-shim annotations.
      secretName: ""
    # Ingress hostname. Defaults to statuslist.<global.domain> when global.domain is set,
    # otherwise localhost. Besides emitting the external-dns hostname annotation, this also
    # sets APP_SERVER__DOMAIN (the application's own public domain) when the operator does
    # not set it in statuslist.env, so changing it changes application config, not just DNS.
    externalDnsHostname: ""
  env:
    RUST_LOG: "info"
    APP_ENV: "production"
    APP_SERVER__HOST: "0.0.0.0"
    APP_SERVER__PORT: "8000"
    APP_SERVER__CERT__ACME_DIRECTORY_URL: "https://acme-v02.api.letsencrypt.org/directory"
    APP_SERVER__CERT__EKU: "1,3,6,1,5,5,7,3,30"
    APP_SERVER__CERT__RENEWAL_CRON_SCHEDULE: "0 0 0 * * *"
    # DNS provider for ACME DNS-01 challenges: route53 | cloudflare | gcloud | azure | acmedns
    # (pebble also exists but is a development-only fake, not for deployments)
    # See docs/dns-providers.md for the settings each provider needs.
    # GKE Workload Identity example:
    #   APP_SERVER__CERT__DNS__PROVIDER: "gcloud"
    #   APP_SERVER__CERT__DNS__GCLOUD__PROJECT_ID: "dns-project-id"
    # AKS Workload Identity / managed identity example:
    #   APP_SERVER__CERT__DNS__PROVIDER: "azure"
    #   APP_SERVER__CERT__DNS__AZURE__SUBSCRIPTION_ID: "subscription-id"
    #   APP_SERVER__CERT__DNS__AZURE__RESOURCE_GROUP: "dns-resource-group"
    # Provider credentials (e.g. APP_SERVER__CERT__DNS__CLOUDFLARE__API_TOKEN, or the
    # APP_SERVER__CERT__DNS__ACMEDNS__ACCOUNTS JSON, which holds every account password)
    # must come from a secret (see externalSecret below), not from plain env values.
    # Database connection: APP_DATABASE__BACKEND selects the backend (postgres | mysql,
    # default postgres). APP_DATABASE__HOST, PORT, USERNAME, and NAME default to the active
    # backend's native values below (postgres/mysql) when omitted, and deployment.yaml
    # always renders all four. Iron rules enforced at render time: the chart REJECTS
    # APP_DATABASE__URL and APP_DATABASE__PASSWORD as plain env values (it would expose
    # assembled credentials in pod metadata); database passwords are delivered through
    # statuslist.secretMounts / APP_DATABASE__PASSWORD_FILE or the fallback Secret instead.
    # APP_DATABASE__QUERY is accepted for non-secret driver/TLS parameters (e.g.
    # sslmode=verify-full&sslrootcert=...).
    # Status-list record cache TTL in seconds. "0" disables this cache.
    APP_CACHE__TTL: "300"
    APP_CACHE__MAX_CAPACITY: "1000"
    APP_STATUS_LIST__TOKEN_EXP_SECS: "900"
    APP_STATUS_LIST__TOKEN_TTL_SECS: "300"
    APP_RATE_LIMIT__STRICT_BURST_SIZE: "10"
    APP_RATE_LIMIT__STRICT_PERIOD_SECS: "60"
    APP_RATE_LIMIT__PERMISSIVE_BURST_SIZE: "100"
    APP_RATE_LIMIT__PERMISSIVE_PERIOD_SECS: "60"
    APP_LIMITS__MAX_BODY_SIZE_BYTES: "2097152"
    APP_LIMITS__MAX_STATUS_INDEX: "100000"
    APP_LIMITS__MAX_STATUSES_PER_REQUEST: "5000"
    APP_LIMITS__MAX_SERIALIZED_LIST_SIZE: "1048576"
    # Telemetry / OpenTelemetry
    APP_SERVER__ENABLE_METRICS: "true"
    APP_TELEMETRY__ENVIRONMENT: "production"
    APP_TELEMETRY__SAMPLER_RATIO: "1.0"
  # Optional AWS configuration for the application. The base chart is provider-neutral:
  # Workload Identity (IRSA) is NOT configured by default — you opt in by adding the
  # serviceAccount.annotations below and the cloud-side trust relationship. This block is
  # only needed for the legacy path that mounts static shared-credential files.
  aws:
    # Mount AWS credential files from aws-credentials-secret into the pod.
    # Disabled by default so the base chart stays provider-neutral. Do NOT combine this
    # with IRSA/Workload Identity: in the AWS SDK credential chain shared-credential files
    # are resolved BEFORE web-identity tokens, so mounting static files would silently win
    # with long-lived static keys over the short-lived role token.
    mountCredentials: false
    # When mountCredentials=true and externalSecret.enabled, the chart also
    # renders a second ExternalSecret that provisions "aws-credentials-secret" — the exact Secret
    # the Deployment's credential volume references (see deployment.yaml). Without it the Pod could
    # never mount that volume and would stay unready. The remote source holds the AWS shared
    # "credentials" and "config" file contents.
    credentialsSecret:
      # Remote key in the configured SecretStore that holds both AWS shared files.
      remoteKey: "statuslist-aws-credentials"
      # Property within remoteKey holding the AWS shared credentials file (INI: [default] ...).
      credentialsProperty: "CREDENTIALS"
      # Property within remoteKey holding the AWS shared config file.
      configProperty: "CONFIG"
      # Optional ESO target.template for the dedicated aws-credentials-secret only.
      # The application ExternalSecret target.template is intentionally not reused here.
      targetTemplate: {}
    # Plain (non-secret) AWS region. APP_AWS__REGION is rendered into the pod only when
    # secretStore.provider=aws AND an effective region is set (this value, or the legacy
    # secretStore.aws.region fallback). For pure-IRSA / Workload Identity installs, leave
    # both empty so the region comes from the AWS SDK's instance-metadata discovery rather
    # than being pinned here. Note this field does NOT by itself enable APP_AWS__REGION:
    # it has no effect unless ESO's AWS provider is active.
    region: ""
  # Fallback Kubernetes Secret for clusters that do not run External Secrets Operator.
  # Only rendered when externalSecret.enabled=false AND statuslist.fallbackSecret.enabled=true.
  # Values are plain strings; the API server base64-encodes them (stringData).
  # The secret is always named "statuslist-secret" (single supported name). PostgreSQL
  # (postgres.auth.existingSecret) references the same name, so it is deliberately not
  # independently configurable.
  fallbackSecret:
    enabled: true
    generatedCertificate:
      # Local/dev helper for the fscert image. When enabled, the fallback Secret
      # includes a self-signed certificate and signing key under the keys below.
      # GitOps deployments should not use generated material because helm template
      # runs without cluster lookup and can regenerate values on each sync.
      enabled: false
      commonName: localhost
      dnsNames:
        - localhost
      ipAddresses:
        - 127.0.0.1
      certificateKey: statuslist.crt
      signingKey: statuslist.key
    stringData:
      # Empty means the chart generates a random password. Helm upgrades reuse
      # the existing statuslist-secret password when the cluster is reachable.
      # GitOps tools such as Argo CD and Flux run helm template without cluster
      # lookup access, so an empty value generates a new password on each
      # reconciliation. For GitOps, provide an explicit password from your
      # secret-management flow or set fallbackSecret.enabled=false and use ESO.
      database-password: ""

  # File-based secret mounts for production credential/key rotation.
  # Mounts Kubernetes Secrets as files into the container at specified paths.
  # Use fileEnv to map a mounted file path into an application environment variable.
  # Paths are relative to mountPath and work whether items is present or the whole
  # Secret is mounted. When items is present, each fileEnv value must exactly match one
  # of the normalized items[].path values so the chart cannot point the app at a file
  # Kubernetes will not mount.
  # The chart never injects APP_DATABASE__PASSWORD — it hard-fails if you try to set it,
  # with or without a file. Database passwords are delivered only via the mounted Secret
  # path referenced by APP_DATABASE__PASSWORD_FILE (below) or the fallback Secret.
  # Example:
  # - name: database-credentials
  #   secretName: postgres-access
  #   mountPath: /etc/secrets/database
  #   items:
  #     - key: password
  #       path: password
  #   fileEnv:
  #     APP_DATABASE__PASSWORD_FILE: password
  # - name: signing-keys
  #   secretName: statuslist-token-keys
  #   mountPath: /etc/secrets/token-keys
  #   items:
  #     - key: statuslist.crt
  #       path: statuslist.crt
  #     - key: statuslist.key
  #       path: statuslist.key
  #   fileEnv:
  #     APP_SERVER__CERT__STORE__CERTIFICATE_PATH: statuslist.crt
  #     APP_SERVER__CERT__STORE__SIGNING_KEY_PATH: statuslist.key
  secretMounts:
    - name: database-credentials
      secretName: statuslist-secret
      mountPath: /var/run/status-list-server/database
      items:
        # Empty means deployment.yaml renders statuslist.database.passwordSecretKey.
        # That defaults to the legacy key so upgrades keep working when statuslist-secret
        # is customer-managed or a custom ESO mapping still emits only postgres-password.
        # The chart-managed fallback Secret and default ExternalSecret emit both
        # postgres-password and database-password; switch this key to database-password
        # or set statuslist.database.passwordSecretKey once your secret-delivery path
        # guarantees that key exists.
        - key: ""
          path: password
      fileEnv:
        APP_DATABASE__PASSWORD_FILE: password

  database:
    # Default Secret key used when a database password item omits `key`.
    # Existing deployments keep the legacy postgres-password key by default.
    # MySQL operators can set this to database-password only after their Secret
    # provisioning guarantees that key exists.
    passwordSecretKey: postgres-password

  # Watcher configuration for file-based credential rotation detection.
  # When pollIntervalSecs is set, APP_WATCHER__POLL_INTERVAL_SECS is injected.
  # This requires an application image that implements the file watcher contract
  # (polls mounted secret files and swaps credentials/pools without restart); the current
  # published images do not watch files yet, so paths propagate but are loaded at startup.
  watcher:
    pollIntervalSecs: "30"
  livenessProbe:
    # HTTP GET on /health/live (port http). Override the whole block to customize.
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    # HTTP GET on /health/ready (port http). Override the whole block to customize.
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  networkPolicy:
    # WARNING: default OFF. Enabling this renders a Kubernetes NetworkPolicy, and with an
    # empty `ingress` the service-port ingress rule allows ANY source in the cluster (a
    # port-only rule with no `from` is equivalent to no ingress restriction). If you enable
    # it, you MUST restrict ingress to your ingress controller, e.g.:
    #   ingress:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: ingress-nginx
    enabled: false
    # When ingress is empty [] (and enabled=true), ANY source can reach the service port.
    # Add podSelector/namespaceSelector/ipBlock entries to restrict sources.
    ingress: []
    # Additional internal egress destinations. IMPORTANT: these entries are appended to the
    # DATABASE egress rule (the one scoped to the DB port), so each inherits the database
    # port and can only reach that port — a selector for e.g. a cache on 6379 will be
    # silent. Use a separate NetworkPolicy (not this chart) for arbitrary internal ports.
    # External ports 443/53 are always allowed with NO destination restriction (open to
    # 0.0.0.0/0 — this policy does not constrain outbound exfiltration).
    egressInternal: []
    # Explicit database egress destinations. Optional for bundled PostgreSQL, where
    # the chart can select postgres pods in-namespace. Required when
    # APP_DATABASE__BACKEND=mysql or the database is external (RDS, Cloud SQL, another
    # namespace, operator-managed cluster) — because this chart does not deploy MySQL, it
    # cannot infer the target. For an external database, also clear/override the
    # statuslist.initContainers wait-for-db probe, which by default pings the in-cluster
    # Postgres host derived by the dbHost helper.
    databaseEgress: []
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ServiceAccount for the application pods. Used to attach Workload Identity role annotations
# (EKS IRSA: eks.amazonaws.com/role-arn, GCP WI, Azure WI) for ambient cloud credentials.
#
# Workload Identity needs BOTH halves: the annotations below (annotation half) AND the
# cloud-side trust relationship (permissions half), which is keyed on the SERVICE ACCOUNT
# NAME this chart derives (default: the chart fullname, see the serviceAccountName helper
# in _helpers.tpl). Keeping these in sync matters — changing the SA name breaks the
# trust relationship unless the cloud identity is updated to match.
#   EKS: IAM role trust policy with  sub = system:serviceaccount:<namespace>:<sa>
#        (EKS Pod Identity is an alternative to IRSA: create a pod identity association
#        bound to the SA instead of annotating a role ARN).
#   GKE: bind roles/iam.workloadIdentityUser on the Google service account to
#        serviceAccount:<project>.svc.id.goog[<namespace>/<sa>].
#   AKS: a federated identity credential on the managed identity with the same subject.
serviceAccount:
  # create=true renders the ServiceAccount and injects serviceAccountName (default: chart
  # fullname, or the value of `name`). create=false with an empty `name` injects NO
  # serviceAccountName, so the pod runs as the namespace default ServiceAccount (which may
  # carry its own cloud role); set `name` explicitly when disabling chart SA creation.
  create: true
  name: "" # default: fullname (via _helpers.tpl)
  # Default false: the application does not need to call the Kubernetes API, so do not
  # mount the SA bearer token (NSA/CISA Kubernetes hardening, CIS Benchmark 5.1.6).
  # This does NOT break Workload Identity — IRSA / GCP WI / Azure WI use projected OIDC
  # tokens injected by the cloud admission webhook, independent of this setting.
  automountServiceAccountToken: false
  annotations: {}
  # EKS IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/status-list-server
  # GKE Workload Identity:
  #   iam.gke.io/gcp-service-account: status-list-server@dns-project-id.iam.gserviceaccount.com
  # AKS Workload Identity:
  #   azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
  labels: {}

# HorizontalPodAutoscaler (autoscaling/v2). When enabled, the Deployment's `replicas`
# is omitted so HPA controls the replica count. Scaled Pods share the application
# ServiceAccount; each Pod receives its own short-lived Workload Identity token, so no
# per-Pod cloud registration is required.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  metrics: []
  # behavior: {}

# PodDisruptionBudget (policy/v1). Use with replicaCount > 1 / HPA so disruption events
# (node drains, voluntary evictions) keep the minimum number of replicas available.
podDisruptionBudget:
  enabled: false
  # Set exactly one of minAvailable / maxUnavailable (int, percentage string, or null).
  # WARNING: minAvailable must be < replicaCount (or < autoscaling.minReplicas when HPA
  # is enabled); setting it equal to or greater than the replica count blocks ALL voluntary
  # pod evictions (node drains, cluster upgrades) indefinitely. The SAFE DEFAULT is
  # maxUnavailable: 1, which allows one voluntary eviction regardless of replica count.
  # An explicit 0 is preserved (valid: prevents voluntary disruptions); only an explicit
  # null counts as "unset".
  minAvailable: null
  maxUnavailable: 1

# ServiceMonitor (monitoring.coreos.com/v1) for Prometheus Operator scrape discovery.
# Prometheus deployments driven by the Prometheus Operator discover scrape targets through
# ServiceMonitor CRs rather than annotation-based targets; enabling this defines the
# /metrics scrape endpoint on the application Service. Set labels.release to match your
# Prometheus ServiceMonitorSelector. If Prometheus also does annotation discovery, the pod
# may be scraped twice (doubled samples/cost).
serviceMonitor:
  enabled: false
  # Additional labels required by your Prometheus Operator (e.g. release: kube-prometheus-stack)
  labels: {}
  # Scrape interval override (e.g. "15s"). Empty uses the Operator default.
  interval: ""
  # Scrape timeout (e.g. "10s"). Empty uses the Operator default.
  scrapeTimeout: ""
  # Additional metric relabelings applied to scraped metrics.
  metricRelabelings: []
  # Additional target relabelings applied before scraping.
  relabelings: []

# PrometheusRule (monitoring.coreos.com/v1) for kube-prometheus-stack / Prometheus
# Operator rule discovery.
# Enables shipping the SLI recording rules (request latency, error rate, DB latency, cache
# hit ratio, token generation, error budget) and the SLO burn-rate / error-budget alerting
# rules as a single PrometheusRule CRD. Alert thresholds are defined under the `slo` block
# and must stay in lockstep with deploy/observability/slo/thresholds.json (enforced by CI)
# and the standalone deploy/observability/prometheus/rules/*.rules.yml.
prometheusRule:
  enabled: false
  # Additional labels required by your Prometheus Operator (e.g. release: kube-prometheus-stack)
  labels: {}

# AlertmanagerConfig for kube-prometheus-stack / Prometheus Operator alert routing.
# When enabled, renders an AlertmanagerConfig CRD that routes SLO alerts to the
# configured notification channel. This is the Kubernetes equivalent of the Docker
# Compose ALERTMANAGER_PLATFORM + generate-alertmanager-config.sh setup — the same
# six platforms are supported and no webhook URL is committed to source control.
#
# Supported platforms (alerting.platform):
#   discord     -> alerting.webhookUrl  (Discord channel webhook URL)
#   slack       -> alerting.webhookUrl  (Slack incoming-webhook URL)
#   teams       -> alerting.webhookUrl  (MS Teams classic inbound webhook; posts Alertmanager's
#                 generic JSON, not an Adaptive Card — see deploy/observability/runbooks/webhook-notifications.md
#                 for the rendering limitation and bridge options)
#   mattermost  -> alerting.webhookUrl  (Mattermost incoming webhook)
#   webhook     -> alerting.webhookUrl  (generic endpoint accepting Alertmanager JSON)
#   email       -> alerting.email.*     (SMTP settings)
#
# Credential model:
#   By default (existingSecret: "") the chart renders its own Secret from the inline
#   values (webhookUrl). For production, set existingSecret to the name of
#   a pre-existing Secret (e.g. managed by ESO or Vault) — the chart then reads from
#   that Secret and does NOT render its own. The pre-existing Secret must contain the
#   following keys depending on the platform:
#     webhook-based platforms: "webhook-url"
#     dead-man's-switch:       "dms-webhook-url" (optional)
#     email SMTP auth:         "smtp-password" (optional, only when alerting.email.smtpPassword is set)
#   Email `to`/`smtpFrom`/`smtpHost` are rendered as plain string values (the
#   EmailConfig CRD types them as strings, not Secret selectors) and are therefore
#   NOT read from the Secret.
#
# Route tree (mirrors generate-alertmanager-config.sh):
#   severity=none  -> deadmansswitch receiver (Watchdog — pages on ABSENCE, not firing)
#   severity=page  -> human receiver, repeat every 4h
#   severity=warn  -> human receiver, repeat every 24h
#   everything else -> noop sink (never spams a human channel)
#
# Labels: add any extra labels required by your Alertmanager selector, e.g.
#   labels:
#     release: kube-prometheus-stack
alerting:
  enabled: false
  # Platform selector — must match one of the supported values above.
  platform: discord
  # Grafana dashboard URL injected into alert annotations (e.g. http://grafana.example.com/d/status-list-slo).
  dashboardUrl: "http://localhost:3000/d/status-list-slo"
  # Optional Slack channel override (e.g. "#alerts"). Leave empty to use the webhook default channel.
  slack:
    channel: ""
  # Additional labels for the AlertmanagerConfig (e.g. release: kube-prometheus-stack).
  labels: {}
  # Name of a pre-existing Secret containing credentials. When set, the chart does NOT
  # render its own Secret. Leave empty to let the chart manage the Secret from inline values.
  #
  # IMPORTANT: The referenced Secret MUST already exist in the namespace before install/upgrade
  # (e.g. provisioned by ESO, Vault, or your GitOps flow). Kubernetes does not hot-reload Secret
  # consumers on content changes: updating a webhook URL inside the Secret requires the
  # Alertmanager pod to reload the referenced secretKeyRef. kube-prometheus-stack / the Prometheus
  # Operator watches Secret changes and triggers an Alertmanager reload automatically, so in most
  # installs a URL rotation takes effect without manual intervention (restart the Alertmanager
  # StatefulSet if your operator version does not auto-reload). Always create the Secret before
  # deploying the chart to avoid a failing AlertmanagerConfig / pending pod.
  existingSecret: ""
  # Inline webhook URL (used for discord, slack, teams, mattermost, webhook platforms).
  # Never commit real tokens — use existingSecret + ESO/Vault in production.
  webhookUrl: ""
  # Optional dead-man's-switch URL. The always-firing Watchdog (severity=none) pings this
  # URL so a collapsed Prometheus/Alertmanager pipeline is detected by its ABSENCE. When
  # empty the Watchdog is silently absorbed and never reaches a human channel.
  dmsWebhookUrl: ""
  # Explicitly enable Dead Man's Switch when using existingSecret (reads key "dms-webhook-url"
  # from existingSecret). When dmsWebhookUrl is set above, DMS is enabled implicitly.
  #
  # When DMS is enabled with existingSecret, the "dms-webhook-url" key MUST be present in that
  # Secret. The chart cannot verify the key exists at render time (it is not readable without a
  # cluster lookup), so an absent key surfaces as a failing/runtime error in the Alertmanager
  # webhook. Keep this key present and correct in the provisioning path that manages the Secret.
  dmsEnabled: false
  # Per-request timeout for webhook/Teams/Mattermost receivers (Alertmanager default is 10s).
  # Applies to the generic `webhook`, `teams`, and `mattermost` platforms and to the
  # dead-man's-switch receiver. Set to a Go duration string (e.g. "10s", "2m").
  webhookTimeout: ""
  # Email settings (required only when platform=email).
  # NOTE: The AlertmanagerConfig EmailConfig CRD defines `to`, `smarthost`, and `from` as plain
  # strings (not Secret selectors), so these are rendered directly from values — they are NOT read
  # from the Secret. Only the SMTP password (when set) is read from the Secret via `smtp-password`.
  email:
    to: ""
    smtpHost: ""
    smtpPort: "587"
    smtpFrom: ""
    # Optional SMTP AUTH password. When set, it is stored in the alerting Secret under the key
    # "smtp-password" (chart-managed Secret) or must be present as "smtp-password" in
    # alerting.existingSecret, and is referenced via EmailConfig.authPassword. Leave empty to
    # disable SMTP AUTH.
    smtpPassword: ""
    requireTls: true
    # Optional SMTP TLS verification options (certificate handling). Rendered into the
    # emailConfig tlsConfig when set. Empty disables custom TLS settings.
    # Example:
    #   tlsConfig:
    #     insecureSkipVerify: false
    tlsConfig: {}

# Configurable SLO target thresholds for the PrometheusRule alerting rules
# (templates/prometheusrule.yaml). Values in this block move the alert thresholds, but the
# rule template renders some of them through printf "%.3f" (so very small errorRateTargets
# can round down) and the alert summary strings are hard-coded text (e.g. "300ms",
# "14.4x over 0.5%", "85%") that does NOT update when you change a threshold here.
# The values.yaml defaults must stay in lockstep with
# deploy/observability/slo/thresholds.json and the standalone
# deploy/observability/prometheus/rules/*.rules.yml; the CI lint compares the defaults but
# does not re-read this template or the hard-coded summaries.
slo:
  # Acceptable ratio of 5xx responses to all requests over the SLO window (0.005 = 0.5%).
  # Used as the multiplicand of the burn-rate multipliers (threshold = target x multiplier)
  # and as the denominator of the error-budget success ratio.
  errorRateTarget: 0.005
  # Fast-burn alert triggers when the observed rate exceeds errorRateTarget x this (14.4x)
  # on both the 1h and 5m windows for 5m. Pages.
  fastBurnMultiplier: 14.4
  # Slow-burn alert triggers when the observed rate exceeds errorRateTarget x this (6.0x)
  # on the 6h and 30m windows for 30m. Warns.
  slowBurnMultiplier: 6.0
  # Request latency P95 SLO target in seconds (0.3 = 300ms), fast- and slow-burn gates.
  requestLatencyP95: 0.3
  # Database query latency P95 SLO target in seconds (0.05 = 50ms).
  dbLatencyP95: 0.05
  # Minimum acceptable status-list cache hit ratio (0.85 = 85%).
  cacheHitRatioMin: 0.85
  # Retained for reference / parity: this value is NOT used by any template or rule.
  certRenewalFailureMax: 0.01
  # Remaining-error-budget gate for the ErrorBudget*Critical page alerts (0.1 = 10%).
  # NOTE: errorRateTarget/fastBurnMultiplier/slowBurnMultiplier also drive the
  # token-generation alerts and budget, not just the HTTP SLO.
  errorBudgetCriticalThreshold: 0.1
  # Certificate expiry gates (seconds remaining until the certificate expires).
  # Warn at <=14d, page at <=7d: cert renewal is a discrete low-frequency event,
  # so alerts watch the continuous cert_time_to_expiry_seconds gauge instead of
  # a rate() over a fixed window (which is 0/0 = NaN between renewals).
  certExpiryWarnSeconds: 1209600
  certExpiryCriticalSeconds: 604800

postgres:
  # Bundled in-cluster PostgreSQL (the CloudPirates subchart). This is the application's
  # default backend. The chart maps these values onto the pod env regardless of
  # postgres.enabled: when APP_DATABASE__BACKEND is unset it defaults to "postgres", HOST
  # is derived from the release name (<release>-postgres.<namespace>.svc.cluster.local),
  # and only USERNAME/NAME come from postgres.auth. Note that if you explicitly set
  # APP_DATABASE__BACKEND=mysql while postgres.enabled=true, the chart FAILS (postgres
  # requires the postgres backend), rather than overriding your value. To use MySQL or
  # another backend, set postgres.enabled=false AND APP_DATABASE__BACKEND+APP_DATABASE__HOST
  # (see mysql below and docs/database-backends.md). WARNING: merely disabling postgres
  # without switching the backend leaves APP_DATABASE__BACKEND=postgres and points the pod
  # at the in-cluster postgres service, which no longer exists — always set the backend
  # explicitly when you disable postgres.
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  auth:
    username: postgres
    database: status-list
    # Must reference the same secret the application reads (see _helpers.tpl
    # "status-list-server-chart.appSecretName"). In fallback (no-ESO) mode the chart
    # renders a Secret named "statuslist-secret" (single supported name), so this stays
    # fixed. In ESO mode keep it in sync with externalSecret.spec.target.name.
    existingSecret: statuslist-secret
    secretKeys:
      passwordKey: postgres-password
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 5432
  image:
    tag: "18.0"

mysql:
  # External MySQL connection defaults used by deployment.yaml, initContainers, and
  # NetworkPolicy ports when APP_DATABASE__BACKEND=mysql. This chart does not vendor
  # or deploy a MySQL database; set APP_DATABASE__HOST to your external Service/host,
  # provide that target through your platform/operator or a values overlay, and set
  # postgres.enabled=false. NOTE: the application supports MySQL, but NO published image
  # variant is built with the mysql feature yet — a MySQL deployment needs an explicit
  # statuslist.image.tag or digest for a MySQL-capable image you build and supply, plus a
  # cleared/overridden initContainers probe and networkPolicy.databaseEgress when the
  # NetworkPolicy is enabled.
  auth:
    username: mysql
    database: status-list
  service:
    port: 3306

externalSecret:
  # External Secrets Operator (ESO) delivery mode, mutually exclusive with
  # statuslist.fallbackSecret (the chart fails if both are enabled). When enabled, the
  # chart renders an ExternalSecret that syncs the application Secret (always named
  # statuslist-secret, holder of the database password) from the secret manager referenced
  # by secretStore. Cloud credential resolution here depends on how ESO is configured:
  # Workload Identity / IRSA / ManagedIdentity where the provider supports it, but Vault
  # token auth and Azure ServicePrincipal use static secrets instead. IMPORTANT: with a
  # namespaced SecretStore, externalSecret.enabled REQUIRES secretStore.enabled (the render
  # fails otherwise); only a pre-existing ClusterSecretStore is exempt.
  enabled: false
  metadata:
    name: statuslist-external-secret
  spec:
    refreshInterval: 30m
    secretStoreRef:
      name: statuslist-secret-store
      kind: SecretStore
    target:
      # Single supported application-secret name (statuslist-secret), shared with the
      # Deployment, PostgreSQL (postgres.auth.existingSecret), and the fallback Secret.
      # A custom value fails at render time; this field is intentionally not configurable.
      name: statuslist-secret
      creationPolicy: Owner
      template:
        type: Opaque
        data:
          database-password: "{{ .postgres_password }}"
          postgres-password: "{{ .postgres_password }}"
    data:
      - secretKey: postgres_password
        remoteRef:
          key: statuslist-secret
          property: POSTGRES_PASSWORD
    # Optional additional ExternalSecret resources for separately mounted Secrets,
    # for example file-based database credentials, token signing keys, or API keys.
    # Each entry renders as its own ExternalSecret and may override refreshInterval
    # and secretStoreRef; defaults come from externalSecret.spec.
    extraExternalSecrets: []

secretStore:
  enabled: false
  # Provider selector: aws | vault | gcp | azure | raw
  provider: ""
  aws:
    service: SecretsManager # SecretsManager | ParameterStore
    # AWS region for the ESO AWS SecretStore. This is a real ESO default, not a formality:
    # ESO calls Secrets Manager in this region, and when both this and statuslist.aws.region
    # are empty it falls back to eu-central-1 at the CR level, so a cluster in another region
    # fails with SecretSyncedError unless the region is set. APP_AWS__REGION is injected into
    # the pod ONLY when secretStore.provider=aws AND an effective region is set (this value,
    # or the statuslist.aws.region fallback via the appRegion helper). For pure-IRSA /
    # Workload Identity installs leave both empty so the SDK discovers the region from
    # instance metadata, but note the SecretStore CR itself still needs an explicit region.
    region: ""
  vault:
    server: ""
    path: "secret"
    auth: {}
  gcp:
    projectID: ""
    auth: {}
  azure:
    tenantId: ""
    vaultUrl: ""
    # Azure authType per the External Secrets Operator AzureKVProvider CRD:
    # ServicePrincipal | ManagedIdentity | WorkloadIdentity. Managed identity
    # selection uses identityId; ServicePrincipal client credentials go under
    # authSecretRef. (authType "ClientSecret" is not a valid CRD value.)
    authType: ""
    environmentType: ""
    identityId: ""
    serviceAccountRef:
      name: "" # e.g. eso-controller-sa (WorkloadIdentity) bound to the ESO identity
      # namespace: should match the External Secrets Operator controller namespace.
      # Leave empty when ESO is deployed in the same namespace as this release (the default).
      namespace: ""
    authSecretRef: {}
  # Full ESO provider spec passthrough for unsupported providers (when provider=raw).
  # secretStore.raw holds ONLY the concrete provider body rendered directly under
  # spec.provider (no extra top-level 'provider' key), e.g.:
  #   raw:
  #     webhook:
  #       url: ...
  # 'raw: {}' is rejected to avoid silently emitting an empty/insecure SecretStore.
  raw: {}

opentelemetry-collector:
  enabled: true
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.158.0"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  serviceAccount:
    # The collector uses only OTLP receivers and has no Kubernetes API access needs.
    # Disabling automounting keeps the pod least-privileged.
    automountServiceAccountToken: false
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
    healthcheck:
      enabled: true
      containerPort: 13133
      servicePort: 13133
      protocol: TCP
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: true
  config:
    receivers:
      jaeger: null
      zipkin: null
      prometheus: null
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      # 'debug' is development scaffolding (prints telemetry to stdout).
      # IMPORTANT: Operators MUST configure production exporters before deploying to production.
      debug:
        verbosity: basic
      # PRODUCTION EXPORTER EXAMPLES:
      # Un-comment and configure the appropriate sink for your infrastructure:
      #
      # Traces (e.g. Jaeger / Grafana Tempo via OTLP gRPC):
      # otlp/tempo:
      #   endpoint: "tempo.monitoring.svc.cluster.local:4317"
      #   tls:
      #     insecure: true
      #
      # Metrics (e.g. Prometheus Remote Write):
      # prometheusremotewrite:
      #   endpoint: "http://prometheus-k8s.monitoring.svc.cluster.local:9090/api/v1/write"
      #
      # Logs (e.g. Grafana Loki):
      # loki:
      #   endpoint: "http://loki-gateway.monitoring.svc.cluster.local:3100/loki/api/v1/push"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
