# Chart-wide settings applied to every resource in this release.
global:
  # Chart-wide public DNS suffix. When set, the default ingress host becomes
  # statuslist.<domain> and the default TLS host becomes *.<domain>.
  # Leave empty for provider-neutral defaults.
  domain: ""

# statuslist: the application core. All fields under this key configure the
# status-list-server Deployment, its Pod, Service, Ingress, secrets, and runtime env.
# The base chart is provider-neutral: cloud-specific behavior (AWS/GCP/Azure Workload
# Identity, per-cloud DNS, per-cloud SecretStore) is selected through the overlays listed
# in deploy/helm/README.md (values-aws.yaml, values-aws-nlb.yaml, values-external-secrets.yaml,
# values-production.yaml) rather than baked into these defaults.
statuslist:
  enabled: true
  # initContainers run before the application container. The default waits for the
  # bundled PostgreSQL service to accept connections on the database port derived from
  # APP_DATABASE__PORT (see the status-list-server-chart.dbPort helper). If you disable
  # the bundled PostgreSQL, you MUST override this block (the default waits on
  # <release>-postgres forever). Each init container is hardened (drop-all capabilities,
  # non-root, read-only rootfs, /tmp emptyDir) and given small fixed CPU/memory
  # requests/limits regardless of the values provided here, so operators only supply the
  # wait command and image. CAUTION: the chart merges the container spec with these
  # hardened defaults using mustMergeOverwrite, which silently REPLACES any
  # user-supplied volumeMounts and resources on an init container — a mount you add here
  # is dropped without warning, so do not add volumeMounts to init containers.
  initContainers:
    - name: wait-for-postgres
      image: busybox:1.37
      command:
        - "sh"
        - "-c"
        - |
          echo "Waiting for postgres..."
          until nc -z {{ .Release.Name }}-postgres.{{ .Release.Namespace }}.svc.cluster.local {{ include "status-list-server-chart.dbPort" . }}; do
            echo "postgres not ready. Retrying in 2s...";
            sleep 2;
          done
          echo "Postgres is up."

  # Number of application replicas. Omitted when autoscaling.enabled=true so the HPA
  # controls the replica count.
  replicaCount: 1
  # Extra labels merged onto Pod metadata. For Azure Workload Identity, specify
  # azure.workload.identity/use: "true" (must be a quoted string, not a boolean).
  podLabels: {}
  image:
    repository: ghcr.io/adorsys/status-list-server
    # Empty derives from which resolution is in use (digest -> IfNotPresent, tag -> Always).
    pullPolicy: ""
    # Used only when tag and digest are empty. The chart derives
    # <appVersion-without-suffix>-<variant>, so overlays can select a cloud
    # variant without hardcoding the release version.
    variant: fscert
    # Image tag with variant suffix. The release workflow publishes 5 multi-arch variants:
    #
    # | Tag Suffix | Cargo Features | Description | Primary Use Case |
    # |------------|----------------|-------------|------------------|
    # | -aws       | postgres,aws | PostgreSQL database with AWS Secrets Manager and Route53 DNS support | AWS EKS native deployments |
    # | -gcp       | postgres,gcp | PostgreSQL database with GCP Secret Manager and Cloud DNS support | GCP GKE native deployments |
    # | -azure     | postgres,azure | PostgreSQL database with Azure Key Vault and Azure DNS support | Azure AKS native deployments |
    # | -vault     | postgres,vault | PostgreSQL database with HashiCorp Vault / OpenBao token material storage | Vault-backed on-prem or multi-cloud deployments |
    # | -fscert    | postgres | PostgreSQL database with filesystem-mounted token signing keys and certificates | Constrained / air-gapped environments using external secret injection |
    #
    # Tag format: <version>-<suffix> (e.g., 1.2.0-aws, 1.2.0-gcp)
    tag: ""
    # "sha256:...". Takes precedence over tag and pins the exact digest CI scanned.
    # Each variant has its own digest. Use the digest from the variant you select.
    digest: ""
    # Image resolution rules (single authoritative reference — order of precedence):
    #   1. digest, if set to "sha256:<64 hex chars>" -> image is repository@digest and
    #      pullPolicy defaults to IfNotPresent (content-addressed, immutable).
    #      An invalid digest does NOT fall through to tag/derived: it fails the render.
    #   2. tag, if set -> image is repository:<tag> and pullPolicy defaults to Always
    #      (tag is mutable and may move).
    #   3. both empty -> the chart derives repository:<baseAppVersion>-<variant>, where
    #      baseAppVersion strips the variant suffix from appVersion (e.g. for appVersion
    #      1.0.1-fscert, baseAppVersion becomes 1.0.1, and the default variant fscert
    #      yields a final derived tag of 1.0.1-fscert). The chart never falls back to
    #      "latest", so an upgrade that changes nothing in the chart cannot silently
    #      advance the running image.
    # An empty pullPolicy derives from which case is in use; set it explicitly to override.
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
    port: 8081
    targetPort: 8000
    nodePort: null
  ingress:
    # NGINX Ingress exposing the application Service. The ingressClassName is hard-coded
    # to "nginx", so if another ingress controller or a service mesh handles external
    # traffic the only option is to disable this block (enabled: false).
    enabled: true
    # Path and pathType for the single ingress rule.
    path: /
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    tls:
      # Defaults to ["*.<global.domain>"] when global.domain is set, or to the
      # rendered ingress host when secretName is set explicitly.
      hosts: []
      # Empty keeps the neutral default render HTTP-only. Set this in overlays
      # that provide TLS material or cert-manager ingress-shim annotations.
      secretName: ""
    # Defaults to statuslist.<global.domain> when global.domain is set, otherwise localhost.
    # Emitted as an external-dns hostname annotation AND sets the application's own public
    # domain (APP_SERVER__DOMAIN, via deployment.yaml) when it is non-empty and
    # APP_SERVER__DOMAIN is not set explicitly — changing what reads like a DNS annotation
    # also changes application config. Set to override the default host.
    externalDnsHostname: ""
  env:
    RUST_LOG: "info"
    APP_ENV: "production"
    APP_SERVER__HOST: "0.0.0.0"
    APP_SERVER__PORT: "8000"
    APP_SERVER__CERT__ACME_DIRECTORY_URL: "https://acme-v02.api.letsencrypt.org/directory"
    APP_SERVER__CERT__EKU: "1,3,6,1,5,5,7,3,30"
    APP_SERVER__CERT__RENEWAL_CRON_SCHEDULE: "0 0 0 * * *"
    # DNS provider for ACME DNS-01 challenges: route53 | cloudflare | gcloud | azure | acmedns
    # (pebble also exists but is a development-only fake, not for deployments)
    # See docs/dns-providers.md for the settings each provider needs.
    #
    # Workload Identity DNS setup per cloud — combine the provider env vars below with the
    # matching serviceAccount.annotations and podLabels documented under serviceAccount,
    # plus the cloud SecretStore under secretStore:
    #   AWS EKS (IRSA) : APP_SERVER__CERT__DNS__PROVIDER=route53, and the EKS IRSA role
    #                    annotation eks.amazonaws.com/role-arn on the application
    #                    ServiceAccount; route53 credentials resolve via the role.
    #   GCP GKE (WI)   : APP_SERVER__CERT__DNS__PROVIDER=gcloud
    #                    APP_SERVER__CERT__DNS__GCLOUD__PROJECT_ID: "dns-project-id"
    #                    and the annotation iam.gke.io/gcp-service-account on the
    #                    application ServiceAccount (GKE Workload Identity).
    #   Azure AKS (WI) : APP_SERVER__CERT__DNS__PROVIDER=azure, plus the subscription /
    #                    resource-group identifiers:
    #                    APP_SERVER__CERT__DNS__AZURE__SUBSCRIPTION_ID: "subscription-id"
    #                    APP_SERVER__CERT__DNS__AZURE__RESOURCE_GROUP: "dns-resource-group"
    #                    and the azure.workload.identity/client-id annotation on the
    #                    application ServiceAccount plus the pod label
    #                    azure.workload.identity/use: "true".
    #   On-prem / other: APP_SERVER__CERT__DNS__PROVIDER=acmedns (or cloudflare) is
    #                    supported where a token/account is supplied.
    #
    # CLOUD-SIDE TRUST RELATIONSHIP (the half operators cannot derive on their own). The
    # annotations above assume a cloud identity already trusts this workload, keyed on the
    # ServiceAccount name this chart creates: it defaults to the chart fullname
    # (<release>-status-list-server unless release already contains "status-list-server",
    # or fullnameOverride if set — see _helpers.tpl). The federated subject is therefore:
    #     system:serviceaccount:<release-namespace>:<that-serviceaccount-name>
    # Create the matching trust on the cloud side:
    #   EKS (IRSA) : IAM role trust policy -> "system:serviceaccount:<ns>:<sa>"; attach the
    #                route53 policy to that role.
    #   GKE (WI)   : bind roles/iam.workloadIdentityUser to the target Google SA for
    #                principalSet: //iam.googleapis.com/projects/<proj>/locations/global/
    #                workloadIdentityPools/<pool>/subject/system:serviceaccount:<ns>:<sa>.
    #   AKS (WI)   : create a federated identity credential whose subject is the same
    #                "system:serviceaccount:<ns>:<sa>".
    # Also consider EKS Pod Identity as an alternative to IRSA (the direction AWS now
    # pushes); it uses a different annotation (eks.amazonaws.com/role-arn is IRSA only).
    # Provider credentials (e.g. APP_SERVER__CERT__DNS__CLOUDFLARE__API_TOKEN, or the
    # APP_SERVER__CERT__DNS__ACMEDNS__ACCOUNTS JSON, which holds every account password)
    # must come from a secret (see externalSecret below), not from plain env values.
    APP_DATABASE__PORT: "5432"
    # Status-list record cache TTL in seconds. "0" disables this cache.
    APP_CACHE__TTL: "300"
    APP_CACHE__MAX_CAPACITY: "1000"
    APP_STATUS_LIST__TOKEN_EXP_SECS: "900"
    APP_STATUS_LIST__TOKEN_TTL_SECS: "300"
    APP_RATE_LIMIT__STRICT_BURST_SIZE: "10"
    APP_RATE_LIMIT__STRICT_PERIOD_SECS: "60"
    APP_RATE_LIMIT__PERMISSIVE_BURST_SIZE: "100"
    APP_RATE_LIMIT__PERMISSIVE_PERIOD_SECS: "60"
    APP_LIMITS__MAX_BODY_SIZE_BYTES: "2097152"
    APP_LIMITS__MAX_STATUS_INDEX: "100000"
    APP_LIMITS__MAX_STATUSES_PER_REQUEST: "5000"
    APP_LIMITS__MAX_SERIALIZED_LIST_SIZE: "1048576"
    # Telemetry / OpenTelemetry
    APP_SERVER__ENABLE_METRICS: "true"
    APP_TELEMETRY__ENVIRONMENT: "production"
    APP_TELEMETRY__SAMPLER_RATIO: "1.0"
  # Optional AWS configuration for the application. The chart is provider-neutral by
  # default: serviceAccount.annotations is empty and no credentials are mounted, so you
  # must attach the AWS integration yourself. For IRSA, set the eks.amazonaws.com/role-arn
  # annotation and let the pod-identity webhook inject AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE
  # (the SDK reads the projected OIDC token; it does NOT use node-instance metadata).
  # Only enable mountCredentials for the legacy static-credential path (shared
  # "credentials"/"config" files). Don't combine the two: in the SDK's default chain,
  # shared-profile files take precedence over web identity, so mountCredentials quietly
  # wins with long-lived static keys.
  aws:
    # Mount AWS credential files from aws-credentials-secret into the pod.
    # Disabled by default so the base chart stays provider-neutral.
    mountCredentials: false
    # When mountCredentials=true and externalSecret.enabled, the chart also
    # renders a second ExternalSecret that provisions "aws-credentials-secret" — the exact Secret
    # the Deployment's credential volume references (see deployment.yaml). Without it the Pod could
    # never mount that volume and would stay unready. The remote source holds the AWS shared
    # "credentials" and "config" file contents.
    credentialsSecret:
      # Remote key in the configured SecretStore that holds both AWS shared files.
      remoteKey: "statuslist-aws-credentials"
      # Property within remoteKey holding the AWS shared credentials file (INI: [default] ...).
      credentialsProperty: "CREDENTIALS"
      # Property within remoteKey holding the AWS shared config file.
      configProperty: "CONFIG"
      # Optional ESO target.template for the dedicated aws-credentials-secret only.
      # The application ExternalSecret target.template is intentionally not reused here.
      targetTemplate: {}
    # Plain (non-secret) AWS region. APP_AWS__REGION is rendered only when
    # secretStore.provider == "aws" AND an effective region is set (this value, else the
    # legacy secretStore.aws.region fallback — see the status-list-server-chart.appRegion
    # helper). Setting this alone without provider=aws renders nothing. Leave both empty
    # with provider=aws for pure-IRSA / Workload Identity so the SDK discovers the region
    # from instance metadata.
    region: ""
  # Fallback Kubernetes Secret for clusters that do not run External Secrets Operator.
  # Only rendered when externalSecret.enabled=false AND statuslist.fallbackSecret.enabled=true.
  # Values are plain strings; the API server base64-encodes them (stringData).
  # The secret is always named "statuslist-secret" (single supported name). PostgreSQL
  # (postgres.auth.existingSecret) references the same name, so it is deliberately not
  # independently configurable.
  fallbackSecret:
    enabled: true
    generatedCertificate:
      # Local/dev helper for the fscert image. When enabled, the fallback Secret
      # includes a self-signed certificate and signing key under the keys below.
      # GitOps deployments should not use generated material because helm template
      # runs without cluster lookup and can regenerate values on each sync.
      enabled: false
      commonName: localhost
      dnsNames:
        - localhost
      ipAddresses:
        - 127.0.0.1
      certificateKey: statuslist.crt
      signingKey: statuslist.key
    stringData:
      # Empty means the chart generates a random password. Helm upgrades reuse
      # the existing statuslist-secret password when the cluster is reachable.
      # GitOps tools such as Argo CD and Flux run helm template without cluster
      # lookup access, so an empty value generates a new password on each
      # reconciliation. For GitOps, provide an explicit password from your
      # secret-management flow or set fallbackSecret.enabled=false and use ESO.
      postgres-password: ""

  # File-based secret mounts for production credential/key rotation.
  # Mounts Kubernetes Secrets as files into the container at specified paths.
  # The current chart support is preparatory for application images that implement
  # file reload support (see issue #456). Use fileEnv to map a mounted file path
  # into an application environment variable. Paths are relative to mountPath and
  # work whether items is present or the whole Secret is mounted.
  # When items is present, each fileEnv value must exactly match one of the
  # normalized items[].path values so the chart cannot point the app at a file
  # Kubernetes will not mount.
  # If APP_DATABASE__PASSWORD_FILE is configured via statuslist.env or fileEnv, the
  # chart does NOT inject APP_DATABASE__PASSWORD — it rejects APP_DATABASE__PASSWORD
  # outright (deployment.yaml fails if it is set as a plain env value or fileEnv key),
  # so the mounted file is the only supported database-password delivery path and the
  # application cannot silently keep a stale startup password from an environment variable.
  # Example:
  # - name: database-credentials
  #   secretName: postgres-access
  #   mountPath: /etc/secrets/database
  #   items:
  #     - key: password
  #       path: password
  #   fileEnv:
  #     APP_DATABASE__PASSWORD_FILE: password
  # - name: signing-keys
  #   secretName: statuslist-token-keys
  #   mountPath: /etc/secrets/token-keys
  #   items:
  #     - key: statuslist.crt
  #       path: statuslist.crt
  #     - key: statuslist.key
  #       path: statuslist.key
  #   fileEnv:
  #     APP_SERVER__CERT__STORE__CERTIFICATE_PATH: statuslist.crt
  #     APP_SERVER__CERT__STORE__SIGNING_KEY_PATH: statuslist.key
  secretMounts:
    - name: database-credentials
      secretName: statuslist-secret
      mountPath: /var/run/status-list-server/database
      items:
        - key: postgres-password
          path: password
      fileEnv:
        APP_DATABASE__PASSWORD_FILE: password

  # Watcher configuration for file-based credential rotation detection.
  # When pollIntervalSecs is set, APP_WATCHER__POLL_INTERVAL_SECS is injected.
  # This requires an application image that implements the watcher contract from issue #456.
  watcher:
    pollIntervalSecs: "30"
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  networkPolicy:
    # WARNING: default OFF. Enabling this renders a Kubernetes NetworkPolicy, and with an
    # empty `ingress` the service-port ingress rule allows ANY source in the cluster (a
    # port-only rule with no `from` is equivalent to no ingress restriction). If you enable
    # it, you MUST restrict ingress to your ingress controller, e.g.:
    #   ingress:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: ingress-nginx
    enabled: false
    # When ingress is empty [] (and enabled=true), ANY source can reach the service port.
    # Add podSelector/namespaceSelector/ipBlock entries to restrict sources.
    ingress: []
    # Additional internal egress destinations beyond the built-in PostgreSQL / OTel pod
    # selectors. CAUTION: each egressInternal entry is appended to the single DB-port
    # egress rule, so it INHERITS that rule's port (the APP_DATABASE__PORT value) — a
    # selector for, say, a cache on 6379 needs its own port entry here and will otherwise
    # get silence. The PostgreSQL rule matches pods labelled app.kubernetes.io/name:
    # postgres in this namespace, so an external database is NOT reachable; the OTel rule
    # only exists when the collector is enabled.
    # External ports (443, 53) are always allowed WITHOUT destination restriction — open to
    # 0.0.0.0/0, so this policy does not block outbound exfiltration.
    egressInternal: []
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ServiceAccount for the application pods. Used to attach Workload Identity role annotations
# (EKS IRSA: eks.amazonaws.com/role-arn, GCP WI, Azure WI) for ambient cloud credentials.
serviceAccount:
  # create=true renders the ServiceAccount and injects serviceAccountName (default: chart
  # fullname, or the value of `name`). create=false with an empty `name` injects NO
  # serviceAccountName, so the pod runs as the namespace default ServiceAccount (which may
  # carry its own cloud role); set `name` explicitly when disabling chart SA creation.
  create: true
  name: "" # default: fullname (via _helpers.tpl)
  # Default false: the application does not need to call the Kubernetes API, so do not
  # mount the SA bearer token (NSA/CISA Kubernetes hardening, CIS Benchmark 5.1.6).
  # This does NOT break Workload Identity — IRSA / GCP WI / Azure WI use projected OIDC
  # tokens injected by the cloud admission webhook, independent of this setting.
  automountServiceAccountToken: false
  annotations: {}
  # EKS IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/status-list-server
  # GKE Workload Identity:
  #   iam.gke.io/gcp-service-account: status-list-server@dns-project-id.iam.gserviceaccount.com
  # AKS Workload Identity:
  #   azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
  labels: {}

# HorizontalPodAutoscaler (autoscaling/v2). When enabled, the Deployment's `replicas`
# is omitted so HPA controls the replica count. Scaled Pods share the application
# ServiceAccount; each Pod receives its own short-lived Workload Identity token, so no
# per-Pod cloud registration is required.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  metrics: []
  # behavior: {}

# PodDisruptionBudget (policy/v1). Use with replicaCount > 1 / HPA so disruption events
# (node drains, voluntary evictions) keep the minimum number of replicas available.
podDisruptionBudget:
  enabled: false
  # Set exactly one of minAvailable / maxUnavailable (int, percentage string, or null).
  # WARNING: minAvailable must be < replicaCount (or < autoscaling.minReplicas when HPA
  # is enabled); setting it equal to or greater than the replica count blocks ALL voluntary
  # pod evictions (node drains, cluster upgrades) indefinitely. The SAFE DEFAULT is
  # maxUnavailable: 1, which allows one voluntary eviction regardless of replica count.
  # An explicit 0 is preserved (valid: prevents voluntary disruptions); only an explicit
  # null counts as "unset".
  minAvailable: null
  maxUnavailable: 1

# ServiceMonitor (monitoring.coreos.com/v1) for Prometheus Operator scrape discovery.
# Defines the /metrics scrape endpoint on the application Service. Set labels.release
# to match your Prometheus ServiceMonitorSelector.
serviceMonitor:
  enabled: false
  # Additional labels required by your Prometheus Operator (e.g. release: kube-prometheus-stack)
  labels: {}
  # Scrape interval override (e.g. "15s")
  interval: ""
  # Scrape timeout (e.g. "10s")
  scrapeTimeout: ""
  # Additional metricRelabelings applied to scraped metrics (Prometheus relabel config).
  metricRelabelings: []
  # Additional target relabelings applied before scraping (Prometheus relabel config).
  relabelings: []

# PrometheusRule (monitoring.coreos.com/v1) for kube-prometheus-stack / Prometheus
# Operator rule discovery.
# Enables shipping the SLI recording rules (request latency, error rate, DB latency, cache
# hit ratio, token generation, error budget) and the SLO burn-rate / error-budget alerting
# rules as a single PrometheusRule CRD. Alert thresholds are defined under the `slo` block.
# Only the values.yaml slo.* defaults are checked against deploy/observability/slo/thresholds.json
# and the standalone deploy/observability/prometheus/rules/*.rules.yml by lint-thresholds.mjs; the
# hard-coded alert summary strings inside prometheusrule.yaml are NOT covered by that lint.
# See the webhook-notifications runbook for how the resulting alerts reach humans via
# alerting.existingSecret.
prometheusRule:
  enabled: false
  # Additional labels required by your Prometheus Operator (e.g. release: kube-prometheus-stack)
  labels: {}

# AlertmanagerConfig for kube-prometheus-stack / Prometheus Operator alert routing.
# When enabled, renders an AlertmanagerConfig CRD that routes SLO alerts to the
# configured notification channel. This is the Kubernetes equivalent of the Docker
# Compose ALERTMANAGER_PLATFORM + generate-alertmanager-config.sh setup — the same
# six platforms are supported and no webhook URL is committed to source control.
#
# Supported platforms (alerting.platform):
#   discord     -> alerting.webhookUrl  (Discord channel webhook URL)
#   slack       -> alerting.webhookUrl  (Slack incoming-webhook URL)
#   teams       -> alerting.webhookUrl  (MS Teams classic inbound webhook; posts Alertmanager's
#                 generic JSON, not an Adaptive Card — see deploy/observability/runbooks/webhook-notifications.md
#                 for the rendering limitation and bridge options)
#   mattermost  -> alerting.webhookUrl  (Mattermost incoming webhook)
#   webhook     -> alerting.webhookUrl  (generic endpoint accepting Alertmanager JSON)
#   email       -> alerting.email.*     (SMTP settings)
#
# Credential model:
#   By default (existingSecret: "") the chart renders its own Secret from the inline
#   values (webhookUrl). For production, set existingSecret to the name of
#   a pre-existing Secret (e.g. managed by ESO or Vault) — the chart then reads from
#   that Secret and does NOT render its own. The pre-existing Secret must contain the
#   following keys depending on the platform:
#     webhook-based platforms: "webhook-url"
#     dead-man's-switch:       "dms-webhook-url" (optional)
#     email SMTP auth:         "smtp-password" (optional, only when alerting.email.smtpPassword is set)
#   Email `to`/`smtpFrom`/`smtpHost` are rendered as plain string values (the
#   EmailConfig CRD types them as strings, not Secret selectors) and are therefore
#   NOT read from the Secret.
#
# Route tree (mirrors generate-alertmanager-config.sh):
#   severity=none  -> deadmansswitch receiver (Watchdog — pages on ABSENCE, not firing)
#   severity=page  -> human receiver, repeat every 4h
#   severity=warn  -> human receiver, repeat every 24h
#   everything else -> noop sink (never spams a human channel)
#
# Labels: add any extra labels required by your Alertmanager selector, e.g.
#   labels:
#     release: kube-prometheus-stack
alerting:
  enabled: false
  # Platform selector — must match one of the supported values above.
  platform: discord
  # Grafana dashboard URL injected into alert annotations (e.g. http://grafana.example.com/d/status-list-slo).
  dashboardUrl: "http://localhost:3000/d/status-list-slo"
  # Optional Slack channel override (e.g. "#alerts"). Leave empty to use the webhook default channel.
  slack:
    channel: ""
  # Additional labels for the AlertmanagerConfig (e.g. release: kube-prometheus-stack).
  labels: {}
  # Name of a pre-existing Secret containing credentials. When set, the chart does NOT
  # render its own Secret. Leave empty to let the chart manage the Secret from inline values.
  #
  # IMPORTANT: The referenced Secret MUST already exist in the namespace before install/upgrade
  # (e.g. provisioned by ESO, Vault, or your GitOps flow). Kubernetes does not hot-reload Secret
  # consumers on content changes: updating a webhook URL inside the Secret requires the
  # Alertmanager pod to reload the referenced secretKeyRef. kube-prometheus-stack / the Prometheus
  # Operator watches Secret changes and triggers an Alertmanager reload automatically, so in most
  # installs a URL rotation takes effect without manual intervention (restart the Alertmanager
  # StatefulSet if your operator version does not auto-reload). Always create the Secret before
  # deploying the chart to avoid a failing AlertmanagerConfig / pending pod.
  existingSecret: ""
  # Inline webhook URL (used for discord, slack, teams, mattermost, webhook platforms).
  # Never commit real tokens — use existingSecret + ESO/Vault in production.
  webhookUrl: ""
  # Optional dead-man's-switch URL. The always-firing Watchdog (severity=none) pings this
  # URL so a collapsed Prometheus/Alertmanager pipeline is detected by its ABSENCE. When
  # empty the Watchdog is silently absorbed and never reaches a human channel.
  dmsWebhookUrl: ""
  # Explicitly enable Dead Man's Switch when using existingSecret (reads key "dms-webhook-url"
  # from existingSecret). When dmsWebhookUrl is set above, DMS is enabled implicitly.
  #
  # When DMS is enabled with existingSecret, the "dms-webhook-url" key MUST be present in that
  # Secret. The chart cannot verify the key exists at render time (it is not readable without a
  # cluster lookup), so an absent key surfaces as a failing/runtime error in the Alertmanager
  # webhook. Keep this key present and correct in the provisioning path that manages the Secret.
  dmsEnabled: false
  # Per-request timeout for webhook/Teams/Mattermost receivers (Alertmanager default is 10s).
  # Applies to the generic `webhook`, `teams`, and `mattermost` platforms and to the
  # dead-man's-switch receiver. Set to a Go duration string (e.g. "10s", "2m").
  webhookTimeout: ""
  # Email settings (required only when platform=email).
  # NOTE: The AlertmanagerConfig EmailConfig CRD defines `to`, `smarthost`, and `from` as plain
  # strings (not Secret selectors), so these are rendered directly from values — they are NOT read
  # from the Secret. Only the SMTP password (when set) is read from the Secret via `smtp-password`.
  email:
    to: ""
    smtpHost: ""
    smtpPort: "587"
    smtpFrom: ""
    # Optional SMTP AUTH password. When set, it is stored in the alerting Secret under the key
    # "smtp-password" (chart-managed Secret) or must be present as "smtp-password" in
    # alerting.existingSecret, and is referenced via EmailConfig.authPassword. Leave empty to
    # disable SMTP AUTH.
    smtpPassword: ""
    requireTls: true
    # Optional SMTP TLS verification options (certificate handling). Rendered into the
    # emailConfig tlsConfig when set. Empty disables custom TLS settings.
    # Example:
    #   tlsConfig:
    #     insecureSkipVerify: false
    tlsConfig: {}

# SLO (service-level objective) target thresholds consumed by the PrometheusRule
# template (prometheusrule.yaml) to build SLI recording rules and SLO burn-rate /
# error-budget alerting rules. These values DO change alert thresholds, but they are not
# rendered verbatim into every expression: burn-rate thresholds go through printf "%.3f"
# (so values that round can drift from what you configure, e.g. a 0.0001 target rounds to
# a 0.001 floor) and the alert SUMMARY strings ("300ms", "14.4x over 0.5%", "85%", "10%",
# "14 days") are hard-coded and do not follow these values. The values.yaml slo.* defaults
# are checked against deploy/observability/slo/thresholds.json and the standalone
# deploy/observability/prometheus/rules/*.rules.yml by lint-thresholds.mjs; that lint does
# NOT read prometheusrule.yaml, so it cannot catch drift in the summary strings above.
slo:
  # Acceptable ratio of 5xx responses to all requests over the SLO window (0.5% here).
  # Multiplicand of the burn-rate thresholds (threshold = errorRateTarget x multiplier)
  # and denominator of the error-budget success ratio. Also drives the token-generation
  # burn-rate and budget alerts — loosening the HTTP SLO loosens token-gen paging too.
  errorRateTarget: 0.005
  # Fast-burn alert triggers when the observed error rate exceeds errorRateTarget *
  # fastBurnMultiplier (14.4x) on both the 1h and 5m windows for 5m. Pages.
  fastBurnMultiplier: 14.4
  # Slow-burn alert triggers when the observed error rate exceeds errorRateTarget *
  # slowBurnMultiplier (6.0x) on the 6h and 30m windows for 30m. Warns.
  slowBurnMultiplier: 6.0
  # P95 request latency target in seconds (300ms). Exceeding it on the 1h/5m windows
  # (fast burn, page) or the 6h/30m windows (slow burn, warn) fires an alert.
  requestLatencyP95: 0.3
  # P95 database query latency target in seconds (50ms). Same fast/slow burn semantics.
  dbLatencyP95: 0.05
  # Minimum acceptable status-list cache hit ratio (85%). Below this for 15m fires a warn.
  cacheHitRatioMin: 0.85
  # Maximum acceptable certificate-renewal failure ratio (1%). NO-OP in this chart: it is
  # retained only for parity with thresholds.json and the standalone rules — prometheusrule.yaml
  # does not reference it, so tuning it here has no effect (cert alerts are expiry-driven below).
  certRenewalFailureMax: 0.01
  # Remaining-error-budget gate for the ErrorBudget*Critical page alerts (below 10% of
  # the 30d budget remaining pages).
  errorBudgetCriticalThreshold: 0.1
  # Certificate expiry gates (seconds remaining until the certificate expires).
  # Warn at <=14d, page at <=7d: cert renewal is a discrete low-frequency event,
  # so alerts watch the continuous cert_time_to_expiry_seconds gauge instead of
  # a rate() over a fixed window (which is 0/0 = NaN between renewals).
  certExpiryWarnSeconds: 1209600
  certExpiryCriticalSeconds: 604800

# Bundled in-cluster PostgreSQL database (accepted CloudPirates-chart values).
# This is one possible backend: the application is database-agnostic and selects its
# backend at runtime through the APP_DATABASE__* environment variables. Only PostgreSQL is
# delivered by this chart — MySQL / other backends are supported by the APPLICATION code
# (see docs/database-backends.md) but no non-Postgres image variant is published, so
# 'including MySQL' is not reachable through Helm today (tracks #498). Note also that
# APP_DATABASE__HOST comes from the release name and APP_DATABASE__BACKEND is the literal
# "postgres" (deployment.yaml sets all of HOST/BACKEND/USERNAME/NAME regardless of
# postgres.enabled; only USERNAME/NAME come from postgres.auth). To use an external
# database, set postgres.enabled=false AND override statuslist.initContainers (the default
# wait-for-postgres otherwise hangs on <release>-postgres forever) AND add egress for the
# external DB host (see the networkPolicy caveat).
postgres:
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  auth:
    username: postgres
    database: status-list
    # Must reference the same secret the application reads (see _helpers.tpl
    # "status-list-server-chart.appSecretName"). Fixed to statuslist-secret in BOTH modes:
    # fallback renders that exact name, and ESO mode rejects any externalSecret target name
    # other than it at render time — there is nothing to keep in sync.
    existingSecret: statuslist-secret
    secretKeys:
      passwordKey: postgres-password
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 5432
  image:
    tag: "18.0"

# External Secrets Operator delivery mode (mutually exclusive with
# statuslist.fallbackSecret; the chart fails if both are enabled). When enabled the chart
# renders an ExternalSecret that syncs the application Secret (always named
# "statuslist-secret", holder of the database password) from a cloud/on-prem secret
# manager referenced by secretStore. This is the recommended production delivery path.
# With a namespace-scoped SecretStore, externalSecret.enabled requires secretStore.enabled
# or the render fails (only a pre-existing ClusterSecretStore is exempt). Cloud credentials
# resolve via Workload Identity / IRSA / ManagedIdentity where the provider supports it —
# Vault token auth and Azure ServicePrincipal + authSecretRef use static secrets instead of
# files. The ExternalSecret, the Deployment, and PostgreSQL (postgres.auth.existingSecret)
# all consume the same single secret name, which is intentionally not configurable.
externalSecret:
  enabled: false
  metadata:
    name: statuslist-external-secret
  spec:
    refreshInterval: 30m
    secretStoreRef:
      name: statuslist-secret-store
      kind: SecretStore
    target:
      # Single supported application-secret name (statuslist-secret), shared with the
      # Deployment, PostgreSQL (postgres.auth.existingSecret), and the fallback Secret.
      # A custom value fails at render time; this field is intentionally not configurable.
      name: statuslist-secret
      creationPolicy: Owner
    data:
      - secretKey: postgres-password
        remoteRef:
          key: statuslist-secret
          property: POSTGRES_PASSWORD
    # Optional additional ExternalSecret resources for separately mounted Secrets,
    # for example file-based database credentials, token signing keys, or API keys.
    # Each entry renders as its own ExternalSecret and may override refreshInterval
    # and secretStoreRef; defaults come from externalSecret.spec.
    extraExternalSecrets: []

# External Secrets Operator SecretStore / ClusterSecretStore reference that externalSecret
# syncs from, selecting the cloud or on-prem secret manager. Rendered only when
# externalSecret.enabled AND secretStore.enabled, and only for a namespace-scoped
# SecretStore; a ClusterSecretStore kind is expected to pre-exist cluster-wide and is not
# rendered. Each provider resolves its credentials differently, and the provider's auth is
# decoupled from the application's own Workload Identity where noted.
secretStore:
  enabled: false
  # Provider selector: aws | vault | gcp | azure | raw
  provider: ""
  aws:
    service: SecretsManager # SecretsManager | ParameterStore
    # Empty by default: APP_AWS__REGION is only injected into the pod when a region is
    # explicitly configured (via statuslist.aws.region, or the legacy secretStore.aws.region
    # upgrade fallback). For pure-IRSA / Workload Identity installs that rely on the AWS SDK
    # discovering the region from instance metadata, leave both empty so no APP_AWS__REGION
    # overrides the SDK. The ESO AWS SecretStore still needs a region; it independently falls
    # back to eu-central-1 at the CR level (not injected into the pod).
    region: ""
  vault:
    server: ""
    path: "secret"
    auth: {}
  gcp:
    projectID: ""
    auth: {}
  azure:
    tenantId: ""
    vaultUrl: ""
    # Azure authType per the External Secrets Operator AzureKVProvider CRD:
    # ServicePrincipal | ManagedIdentity | WorkloadIdentity. Managed identity
    # selection uses identityId; ServicePrincipal client credentials go under
    # authSecretRef. (authType "ClientSecret" is not a valid CRD value.)
    authType: ""
    environmentType: ""
    identityId: ""
    serviceAccountRef:
      name: "" # e.g. eso-controller-sa (WorkloadIdentity) bound to the ESO identity
      # namespace: should match the External Secrets Operator controller namespace.
      # Leave empty when ESO is deployed in the same namespace as this release (the default).
      namespace: ""
    authSecretRef: {}
  # Full ESO provider spec passthrough for unsupported providers (when provider=raw).
  # secretStore.raw holds ONLY the concrete provider body rendered directly under
  # spec.provider (no extra top-level 'provider' key), e.g.:
  #   raw:
  #     webhook:
  #       url: ...
  # 'raw: {}' is rejected to avoid silently emitting an empty/insecure SecretStore.
  raw: {}

# OpenTelemetry Collector subchart (opentelemetry-collector dependency). The application
# ships OTLP traces/metrics/logs; when enabled the Deployment injects
# APP_TELEMETRY__ENABLED=true and APP_TELEMETRY__OTLP_ENDPOINT pointing at the collector
# Service. When statuslist.networkPolicy.enabled is ALSO set, network-policy.yaml adds a
# separate OTLP egress rule (ports 4317/4318) scoped to the collector pods, independent of
# the PostgreSQL rule. The default config uses the `debug` exporter (dev scaffolding that
# prints to stdout); configure real exporters (e.g. otlp/tempo, prometheusremotewrite,
# loki) in config.exporters before deploying to production.
opentelemetry-collector:
  enabled: true
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.158.0"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  serviceAccount:
    # The collector uses only OTLP receivers and has no Kubernetes API access needs.
    # Disabling automounting keeps the pod least-privileged.
    automountServiceAccountToken: false
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
    healthcheck:
      enabled: true
      containerPort: 13133
      servicePort: 13133
      protocol: TCP
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: true
  config:
    receivers:
      jaeger: null
      zipkin: null
      prometheus: null
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      # 'debug' is development scaffolding (prints telemetry to stdout).
      # IMPORTANT: Operators MUST configure production exporters before deploying to production.
      debug:
        verbosity: basic
      # PRODUCTION EXPORTER EXAMPLES:
      # Un-comment and configure the appropriate sink for your infrastructure:
      #
      # Traces (e.g. Jaeger / Grafana Tempo via OTLP gRPC):
      # otlp/tempo:
      #   endpoint: "tempo.monitoring.svc.cluster.local:4317"
      #   tls:
      #     insecure: true
      #
      # Metrics (e.g. Prometheus Remote Write):
      # prometheusremotewrite:
      #   endpoint: "http://prometheus-k8s.monitoring.svc.cluster.local:9090/api/v1/write"
      #
      # Logs (e.g. Grafana Loki):
      # loki:
      #   endpoint: "http://loki-gateway.monitoring.svc.cluster.local:3100/loki/api/v1/push"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
