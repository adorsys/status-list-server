# Existing EKS release, applied after the AWS and production overlays.
statuslist:
  # The memory cache is local to each pod; keep this profile on one replica.
  replicaCount: 1
  strategy:
    type: Recreate
  image:
    variant: fscert
  aws:
    mountCredentials: false
  env:
    APP_CACHE__BACKEND: memory
  secretMounts:
    - name: database-credentials
      secretName: statuslist-secret
      mountPath: /var/run/status-list-server/database
      items:
        - key: postgres-password
          path: password
      fileEnv:
        APP_DATABASE__PASSWORD_FILE: password
    - name: signing-material
      secretName: statuslist-signing
      mountPath: /var/run/status-list-server/signing
      items:
        - key: tls.crt
          path: tls.crt
        - key: tls.key
          path: tls.key
          mode: 0440
      fileEnv:
        APP_SERVER__CERT__STORE__CERTIFICATE_PATH: tls.crt
        APP_SERVER__CERT__STORE__SIGNING_KEY_PATH: tls.key

autoscaling:
  enabled: false

externalSecret:
  spec:
    extraExternalSecrets:
      - metadata:
          name: statuslist-signing
        spec:
          target:
            name: statuslist-signing
            creationPolicy: Owner
          data:
            - secretKey: tls.crt
              remoteRef:
                key: statuslist-fscert-signing
                property: CERTIFICATE
            - secretKey: tls.key
              remoteRef:
                key: statuslist-fscert-signing
                property: SIGNING_KEY
