# Existing EKS release, applied after the AWS and production overlays.
statuslist:
  # The memory cache is local to each pod; keep this profile on one replica.
  replicaCount: 1
  strategy:
    type: Recreate
  image:
    variant: fscert
  aws:
    mountCredentials: false
  env:
    APP_CACHE__BACKEND: memory
  secretMounts:
    - name: database-credentials
      secretName: statuslist-secret
      mountPath: /var/run/status-list-server/database
      items:
        - key: postgres-password
          path: password
      fileEnv:
        APP_DATABASE__PASSWORD_FILE: password
    - name: signing-material
      secretName: statuslist-token-signing
      mountPath: /var/run/status-list-server/token-signing
      items:
        - key: tls.crt
          path: statuslist.crt
        - key: tls.key
          path: statuslist.key
          mode: 0440
      fileEnv:
        APP_SERVER__CERT__STORE__CERTIFICATE_PATH: statuslist.crt
        APP_SERVER__CERT__STORE__SIGNING_KEY_PATH: statuslist.key

autoscaling:
  enabled: false

tokenSigningCertificate:
  enabled: true
  dnsName: statuslist.eudi-adorsys.com
  issuerName: letsencrypt-prod
