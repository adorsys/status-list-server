# Production values for deploy/helm/chart. Applied after values-aws.yaml by the
# production deploy workflow (deploy.yml) on release-tag deploys to the
# statuslist-production namespace.

serviceAccount:
  create: true

statuslist:
  replicaCount: 2
  ingress:
    management:
      # Enable the management listener Ingress in production so issuer writes
      # (PUT/PATCH .../statuses, POST .../allocations, POST /credentials) reach
      # the management port (8001) instead of the public listener, which returns
      # 404 for every write. Shared hostname: the edge routes by path regex.
      enabled: true
      annotations:
        # Match the public Ingress body-size limit; without this nginx falls back
        # to 1m and large status-list payloads are rejected with 413.
        nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  env:
    APP_ENV: "production"
    # Issuers targeting the AWS production deployment must use this exact aud.
    # Other deployments must override it with their own audience.
    APP_MANAGEMENT_AUTH__AUDIENCES: "https://statuslist.eudi-adorsys.com/api/v1"
    APP_SERVER__ENABLE_METRICS: "true"
    APP_TELEMETRY__ENVIRONMENT: "production"
    RUST_LOG: "warn,status_list_server=info"
    # Redis cache backend. Production requires TLS + a password (CacheConfig::validate);
    # the password comes via secretEnv below. APP_CACHE__HOST is injected by deploy.yml
    # from the APP_CACHE_HOST var (bare hostname), so keep it empty here to avoid
    # committing an endpoint and to fail fast when the var is unset.
    APP_CACHE__BACKEND: "redis"
    APP_CACHE__HOST: ""
    APP_CACHE__PORT: "6379"
    APP_CACHE__TLS: "true"
    APP_CACHE__DATABASE: "0"
    APP_CACHE__KEY_PREFIX: "status-list-server:status-list:"
    # APP_CACHE__MAX_CAPACITY (inherited from the base values) applies only to the
    # in-memory backend; Redis uses native key expiration from APP_CACHE__TTL.
  # Redis password from the ESO-provisioned redis-credentials Secret. The name must
  # match externalSecret.spec.extraExternalSecrets[].spec.target.name below; a mismatch
  # only surfaces as CreateContainerConfigError. Read once at pod start.
  secretEnv:
    APP_CACHE__PASSWORD:
      name: redis-credentials
      key: password
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# NetworkPolicy is OFF by default. If enabled, cacheEgress is required for the Redis
# backend (the chart hard-fails otherwise); the rule port derives from APP_CACHE__PORT
# (6379 here). ElastiCache is external, so select its subnets via ipBlock:
# networkPolicy:
#   enabled: true
#   cacheEgress:
#     - ipBlock:
#         cidr: 10.0.x.0/24   # one entry per ElastiCache subnet

# Horizontal Pod Autoscaling for production workloads.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

# PodDisruptionBudget ensures safe rolling deploys and node drains.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Recommended monitoring discovery for kube-prometheus-stack environments.
serviceMonitor:
  enabled: true
  interval: "15s"
  labels:
    release: kube-prometheus-stack

# Ship SLI recording and SLO alerting rules into the cluster via PrometheusRule CRD.
prometheusRule:
  enabled: true
  labels:
    release: kube-prometheus-stack

# Auto-provision the SLO dashboard in the shared Grafana via a labelled ConfigMap
# (grafana_dashboard: "1") that the central Grafana sidecar discovers.
grafanaDashboard:
  enabled: true
  labels:
    release: kube-prometheus-stack
    grafana_dashboard: "1"

# Alert routing via kube-prometheus-stack's Alertmanager (AlertmanagerConfig CRD).
# Enable this block and set alerting.platform + credentials to receive SLO alert
# notifications. In production, always use existingSecret so no webhook URL is
# stored in this file or in Helm history.
#
# Example (Discord, credentials in ESO-managed Secret):
#   1. Create / sync a Secret named "statuslist-alerting-credentials" with key "webhook-url"
#      set to your Discord channel webhook URL (and optionally "dms-webhook-url").
#   2. Uncomment the block below and set existingSecret to match the Secret name.
#
# alerting:
#   enabled: true
#   platform: discord    # slack | discord | teams | mattermost | webhook | email
#   labels:
#     release: kube-prometheus-stack
#   existingSecret: statuslist-alerting-credentials   # pre-existing Secret; chart does not render its own
#   # dmsWebhookUrl: ""  # set via existingSecret key "dms-webhook-url" instead

# Provision the redis-credentials Secret from the secret manager via ESO. The remote
# secret must already exist (AWS Secrets Manager key statuslist-redis-password, JSON
# PASSWORD field) and the ClusterSecretStore role (datev-secret-store) must be able to
# read it; secretStoreRef is inherited from externalSecret.spec (overridden by deploy.yml).
externalSecret:
  spec:
    extraExternalSecrets:
      - metadata:
          name: statuslist-redis-credentials
        spec:
          target:
            name: redis-credentials
            creationPolicy: Owner
          data:
            - secretKey: password
              remoteRef:
                key: statuslist-redis-password
                property: PASSWORD
