# Applied after values-aws.yaml by deploy.yml for the statuslist-production namespace.

serviceAccount:
  create: true

statuslist:
  replicaCount: 2
  ingress:
    management:
      # Without this, issuer writes reach the public listener and get 404.
      # Shared hostname: the edge routes management paths by regex.
      enabled: true
      annotations:
        # Same limit as the public Ingress; nginx's 1m default rejects large lists with 413.
        nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  env:
    APP_ENV: "production"
    # The AWS production audience; other deployments must set their own.
    APP_MANAGEMENT_AUTH__AUDIENCES: "https://statuslist.eudi-adorsys.com/api/v1"
    APP_SERVER__ENABLE_METRICS: "true"
    APP_TELEMETRY__ENVIRONMENT: "production"
    RUST_LOG: "warn,status_list_server=info"
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

serviceMonitor:
  enabled: true
  interval: "15s"
  labels:
    release: kube-prometheus-stack

prometheusRule:
  enabled: true
  labels:
    release: kube-prometheus-stack

grafanaDashboard:
  enabled: true
  labels:
    release: kube-prometheus-stack
    grafana_dashboard: "1"

# Alerting: keep webhook URLs in existingSecret (key webhook-url), never in this file.
