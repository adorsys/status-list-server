global:
  # Dev only: 2s makes the rule windows fill fast. Use 15s or more in production.
  scrape_interval: 2s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/recording.rules.yml
  - /etc/prometheus/rules/alerting.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

scrape_configs:
  - job_name: 'status_list_server'
    # Running the binary on the host? Use host.docker.internal:8002.
    static_configs:
      - targets: ['app:8002']

  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
