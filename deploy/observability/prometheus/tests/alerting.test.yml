# promtool compares annotations literally, so they repeat the rule text.
rule_files:
  - ../rules/recording.rules.yml
  - ../rules/alerting.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: >-
          http_server_requests_total{otel_scope_name="status-list-server",namespace="ns1",method="GET",route="/x",status_class="5xx"}
        values: '0+100x400'
      - series: >-
          http_server_requests_total{otel_scope_name="status-list-server",namespace="ns1",method="GET",route="/x",status_class="2xx"}
        values: '0+900x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: ErrorRateFastBurn
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "page"
              team: "statuslist"
              sli: "error_rate"
              namespace: "ns1"
            exp_annotations:
              summary: "5xx error rate burning the error budget fast (>=14.4x over 0.5% budget on the 1h window)"
              description: "1h error rate is 10% (>=14.4x budget)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/error-rate.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: ErrorRateSlowBurn
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "warn"
              team: "statuslist"
              sli: "error_rate"
              namespace: "ns1"
            exp_annotations:
              summary: "5xx error rate burning the error budget slowly (>=6x over 0.5% budget on the 6h window)"
              description: "6h error rate is 10% (>=6x budget)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/error-rate.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: RequestLatencyFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: DbLatencyFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: TokenGenerationFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: CacheHitRatioLow
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: >-
          status_list_cache_errors_total{otel_scope_name="status-list-server",namespace="ns1",cache="status_list",backend="redis",operation="get"}
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: RedisCacheErrors
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "warn"
              sli: "cache_hit_ratio"
              namespace: "ns1"
              team: "statuslist"
            exp_annotations:
              summary: "Redis status-list cache operations are failing"
              description: "Redis cache error rate: 1"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/cache-hit-ratio.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"

  - interval: 1m
    input_series:
      - series: >-
          http_server_requests_total{otel_scope_name="status-list-server",namespace="ns1",method="GET",route="/x",status_class="5xx"}
        values: '0+5x400'
      - series: >-
          http_server_requests_total{otel_scope_name="status-list-server",namespace="ns1",method="GET",route="/x",status_class="2xx"}
        values: '0+95x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: ErrorRateFastBurn
        exp_alerts: []
      - eval_time: 400m
        alertname: ErrorRateSlowBurn
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "warn"
              team: "statuslist"
              sli: "error_rate"
              namespace: "ns1"
            exp_annotations:
              summary: "5xx error rate burning the error budget slowly (>=6x over 0.5% budget on the 6h window)"
              description: "6h error rate is 5% (>=6x budget)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/error-rate.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"

  - interval: 1m
    input_series:
      - series: >-
          http_server_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="0.1"}
        values: '0+20x400'
      - series: >-
          http_server_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="0.3"}
        values: '0+80x400'
      - series: >-
          http_server_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="0.5"}
        values: '0+90x400'
      - series: >-
          http_server_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="1"}
        values: '0+100x400'
      - series: >-
          http_server_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="+Inf"}
        values: '0+100x400'
      - series: >-
          db_query_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="0.01"}
        values: '0+20x400'
      - series: >-
          db_query_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="0.05"}
        values: '0+80x400'
      - series: >-
          db_query_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="0.1"}
        values: '0+90x400'
      - series: >-
          db_query_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="1"}
        values: '0+100x400'
      - series: >-
          db_query_duration_seconds_bucket{otel_scope_name="status-list-server",namespace="ns1",le="+Inf"}
        values: '0+100x400'
      - series: >-
          token_generation_failures_total{otel_scope_name="status-list-server",namespace="ns1",format="jwt"}
        values: '0+10x400'
      - series: >-
          token_generation_attempts_total{otel_scope_name="status-list-server",namespace="ns1",format="jwt"}
        values: '0+100x400'
      - series: >-
          status_list_cache_hits_total{otel_scope_name="status-list-server",namespace="ns1",cache="status_list"}
        values: '0+3x400'
      - series: >-
          status_list_cache_misses_total{otel_scope_name="status-list-server",namespace="ns1",cache="status_list"}
        values: '0+2x400'
      - series: >-
          cert_time_to_expiry_seconds{otel_scope_name="status-list-server",namespace="ns1"}
        values: '600000x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: RequestLatencyFastBurn
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "page"
              team: "statuslist"
              sli: "request_latency"
              namespace: "ns1"
            exp_annotations:
              summary: "Request latency P95 sustainably above 300ms (>300ms on the 1h window)"
              description: "request latency P95 is 750ms on the 1h window (threshold 300ms)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/request-latency.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: RequestLatencySlowBurn
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "warn"
              team: "statuslist"
              sli: "request_latency"
              namespace: "ns1"
            exp_annotations:
              summary: "Request latency P95 sustained above 300ms on the 6h window"
              description: "request latency P95 is 750ms on the 6h window (threshold 300ms)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/request-latency.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: DbLatencyFastBurn
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "page"
              team: "statuslist"
              sli: "db_latency"
              namespace: "ns1"
            exp_annotations:
              summary: "DB query latency P95 sustainably above 50ms (>50ms on the 1h window)"
              description: "DB query latency P95 is 550ms on the 1h window (threshold 50ms)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/db-latency.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: DbLatencySlowBurn
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "warn"
              team: "statuslist"
              sli: "db_latency"
              namespace: "ns1"
            exp_annotations:
              summary: "DB query latency P95 sustained above 50ms on the 6h window"
              description: "DB query latency P95 is 550ms on the 6h window (threshold 50ms)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/db-latency.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: TokenGenerationFastBurn
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "page"
              team: "statuslist"
              sli: "token_generation"
              namespace: "ns1"
            exp_annotations:
              summary: "Token-generation failures burning the error budget fast (>=14.4x over 0.5% budget on the 1h window)"
              description: "1h token-generation failure rate is 10% (>=14.4x budget)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/token-generation.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: TokenGenerationSlowBurn
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "warn"
              team: "statuslist"
              sli: "token_generation"
              namespace: "ns1"
            exp_annotations:
              summary: "Token-generation failure rate burning the error budget slowly (>=6x over 0.5% budget on the 6h window)"
              description: "6h token-generation failure rate is 10% (>=6x budget)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/token-generation.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: CacheHitRatioLow
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "warn"
              team: "statuslist"
              sli: "cache_hit_ratio"
              namespace: "ns1"
            exp_annotations:
              summary: "Status-list cache hit ratio below 85% for 15m (degradation, not outage)"
              description: "current cache hit ratio is 60%"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/cache-hit-ratio.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: CertRenewalFailures
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "warn"
              team: "statuslist"
              sli: "cert_renewal"
              namespace: "ns1"
              otel_scope_name: "status-list-server"
            exp_annotations:
              summary: "Certificate expires within 14 days (renewal loop not refreshing it)"
              description: "time to expiry is 600000s"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/cert-renewal.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 400m
        alertname: CertRenewalErrorBudgetCritical
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "page"
              team: "statuslist"
              sli: "cert_renewal"
              namespace: "ns1"
              otel_scope_name: "status-list-server"
            exp_annotations:
              summary: "Certificate expires within 7 days (imminent expiry)"
              description: "time to expiry is 600000s"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/cert-renewal.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"

  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        alertname: ErrorRateFastBurn
        exp_alerts: []
      - eval_time: 10m
        alertname: ErrorRateSlowBurn
        exp_alerts: []
      - eval_time: 10m
        alertname: RequestLatencyFastBurn
        exp_alerts: []
      - eval_time: 10m
        alertname: RequestLatencySlowBurn
        exp_alerts: []
      - eval_time: 10m
        alertname: DbLatencyFastBurn
        exp_alerts: []
      - eval_time: 10m
        alertname: DbLatencySlowBurn
        exp_alerts: []
      - eval_time: 10m
        alertname: TokenGenerationFastBurn
        exp_alerts: []
      - eval_time: 10m
        alertname: TokenGenerationSlowBurn
        exp_alerts: []
      - eval_time: 10m
        alertname: CacheHitRatioLow
        exp_alerts: []
      - eval_time: 10m
        alertname: CertRenewalFailures
        exp_alerts: []
      - eval_time: 10m
        alertname: CertRenewalErrorBudgetCritical
        exp_alerts: []
      - eval_time: 10m
        alertname: TokenGenErrorBudgetCritical
        exp_alerts: []
      - eval_time: 10m
        alertname: ErrorBudgetCritical
        exp_alerts: []
      - eval_time: 10m
        alertname: StatusListMetricsAbsent
        exp_alerts:
          - exp_labels:
              job: "status_list_server"
              instance: "app:8000"
              service: "status-list-server"
              severity: "page"
              team: "statuslist"
            exp_annotations:
              summary: "status-list-server metrics absent for 5m (target down or not scraped)"
              description: "Status List /metrics target is unreachable or absent (up == 0 or no up series for 5m)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/README.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"
      - eval_time: 10m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "none"
              team: "statuslist"
            exp_annotations:
              summary: "Prometheus alerting pipeline is healthy (Watchdog)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/README.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"

  - interval: 1m
    input_series:
      - series: 'up{job="status_list_server",instance="app:8000"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: StatusListMetricsAbsent
        exp_alerts:
          - exp_labels:
              job: "status_list_server"
              instance: "app:8000"
              service: "status-list-server"
              severity: "page"
              team: "statuslist"
            exp_annotations:
              summary: "status-list-server metrics absent for 5m (target down or not scraped)"
              description: "Status List /metrics target is unreachable or absent (up == 0 or no up series for 5m)"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/README.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"

  - interval: 1m
    input_series:
      - series: 'up{job="status_list_server",instance="app:8000"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: StatusListMetricsAbsent
        exp_alerts: []

  - interval: 6h
    input_series:
      - series: >-
          http_server_requests_total{otel_scope_name="status-list-server",namespace="ns1",method="GET",route="/x",status_class="5xx"}
        values: '0+50x120'
      - series: >-
          http_server_requests_total{otel_scope_name="status-list-server",namespace="ns1",method="GET",route="/x",status_class="2xx"}
        values: '0+50x120'
    alert_rule_test:
      - eval_time: 30d
        alertname: ErrorBudgetCritical
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "page"
              team: "statuslist"
              sli: "error_budget"
              namespace: "ns1"
            exp_annotations:
              summary: "Error budget is below 10% for the 30d window"
              description: "remaining error budget is 0%"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/error-budget.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"

  - interval: 6h
    input_series:
      - series: >-
          token_generation_failures_total{otel_scope_name="status-list-server",namespace="ns1",format="jwt"}
        values: '0+50x120'
      - series: >-
          token_generation_attempts_total{otel_scope_name="status-list-server",namespace="ns1",format="jwt"}
        values: '0+100x120'
    alert_rule_test:
      - eval_time: 30d
        alertname: TokenGenErrorBudgetCritical
        exp_alerts:
          - exp_labels:
              service: "status-list-server"
              severity: "page"
              team: "statuslist"
              sli: "token_gen_error_budget"
              namespace: "ns1"
            exp_annotations:
              summary: "Token generation error budget below 10% for the 30d window"
              description: "remaining token generation error budget is 0%"
              runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/deploy/observability/runbooks/token-generation.md"
              dashboard_url: "http://localhost:3000/d/status-list-slo"

  - interval: 1m
    input_series:
      - series: >-
          cert_time_to_expiry_seconds{otel_scope_name="status-list-server",namespace="ns1"}
        values: '2592000x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: CertRenewalFailures
        exp_alerts: []
      - eval_time: 400m
        alertname: CertRenewalErrorBudgetCritical
        exp_alerts: []
