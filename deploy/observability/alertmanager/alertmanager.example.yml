# Hand-written example; the compose stack generates its config with generate-alertmanager-config.sh.
# Keep URLs as placeholders. Unlike the generator, this splits page and warn into separate channels.
# Webhook payloads are Alertmanager's standard JSON (status, labels, annotations incl. runbook_url).

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "sli", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "noop"
  routes:
    # Watchdog goes to the dead man's switch, which pages on absence.
    - matchers:
        - severity="none"
      receiver: "watchdog-deadmansswitch"

    - matchers:
        - severity="page"
      receiver: "discord-page"
      continue: false

    - matchers:
        - severity="warn"
      receiver: "discord-warn"
      continue: false

inhibit_rules:
  # Don't page a channel for a warn while a page for the same SLI is firing.
  - source_match:
      severity: page
    target_match:
      severity: warn
    equal: ["sli", "service"]

receivers:
  # Catch-all, so unrouted alerts reach no human.
  - name: "noop"

  - name: "watchdog-deadmansswitch"
    webhook_configs:
      - url: "https://deadmansswitch.example.com/<DMS_WEBHOOK>"

  - name: "discord-page"
    discord_configs:
      - webhook_url: "https://discord.com/api/webhooks/REPLACE_ME/REPLACE_ME"
        send_resolved: true
        title: '{{ template "discord.default.title" . }}'
        message: '{{ template "discord.default.message" . }}'

  - name: "discord-warn"
    discord_configs:
      - webhook_url: "https://discord.com/api/webhooks/REPLACE_ME/REPLACE_ME"
        send_resolved: true
        title: '{{ template "discord.default.title" . }}'
        message: '{{ template "discord.default.message" . }}'

