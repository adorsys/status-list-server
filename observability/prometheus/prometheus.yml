global:
  # Scrape matches the app's in-process scrape cadence used in development.
  scrape_interval: 2s
  # Evaluated frequently so burn-rate windows (5m/30m/1h/6h) resolve promptly.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/recording.rules.yml
  - /etc/prometheus/rules/alerting.rules.yml

scrape_configs:
  - job_name: 'status_list_server'
    # For local / non-dockerised development the app runs on the host, so scrape
    # it via the docker bridge gateway. Swap back to 'app:8000' when the app is
    # a compose service.
    static_configs:
      - targets: ['192.168.0.1:8000']

  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
