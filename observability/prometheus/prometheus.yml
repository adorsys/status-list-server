global:
  # DEV ONLY — 2s makes recording rules (5m/30m/1h/6h) resolve quickly for local
  # review demos. It generates ~7.5x the TSDB samples of Prometheus' 15s default,
  # inflating memory/disk. Production: use 15s (Prometheus default) or 30s.
  # Change here and reload Prometheus.
  scrape_interval: 2s
  # Evaluated frequently so burn-rate windows (5m/30m/1h/6h) resolve promptly.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/recording.rules.yml
  - /etc/prometheus/rules/alerting.rules.yml

scrape_configs:
  - job_name: 'status_list_server'
    # The app runs as the compose service 'app' on port 8000, so it is scraped
    # by DNS name on the compose network. For local / non-dockerised
    # development (binary run on the host), point this at the host gateway
    # instead, e.g. 'host.docker.internal:8000'.
    static_configs:
      - targets: ['app:8000']

  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
