groups:
  # Multi-window multi-burn-rate alerts (Google SRE). Each outage SLI has a
  # fast-burn page pair (short 1h + long 6h window, aligned) and a slow-burn
  # warn pair on the long window. `severity` (`page`/`warn`) marks alert
  # importance; `runbook_url` points at the in-repo runbook for the SLI.
  #
  # Burn-rate thresholds (0.5% budget -> 14.4x = 0.072 fast, 6x = 0.030 slow).
  # Latency SLOs are threshold-based (p95), so their "burn" is a sustained
  # threshold breach over matched windows rather than a ratio burn rate.
  - name: slo-alerts
    rules:
      # --- Pipeline health (always-firing / absent guards) -------------------
      # Watchdog: always firing. A healthy alert pipeline routes this to a
      # dead-man's-switch, so a total collapse of Prometheus or Alertmanager is
      # itself a detectable, pageable condition rather than a silent outage.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          service: status-list-server
        annotations:
          summary: "Prometheus alerting pipeline is healthy (Watchdog)"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/README.md"

      # Target-down / absent-SLI guard. If the app stops being scraped (pod
      # crash, ServiceMonitor mis-scrape, deployment deleted), the raw request
      # metrics go absent, every sli:* recording rule goes NaN, and every burn
      # alert above goes silent. `absent()` turns that missing series into an
      # alertable page so a total outage is not invisible.
      - alert: StatusListMetricsAbsent
        expr: absent(http_server_duration_seconds_bucket{otel_scope_name="status-list-server"})
        for: 5m
        labels:
          severity: page
          service: status-list-server
        annotations:
          summary: "status-list-server metrics absent for 5m (target down or not scraped)"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/README.md"

      # --- Request latency (SLO: p95 < 300ms) --------------------------------
      - alert: RequestLatencyFastBurn
        expr: |
          sli:request_latency:p95:1h > 0.3
          and
          sli:request_latency:p95:6h > 0.3
        for: 5m
        labels:
          severity: page
          service: status-list-server
          sli: request_latency
        annotations:
          summary: "Request latency P95 sustainably above 300ms (>300ms in both 1h and 6h)"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/request-latency.md"

      - alert: RequestLatencySlowBurn
        expr: |
          sli:request_latency:p95:6h > 0.3
        for: 30m
        labels:
          severity: warn
          service: status-list-server
          sli: request_latency
        annotations:
          summary: "Request latency P95 sustained above 300ms for 6h"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/request-latency.md"

      # --- Error rate (SLO: >=99.5% success, 0.5% budget) --------------------
      - alert: ErrorRateFastBurn
        expr: |
          sli:error_rate:1h >= 0.072
          and
          sli:error_rate:6h >= 0.072
        for: 5m
        labels:
          severity: page
          service: status-list-server
          sli: error_rate
        annotations:
          summary: "5xx error rate burning the error budget fast (>=14.4x over 0.5% budget in both 1h and 6h)"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-rate.md"

      - alert: ErrorRateSlowBurn
        expr: |
          sli:error_rate:6h >= 0.030
        for: 30m
        labels:
          severity: warn
          service: status-list-server
          sli: error_rate
        annotations:
          summary: "5xx error rate burning the error budget slowly (>=6x over 0.5% budget for 6h)"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-rate.md"

      # --- DB latency (SLO: p95 < 50ms) --------------------------------------
      - alert: DbLatencyFastBurn
        expr: |
          sli:db_query_latency:p95:1h > 0.05
          and
          sli:db_query_latency:p95:6h > 0.05
        for: 5m
        labels:
          severity: page
          service: status-list-server
          sli: db_latency
        annotations:
          summary: "DB query latency P95 sustainably above 50ms (>50ms in both 1h and 6h)"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/db-latency.md"

      - alert: DbLatencySlowBurn
        expr: |
          sli:db_query_latency:p95:6h > 0.05
        for: 30m
        labels:
          severity: warn
          service: status-list-server
          sli: db_latency
        annotations:
          summary: "DB query latency P95 sustained above 50ms for 6h"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/db-latency.md"

      # --- Token generation (SLO: <0.5% failure, warn-only is not acceptable) -
      - alert: TokenGenerationFastBurn
        expr: |
          sli:token_gen_failure_rate:1h >= 0.072
          and
          sli:token_gen_failure_rate:6h >= 0.072
        for: 5m
        labels:
          severity: page
          service: status-list-server
          sli: token_generation
        annotations:
          summary: "Token-generation failures burning the error budget fast (>=14.4x over 0.5% budget in both 1h and 6h)"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"

      - alert: TokenGenerationSlowBurn
        expr: |
          sli:token_gen_failure_rate:6h >= 0.030
        for: 30m
        labels:
          severity: warn
          service: status-list-server
          sli: token_generation
        annotations:
          summary: "Token-generation failure rate burning the error budget slowly (>=6x over 0.5% budget for 6h)"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"

      # --- Cache hit ratio (warn-only degradation) ---------------------------
      - alert: CacheHitRatioLow
        expr: |
          sli:cache_hit_ratio:5m < 0.85
        for: 15m
        labels:
          severity: warn
          service: status-list-server
          sli: cache_hit_ratio
        annotations:
          summary: "Status-list cache hit ratio below 85% for 15m (degradation, not outage)"
          description: "Current cache hit ratio: {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cache-hit-ratio.md"

      # --- Error budget exhaustion (critical page) ---------------------------
      # Fires when the 30d error budget (sli:error_budget:success:30d) drops
      # below 10% remaining: error_rate:30d is fast approaching the 0.5% target.
      # The NaN-when-no-data behaviour of the recording rule means a missing
      # series does not trip this (NaN < 0.1 is false).
      - alert: ErrorBudgetCritical
        expr: |
          sli:error_budget:success:30d < 0.1
        for: 5m
        labels:
          severity: page
          service: status-list-server
          sli: error_budget
        annotations:
          summary: "Error budget is below 10% for the 30d window"
          description: "Remaining error budget: {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/error-budget.md"

      - alert: TokenGenErrorBudgetCritical
        expr: |
          sli:token_gen_error_budget:30d < 0.1
        for: 5m
        labels:
          severity: page
          service: status-list-server
          sli: token_gen_error_budget
        annotations:
          summary: "Token generation error budget below 10% for the 30d window"
          description: "Remaining token generation error budget: {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/token-generation.md"

      # --- Certificate renewal (warn-only operational risk) ------------------
      # NOTE: certificate renewal is a discrete, low-frequency event (a renewal
      # cycle every few days, not a continuous stream), so a 5m `rate` is
      # meaningless here. The 7d window guarantees at least one renewal cycle is
      # observed, making this rule actually fireable while staying warn-only.
      - alert: CertRenewalFailures
        expr: |
          sli:cert_renewal_failure_rate:7d >= 0.01
        for: 5m
        labels:
          severity: warn
          service: status-list-server
          sli: cert_renewal
        annotations:
          summary: "Certificate renewal failure rate at or above 1% over the last 7d"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cert-renewal.md"

      # Page (critical) only when the renewal loop is genuinely broken: >=50% of
      # renewals failed over the 30d window means the certificate is not being
      # re-signed and will expire. A single transient failure (e.g. 1 of ~30
      # renewals) stays warn-only and does not page on-call.
      - alert: CertRenewalErrorBudgetCritical
        expr: |
          sli:cert_renewal_failure_rate:30d >= 0.5
        for: 5m
        labels:
          severity: page
          service: status-list-server
          sli: cert_renewal
        annotations:
          summary: "Certificate renewal failure rate exceeded 50% over 30d"
          description: "Current 30d cert renewal failure rate: {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/adorsys/status-list-server/blob/develop/observability/runbooks/cert-renewal.md"

