openapi: 3.1.0
info:
  title: Status List Server
  version: 0.1.0
  description: |
    REST API for the Status List Server.

    This service implements the
    [Token Status List specification](https://datatracker.ietf.org/doc/draft-ietf-oauth-status-list/)
    and allows credential issuers to register, publish, and update status lists.
    Relying parties can retrieve status list tokens in JWT or CWT format.

    Error responses are JSON objects of the form
    `{"error": "<code>", "error_description": "<human-readable text>"}`, served
    as `application/json` with `Cache-Control: no-store, max-age=0`. The
    `error` field is a stable machine-readable identifier and is the field
    clients should branch on — the HTTP status alone is not sufficient, since
    (for example) `409` covers both `status_list_already_exists` and
    `update_conflict`. `error_description` is for humans and its wording is not
    part of the contract.

    Status list tokens are signed by the server and delivered as
    `application/statuslist+jwt` or `application/statuslist+cwt`. JWT-format
    tokens are gzip-compressed only when the client requests it via
    `Accept-Encoding: gzip`; CWT-format tokens are never compressed.

    ## Rate limiting

    The server applies three independent token-bucket governor tiers, each
    operator-configurable through the `APP_RATE_LIMIT__*` environment
    variables (see `RateLimitConfig`):

      * **strict** (per source IP) — `POST /api/v1/credentials`.
        Tunables: `strict_burst_size`, `strict_period_secs`
        (defaults: 10 / 60s).
      * **writes** (per smart IP via `SmartIpKeyExtractor`, reading
        `X-Forwarded-For`, `X-Real-Ip`, and `Forwarded` headers, falling back to
        the peer IP) — `PUT`/`PATCH`
        `/api/v1/status-lists/{list_id}/statuses` and the authenticated
        `GET /api/v1/credentials`.
        Tunables: `strict_burst_size`, `strict_period_secs`.
      * **permissive** (per source IP) — public read routes
        (`GET /api/v1/aggregation/{aggregation_id}`,
        `GET /api/v1/aggregation`,
        `GET /api/v1/status-lists/{list_id}`).
        Tunables: `permissive_burst_size`, `permissive_period_secs`
        (defaults: 100 / 60s).

    When a quota is exhausted the server returns `429 Too Many Requests`.

    ## Request bounds

    In addition to the rate limiter, the server enforces hard bounds on
    incoming requests and persisted status lists through the `APP_LIMITS__*`
    environment variables (see `LimitsConfig`):

    | Bound | Default | Exceeded response |
    |---|---|---|
    | `max_body_size_bytes` | 2 MiB | `413 Payload Too Large` |
    | `max_status_index` | 100000 | `400 Bad Request` (`index` too large) |
    | `max_statuses_per_request` | 5000 | `400 Bad Request` (too many entries) |
    | `max_serialized_list_size` | 1 MiB | `422 Unprocessable Entity` |
    | `max_lists_per_issuer` | 1000 | `400 Bad Request` (`list_quota_exceeded`) |

    These bounds are reflected on the request schemas (`StatusEntry.index`
    `maximum`, `StatusUpdateRequest.statuses` `maxItems`) for the default
    configuration; operators who lower a bound via configuration should treat
    the documented schema maximums as defaults, not guarantees.
  contact:
    name: adorsys Status List Server
    url: https://github.com/adorsys/status-list-server
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0

servers:
  - url: https://{host}
    description: Status List Server
    variables:
      host:
        default: localhost:8000
        description: Host name and port of the server.

security:
  - BearerAuth: []

paths:
  /:
    get:
      operationId: welcome
      summary: Welcome page
      description: Returns a simple welcome message for the Status List Server.
      security: []
      responses:
        "200":
          description: Welcome message
          content:
            text/plain:
              schema:
                type: string
              example: "Status list Server"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health/live:
    get:
      operationId: livenessCheck
      summary: Liveness check
      description: Returns a lightweight indicator that the HTTP server process is up.
      security: []
      responses:
        "200":
          description: Server process is up
          content:
            text/plain:
              schema:
                type: string
              example: "OK"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health:
    get:
      operationId: legacyLivenessCheck
      summary: Liveness check alias
      description: Backward-compatible alias for `/health/live`.
      security: []
      responses:
        "200":
          description: Server process is up
          content:
            text/plain:
              schema:
                type: string
              example: "OK"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health/ready:
    get:
      operationId: readinessCheck
      summary: Readiness check
      description: |
        Returns 200 only when all critical dependencies are reachable;
        otherwise 503. The public response is intentionally generic; detailed
        dependency failures are logged internally.
      security: []
      responses:
        "200":
          description: All critical dependencies are reachable
          content:
            text/plain:
              schema:
                type: string
              example: "READY"
        "503":
          description: One or more critical dependencies are unavailable
          content:
            text/plain:
              schema:
                type: string
              example: "NOT_READY"

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Returns Prometheus exposition format metrics when the server is started
        with `APP_SERVER__ENABLE_METRICS=true`. Returns a 404 response when
        metrics are disabled.
      security: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
          headers:
            Content-Type:
              schema:
                type: string
              description: text/plain; version=0.0.4
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/credentials:
    get:
      operationId: getIssuerRegistration
      summary: Get the calling issuer's aggregation ID and URI
      description: |
        Returns the aggregation ID and URI of the issuer the Bearer token
        belongs to. Issuers registered before aggregation IDs existed never got
        theirs in the registration response, and get them here.
      responses:
        "200":
          description: The issuer's registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The issuer's credential was removed after the token was checked
            (`issuer_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "issuer_not_found"
                error_description: "Issuer is not registered"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: registerIssuer
      summary: Register issuer credentials
      description: |
        Registers an issuer by storing its unique identifier and public key
        (JWK). The registered public key is used later to validate signed JWT
        Bearer tokens for the protected management endpoints.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "202":
          description: |
            Credentials accepted and stored. The body tells the issuer its
            aggregation ID, which it cannot derive itself, and the aggregation
            URI to publish in its metadata (draft-21 §9.1).
            `GET /api/v1/credentials` returns them again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/CredentialConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/aggregation/{aggregation_id}:
    get:
      operationId: getIssuerAggregation
      summary: List one issuer's status list URIs
      description: |
        Returns the `sub` URIs of one issuer's status lists as a draft-21 §9.3
        Status List Aggregation, plus a `next_cursor` for paging. Status list
        tokens advertise this URI in `aggregation_uri`.

        The response is complete in one page and `next_cursor` is `null`: the
        server refuses to start when `limits.max_lists_per_issuer` exceeds the
        default page size, and the list quota holds each issuer to it. When an
        issuer has more lists anyway, for example while the quota is off, a
        request without `limit` gets `409 paging_required` rather than part of
        the aggregation. Send `limit` to page as described under
        `getAggregation`.
      security: []
      parameters:
        - name: aggregation_id
          in: path
          required: true
          description: |
            The issuer's aggregation ID, as returned at registration and by
            `GET /api/v1/credentials`.
          schema:
            type: string
            format: uuid
            example: "0b8ef1c4-3c6a-4d2e-9f1a-5b7c9d2e4f60"
        - $ref: "#/components/parameters/AggregationLimit"
        - $ref: "#/components/parameters/AggregationCursor"
        - $ref: "#/components/parameters/AggregationIfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/AggregationPage"
        "304":
          $ref: "#/components/responses/AggregationNotModified"
        "400":
          description: |
            `aggregation_id` is not a UUID (`invalid_aggregation_id`), or
            `limit`, `cursor` or the query string is invalid (`invalid_query`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid_aggregation_id"
                error_description: "aggregation_id must be a UUID"
        "404":
          description: No issuer has this aggregation ID (`aggregation_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "aggregation_not_found"
                error_description: "No issuer has this aggregation ID"
        "409":
          description: |
            The issuer has more status lists than one page and the request
            sent neither `limit` nor `cursor` (`paging_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "paging_required"
                error_description: "this aggregation has more than 1000 status lists; send limit to page through it"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/aggregation:
    get:
      operationId: getAggregation
      summary: List every issuer's status list URIs, one page at a time
      deprecated: true
      description: |
        Returns the `sub` URIs of every hosted status list, across issuers,
        one bounded page per request. Kept for status list tokens issued
        before `aggregation_uri` named one issuer; use
        `GET /api/v1/aggregation/{aggregation_id}` instead. A client that
        reads only `status_lists` sees the first page and nothing else.

        **Paging.** Pages are ordered by `list_id` and hold at most `limit`
        URIs (default and maximum 1000). While `next_cursor` is non-null, pass
        it back as `cursor` to fetch the next page; the same next page is also
        advertised in an RFC 8288 `Link: <…>; rel="next"` header. A full walk
        returns exactly once every list that existed when the walk started
        and still exists when its page is read; lists are never deleted
        through the API, but an operator may delete them directly in the
        database. A list published during a walk may be missed, and not only
        because it was published late: `list_id` is chosen by the publisher
        and can be any UUID, so a new list can sort before the current cursor.
        The same applies to the paged exceptions of `getIssuerAggregation`.

        There is no total count: counting every list is itself an unbounded
        read on a public endpoint.
      security: []
      parameters:
        - $ref: "#/components/parameters/AggregationLimit"
        - $ref: "#/components/parameters/AggregationCursor"
        - $ref: "#/components/parameters/AggregationIfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/AggregationPage"
        "304":
          $ref: "#/components/responses/AggregationNotModified"
        "400":
          description: |
            `limit` is outside 1–1000, `cursor` is not a value this endpoint
            returned, or the query string could not be parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid_query"
                error_description: "limit must be between 1 and 1000, got 5000"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/status-lists/{list_id}/statuses:
    parameters:
      - name: list_id
        in: path
        required: true
        description: |
          UUID of the status list. For publish (`PUT`), only the lowercase,
          hyphenated form is accepted (e.g. `477121aa-b598-419e-916f-1e74654ff38b`);
          the braced, `urn:uuid:`, no-hyphen and uppercase forms are rejected
          with `400`. For update (`PATCH`), any well-formed UUID is accepted
          for the lookup, but a list is only found by the exact spelling it was
          published with: an uppercase (or otherwise differently-spelled) ID
          for a list stored in the canonical lowercase form is not matched and
          yields `404`.
        schema:
          type: string
          format: uuid
          example: "477121aa-b598-419e-916f-1e74654ff38b"

    put:
      operationId: publishStatusList
      summary: Publish a new status list
      parameters:
        - name: list_id
          in: path
          required: true
          description: |
            UUID of the status list. Only the lowercase, hyphenated UUID form is
            accepted (e.g. `477121aa-b598-419e-916f-1e74654ff38b`); braced,
            `urn:uuid:`, no-hyphen and uppercase forms are rejected with `400`.
          schema:
            type: string
            format: uuid
            example: "477121aa-b598-419e-916f-1e74654ff38b"
      description: |
        Creates a new status list for the given `list_id`. The issuer is
        derived from the validated JWT Bearer token. The request body defines
        the initial status entries for the list.

        On success the response `Location` header and the `uri` member of the
        body carry the absolute URI of the created status list. For full spec
        compliance (§5.1/§5.2/§8.3) the issuer MUST embed that exact URI in the
        Referenced Token's `status.status_list.uri`; the status list token's own
        `sub` carries the same URI so relying parties can resolve it.

        Each issuer may hold at most `limits.max_lists_per_issuer` status lists
        (default 1000). A publish past that is refused with `400`
        `list_quota_exceeded`; status lists cannot be deleted through the API,
        so retrying never succeeds until an operator raises the quota. A
        `list_id` that already exists is still refused with `409`, even when
        the quota is full, so retrying a publish that did land is recognisable.
        During the upgrade of an existing SQL deployment to a release with the
        quota, an operator may run it unenforced until it is enabled.

        `size` may be supplied to create a fixed-size list. The server rounds it
        up so `bits * entries` is byte-aligned and initialises every entry to
        `default_status` (default `0`). `size` must be at least 1 and, after
        rounding, no larger than `limits.max_status_index + 1` (default
        100001). Later writes past that fixed size are refused with
        `400 index_out_of_range`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPublishRequest"
      responses:
        "201":
          description: Status list created successfully
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: |
                Absolute URI of the newly created status list, e.g.
                `https://statuslist.example.com/api/v1/status-lists/{list_id}`.
                This is the value the issuer MUST embed in the Referenced
                Token's `status.status_list.uri`; the status list token's own
                `sub` carries the same URI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPublishResponse"
              example:
                uri: "https://statuslist.example.com/api/v1/status-lists/477121aa-b598-419e-916f-1e74654ff38b"
                list_id: "477121aa-b598-419e-916f-1e74654ff38b"
                size: 100000
                bits: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/PublishConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: updateStatusList
      summary: Update an existing status list
      description: |
        Updates the status entries of an existing status list. The JWT Bearer
        token must belong to the issuer that originally published the list.

        An update that leaves the list unchanged is a successful no-op: it
        neither advances the list version nor records a history snapshot.
        A payload that is empty (`{"statuses": []}`) or that re-sets every
        affected `index` to its current value both qualify.

        On fixed-size lists, PATCH may update only indices previously returned
        by the allocation endpoint or supplied as initial publish statuses.
        Updating an unallocated index is refused with `409 index_not_allocated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateRequest"
      responses:
        "200":
          description: Status list updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UpdateConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/UpdateInternalServerError"

  /api/v1/status-lists/{list_id}/allocations:
    parameters:
      - name: list_id
        in: path
        required: true
        description: UUID of the status list.
        schema:
          type: string
          format: uuid
          example: "477121aa-b598-419e-916f-1e74654ff38b"

    post:
      operationId: allocateStatusListIndices
      summary: Allocate unused status-list indices
      description: |
        Reserves unused indices for the authenticated issuer's fixed-size
        status list and returns them in ascending order. Each reserved
        `(list_id, index)` pair is recorded so it is not returned by a later
        allocation request. Lists published without `size` are caller-managed
        and return `409 list_not_fixed_size` from this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationRequest"
      responses:
        "201":
          description: Indices allocated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/UpdateConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/status-lists/{list_id}:
    get:
      operationId: getStatusList
      summary: Retrieve a status list token
      description: |
        Returns the status list token for the requested `list_id`, encoded as a
        JWT or CWT depending on the `Accept` header.

        **Content negotiation.** The token format is negotiated per RFC 9110
        §12.5.1. The `Accept` header (absent or empty means "accept anything")
        is a comma-separated list of media ranges, each optionally carrying a
        `q`-value (`q=0` excludes a range); type/subtype matching is
        case-insensitive. Wildcard precedence for each supported type is
        three-tiered: an exact type beats `application/*`, which beats `*/*`,
        so an explicit `q=0` exclusion is never overridden by a wildcard. The
        supported types are `application/statuslist+jwt` and
        `application/statuslist+cwt`; the type with the highest acceptable `q`
        is served, and JWT wins ties (including a wildcard match). A `406 Not
        Acceptable` is returned only when no supported type is acceptable (for
        example `q=0` on both types, only unsupported types, or a malformed or
        out-of-range `q` such as `q=2` on the only matching range).

        Media parameters other than `q` (for example `profile=v2`) are ignored
        for matching — a deliberately parameter-agnostic policy. The server
        serves exactly two un-parameterized representations, so treating every
        parameterized range as a match is less surprising than RFC 9110's
        parameter-equality matching, which would ignore every parameterized
        range and produce spurious `406`s. Revisit this if a parameterized
        status-list variant is introduced.

        JWT-format responses are gzip-compressed (`Content-Encoding: gzip`)
        only when the client has advertised support via `Accept-Encoding: gzip`
        (see draft-ietf-oauth-status-list-21 §8.2). CWT-format responses are
        never gzip-compressed. Because the representation varies by both `Accept`
        and `Accept-Encoding`, the `200`, `304` and `406` responses carry
        `Vary: Accept, Accept-Encoding`.

        The decoded token conforms to the
        [OAuth Status List](https://datatracker.ietf.org/doc/draft-ietf-oauth-status-list/)
        specification. The token is signed by the server and contains an `x5c`
        certificate chain in the protected header (JWT) or protected header map
        (CWT) for verification.

        Supplying `?time=<unix-timestamp>` performs draft-21 §8.4 historical
        resolution. Historical snapshots are privacy-sensitive because they
        disclose timing information; deploy this capability only after
        considering the privacy implications in §12.7.
      security: []
      parameters:
        - name: list_id
          in: path
          required: true
          description: Identifier of the status list.
          schema:
            type: string
            example: "477121aa-b598-419e-916f-1e74654ff38b"
        - name: Accept
          in: header
          required: false
          description: |
            Desired token format, negotiated per RFC 9110 §12.5.1. Defaults to
            `application/statuslist+jwt` when omitted (or when the header is
            `*/*` / `application/*`). Accepts a comma-separated list of media
            ranges with optional `q`-values; type/subtype matching is
            case-insensitive and non-`q` parameters are ignored (a documented
            parameter-agnostic policy). For each type an exact range beats
            `application/*`, which beats `*/*`, so an explicit `q=0` exclusion
            is never overridden by a wildcard. The supported types are
            `application/statuslist+jwt` and `application/statuslist+cwt`; the
            type with the highest acceptable `q` is served (JWT wins ties). A
            `406 Not Acceptable` is returned only when no supported type is
            acceptable (e.g. `q=0` on both, an unsupported type, or a malformed
            or out-of-range `q`).
          schema:
            type: string
            example: application/statuslist+jwt
        - name: time
          in: query
          required: false
          description: |
            Unix timestamp for a historical Status List Token. A response is
            returned only when a retained token validity window covers this
            instant (`iat <= time < exp`).
          schema:
            type: integer
            format: int64
            example: 1686925000
        - name: If-None-Match
          in: header
          required: false
          description: |
            Conditional validator: the strong `"..."` `ETag` previously returned by
            this endpoint. The ETag is opaque to clients — it is a SHA-256 digest
            of the exact served representation bytes (RFC 9110 §8.8.3.1). Because
            ES256 signatures are randomized, the bytes differ across replicas,
            restarts, cold caches and window roll-overs; the strong ETag therefore
            differs across replicas — this is a documented, accepted deviation from
            cross-replica ETag equality (ticket 564 acceptance criterion: "two
            replicas return matching ETags *or the issue documents why they don't*").
            Within a single replica the ETag is stable for the whole token window,
            so a client revalidating against the same replica gets a `304` with no
            signing. The token window is exactly the token's full lifetime
            (`exp_secs`); the ETag changes on content update, key/certificate
            rotation, window roll-over, token-format/encoding change, aggregation
            URI or token lifetime change, or mid-window content revert. A matching
            `If-None-Match` proves the client holds the current window's token; the
            server certifies `304` only while that token remains valid beyond the
            advertised `max-age = min(ttl, exp - now)`, so the `304` never extends
            a cached token past its `exp`. Otherwise a freshly signed `200 OK`
            token is returned.
          schema:
            type: string
            example: '"a1b2c3d4..."'
        - name: If-Modified-Since
          in: header
          required: false
          description: |
            Date-time validator matching the `Last-Modified` header of a previous
            response. Unlike `If-None-Match`, an `If-Modified-Since`-only request
            never returns `304 Not Modified`; the server always returns a freshly
            signed `200 OK` token. `304` is returned only for a matching
            `If-None-Match`.
          schema:
            type: string
            example: "Wed, 21 Oct 2015 07:28:00 GMT"
        - name: Accept-Encoding
          in: header
          required: false
          description: |
            Content codings the client is willing to accept. When `gzip` is
            advertised (default q-value), JWT-format responses are
            gzip-compressed and carry `Content-Encoding: gzip`. CWT-format
            responses are never compressed regardless of this header.
          schema:
            type: string
            example: gzip
      responses:
        "200":
          description: |
            Status list token returned successfully. The decoded token payload
            conforms to `StatusListToken`.
          content:
            application/statuslist+jwt:
              schema:
                type: string
                format: binary
              example: "H4sIAAAAAAAAE6tW..."
            application/statuslist+cwt:
              schema:
                type: string
                format: binary
                description: |
                  Raw COSE_Sign1_Tagged CBOR bytes (CBOR tag 18). Never
                  gzip-compressed regardless of the request's `Accept-Encoding`.
              example: "0gEAAQ..."
          headers:
            Content-Encoding:
              schema:
                type: string
              description: |
                Present with value `gzip` only when the response body has been
                gzip-compressed. Compression is applied to JWT-format tokens
                (`application/statuslist+jwt`) exclusively, and only when the
                client has advertised support for it via an
                `Accept-Encoding: gzip` request header. CWT-format tokens are
                never compressed. Absent otherwise.
              example: gzip
            Vary:
              schema:
                type: string
              description: |
                Always `Accept, Accept-Encoding`. The response body varies by both
                the requested token format (`Accept`) and the negotiated content
                coding (`Accept-Encoding`), which is required so shared caches/CDNs
                do not serve a gzipped variant to a client that did not request one
                (RFC 9111 §4.1).
              example: Accept, Accept-Encoding
        "304":
          description: |
            Not Modified. Returned only for a matching `If-None-Match`
            conditional revalidation when the list has not changed and the
            client's previously cached Status List Token is still more than `ttl`
            seconds from `exp`. The client can continue to use its cached token,
            so no body is sent.

            A matching `If-None-Match` proves the client holds the current-window
            token; the server certifies the `304` only while that token is still
            valid beyond the advertised `max-age = min(ttl, exp - now)`, so the
            `304` never strands the relying party with a token that is about to
            expire or already expired (RFC 9110 §8.8.1).

            An `If-Modified-Since`-only request never gets a `304`; it always
            receives a freshly signed `200 OK` token.
          headers:
            ETag:
              schema:
                type: string
              description: |
                The current strong validator for the live representation. It is a
                SHA-256 digest of the served representation bytes, stable for the
                whole token window on a single replica. It differs across replicas
                (due to randomized ES256 signatures) and changes whenever the live
                representation or its validity window changes (content,
                key/certificate, window roll-over, format or encoding, aggregation
                URI, token lifetime settings).
            Last-Modified:
              schema:
                type: string
              description: |
                The HTTP-date of the last modification of the status list.
            Cache-Control:
              schema:
                type: string
              description: |
                Caching directive for intermediaries (e.g. `max-age=<min(ttl, exp - now)>`).
                The live token is not marked `immutable`: it expires and its validator
                rotates, so freshness-honouring caches/browsers must revalidate to
                obtain an unexpired token.
            Vary:
              schema:
                type: string
              description: Always `Accept, Accept-Encoding`.
        "400":
          description: |
            `list_id` contains a NUL character (`invalid_list_id`), `time` is
            not a positive timestamp in the past (`invalid_historical_time`),
            or the query string could not be parsed (`invalid_query`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid_list_id"
                error_description: "list_id must not contain NUL"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Signed JWT Bearer token. The token must be signed with the private key
        corresponding to the public key registered for the issuer. The payload
        must contain:

        - `iss`: the registered issuer identifier
        - `iat`: issued-at timestamp
        - `exp`: expiration timestamp

        The optional `nbf` claim is honored when present. When
        `management_auth.audiences` is configured, the token must contain an
        `aud` claim matching one of the configured values. When
        `management_auth.audiences` is empty, `aud` is not validated.

        The server validates the signature using the registered JWK, verifies
        that the `iss` claim matches the registered issuer, rejects future
        `iat`/`nbf` values outside the configured leeway, and rejects tokens
        whose lifetime (`exp - iat`) exceeds the configured maximum.

        Mutual TLS (mTLS) for issuer authentication is not implemented in the
        current release; this security scheme may be added in a future version.

  schemas:
    CredentialsRequest:
      type: object
      required:
        - issuer
        - public_key
      properties:
        issuer:
          type: string
          description: Unique identifier of the issuer.
          example: "my-issuer"
        public_key:
          $ref: "#/components/schemas/JWK"

    CredentialsResponse:
      type: object
      required:
        - status
        - aggregation_id
      properties:
        status:
          type: string
          example: "Credentials stored successfully"
        aggregation_id:
          type: string
          format: uuid
          description: |
            Opaque ID that names this issuer in public aggregation URIs, in
            place of the issuer identifier.
          example: "0b8ef1c4-3c6a-4d2e-9f1a-5b7c9d2e4f60"
        aggregation_uri:
          type: string
          format: uri
          description: |
            The issuer's Status List Aggregation URI. Absent when status list
            tokens do not carry one (see `StatusList.aggregation_uri`).
          example: "https://statuslist.example.com/api/v1/aggregation/0b8ef1c4-3c6a-4d2e-9f1a-5b7c9d2e4f60"

    RegistrationResponse:
      type: object
      required:
        - issuer
        - aggregation_id
      properties:
        issuer:
          type: string
          example: "my-issuer"
        aggregation_id:
          type: string
          format: uuid
          example: "0b8ef1c4-3c6a-4d2e-9f1a-5b7c9d2e4f60"
        aggregation_uri:
          type: string
          format: uri
          description: |
            Absent when status list tokens do not carry one (see
            `StatusList.aggregation_uri`).
          example: "https://statuslist.example.com/api/v1/aggregation/0b8ef1c4-3c6a-4d2e-9f1a-5b7c9d2e4f60"

    JWK:
      type: object
      description: |
        JSON Web Key representing the issuer's public key. The exact fields
        depend on the key type (e.g., `kty`, `crv`, `x`, `y` for EC keys).
      required:
        - kty
      properties:
        kty:
          type: string
          description: Key type.
          example: "EC"
        crv:
          type: string
          description: Curve name for EC keys.
          example: "P-256"
        x:
          type: string
          description: X coordinate of the public key.
          example: "NeyFv_2L67OEplNbJpR02IFis4_lFW9HYmhfF5Or6m8"
        y:
          type: string
          description: Y coordinate of the public key.
          example: "eAH2qe8Pg3GQ28uxA8-qNAqdwQ_zfV2uKAvJ2sLpY9M"
      example:
        kty: "EC"
        crv: "P-256"
        x: "NeyFv_2L67OEplNbJpR02IFis4_lFW9HYmhfF5Or6m8"
        y: "eAH2qe8Pg3GQ28uxA8-qNAqdwQ_zfV2uKAvJ2sLpY9M"

    StatusUpdateRequest:
      type: object
      description: |
        Request payload for creating (`PUT`) or updating (`PATCH`) status
        entries in a status list. The number of entries is bounded by the
        operator-configurable `limits.max_statuses_per_request` (default 5000);
        a request exceeding that bound is rejected with `400 Bad Request`.
        A `statuses` array containing duplicate `index` values is rejected with
        `400 Bad Request` on both `PUT` and `PATCH`.
      required:
        - statuses
      properties:
        statuses:
          type: array
          description: Array of status entries to create or update.
          maxItems: 5000
          items:
            $ref: "#/components/schemas/StatusEntry"

    StatusPublishRequest:
      allOf:
        - $ref: "#/components/schemas/StatusUpdateRequest"
        - type: object
          properties:
            size:
              type: integer
              format: int32
              minimum: 1
              maximum: 100001
              description: |
                Optional fixed number of entries to create. The server rounds
                this value up so `bits * entries` is a multiple of 8. The
                rounded value must not exceed `limits.max_status_index + 1`
                (default 100001).
              example: 100000
            default_status:
              $ref: "#/components/schemas/StatusValue"

    StatusPublishResponse:
      type: object
      description: |
        Response body of a successful `PUT /api/v1/status-lists/{list_id}/statuses`.
        `uri` is the absolute URI of the newly created status list — the value
        the issuer MUST embed in the Referenced Token's `status.status_list.uri`
        (spec §5.1/§5.2/§8.3). It is identical to the `Location` header.
      required:
        - uri
        - list_id
        - size
        - bits
      properties:
        uri:
          type: string
          format: uri
          description: Absolute URI of the created status list.
          example: "https://statuslist.example.com/api/v1/status-lists/477121aa-b598-419e-916f-1e74654ff38b"
        list_id:
          type: string
          format: uuid
          description: The `list_id` the status list was published under.
          example: "477121aa-b598-419e-916f-1e74654ff38b"
        size:
          type:
            - integer
            - "null"
          format: int32
          minimum: 1
          maximum: 100001
          description: |
            Fixed list size actually stored by the server after byte-alignment
            rounding, or `null` when the list is caller-managed.
          example: 100000
        bits:
          type: integer
          format: int32
          enum: [1, 2, 4, 8]
          description: Number of bits stored for each status entry.
          example: 1

    AllocationRequest:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 5000
          description: |
            Number of unused indices to reserve. The maximum is bounded by
            `limits.max_statuses_per_request` (default 5000).
          example: 10

    AllocationResponse:
      type: object
      required:
        - indices
      properties:
        indices:
          type: array
          items:
            type: integer
            format: int32
          example: [0, 1, 2]

    StatusEntry:
      type: object
      required:
        - index
        - status
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: |
            Position of the referenced token in the status list. The maximum
            accepted value is bounded by the operator-configurable
            `limits.max_status_index` (default 100000); a request with an
            index above that bound is rejected with `400 Bad Request`.
          example: 42
        status:
          $ref: "#/components/schemas/StatusValue"

    StatusValue:
      description: |
        Draft-21 status type value. Accepted as either a numeric integer, a
        case-insensitive string name, or a stringified supported integer.

        | Value                | Integer | String        |
        |----------------------|---------|---------------|
        | Valid                | `0`     | `"VALID"`     |
        | Invalid              | `1`     | `"INVALID"`   |
        | Suspended            | `2`     | `"SUSPENDED"` |
        | Application-specific | `3`     | `"3"`         |
        | Application-specific | `12-15` | `"12"-"15"`  |

        Values `4` through `11`, `16` through `255`, and values above `255`
        are rejected by this API.
      anyOf:
        - type: integer
          description: Draft-21 status code.
          enum: [0, 1, 2, 3, 12, 13, 14, 15]
          example: 1
        - type: string
          description: Named status value (case-insensitive) or a stringified supported integer.
          example: "VALID"

    StatusList:
      type: object
      description: |
        Bit-string representation of the status list. The `lst` field contains
        a zlib-compressed, base64url-encoded byte array where each referenced
        token occupies `bits` bits. The first bit of the byte array is the status
        for index 0.
      required:
        - bits
        - lst
      properties:
        bits:
          type: integer
          description: Number of bits used for each status entry.
          enum:
            - 1
            - 2
            - 4
            - 8
          example: 1
        lst:
          type: string
          description: |
            Base64url-encoded zlib-compressed status byte array.
          example: "eJxLTAQAASUAw3s"
        aggregation_uri:
          type: string
          format: uri
          description: |
            The issuing issuer's Status List Aggregation URI (draft-21 §4.2,
            §4.3). Present when the server has `server.aggregation_uri`
            configured, the list quota is enforced and no issuer has more
            status lists than one aggregation page, unless looking up the
            issuer's aggregation ID failed.
            Tokens served before issuer scoping carried the unscoped URI, which
            still resolves.
          example: "https://statuslist.example.com/api/v1/aggregation/0b8ef1c4-3c6a-4d2e-9f1a-5b7c9d2e4f60"

    StatusListToken:
      type: object
      description: |
        Decoded payload of a JWT or CWT status list token. The actual response
        from `GET /statuslists/{list_id}` is the signed token — a JWT string
        (optionally gzip-compressed when the client requests it) or raw
        COSE_Sign1_Tagged CBOR bytes for CWT. The token is signed by the server
        using the configured signing key and contains the certificate chain in
        the `x5c` header (JWT) or protected header (CWT).
      required:
        - sub
        - iat
        - status_list
      properties:
        iss:
          type: string
          description: Issuer identifier of the status list server.
          example: "https://statuslist.example.com"
        sub:
          type: string
          description: URI of the status list.
          example: "https://statuslist.example.com/statuslists/477121aa-b598-419e-916f-1e74654ff38b"
        iat:
          type: integer
          description: |
            Issued-at timestamp (seconds since Unix epoch). For live tokens it is
            `max(window_start, updated_at)`: the start of the current token window
            (matching the window by which the ETag and signed-bytes cache rotate),
            or the last content change if that is later — so it never predates the
            list's most recent modification, and is part of the cache key and ETag
            so a mid-window content revert to an earlier state is a distinct
            identity. Lifetime is governed by `exp` and `ttl`, not by `iat` skew.
          example: 1752515200
        exp:
          type: integer
          description: |
            Expiration timestamp (seconds since Unix epoch); always `iat + exp_secs`.
          example: 1752516100
        ttl:
          type: integer
          description: Recommended time-to-live in seconds for caching the token.
          example: 300
        status_list:
          $ref: "#/components/schemas/StatusList"

    AggregationResponse:
      type: object
      description: |
        Response body of `GET /api/v1/aggregation/{aggregation_id}` and
        `GET /api/v1/aggregation`: one page of the `sub` URIs of one issuer's
        status lists, or of every issuer's. The `status_lists` member is the
        draft-21 §9.3 Status List Aggregation structure; `next_cursor` is an
        extension for paging.
      required:
        - status_lists
        - next_cursor
      properties:
        status_lists:
          type: array
          description: URIs of the hosted status lists on this page.
          maxItems: 1000
          items:
            type: string
            format: uri
          example:
            - "https://statuslist.example.com/api/v1/status-lists/477121aa-b598-419e-916f-1e74654ff38b"
            - "https://statuslist.example.com/api/v1/status-lists/8e4ebb4a-dd79-498f-ac97-966f22884037"
        next_cursor:
          type:
            - string
            - "null"
          description: |
            Opaque cursor for the next page, to pass back as `cursor`. Always
            present; `null` on the last page.
          example: "djE6OGU0ZWJiNGEtZGQ3OS00OThmLWFjOTctOTY2ZjIyODg0MDM3"

    ErrorResponse:
      type: object
      description: |
        The error body returned by every JSON error response. Serialized from
        `server::error::ErrorResponse`.

        This shape follows the `cloud-identity-wallet` house pattern used for
        cross-project consistency across ADORSYS identity services.
      required:
        - error
      properties:
        error:
          type: string
          description: |
            Stable machine-readable error identifier. Branch on this rather
            than on the HTTP status, which is not unique across error kinds.
          enum:
            # 400
            - invalid_list_id
            - invalid_query
            - invalid_input
            - invalid_index
            - invalid_historical_time
            - invalid_public_jwk
            - too_many_statuses
            - index_too_large
            - index_out_of_range
            - invalid_size
            - invalid_count
            - duplicate_index
            - list_quota_exceeded
            - invalid_aggregation_id
            # 401 — emitted by the authentication middleware
            - invalid_auth_header
            - invalid_token
            - jwt_error
            - unsupported_algorithm
            - issuer_not_found
            # 403
            - issuer_mismatch
            # 404
            - status_list_not_found
            - historical_status_list_not_found
            - aggregation_not_found
            # 406
            - invalid_accept_header
            # 409
            - status_list_already_exists
            - credentials_already_exist
            - update_conflict
            - index_not_allocated
            - list_not_fixed_size
            - allocation_exhausted
            - write_contention
            - paging_required
            # 413
            - payload_too_large
            # 422
            - status_too_large
            # 429
            - too_many_requests
            # 500 / 503
            - internal_error
            - service_unavailable
          example: "status_list_already_exists"
        error_description:
          type: string
          description: |
            Human-readable explanation. Omitted when absent; wording is not
            part of the contract and may change without notice.
          example: "Status list already exists"

  parameters:
    AggregationLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of URIs on this page.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    AggregationCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque `next_cursor` value from the previous page. Omit for the first
        page. Clients must not construct or modify cursors, and a cursor only
        works on the aggregation that returned it.
      schema:
        type: string
    AggregationIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        `ETag` of a page fetched earlier. The server answers `304 Not Modified`
        while that page is unchanged.
      schema:
        type: string
        example: 'W/"3b1f..."'

  responses:
    AggregationPage:
      description: One page of status list URIs.
      headers:
        ETag:
          schema:
            type: string
          description: Weak validator of this page.
        Link:
          schema:
            type: string
          description: |
            Present only when another page follows, as
            `<?limit=<limit>&cursor=<next_cursor>>; rel="next"` (RFC 8288).
            The target is a relative reference resolved against this
            request's URI, so it keeps the request's path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AggregationResponse"
          example:
            status_lists:
              - "https://statuslist.example.com/api/v1/status-lists/477121aa-b598-419e-916f-1e74654ff38b"
              - "https://statuslist.example.com/api/v1/status-lists/8e4ebb4a-dd79-498f-ac97-966f22884037"
            next_cursor: null

    AggregationNotModified:
      description: |
        Not Modified. The page matching `If-None-Match` is unchanged, so no
        body is sent.
      headers:
        ETag:
          schema:
            type: string
          description: The same weak validator the page was served with.

    BadRequest:
      description: |
        Invalid request data. In addition to schema/validation failures
        (e.g. a non-UUID `list_id`), this status is returned when an enforced
        request bound is exceeded:

          * number of status entries exceeds
            `limits.max_statuses_per_request` (default 5000) —
            `Too many statuses in request: <count> > <max>`; or
          * a status `index` exceeds `limits.max_status_index`
            (default 100000) — `Status index <n> exceeds the configured
            maximum`; or
          * a payload repeats the same `index` in more than one entry — on
            either `PATCH` or `PUT` — `duplicate status index <n> in statuses
            array`; or
          * `size` is `0` or rounds above `limits.max_status_index + 1` —
            `invalid_size`; or
          * allocation `count` is `0` or exceeds
            `limits.max_statuses_per_request` — `invalid_count`.

        `list_quota_exceeded` (publish only) is different in kind: the request
        was well-formed, and is refused because the issuer already holds
        `limits.max_lists_per_issuer` status lists (default 1000). No change
        to the request and no retry will succeed; the quota must be raised by
        an operator. It carries no `Retry-After`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "too_many_statuses"
            error_description: "too many statuses in request: 6000 > 5000"

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "invalid_auth_header"
            error_description: "Missing or invalid Authorization header"

    Forbidden:
      description: Insufficient permissions to access the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "issuer_mismatch"
            error_description: "Issuer does not own the status list"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "status_list_not_found"
            error_description: "Status list was not found"

    NotAcceptable:
      description: |
        Requested response format not supported. No acceptable media type was
        advertised in the `Accept` header. Supported types are
        `application/statuslist+jwt` and `application/statuslist+cwt`; the 406
        body lists both.
      headers:
        Vary:
          schema:
            type: string
          description: |
            Always `Accept, Accept-Encoding`, advertising that the outcome
            depends on `Accept` (RFC 9110 §12.5.5). The 406 itself is sent with
            `Cache-Control: no-store`, so caches never store it.
          example: Accept, Accept-Encoding
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "invalid_accept_header"
            error_description: "No acceptable media type. Supported: application/statuslist+jwt, application/statuslist+cwt"

    PublishConflict:
      description: |
        The publish was rejected. Read the `error` field: the two cases below
        require opposite client behaviour, and only one of them is retryable.

        `status_list_already_exists` — a list with this `list_id` is already
        published. **Retrying will never succeed**; choose a different `list_id`
        or update the existing list instead. When the stored list can be read, a
        `Location` header carries its canonical URI (the same `sub` the list
        already uses), so a racing publisher can adopt it instead of guessing.

        `write_contention` — the write lost a lock race inside the database
        (deadlock or lock-wait timeout) and was rolled back. Nothing was created,
        so **retry the identical request**. A `Retry-After` header gives a floor;
        add jitter on top, since the writers that just collided would otherwise
        resynchronise.
      headers:
        Location:
          description: |
            Present only for `status_list_already_exists`, when the stored list
            is readable: the canonical URI of the existing list — the `sub` the
            list already uses.
          required: false
          schema:
            type: string
            format: uri
        Retry-After:
          description: |
            Present only for `write_contention`. Seconds to wait before
            retrying — a minimum, not a schedule.
          required: false
          schema:
            type: integer
            example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            alreadyExists:
              summary: A list with this identifier is already published (do not retry)
              value:
                error: "status_list_already_exists"
                error_description: "Status list already exists"
            writeContention:
              summary: Rolled back by a storage lock race (retry unchanged)
              value:
                error: "write_contention"
                error_description: "The write lost a lock race in storage and was rolled back. Nothing was modified; retry the same request."

    CredentialConflict:
      description: |
        The credential registration was rejected. Read the `error` field.

        `credentials_already_exist` — this issuer already has credentials
        registered. **Retrying will never succeed.**

        `write_contention` — the write lost a lock race inside the database
        (deadlock or lock-wait timeout) and was rolled back. Nothing was created,
        so **retry the identical request** after the `Retry-After` interval plus
        jitter.
      headers:
        Retry-After:
          description: |
            Present only for `write_contention`. Seconds to wait before
            retrying — a minimum, not a schedule.
          required: false
          schema:
            type: integer
            example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            alreadyExists:
              summary: This issuer is already registered (do not retry)
              value:
                error: "credentials_already_exist"
                error_description: "Credentials already exist for this issuer"
            writeContention:
              summary: Rolled back by a storage lock race (retry unchanged)
              value:
                error: "write_contention"
                error_description: "The write lost a lock race in storage and was rolled back. Nothing was modified; retry the same request."

    PayloadTooLarge:
      description: |
        The request body exceeds the operator-configurable
        `limits.max_body_size_bytes` (default 2 MiB). Rejected by the
        `RequestBodyLimitLayer` before the handler runs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "payload_too_large"
            error_description: "The request body exceeds the configured maximum size"

    UnprocessableEntity:
      description: |
        The request was well-formed but the resulting serialized status list
        exceeds the operator-configurable `limits.max_serialized_list_size`
        (default 1 MiB), or (for `POST /api/v1/credentials`) the supplied
        public key could not be parsed into a JWK.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "status_too_large"
            error_description: "Serialized status list size exceeds the configured maximum"

    TooManyRequests:
      description: |
        The client has exceeded the configured rate-limit quota for the route
        tier (strict, per-issuer, or permissive — see the Rate limiting section
        in the API description).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "too_many_requests"
            error_description: "Too many requests"

    UpdateConflict:
      description: |
        The request was rejected because of the current status-list state.
        Branch on the `error` field rather than on the status code: some cases
        are transient write races, while others are durable request/state
        mismatches where retrying the same request will not help.

        `update_conflict` — optimistic-concurrency conflict. Another writer's
        update landed first between the client's read and this write, so this
        request was rejected rather than silently overwriting it. The client's
        view is stale: **re-read the current state before retrying**, because
        replaying the same request would reapply it to a changed list.

        `write_contention` — the write lost a lock race inside the database
        (deadlock or lock-wait timeout) and was rolled back by the server.
        Nothing was modified and no writer won, so **retry the identical
        request**; no re-read is required. A `Retry-After` header gives a floor —
        add jitter on top, since the writers that just collided would otherwise
        resynchronise.

        `index_not_allocated` — PATCH on a fixed-size list targeted an index
        that has not been allocated. Retrying the same request will not help;
        allocate an index first or use one already assigned to the token.

        `list_not_fixed_size` — allocation was requested for a list published
        without `size`. Retrying the same request will not help; use
        caller-managed indices for that list or publish a fixed-size list.

        `allocation_exhausted` — the list has fewer unallocated entries
        remaining than requested. Retrying the same request will not help unless
        the list is explicitly grown first.

        > Note for integrators: 409 is not a status most generic HTTP clients,
        > SDKs or service meshes retry automatically. `write_contention` is
        > transient and safe to replay, but recovering from it requires handling
        > this code explicitly.
      headers:
        Retry-After:
          description: |
            Present only for `write_contention`. Seconds to wait before
            retrying — a minimum, not a schedule.
          required: false
          schema:
            type: integer
            example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            updateConflict:
              summary: A racing writer's update landed first (re-read, then retry)
              value:
                error: "update_conflict"
                error_description: "The status list was modified concurrently"
            writeContention:
              summary: Rolled back by a storage lock race (retry unchanged)
              value:
                error: "write_contention"
                error_description: "The write lost a lock race in storage and was rolled back. Nothing was modified; retry the same request."
            indexNotAllocated:
              summary: Fixed-size PATCH used an unallocated index (retry will not help)
              value:
                error: "index_not_allocated"
                error_description: "index 5 has not been allocated for this status list"
            listNotFixedSize:
              summary: Allocation requested on a caller-managed list (retry will not help)
              value:
                error: "list_not_fixed_size"
                error_description: "status list must be fixed-size to allocate indices"
            allocationExhausted:
              summary: Not enough unallocated entries remain (retry will not help)
              value:
                error: "allocation_exhausted"
                error_description: "not enough unallocated entries remain in this status list"

    UpdateInternalServerError:
      description: |
        Internal server error. The status list row and the historical snapshot
        recording the change are written in a single database transaction, so a
        500 from this endpoint means **no partial write occurred**: the list is
        unchanged, no snapshot was recorded, and the previous state remains
        authoritative. The request is therefore safe to retry as-is.

        This differs from a `409`, which means the write was rejected because it
        raced another writer. A `409 update_conflict` requires re-reading the
        current state before retrying; a `409 write_contention` and a `500` do
        not — both are safe to replay as-is.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "internal_error"
            error_description: "The server encountered an unexpected error."

    ServiceUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "service_unavailable"
            error_description: "the service is currently unavailable. Please try again later"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "internal_error"
            error_description: "The server encountered an unexpected error."
