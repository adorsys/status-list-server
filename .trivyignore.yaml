misconfigurations:
  # AVD-KSV-0014: root filesystem not read-only. The reason belongs in statement.
  - id: AVD-KSV-0014
    statement: >-
      Third-party subchart pod specs (postgres) that the chart cannot override; it exposes no values-level setting for it. The application's own Deployment does set readOnlyRootFilesystem: true, so this does not cover our workload. Revisit if the chart gains the setting.
    paths:
      - "**/charts/postgres*/**"

