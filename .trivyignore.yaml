misconfigurations:
  # AVD-KSV-0014 is "Root file system is not read-only" (HIGH). Rationale lives in
  # `statement`, which scripts/check-trivyignore.py requires, rather than in
  # comments beside it.
  - id: AVD-KSV-0014
    statement: >-
      Third-party subchart pod specs (postgres) that the chart cannot override; it exposes no values-level setting for it. The application's own Deployment does set readOnlyRootFilesystem: true, so this does not cover our workload. Revisit if the chart gains the setting.
    paths:
      - "*/charts/postgres*/**"

# Container image scan exceptions. Each needs a statement and an expired_at date so
# it lapses rather than becoming permanent. Triage process: docs/supply-chain.md.
#
#   - id: RUSTSEC-0000-0000
#     statement: Why this is not exploitable here, and what would change that.
#     expired_at: 2026-01-01
#
# Read by the trivy-config job on every pull request and by the image scan on every
# release, so a malformed entry breaks CI repository-wide.
# scripts/check-trivyignore.py validates this file before Trivy reads it.
vulnerabilities: []