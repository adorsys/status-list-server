services:
  app:
    build:
      args:
        FEATURES: ${FEATURES:-postgres}
    environment:
      APP_DATABASE__HOST: ${APP_DATABASE__HOST:-db}
      APP_DATABASE__PORT: ${APP_DATABASE__PORT:-5432}
      APP_DATABASE__USERNAME: ${APP_DATABASE__USERNAME:-${POSTGRES_USER:-postgres}}
      APP_DATABASE__PASSWORD: ${APP_DATABASE__PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      APP_DATABASE__NAME: ${APP_DATABASE__NAME:-${POSTGRES_DB:-status-list}}
