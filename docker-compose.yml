services:
  db:
    image: postgres:18.4
    profiles: ["postgres"]
    restart: always
    container_name: status-list-db
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-status-list}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - status-list-network

  mysql:
    image: mysql:9.2
    restart: always
    container_name: status-list-mysql
    profiles: ["mysql"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-status-list}
      MYSQL_USER: ${MYSQL_USER:-mysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mysql}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - status-list-network

  localstack:
    container_name: localstack
    image: localstack/localstack:4.14
    profiles: ["aws"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:4566:4566"
    environment:
      - SERVICES=secretsmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - status-list-network

  redis:
    image: redis:8.10-alpine
    restart: always
    container_name: status-list-redis
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - status-list-network

  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10
    profiles: ["acme"]
    command: -http01 "" -https01 "" -tlsalpn01 ""
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8055:8055"
    networks:
      - status-list-network

  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10
    profiles: ["acme"]
    command: -config /test/pebble_config.json -strict -dnsserver challtestsrv:8053
    ports:
      - "${BIND_ADDR:-127.0.0.1}:14000:14000"
      - "${BIND_ADDR:-127.0.0.1}:15000:15000"
    depends_on:
      challtestsrv:
        condition: service_started
    networks:
      - status-list-network
    volumes:
      - ./test_data/pebble_config.json:/test/pebble_config.json

  filesystem-cert:
    image: alpine:3.24
    profiles: ["fscert"]
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        cp /sample/dev.crt /certs/tls.crt
        cp /sample/dev.key /certs/tls.key
        chown 65534:65534 /certs/tls.crt /certs/tls.key
        chmod 0644 /certs/tls.crt
        chmod 0600 /certs/tls.key
    volumes:
      - ./test_data/certs/dev.crt:/sample/dev.crt:ro
      - ./test_data/certs/dev.key:/sample/dev.key:ro
      - certdata:/certs

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FEATURES: ${FEATURES:-memory}
    container_name: status-list-server
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SERVER__ENABLE_METRICS: ${APP_SERVER__ENABLE_METRICS:-true}
      APP_STATUS_LIST__TOKEN_EXP_SECS: ${APP_STATUS_LIST__TOKEN_EXP_SECS:-900}
      APP_STATUS_LIST__TOKEN_TTL_SECS: ${APP_STATUS_LIST__TOKEN_TTL_SECS:-300}
      APP_TELEMETRY__ENVIRONMENT: ${APP_TELEMETRY__ENVIRONMENT:-development}
      # Enabling telemetry requires the observability profile so the collector exists.
      APP_TELEMETRY__OTLP_ENDPOINT: "http://otel-collector:4317"
      APP_TELEMETRY__ENABLED: ${APP_TELEMETRY__ENABLED:-false}
      APP_TELEMETRY__SAMPLER_RATIO: ${APP_TELEMETRY__SAMPLER_RATIO:-1.0}
      APP_SERVER__CERT__STORE__CERTIFICATE_PATH: ${APP_SERVER__CERT__STORE__CERTIFICATE_PATH:-/etc/status-list/sample-certs/dev.crt}
      APP_SERVER__CERT__STORE__SIGNING_KEY_PATH: ${APP_SERVER__CERT__STORE__SIGNING_KEY_PATH:-/etc/status-list/sample-certs/dev.key}
      APP_DATABASE__HOST: ${APP_DATABASE__HOST:-db}
      APP_DATABASE__PORT: ${APP_DATABASE__PORT:-5432}
      APP_DATABASE__USERNAME: ${APP_DATABASE__USERNAME:-postgres}
      APP_DATABASE__PASSWORD: ${APP_DATABASE__PASSWORD:-postgres}
      APP_DATABASE__NAME: ${APP_DATABASE__NAME:-status-list}
      APP_CACHE__BACKEND: ${APP_CACHE__BACKEND:-memory}
      APP_CACHE__HOST: ${APP_CACHE__HOST:-redis}
      APP_CACHE__PORT: ${APP_CACHE__PORT:-6379}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ./test_data/certs/dev.crt:/etc/status-list/sample-certs/dev.crt:ro
      - ./test_data/certs/dev.key:/etc/status-list/sample-certs/dev.key:ro
      - certdata:/etc/status-list/generated:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
      pebble:
        condition: service_started
        required: false
      filesystem-cert:
        condition: service_completed_successfully
        required: false
      localstack:
        condition: service_healthy
        required: false
      otel-collector:
        condition: service_started
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - status-list-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    profiles: ["observability"]
    container_name: otel-collector
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml
    ports:
      - "${BIND_ADDR:-127.0.0.1}:4317:4317"
      - "${BIND_ADDR:-127.0.0.1}:4318:4318"
      - "${BIND_ADDR:-127.0.0.1}:8889:8889"
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - status-list-network

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    profiles: ["observability"]
    container_name: jaeger
    ports:
      - "${BIND_ADDR:-127.0.0.1}:16686:16686"
    networks:
      - status-list-network

  prometheus:
    image: prom/prometheus:v3.11.3
    profiles: ["observability"]
    container_name: prometheus
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9092:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/observability/prometheus/rules:/etc/prometheus/rules
    depends_on:
      alertmanager:
        condition: service_started
    networks:
      - status-list-network
    # Only scrape metrics if endpoint is exposed
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=31d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9093:9093"
    environment:
      # Webhook-based alert notifications (ticket #446). Select the target
      # channel with ALERTMANAGER_PLATFORM (webhook|discord|slack|teams|
      # mattermost|email) and supply that platform's credential below. The
      # entrypoint renders deploy/observability/prometheus/generate-alertmanager-config.sh,
      # which emits the native receiver config, so no repo code is platform
      # specific and no webhook URL is committed. We recommend the generic
      # `webhook` platform for a Discord/Slack-compatible endpoint.
      # ALERTMANAGER_DMS_WEBHOOK_URL is optional: when set, the always-firing
      # Watchdog (severity=none) pings a dead-man's-switch instead of a human
      # channel; when unset it is absorbed silently (never spams a human channel).
      ALERTMANAGER_PLATFORM: ${ALERTMANAGER_PLATFORM:-webhook}
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_DMS_WEBHOOK_URL: ${ALERTMANAGER_DMS_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      MS_TEAMS_WEBHOOK_URL: ${MS_TEAMS_WEBHOOK_URL:-}
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
      ALERTMANAGER_SMTP_HOST: ${ALERTMANAGER_SMTP_HOST:-}
      ALERTMANAGER_SMTP_PORT: ${ALERTMANAGER_SMTP_PORT:-587}
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:-}
      ALERTMANAGER_EMAIL_TO: ${ALERTMANAGER_EMAIL_TO:-}
    volumes:
      - ./deploy/observability/prometheus/generate-alertmanager-config.sh:/generate-alertmanager-config.sh:ro
    networks:
      - status-list-network
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /bin/sh /generate-alertmanager-config.sh
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:12.0.0
    profiles: ["observability"]
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/dashboards/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/observability/dashboards/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/observability/dashboards/generated:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - ': "$${GF_SECURITY_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting Grafana}"; exec /run.sh'
    networks:
      - status-list-network

  pushgateway:
    image: prom/pushgateway:v1.11.2
    profiles: ["observability"]
    container_name: pushgateway
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9091:9091"
    networks:
      - status-list-network

networks:
  status-list-network:
    driver: bridge

volumes:
  certdata:
    driver: local
  pgdata:
    driver: local
  mysqldata:
    driver: local
