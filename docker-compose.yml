services:
  db:
    image: postgres:18.4
    restart: always
    container_name: status-list-db
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-status-list}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - status-list-network

  mysql:
    image: mysql:9.2
    restart: always
    container_name: status-list-mysql
    profiles: ["mysql"]
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-status-list}
      MYSQL_USER: ${MYSQL_USER:-mysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mysql}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - status-list-network

  localstack:
    container_name: localstack
    image: localstack/localstack:4.14
    ports:
      - 4566:4566
    environment:
      - SERVICES=secretsmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - status-list-network

  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10
    command: -http01 "" -https01 "" -tlsalpn01 ""
    ports:
      - 8055:8055
    networks:
      - status-list-network

  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10
    command: -config /test/pebble_config.json -strict -dnsserver challtestsrv:8053
    ports:
      - 14000:14000
      - 15000:15000
    depends_on:
      challtestsrv:
        condition: service_started
    networks:
      - status-list-network
    volumes:
      - ./test_data/pebble_config.json:/test/pebble_config.json

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FEATURES: ${FEATURES:-postgres,aws}
    container_name: status-list-server
    env_file:
      - path: .env.template
        required: false
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SERVER__ENABLE_METRICS: ${APP_SERVER__ENABLE_METRICS:-true}
      APP_STATUS_LIST__TOKEN_EXP_SECS: ${APP_STATUS_LIST__TOKEN_EXP_SECS:-900}
      APP_STATUS_LIST__TOKEN_TTL_SECS: ${APP_STATUS_LIST__TOKEN_TTL_SECS:-300}
      APP_TELEMETRY__ENVIRONMENT: ${APP_TELEMETRY__ENVIRONMENT:-development}
      APP_TELEMETRY__OTLP_ENDPOINT: "http://otel-collector:4317"
      APP_TELEMETRY__ENABLED: ${APP_TELEMETRY__ENABLED:-true}
      APP_TELEMETRY__SAMPLER_RATIO: ${APP_TELEMETRY__SAMPLER_RATIO:-1.0}
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
      pebble:
        condition: service_started
      localstack:
        condition: service_healthy
      pushgateway:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - status-list-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: otel-collector
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml
    ports:
      - 4317:4317
      - 4318:4318
      - 8889:8889
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - status-list-network

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    ports:
      - 16686:16686
      - "4317"
    networks:
      - status-list-network

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    ports:
      - 9092:9090
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/rules:/etc/prometheus/rules
    depends_on:
      alertmanager:
        condition: service_started
    networks:
      - status-list-network
    # Only scrape metrics if endpoint is exposed
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=31d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - 9093:9093
    environment:
      # Webhook-based alert notifications (ticket #446). Select the target
      # channel with ALERTMANAGER_PLATFORM (webhook|discord|slack|teams|
      # mattermost|email) and supply that platform's credential below. The
      # entrypoint renders observability/prometheus/generate-alertmanager-config.sh,
      # which emits the native receiver config, so no repo code is platform
      # specific and no webhook URL is committed. We recommend the generic
      # `webhook` platform for a Discord/Slack-compatible endpoint.
      # ALERTMANAGER_DMS_WEBHOOK_URL is optional: when set, the always-firing
      # Watchdog (severity=none) pings a dead-man's-switch instead of a human
      # channel; when unset it is absorbed silently (never spams a human channel).
      ALERTMANAGER_PLATFORM: ${ALERTMANAGER_PLATFORM:-webhook}
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_DMS_WEBHOOK_URL: ${ALERTMANAGER_DMS_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      MS_TEAMS_WEBHOOK_URL: ${MS_TEAMS_WEBHOOK_URL:-}
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
      ALERTMANAGER_SMTP_HOST: ${ALERTMANAGER_SMTP_HOST:-}
      ALERTMANAGER_SMTP_PORT: ${ALERTMANAGER_SMTP_PORT:-587}
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:-}
      ALERTMANAGER_EMAIL_TO: ${ALERTMANAGER_EMAIL_TO:-}
    volumes:
      - ./observability/prometheus/generate-alertmanager-config.sh:/generate-alertmanager-config.sh:ro
    networks:
      - status-list-network
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /bin/sh /generate-alertmanager-config.sh
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/dashboards/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/dashboards/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards/generated:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - status-list-network

  pushgateway:
    image: prom/pushgateway:v1.11.2
    container_name: pushgateway
    ports:
      - 9091:9091
    networks:
      - status-list-network

networks:
  status-list-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  mysqldata:
    driver: local
